  if (document.body.classList.contains('projector')) toggleProjector(false);
  onHome = true;
  document.getElementById('screen-home').classList.remove('hidden');
  document.getElementById('screen-detail').classList.remove('active');
  // 回首頁後恢復上次的鍵盤 focus 位置
  setTimeout(() => {
    const cards = getHomeCards(group);
    const pos = cards.findIndex(c => parseInt(c.dataset.idx, 10) === charIdx);
    if (pos >= 0) setHomeKbFocus(group, pos, false); else clearHomeKbFocus();
  }, 50);
}

// ── DETAIL ──
function hasStoryteller(char = currentChar()) {
  return Array.isArray(char.storytellerSimple) && char.storytellerSimple.length === 7;
}
// 通用：取第 idx 個說書人資料（0-based）
function getStorytellerData(char, idx) {
  if (idx === 0) return { name: char.storytellerName, role: char.storytellerRole, intro: char.storytellerIntro, simple: char.storytellerSimple };
  if (idx === 1) return { name: char.storyteller2Name, role: char.storyteller2Role, intro: char.storyteller2Intro, simple: char.storyteller2Simple };
  if (idx === 2) return { name: char.storyteller3Name, role: char.storyteller3Role, intro: char.storyteller3Intro, simple: char.storyteller3Simple };
  if (idx === 3) return { name: char.storyteller4Name, role: char.storyteller4Role, intro: char.storyteller4Intro, simple: char.storyteller4Simple };
  if (idx === 4) return { name: char.storyteller5Name, role: char.storyteller5Role, intro: char.storyteller5Intro, simple: char.storyteller5Simple };
  return null;
}
function countStorytellers(char = currentChar()) {
  let n = 0;
  if (Array.isArray(char.storytellerSimple)  && char.storytellerSimple.length  === 7) n++;
  if (Array.isArray(char.storyteller2Simple) && char.storyteller2Simple.length === 7) n++;
  if (Array.isArray(char.storyteller3Simple) && char.storyteller3Simple.length === 7) n++;
  if (Array.isArray(char.storyteller4Simple) && char.storyteller4Simple.length === 7) n++;
  if (Array.isArray(char.storyteller5Simple) && char.storyteller5Simple.length === 7) n++;
  return n;
}
function getRow(i) {
  const char = currentChar();
  if (viewMode === 'storyteller' && hasStoryteller(char)) {
    const st = getStorytellerData(char, storytellerIdx);
    if (st && Array.isArray(st.simple)) return st.simple[i];
  }
  return density === 'full' ? char.full[i] : char.simple[i];
}

function getViewIntro() {
  const char = currentChar();
  if (viewMode === 'storyteller' && hasStoryteller(char)) {
    const st = getStorytellerData(char, storytellerIdx);
    if (!st || !st.intro) return '';
    const parts = [
      ['我是誰', st.intro.who],
      ['我和他的關係', st.intro.relation],
      ['為什麼由我來說', (st.intro.why || '').replace(/^為什麼由我來說[：:？?]?\s*/, '')]
    ].filter(p => p[1]);
    if (!parts.length) return '';
    const body = parts.map((p, k) => `<div class="st-intro-part" style="animation-delay:${k * .15}s"><div class="st-intro-label">${p[0]}</div><p>${p[1]}</p></div>`).join('');
    return `<details class="st-intro-card"${stepIdx === -1 ? ' open' : ''}>
      <summary><span class="st-intro-title">說書人自我介紹</span><span class="st-intro-toggle when-open">收起 ▴</span><span class="st-intro-toggle when-closed">點開 ▾</span></summary>
      <div class="st-intro-body">${body}</div>
    </details>`;
  }
  return '';
}

function renderSidebar() {
  const wrap = document.getElementById('top-char-strip');
  if(!wrap) return;
  const list = currentList();
  const isFiction = group === 'fiction';
  wrap.innerHTML = list.map((c, i) => {
    const active = i === charIdx;
    return `<button type="button" class="top-char-item ${active ? (isFiction ? 'active' : 'active active-real') : ''}" onclick="selectChar(${i})" aria-pressed="${active ? 'true' : 'false'}">
      <span class="dot c${i%7}"></span>${c.name}
    </button>`;
  }).join('');
  // 自動滾動到 active 項目
  setTimeout(() => {
    const activeEl = wrap.querySelector('.top-char-item.active');
    if (activeEl) activeEl.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
  }, 50);
}

function getCharImg() {
  const kf=['harry','sherlock','wukong','peter','quixote','truman','frodo','elsa','mulan','macbeth','hamlet','zhugeliang','','','','','','','','','','','','','','','','','','','',''];
  const kr=['mandela','gandhi','beethoven','curie','lincoln','jobs','socrates','helen','teresa','sima','leang','zhengyan','xingyun','xintao','','','','','','','','','','','','',''];
  return CHAR_IMGS[(group==='fiction'?kf:kr)[charIdx]]||'';
}

function renderContent() {
  const char = currentChar();
  const color = currentColors()[charIdx];
  const charImg = getCharImg();
  const maxStep = mode==='show' ? stepIdx : Math.max(stepIdx,...revealed,-1);
  let html = '';
  for (let i=0; i<=maxStep; i++) {
    const isPractice = mode==='practice' && i===stepIdx && !revealed.includes(i);
    const isActive = i===stepIdx;
    const cardDim = `style="--sc:${STEP_COLORS[i]}"`;
    const stateCls = isActive ? ' is-active' : ' is-past';
    const aKey = ansKey(i);
    const myA = mode==='practice' ? (practiceAnswers[aKey]||'').trim() : '';
    const myAns = myA ? `<div class="my-answer"><span>你的答案</span>${escHtml(myA)}</div>` : '';
    html += isPractice
      ? `<div class="step-card is-active is-practice" id="sc-${i}" ${cardDim}>
        <div class="step-card-side c${i}"><div class="step-card-side-label">${STEPS[i]}</div></div>
        <div class="step-card-body">
          <textarea class="practice-input" data-akey="${aKey}" placeholder="你覺得「${STEPS[i]}」是什麼？先寫下你的答案…" oninput="practiceAnswers[this.dataset.akey]=this.value" onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){event.preventDefault();nextStep();}">${escHtml(practiceAnswers[aKey]||'')}</textarea>
          <div class="practice-tip">寫好後按「揭曉答案」（或 Ctrl＋Enter）</div>
        </div>
      </div>`
      : `<div class="step-card${stateCls}" id="sc-${i}" ${cardDim}>
        <div class="step-card-side c${i}">
          <div class="step-card-side-label">${STEPS[i]}</div>
        </div>
        <div class="step-card-body">
          ${myAns}<div class="step-card-text">${getRow(i)}</div>
        </div>
      </div>`;
  }
  for (let i=maxStep+1; i<7; i++) {
    html += `<button type="button" class="step-card step-ghost" style="--sc:${STEP_COLORS[i]}" onclick="goStep(${i})" aria-label="${STEPS[i]}（尚未揭曉）">
        <div class="step-card-side"><div class="step-card-side-label">${STEPS[i]}</div></div>
        <div class="step-card-body"><div class="step-card-text">？</div></div>
      </button>`;
  }
  const allDone = mode==='show' ? stepIdx===6 : revealed.length===7;
  const emptyHint = stepIdx === -1
    ? (mode==='practice'
        ? '<div class="empty-hint practice">✎ 練習模式：每一步先寫下你的答案，再按「揭曉答案」對照</div>'
        : '<div class="empty-hint">點擊上方步驟標籤，或按「開始 →」逐步揭曉</div>')
    : '';

  // 名言預告標籤（步驟列最右）
  const quoteTeaserTag = `<button type="button" class="quote-teaser-tag${allDone ? ' unlocked' : ''}" title="${allDone ? '點擊查看核心名言' : '走完七步後解鎖'}" ${allDone ? `onclick="document.getElementById('quote-card').scrollIntoView({behavior:'smooth'})"` : 'disabled aria-disabled="true"'}>✦ 名言${allDone ? '' : ' 🔒'}</button>`;

  // 步驟操作引導（只在第一次、第一步顯示）
  let showNavHint = false;
  try {
    showNavHint = stepIdx === 0 && !localStorage.getItem('nav_hint_seen');
    if (showNavHint) localStorage.setItem('nav_hint_seen', '1');
  } catch (e) { showNavHint = stepIdx === 0 && !window.__navHintSeen; window.__navHintSeen = true; }
  const navHint = showNavHint
    ? '<div class="step-nav-hint">按「下一步 →」繼續，或點擊上方步驟切換到任一步。</div>'
    : '';

  const logoTag = `<div style="font-family:'Noto Serif TC',serif;font-size:1rem;font-weight:900;color:#111;letter-spacing:.06em;padding:3px 6px;margin-right:2px;white-space:nowrap;flex-shrink:0;">靶心人公式</div>`;
  const stepTagsHtml = STEPS.map((s,i) => {
    const isLocked = mode==='practice' && !revealed.includes(i) && i>stepIdx;
    const isActive = i===stepIdx;
    const activeStyle = isActive
      ? `border-color:rgba(200,0,0,.5);background:rgba(200,0,0,.1);color:#c00000;`
      : '';
    const dimClass = isActive ? '' : 'dim';
    return `<button type="button" class="step-tag ${isLocked?'locked':''} ${dimClass}" onclick="goStep(${i})" style="${activeStyle}" aria-pressed="${isActive ? 'true' : 'false'}">
      <div class="step-tag-num c${i}">${i+1}</div>${s}
    </button>`;
  }).join('');

  // 說書人按鈕 HTML（放在左側欄人物名字下方）
  const introHtml = getViewIntro();
  const has1 = hasStoryteller(char);
  const isFiction = group === 'fiction';
  const stCount = countStorytellers(char);
  let storytellerBtnsHtml = '';
  if (has1) {
    storytellerBtnsHtml = '<div class="left-storyteller-select-wrap">';
    storytellerBtnsHtml += '<label class="left-storyteller-select-label" for="left-storyteller-select">說書人</label>';
    storytellerBtnsHtml += '<select id="left-storyteller-select" class="left-storyteller-select" onchange="setStoryteller(parseInt(this.value,10))">';
    storytellerBtnsHtml += `<option value="-1" ${viewMode !== 'storyteller' ? 'selected' : ''}>公式視角（不用說書人）</option>`;
    for (let si = 0; si < stCount; si++) {
      const st = getStorytellerData(char, si);
      if (!st || !st.name) continue;
      const isSelected = viewMode === 'storyteller' && storytellerIdx === si;
      storytellerBtnsHtml += `<option value="${si}" ${isSelected ? 'selected' : ''}>${st.name}｜${st.role}</option>`;
    }
    storytellerBtnsHtml += '</select></div>';
  }

  // 說書人身份列（右側頂部，說書人模式啟動時顯示）
  let identityBarHtml = '';
  if (viewMode === 'storyteller') {
    const st = getStorytellerData(char, storytellerIdx);
    if (st) {
      const barClass = isFiction ? 'fiction' : 'real';
      identityBarHtml = '<div class="st-identity-bar ' + barClass + '">'
        + '<span class="st-identity-icon">🎙</span>'
        + '<span class="st-identity-name">' + st.name + '</span>'
        + '<span class="st-identity-role">（' + st.role + '）</span>'
        + '<span class="st-identity-label">說書人視角</span>'
        + '</div>';
    }
  }

  // 內容寫入 #content
  document.getElementById('content').innerHTML = `
    <div id="content-left">
      <button type="button" class="sidebar-rail-toggle" id="sidebar-rail-toggle" onclick="toggleSidebarPanel()" aria-label="收起側邊欄" title="收起側邊欄">‹</button>
      <div class="sidebar-inner">
      <div class="char-meta-card">
        <div class="char-header">
          <div class="char-number" style="color:rgba(255,255,255,.45);font-size:.68rem;">${charIdx+1} / ${(group==='fiction'?FICTION:REAL).length}</div>
          <div class="char-title-row">
            ${charImg ? `<img class="char-mini-thumb" src="${charImg.replace('.webp','-t.webp')}" alt="" style="border-color:${color}88">` : `<span class="char-mini-thumb card-seal" style="--seal:${color}">${char.name.charAt(0)}</span>`}
            <div class="char-title" style="color:${color};">${char.name}</div>
            ${storytellerBtnsHtml}
          </div>
          <div class="char-scene-tag">聚焦${group==='fiction'?'情節':'事件'}：${char.scene}</div>
        </div>
      </div>
      <div class="char-image-frame">
        ${charImg
          ? `<img src="${charImg}" alt="${char.name}" style="width:100%;border-radius:16px;border:2px solid ${color}55;display:block;object-fit:cover;box-shadow:0 18px 34px rgba(0,0,0,.24);">
        <div class="char-image-credit">圖片來源：網路示意圖</div>`
          : `<div class="char-seal-big" style="--seal:${color}"><span class="char-seal-big-char">${char.name.charAt(0)}</span><span class="char-seal-big-name">${char.name}</span><span class="char-seal-big-work">${char.work}</span></div>`}
      </div>
      </div>
    </div>
    <div id="content-right">
      <div id="right-step-bar">
        <div class="step-tags-row">${logoTag}${stepTagsHtml}${quoteTeaserTag}</div>
      </div>
      <div id="right-step-content"><div class="proj-title"><span class="proj-name" style="color:${color}">${char.name}</span><span class="proj-scene">${char.scene}</span></div>${identityBarHtml}${introHtml}${emptyHint}${html}${navHint}${allDone ? `<div id='quote-card' class='quote-card'><div class='quote-mark' aria-hidden='true'>“</div><p>${char.quote}</p></div>` : ''}</div>
    </div>`;

  applySidebarState();

  setTimeout(()=>{
    const el=document.getElementById(`sc-${maxStep}`);
    const rc=document.getElementById('right-step-content');
    if(el&&rc) rc.scrollTop += el.getBoundingClientRect().top - rc.getBoundingClientRect().top - 20;
    const ta=document.querySelector('.practice-input');
    if(ta && window.innerWidth>820){ ta.focus({preventScroll:true}); ta.setSelectionRange(ta.value.length, ta.value.length); }
    const bar=document.getElementById('right-step-bar');
    const tag=bar && bar.querySelector('.step-tag[aria-pressed="true"]');
    if(bar&&tag&&bar.scrollWidth>bar.clientWidth){
      const d=tag.getBoundingClientRect().left-bar.getBoundingClientRect().left;
      bar.scrollLeft += d - bar.clientWidth/2 + tag.offsetWidth/2;
    }
  },80);
}

function updateFooter() {
  const prog = stepIdx === -1 ? 0 : (stepIdx+1)/7*100;
  document.getElementById('progress-fill').style.width = prog + '%';
  document.getElementById('footer-info').textContent = stepIdx === -1 ? '點擊步驟開始' : `步驟 ${stepIdx+1} / 7`;
  const btn = document.getElementById('btn-next');
  const isLast = stepIdx === 6;
  if (mode==='show') btn.textContent = isLast ? '完成 ✓' : (stepIdx === -1 ? '開始 →' : '下一步 →');
  else btn.textContent = revealed.includes(stepIdx) ? (isLast ? '完成 ✓' : '下一步 →') : (stepIdx === -1 ? '開始 →' : '揭曉答案');
  document.getElementById('btn-prev').disabled = stepIdx <= 0;
}

function nextStep() {
  if (stepIdx === -1) { stepIdx = 0; renderContent(); renderSidebar(); updateFooter(); return; }
  if (mode==='practice' && !revealed.includes(stepIdx)) { revealed.push(stepIdx); renderContent(); renderSidebar(); updateFooter(); return; }
  if (stepIdx < 6) stepIdx++;
  renderContent(); renderSidebar(); updateFooter();
}
function prevStep() {
  if (stepIdx > 0) { stepIdx--; if(mode==='practice') revealed=revealed.filter(r=>r<=stepIdx); renderContent(); renderSidebar(); updateFooter(); }
}
function goStep(idx) {
  if (mode==='practice' && idx > stepIdx && !revealed.includes(idx)) return;
  stepIdx = idx; renderContent(); renderSidebar(); updateFooter();
}

function dismissStTip() {}

function setStoryteller(idx) {
  dismissStTip();
  const char = currentChar();
  if (idx < 0) {
    viewMode = 'formula';
    syncBtns();
    if (!onHome) { stepIdx = -1; revealed = []; renderContent(); renderSidebar(); updateFooter(); }
    return;
  }
  if (idx >= countStorytellers(char)) return;
  viewMode = 'storyteller';
  storytellerIdx = idx;
  syncBtns();
  if (!onHome) { stepIdx = -1; revealed = []; renderContent(); renderSidebar(); updateFooter(); }
}

function setDisplayMode(m) {
  const char = currentChar();
  if (m === 'storyteller') {
    if (!hasStoryteller(char)) return;
    viewMode = 'storyteller';
    storytellerIdx = 0;
  } else {
    density = m;
    viewMode = 'formula';
    storytellerIdx = 0;
  }
  syncBtns();
  if (!onHome) { stepIdx = -1; revealed = []; renderContent(); renderSidebar(); updateFooter(); }
}

function syncBtns() {
  const isFiction = group === 'fiction';
  const activeClass = isFiction ? ' active-gold' : ' active-blue';

  // group buttons
  const fb = document.getElementById('dbtn-fiction');
  const rb = document.getElementById('dbtn-real');
  if(fb){ fb.className = 'hbtn' + (isFiction ? activeClass : ''); }
  if(rb){ rb.className = 'hbtn' + (!isFiction ? activeClass : ''); }

  // simple / full buttons
  ['simple','full'].forEach(v => {
    const el = document.getElementById('dbtn-'+v);
    if(!el) return;
    const isActive = viewMode === 'formula' && density === v;
    el.className = 'hbtn' + (isActive ? activeClass : '');
  });
  const pb = document.getElementById('dbtn-practice');
  if (pb) pb.className = 'hbtn' + (mode === 'practice' ? activeClass : '');
  const jb = document.getElementById('dbtn-projector');
  if (jb) jb.className = 'hbtn' + (document.body.classList.contains('projector') ? activeClass : '');

}

let homeKbGroup = 'fiction'; // 目前 focus 在哪個群組
let homeKbIdx   = 0;         // 目前 focus 在群組中的第幾張卡

function getHomeCards(g) {
  return Array.from(document.querySelectorAll(g === 'fiction' ? '#grid-fiction .char-card' : '#grid-real .char-card'))
    .filter(c => c.offsetParent !== null);
}

function setHomeKbFocus(g, idx, scroll) {
  // 清除所有 focus
  document.querySelectorAll('.char-card.kb-focus, .char-card.kb-focus-real')
    .forEach(el => el.classList.remove('kb-focus','kb-focus-real'));

  const cards = getHomeCards(g);
  if (!cards.length) return;

  homeKbGroup = g;
  homeKbIdx   = Math.max(0, Math.min(idx, cards.length - 1));

  const cls = g === 'fiction' ? 'kb-focus' : 'kb-focus-real';
  cards[homeKbIdx].classList.add(cls);

  if (scroll !== false) {
    cards[homeKbIdx].scrollIntoView({ behavior:'smooth', block:'nearest' });
  }
}

function clearHomeKbFocus() {
  document.querySelectorAll('.char-card.kb-focus, .char-card.kb-focus-real')
    .forEach(el => el.classList.remove('kb-focus','kb-focus-real'));
}

document.addEventListener('keydown', e => {
  const target = e.target;
  const isEditable = target instanceof HTMLElement && (
    target.tagName === 'INPUT' ||
    target.tagName === 'TEXTAREA' ||
    target.tagName === 'SELECT' ||
    target.isContentEditable
  );

  if (isEditable) {
    if (!onHome) {
      if (e.key === 'Escape') target.blur();
      return;
    }
    if (e.key === 'Escape' && target.id === 'home-search-input') clearSearch();
    return;
  }

  // ── Detail 頁 ──
  if (!onHome) {
    if (e.key === 'Escape') {
      if (document.body.classList.contains('projector')) { toggleProjector(false); return; }
      goHome(); clearHomeKbFocus(); return;
    }
    if (e.key === 'p' || e.key === 'P') { toggleProjector(); return; }
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextStep(); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); prevStep(); }
    if (e.key >= '1' && e.key <= '7') goStep(parseInt(e.key) - 1);
    return;
  }

  // ── Home 頁 ──
  const cols = window.innerWidth <= 1100 ? 2 : 4;
  const fLen = getHomeCards('fiction').length;
  const rLen = getHomeCards('real').length;
  const activeLen = homeKbGroup === 'fiction' ? fLen : rLen;
  if (!activeLen && !['Tab','Escape'].includes(e.key)) return;

  switch (e.key) {

    case 'Tab': {
      if (!fLen && !rLen) return;
      e.preventDefault();
      const ng = homeKbGroup === 'fiction'
        ? (rLen ? 'real' : 'fiction')
        : (fLen ? 'fiction' : 'real');
      setHomeKbFocus(ng, 0);
      break;
    }

    case 'ArrowRight': {
      e.preventDefault();
      const len = homeKbGroup === 'fiction' ? fLen : rLen;
      const next = (homeKbIdx + 1) % len;
      setHomeKbFocus(homeKbGroup, next);
      break;
    }

    case 'ArrowLeft': {
      e.preventDefault();
      const len = homeKbGroup === 'fiction' ? fLen : rLen;
      const prev = (homeKbIdx - 1 + len) % len;
      setHomeKbFocus(homeKbGroup, prev);
      break;
    }

    case 'ArrowDown': {
      e.preventDefault();
      const len = homeKbGroup === 'fiction' ? fLen : rLen;
      const dn = homeKbIdx + cols;
      if (dn < len) {
        setHomeKbFocus(homeKbGroup, dn);
      } else if (homeKbGroup === 'fiction') {
        // 跳到真實人物群組，盡量對齊同一欄
        const col = homeKbIdx % cols;
        setHomeKbFocus('real', Math.min(col, rLen - 1));
      }
      break;
    }

    case 'ArrowUp': {
      e.preventDefault();
      const up = homeKbIdx - cols;
      if (up >= 0) {
        setHomeKbFocus(homeKbGroup, up);
      } else if (homeKbGroup === 'real') {
        // 跳回虛構人物群組，對齊同一欄，落在最後一行
        const col = homeKbIdx % cols;
        const lastRowStart = Math.floor((fLen - 1) / cols) * cols;
        setHomeKbFocus('fiction', Math.min(lastRowStart + col, fLen - 1));
      }
      break;
    }

    case 'Enter': {
      if (homeKbIdx !== null) {
        e.preventDefault();
        openChar(homeKbGroup, homeKbIdx);
      }
      break;
    }

    default:
      // 按下任意非功能鍵時，初始化 focus 到第一張卡（方便從鍵盤喚醒）
      if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1) {
        setHomeKbFocus('fiction', 0);
      }
  }
});

buildCards();
