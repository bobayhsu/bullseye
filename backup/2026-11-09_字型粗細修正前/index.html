      why:'因為用靶心人公式看 哈利波特，最值得分析的不是表面的成敗，而是他在「第七集：走進禁忌森林，主動赴死」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，哈利波特 真正要做的，是：打敗佛地魔，讓魔法世界從黑暗統治中解放。','這個故事真正有力的阻礙，在於：鄧不利多留下的最後秘密揭開：哈利自己就是最後一個魂器，他必須死，佛地魔才能真正死。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他獨自一人，帶著復活石，深夜走進禁忌森林，沒有告訴任何人。','故事走到這一步，表面的結果是：他走到佛地魔面前，被阿瓦達索命咒擊中，倒下。','真正讓這個故事變得難忘的意外，是：母親的愛留在他血液裡的保護咒，再次救了他——他沒有真正死去。','而最關鍵的轉彎，正是在這裡發生：他放棄活著看到結局的願望，用主動赴死換來所有人活下去的可能。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：佛地魔失去最後的護盾，在最終決戰中被哈利擊敗，黑暗統治終結。'],
    quote:'不是男孩打敗魔王的故事，而是一個從小沒有家的孩子，最後用愛回答了命運。'},
  { name:'福爾摩斯', work:'《藍寶石》案', scene:'追查失竊藍寶石，卻選擇私自放走竊賊',
    storytellerName:'華生', storytellerRole:'福爾摩斯的搭檔與摯友',
    storytellerIntro:{
      who:'我是華生醫師。世人認識夏洛克．福爾摩斯，多半是透過我的筆；我既是他的室友、朋友，也是他一次次奇案的見證人。',
      relation:'我和他的關係，不只是搭檔。我是那個永遠站在他身旁，卻總慢他半步的人；正因為我慢半步，所以我能看見他的聰明，也能看見他的不可思議。',
      why:'為什麼由我來說？因為若由福爾摩斯自己來說，故事只剩答案；由我來說，故事才有懸念、有驚奇，也有人味。我不是天才，所以我更能讓你看見，天才究竟可怕到什麼程度。'
    },
    storytellerSimple:['那一天，我便知道，福爾摩斯已將那顆失竊的藍寶石視為獵物；他的目標很明確：找回藍寶石，找出真正的犯人。','這案子最奇怪的地方，在於它看起來太不像一宗像樣的罪案；更麻煩的是，犯人並非窮凶極惡之徒，而更像是一個被命運逼到牆角的人。','我見過福爾摩斯工作時的模樣，他總能從最無足輕重之處，抽出最關鍵的一根絲線，再一路牽出整張網。','最後，他做到了：藍寶石找到了，犯人也跪倒在我們面前；案情至此，本該結束。','真正令我意外的，不是犯人的供詞，而是福爾摩斯的反應——真相找到了，公義卻還沒有答案。','於是，福爾摩斯做了一件連我也沒有料到的事：他放走了那個人，從破案轉向審視人。','藍寶石回到它該回去的地方，而我也終於明白，他真正難得的，是在冷靜推理之後，仍替人性留下一道縫。'],
    storyteller2Name:'柯南道爾', storyteller2Role:'福爾摩斯的創造者',
    storyteller2Intro:{
      who:'我是亞瑟．柯南道爾醫師。我創造了福爾摩斯——這句話說起來簡單，但我後來才明白，有些人物被創造出來之後，就不再屬於創造者了。',
      relation:'我和福爾摩斯的關係，說起來荒謬：我既是他的父親，也是那個曾試圖殺死他的人。我把他推下萊辛巴赫瀑布，宣告他死亡，以為我終於自由了——結果讀者的憤怒讓我明白，他活得比我更真實。',
      why:'為什麼由我來說？因為只有創造者知道，一個角色是怎麼從筆下逃走的。我寫他是為了賺錢，他卻活成了一個符號；我想殺死他，他卻逼我讓他復活。若你想知道福爾摩斯究竟有多強大，不必看他破了多少案，只要看他是怎麼把我這個作者逼到牆角的就夠了。'
    },
    storyteller2Simple:[
      '我給福爾摩斯一個目標——找回藍寶石，找出真相——因為這是偵探故事應有的樣子。可當我寫著寫著，我發現他要的不只是答案；他要的，是那個答案背後讓他覺得世界還值得存在的理由。',
      '我給他設置了阻礙：一個不像罪犯的犯人，一個荒誕的案情，一個讓「正義」說不清楚的結局。我想測試他，看他是否只是一台推理機器。',
      '他不是。他推理，他排查，他一步步鎖定真相——這些都在我的計劃之內。但最後他放走了犯人，這是我沒有預料的，或者說，是我寫到那裡才發現這才是對的。',
      '他破了案，找到了寶石，犯人跪在他面前。這應該是故事的終點。可他抬起頭，對那個可憐人說：走吧，聖誕節，我不打算讓警方介入。',
      '這個意外不是情節上的意外，而是我這個作者的意外：我發現我筆下的人物，比我更清楚什麼是公義。',
      '我本來只想讓他是個破案的機器，讓故事好看、讓雜誌好賣。可他在那一刻替自己做了一個選擇，一個比法律更深的選擇。他放棄了規則，換來了悲憫。',
      '後來我試圖殺死他，讀者不肯。我讓他復活，讀者歡呼。我這才完全明白：他不再是我的角色，他是所有渴望在冷酷世界裡還能看見人性的讀者，共同創造出來的人。'
    ],
    simple:['找出失竊的藍寶石，將兇手繩之以法。','真兇是一個走投無路的落魄男人，藍寶石竟藏在一隻鵝的嗉囊裡，案情荒誕卻真實。','憑極致觀察與推理，在一連串看似無關的線索中，迅速鎖定竊賊身分。','他找到了藍寶石，也找到了犯人——但犯人只是個走投無路、急需用錢的可憐人。','法律會判他重刑，但他的罪行起於絕境而非惡意——理性找到了真相，卻給不出公義。','他選擇私自放走犯人，用人心的判斷取代法律的規則。','案件「不了了之」，藍寶石物歸原主，福爾摩斯以自己的方式完成了他認為正確的公義。'],
    full:['外在目標：找出真相，破解懸案。<br><br>內在目標：在一個混沌的世界裡，找到唯一能讓他與人群產生真實連結的方式。<br><br>福爾摩斯的大腦是詛咒——它讓他無法像正常人一樣感受情感與關係。辦案，是他與這個世界建立意義的唯一橋樑。','外在：狡猾且善於偽裝的兇手，以及警方愚鈍的辦案方式。<br><br>中層：他的方法超越時代，常被誤解為傲慢與偏執。<br><br>內在：過度運轉的理性讓他難以與人共鳴，也讓他陷入毒品與絕望的邊緣——沒有案子，他就失去存在的支撐。','極致的觀察、演繹與排除。每一個細節都是線索，每一個謊言都有破綻。<br><br>但他真正的努力是：在一個充滿情感謊言的世界裡，堅持用邏輯建立秩序。','他總是比警方更快鎖定真兇，以理性的絕對優勢破解謎局。<br><br>但每一個案件結束後，他又回到那個空洞的貝克街，等待下一次與世界的連結。','許多案件合乎邏輯的真相背後，隱藏著法律無法制裁的人性悲劇。<br><br>他發現：理性可以找到真相，卻無法解決所有道德困境。','他可以永遠做一台精密的推理機器，把真相交給法律，讓規則運作。<br><br>但在《藍寶石》案，他選擇私自放走犯人。<br><br>他放棄的：對法律規則的絕對服從。<br><br>他換來的：對人性的悲憫，以及一種更深層的公義——不是法律的公義，而是人心的公義。','案件落幕，真相大白。但福爾摩斯真正完成的，不只是破案。<br><br>他證明了：最冷酷的理性內部，住著一個對人性仍懷有期待的靈魂。'],
    storyteller3Name:'莫里亞提', storyteller3Role:'福爾摩斯一生唯一真正的對手',
    storyteller3Intro:{
      who:'我是詹姆斯·莫里亞提教授。犯罪界稱我拿破崙，警方稱我幕後黑手，福爾摩斯稱我「蜘蛛網中心的蜘蛛」。這些稱呼都對，但都只說到一半。我真正的身分，是這個故事裡唯一真正讀懂福爾摩斯的人。',
      relation:'我和福爾摩斯的關係，不是警察與罪犯，不是正義與邪惡——而是兩面鏡子，互相照見對方。他的智識，我有；我的意志，他差一點就有。我們是同一種人，只是在某個岔路口，選擇了不同的方向。',
      why:'為什麼由我來說？因為只有我知道，他有多孤獨。華生看見他的聰明，我看見的是：一個智識高到無法與任何人真正對話的人，除了我。萊辛巴赫瀑布那一天，我們兩個都清楚——那不只是決鬥，那是世界上僅有的兩個彼此讀得懂對方的人，最後一次說話。'
    },
    storyteller3Simple:[
      '福爾摩斯想要的，他自己說是破案，說是真相，說是正義。可我看得更清楚：他想要的是一個不讓他感到無聊的世界。那個藍寶石案，對他來說不是案件，而是他和世界之間保持連結的方式——沒有謎，他就不知道自己為什麼要活著。',
      '他的阻礙，從來都不是我，也不是任何犯人。他最大的阻礙，是他自己那顆大腦——它太快，太準，把一切在發生之前就看穿了；看穿了，就沒有驚喜；沒有驚喜，就只剩毒品和空洞。我給他設計的謎題，其實是一種慈悲。',
      '那個藍寶石案，我在旁邊看著他工作。他推理、排查、鎖定——每一步都精準，沒有浪費。可最讓我著迷的，不是他怎麼找到真相，而是他最後做的那個決定：放走犯人。那一刻，他選擇了人心，不是規則。',
      '他找到了藍寶石，找到了犯人，也找到了一個法律解決不了的困境。這種情況，換了我，我會利用那個困境——讓它成為槓桿，讓它成為籌碼。他沒有。他選擇了消化它，然後放手。',
      '他放走犯人，這個意外不在任何人的預料裡，包括我。我以為他是邏輯的機器，我以為規則對他來說是神聖的；結果他用那個決定告訴我：他比我想的更複雜，也比我想的更人性。那是他讓我真正尊重他的時刻。',
      '他選擇了悲憫，放棄了規則的絕對。那個轉彎，是他告訴世界：聰明不是最終答案，聰明加上悲憫，才是。我選了另一條路——聰明加上意志，不加悲憫。我們的結局，說明了一切。',
      '萊辛巴赫瀑布，我們一起墜落。世界以為那是結束；他回來了，我沒有。可我想說：那不是他贏了我——那是我們兩個共同完成了一件事：證明了這個世界，確實需要夏洛克·福爾摩斯這種人。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 福爾摩斯 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 福爾摩斯 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 福爾摩斯，最值得分析的不是表面的成敗，而是他在「追查失竊藍寶石，卻選擇私自放走竊賊」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，福爾摩斯 真正要做的，是：找出失竊的藍寶石，將兇手繩之以法。','這個故事真正有力的阻礙，在於：真兇是一個走投無路的落魄男人，藍寶石竟藏在一隻鵝的嗉囊裡，案情荒誕卻真實。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：憑極致觀察與推理，在一連串看似無關的線索中，迅速鎖定竊賊身分。','故事走到這一步，表面的結果是：他找到了藍寶石，也找到了犯人——但犯人只是個走投無路、急需用錢的可憐人。','真正讓這個故事變得難忘的意外，是：法律會判他重刑，但他的罪行起於絕境而非惡意——理性找到了真相，卻給不出公義。','而最關鍵的轉彎，正是在這裡發生：他選擇私自放走犯人，用人心的判斷取代法律的規則。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：案件「不了了之」，藍寶石物歸原主，福爾摩斯以自己的方式完成了他認為正確的公義。'],
    quote:'理性找到了答案，但他選擇用悲憫決定結局——這才是福爾摩斯最人性的一面。'},
  { name:'孫悟空', work:'《西遊記》', scene:'三打白骨精：護師遭誤解，含冤被驅逐',
    storytellerName:'豬八戒', storytellerRole:'孫悟空的師弟',
    storytellerIntro:{
      who:'俺老豬是豬八戒。你要說猴哥的故事，很多人以為該由師父來說，或者讓他自己說；可要我看，這兩個都不對。',
      relation:'我和孫悟空的關係，可不是一句師兄弟就能說完。我嫉妒過他，抱怨過他，也被他罵過、救過、罩過；一路西行，我最知道他有多能耐，也最知道他受了多少冤枉。',
      why:'為什麼由我來說？因為我不是完人，我有私心，也有偏見。正因如此，當連我都不得不承認猴哥的忠心與本事時，那才真正有分量。只有我老豬來說，才最能說出那種一邊不服、一邊又真服了的滋味。'
    },
    storytellerSimple:['要我說啊，猴哥那傢伙平常雖然狂得很，可一遇到妖怪，腦子倒是比誰都快；他的目標很簡單：拆穿妖怪，保師父活著上西天。','可麻煩就麻煩在，妖怪會裝，師父又太容易信；說到底，猴哥最大的敵人還真不只是妖怪，還有師父那雙看不穿的眼睛。','猴哥一連三次出手，打完了還得回頭拼命解釋：「師父，那是妖怪！」其實那時候他是真的急。','結果師父根本不信，不但念緊箍咒，最後還寫了貶書，把他趕走；妖怪沒傷到他，倒是自己人先把他打傷了。','最叫人難受的，不是白骨精多狡猾，而是猴哥拼了命護著的人，到頭來最不信他的，也是那個人。','猴哥接了貶書，本來大可以拍拍屁股回花果山，可後來師父真遇了險，他還是回來了，這一回，我老豬算是真服了。','後來師父總算明白，猴哥不是兇，不是狠，是看得比我們都遠；這是個最有本事的人，受了委屈，還肯回來。'],
    storyteller2Name:'唐三藏', storyteller2Role:'孫悟空的師父',
    storyteller2Intro:{
      who:'貧僧玄奘，法號三藏。世人叫我唐僧，也有人叫我唐三藏。我此去西天，是為求取真經，普度眾生；可說起悟空這件事，我有些話，是當年沒有說出口的。',
      relation:'我和悟空的關係，從一開始就不對等。我是他的師父，卻未必真正懂他；他護著我，而我……在那最關鍵的時刻，我選擇了不信任他。那一封貶書，是我這一路走來最難以釋懷的事。',
      why:'為什麼由我來說？因為這個故事裡，傷他最深的人是我。別人說他的委屈，那是旁觀；只有我來說，才是真正的承認。我欠他一句話，而說書，是我補上那句話的方式。'
    },
    storyteller2Simple:['悟空真正想要的，我那時沒能看見——我看見的，只是他一次次揮棒，一次次有人倒下，卻沒有看見他眼裡那份急切，是因為護著我。','可我的阻礙，偏偏就是我自己的眼睛。我看不穿妖怪的偽裝，卻以為我看清楚了真相；我信了表象，卻不信那個一路跟著我的人。','他三次揮棒，三次試著告訴我那是妖怪；我三次不信，三次讓緊箍咒去懲罰他的忠心。那個時候，我以為我在主持公道。','我寫了貶書，把他趕走。那一刻，我覺得自己是對的；可悟空走後，路上每一個危險，我才慢慢明白，他有多難被取代。','最讓我意外的，不是後來遇到了多少危險，而是他回來了——不是因為我認錯，不是因為我求他，是因為他放不下我這個師父。','他回來的那一刻，我才真正明白什麼叫轉彎。不是他轉彎，是我：我放下了「我是師父、我必須是對的」這件事，重新看見了他。','師徒四人取得真經，各自成就。悟空修成鬥戰勝佛，而我知道，那個果位，有一半是他替我扛過的委屈換來的。'],
    storyteller3Name:'吳承恩', storyteller3Role:'《西遊記》的作者',
    storyteller3Intro:{
      who:'我是吳承恩。世人說我寫了一部神魔小說，可我心裡清楚，我寫的不是神仙，而是人——那些被壓著、被管著、滿腔本事卻無處施展的人。悟空不只是一隻猴子，他是我，也是那個時代千千萬萬個懷才不遇的人。',
      relation:'我和悟空的關係，是造物者與被造物的關係，但說到底，是我把自己藏進了他的身體裡。他被壓在五行山下五百年，我在科舉的路上蹉跎了幾十年；他頭上戴著緊箍，我頭上壓著的，是那個讓讀書人只能走一條路的時代。',
      why:'為什麼由我來說？因為沒有人比我更清楚，悟空那股不馴，究竟是從哪裡來的。他的每一次憤怒，都是我沒說出口的憤怒；他最後修成正果，也是我用一生換來的那一點點安慰。只有創造他的人，才知道他有多必要。'
    },
    storyteller3Simple:[
      '我給悟空的目標，說穿了只有一件事：證明自己配得上這個世界，哪怕這個世界從一開始就沒有給他位置。保護師父取經，只是那個證明的形式，不是本質。',
      '他的阻礙，我最清楚，因為是我設計的——白骨精的三次偽裝，是我對「人心看不穿真相」這件事最深的嘲諷；而唐僧的不信任，是我對「忠心換不來理解」這件悲劇最誠實的描寫。',
      '他三次揮棒，三次解釋，三次被誤解。我寫那幾段的時候，下筆很重，因為我太熟悉那種感覺——你明明是對的，你明明看得比別人清楚，可沒有人信你。',
      '師父寫了貶書，悟空走了。我讓他走，是因為有時候，離開才是唯一剩下的尊嚴。可我也讓他回來，因為我相信，真正有本事的人，不會因為受了委屈就永遠放手。',
      '最讓我想說的意外，不是白骨精有多狡猾，而是：傷他最深的，偏偏是他最在乎的人。這不是偶然，這是我對人世間一個殘酷規律的觀察——越在乎，越容易被傷。',
      '他回去救師父，那個轉彎，不是因為師父認錯了，而是因為他選擇了比委屈更重的東西。我寫到那裡，覺得那才是真正的強大——不是打不倒，而是放得下又拿得起。',
      '最後他修成鬥戰勝佛，緊箍自然消失。我設計這個結局，是因為我相信：真正的自由，不是衝破枷鎖，而是走到那一天，你發現枷鎖早就不見了，因為你已經不再需要被約束。'
    ],
    storyteller4Name:'觀世音菩薩', storyteller4Role:'悟空命運的設計者',
    storyteller4Intro:{
      who:'我是觀世音。世人來求我，多半是因為苦；可我這次要說的，不是一個苦盡甘來的故事，而是一個我親手設計的局——為了讓一隻猴子，走完他必須走的那條路。',
      relation:'我和悟空的關係，不是慈悲與頑劣，而是棋手與棋子——只是這顆棋子，有自己的脾氣，有自己的傷，有自己的不服氣。我看著他被壓，看著他出來，看著他一路護著唐僧；我沒有告訴他，這條路本來就是為他量身設計的。',
      why:'為什麼由我來說？因為整件事，從頭到尾，我都在場——只是他不知道。三打白骨精這一關，是他必須過的一關，不只是打妖怪，而是學會在沒有人相信你的時候，還能選擇留下來。那個功課，只有他自己能交。'
    },
    storyteller4Simple:[
      '悟空的目標，我比他自己更早知道——他想要的，不只是自由，而是一個讓他的力量有意義的地方。花果山給不了他，天庭給不了他；只有這條取經路，才給得了他。',
      '三打白骨精這一關，我沒有出手，是刻意的。他最大的阻礙，從來不是白骨精有多難打，而是唐僧的不信任。那道關，是悟空的心魔關，不是降妖關——降妖他一早就過了，心魔才是真正的考驗。',
      '他三次揮棒，三次被誤解，三次受罰。我在旁邊看著，沒有下來解釋，因為那個委屈，必須由他自己扛；有些功課，我替他過了，他就沒有長進。',
      '師父給了貶書，悟空走了。我知道他去了花果山，我也知道他心裡放不下。那個放不下，才是我設計這條路時，最在意的東西——因為只有在乎，才能修行。',
      '最讓人意外的，從來不是妖怪多厲害，而是他在完全沒有人支持的情況下，還是選擇回來。那個選擇，不是被逼的，也不是習慣，而是他終於明白，他的意義不在花果山，而在這條還沒走完的路上。',
      '他回來救師父，那一刻的轉彎，我看得最清楚：他不是屈服了，他是長大了。放下委屈不是軟弱，是因為他找到了比不服氣更重要的事。',
      '取經圓滿，緊箍消失，悟空成佛。那個結局，我從一開始就看見了；可中間那條路，必須由他自己走。我給他設計了考驗，卻沒有辦法替他通過——那才是慈悲真正的樣子。'
    ],
    simple:['識破白骨精的三次偽裝，保護唐僧不被妖怪所害。','白骨精化身村姑、老婦、老翁，唐僧肉眼凡胎看不穿，豬八戒趁機煽風點火。','他三次揮棒，打死白骨精的化身，每次都試圖向師父解釋眼前是妖。','師父不信，認定他濫殺無辜，當場念緊箍咒懲罰，最終寫下貶書將他驅逐出師門。','他拚死保護的人，成了傷他最深的人——忠誠換來的不是信任，而是放逐。','他含淚接下貶書，選擇離開，卻在師父後來遇險時義無反顧回來相救。','師父終於明白他的忠心，師徒重歸於好，繼續西行。'],
    full:['外在目標：識破白骨精，護送唐僧西天取經，修成正果。<br><br>內在目標：從一個被壓迫、被封印的叛逆者，找到一種不需要靠破壞才能確認自己存在的方式。<br><br>取經，是他第一次有機會讓力量服務於愛，而非服務於憤怒。','外在：白骨精三次偽裝，妖魔層出不窮，每一關都是考驗。<br><br>中層：緊箍咒的物理束縛，以及凡人師父的肉眼凡胎與反覆誤解。<br><br>內在：他的狂傲野性與「守護」所需要的忍耐之間的根本衝突。最難打的敵人，從來不是妖怪，而是他自己的脾氣。','三次揮棒，打死白骨精的化身，每次都試圖向師父解釋眼前是妖。<br><br>但他真正的努力是學會按捺性子——在師父誤解他、驅逐他之後，仍然回來。','他一次次擊退強敵，保住了取經團隊的存續。<br><br>但師父不信，認定他濫殺無辜，寫下貶書將他驅逐出師門——力量強大，卻仍被嫌棄。','最大的危機不是打不過的妖怪，而是他拚死保護的對象，竟然是傷害他最深、最不信任他的人。<br><br>忠誠無法保證被理解，守護無法換來信任。','他可以一怒之下回花果山，永遠做自由自在的齊天大聖。<br><br>但師父遇險時，他義無反顧地回來了。<br><br>他放棄的：不受拘束的野性自由，以及「不需要任何人認可」的孤傲。<br><br>他換來的：真正的責任與牽絆——一種比自由更深的東西，叫做「在乎」。','九九八十一難，取經成功，緊箍自然消失。<br><br>他從一隻用破壞確認存在的狂猿，變成了一個用守護定義自己的鬥戰勝佛。頭上的箍不見了，因為他的心不再需要被約束。'],
    storyteller5Name:'許榮哲', storyteller5Role:'故事教練，靶心人公式創造者',
    storyteller5Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 孫悟空 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 孫悟空 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 孫悟空，最值得分析的不是表面的成敗，而是他在「三打白骨精：護師遭誤解，含冤被驅逐」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller5Simple:['用靶心人公式看，孫悟空 真正要做的，是：識破白骨精的三次偽裝，保護唐僧不被妖怪所害。','這個故事真正有力的阻礙，在於：白骨精化身村姑、老婦、老翁，唐僧肉眼凡胎看不穿，豬八戒趁機煽風點火。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他三次揮棒，打死白骨精的化身，每次都試圖向師父解釋眼前是妖。','故事走到這一步，表面的結果是：師父不信，認定他濫殺無辜，當場念緊箍咒懲罰，最終寫下貶書將他驅逐出師門。','真正讓這個故事變得難忘的意外，是：他拚死保護的人，成了傷他最深的人——忠誠換來的不是信任，而是放逐。','而最關鍵的轉彎，正是在這裡發生：他含淚接下貶書，選擇離開，卻在師父後來遇險時義無反顧回來相救。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：師父終於明白他的忠心，師徒重歸於好，繼續西行。'],
    quote:'他不是因為被理解才留下，而是因為在乎才回來——這才是真正的忠誠。'},
  { name:'彼得潘', work:'《彼得潘》', scene:'溫蒂決定回家，彼得潘選擇放手',
    simple:['讓溫蒂永遠留在夢幻島，繼續說故事、繼續冒險。','溫蒂和弟弟們開始想家，想要母親，想回到那個他最不願意面對的「長大的世界」。','他用冒險、飛翔、故事留住他們，試圖讓夢幻島比現實更有吸引力。','溫蒂仍然決定離開，她說她必須回家，必須長大。','他可以強留，卻發現：強留住的人，已經不是他想要的那個人了。','他選擇放手，把溫蒂和弟弟們送回倫敦，自己獨留夢幻島。','溫蒂長大、老去，彼得潘依然是那個在窗外窺探的孩子，永遠在告別，永遠不能同行。'],
    full:['外在目標：帶領孩子們對抗海盜，守護夢幻島。<br><br>內在目標：停留在一個不需要承擔失去、不需要面對改變的永恆狀態。<br><br>他真正恐懼的，是成長帶來的必然——每一段關係都會結束，每一個人都會離開。','外在：虎克船長代表的成人世界——規則、責任、死亡的威脅。<br><br>中層：溫蒂和迷失男孩們內心逐漸甦醒的思鄉之情與成長渴望。<br><br>內在：時間的必然流逝。他可以讓自己不長大，卻無法讓別人跟他一起停止。孤獨，才是他真正的枷鎖。','戰鬥、飛翔、發明遊戲，全力維持夢幻島的永恆法則。<br><br>他以為只要保持冒險，就能留住所有人。但他錯了——人心的成長，不是冒險可以阻止的。','他打敗了海盜，守住了夢幻島，維持了永恆童年的狀態。<br><br>但他發現自己贏得的世界越來越空——身邊的人一個個選擇離開。','真正的敵人根本不是虎克船長，而是：朋友們終究會想家、會長大、會選擇離開。<br><br>他以為停止就能避免失去，結果停止本身就是最大的失去。','他可以強留溫蒂，甚至跟她一起回倫敦，選擇長大。<br><br>但他沒有。他選擇放手，把溫蒂送回倫敦，自己獨留夢幻島。<br><br>他放棄的：與他人共同經歷生命、衰老與流逝的可能。<br><br>他換來的：永不褪色的童年，以及永遠不必說「我失去了你」的保護。','溫蒂長大、老去，彼得潘依然是那個在窗外窺探的孩子。<br><br>他贏得了絕對的自由，卻永遠無法同行。這不是童話的狂歡，而是關於拒絕成長的人，最終必然承受的孤獨。'],
    storytellerName:'溫蒂', storytellerRole:'彼得潘最理解他的朋友',
    storytellerIntro:{
      who:'我是溫蒂。很多人記得彼得潘，是因為他會飛，會帶孩子去夢幻島，永遠不長大；可我記得的，不只是那個會飛的男孩，而是那個不肯長大的靈魂。',
      relation:'我和他的關係，很難只用一句話說清楚。我像是他的朋友，也像是他的聽眾；有時像姐姐，有時又像那個短暫走進他世界的人。我曾經被他的自由吸引，也曾經為他的天真感到心疼。',
      why:'為什麼由我來說？因為只有真正喜歡過他的人，才看得見他的哀傷。別人看見的是冒險，我看見的卻是逃避；別人看見的是自由，我看見的卻是他不敢長大的理由。'
    },
    storytellerSimple:['第一次見到彼得時，我就明白，他最想要的，不只是冒險，而是把我們永遠留在夢幻島，讓故事永遠不要結束。','可我們終究不是夢幻島的孩子；弟弟們開始想家，我也開始想念母親，想念那個會長大的世界。','彼得帶著我們飛、帶著我們戰鬥、帶著我們玩，好像只要笑聲不停，我們就不必離開。','但最後，我還是告訴他：我必須回家，必須長大；那一刻我知道，我們想守住的，已經不是同一樣東西了。','真正令人難過的，不是他留不住我，而是他終於明白：若是強行留下，那就不再是我了。','所以他沒有攔我；他送我們回倫敦，自己回到夢幻島，把那個永遠不長大的位置，留給了自己。','後來我長大了，而彼得依然在窗外；於是我才懂得，他守住了童年，卻也因此必須一次又一次，看著別人離開。'],
    storyteller2Name:'J.M.巴利', storyteller2Role:'彼得潘的創造者',
    storyteller2Intro:{
      who:'我是詹姆斯．馬修．巴利。我創造了彼得潘，但說實話，是彼得潘先找到我的。我從來沒有真正長大過——不是因為我不想，而是因為有什麼東西，讓我一直站在那個童年的門口，進不去，也走不開。',
      relation:'我和彼得潘的關係，比作者和角色更複雜。他是我心裡那個永遠不肯長大的部分，也是我最清楚的自畫像——我把他寫出來，是因為我需要承認他的存在，卻又沒有辦法真正活成他。',
      why:'為什麼由我來說？因為我知道彼得潘最深的秘密：他不是一個快樂的故事，而是一個關於「如果不放手，你會失去什麼」的警告。只有創造他的人，才知道他身上有多少是我不敢說出口的遺憾。'
    },
    storyteller2Simple:[
      '彼得潘想要的，說穿了只有一件事：讓時間停下來，讓所有喜歡的人留在他身邊，讓故事永遠不要結束。這個願望我太熟悉了，因為它也是我的。',
      '可最大的阻礙，不是任何外來的敵人，而是時間本身。孩子們會長大，溫蒂會長大，每一個走進夢幻島的人，最終都會選擇離開——這是彼得潘唯一打不贏的敵人。',
      '他飛翔、冒險、對抗海盜，他用盡所有方法讓夢幻島比現實更有魅力。他真正的努力，是每一次有人想起家的時候，想辦法讓他們忘記。',
      '溫蒂還是走了。她必須走，因為那才是真實的生命；可彼得潘留下來了，守著那個不會改變的島，一個人。',
      '最大的意外，不是溫蒂離開，而是彼得潘送她走了——他明明可以攔住她，可他沒有。我寫到那裡，才驚覺：他其實知道，強留住的人，已經不是他想要的人了。',
      '他放棄了跟溫蒂一起長大、一起老去的可能，換來了永遠不必說再見的幻覺。但那個幻覺的代價，是他必須一次又一次，站在窗外看著別人活著。',
      '我寫彼得潘，以為我在寫一個快樂的孩子；後來我才明白，我寫的是所有人心裡那個不肯長大的部分——那個部分守住了童年，卻也因此，永遠無法同行。'
    ],
    storyteller3Name:'虎克船長', storyteller3Role:'夢幻島的反派，另一個拒絕長大的人',
    storyteller3Intro:{
      who:'我是詹姆斯·虎克船長。世人記得我，是因為那隻鉤子，以及那條鱷魚。可沒有人問過：一個劍橋畢業的紳士，為什麼會在一座幻想島上，用一生對抗一個永遠不長大的男孩？那個問題的答案，才是我真正的故事。',
      relation:'我和彼得潘的關係，比任何人都更深，也更荒謬。他是我存在的理由——沒有他，我就只是一個在夢幻島上無所事事的海盜。可我也是他存在的理由：沒有我，他的冒險就沒有真正的危險，他的永恆童年就沒有重量。我們互相需要，卻互相毀滅。',
      why:'為什麼由我來說？因為我是那個鏡子——彼得潘拒絕長大，選擇了輕盈；我拒絕長大，選擇了憤怒。我們走的是同一條路，卻走向了完全不同的地方。只有我，才能讓你看清楚：不長大這件事，可以是自由，也可以是詛咒。'
    },
    storyteller3Simple:[
      '彼得潘想要的，說穿了是永恆——永遠的冒險，永遠的青春，永遠不必面對失去。我懂那個渴望，因為我也有。可他用飛翔去追，我用憤怒去追；他追的是快樂，我追的是，讓那個奪走我手的男孩，承認我的存在。',
      '他的阻礙，是時間——是所有人終將長大、終將離去的必然。可他不知道，這個阻礙也壓在我身上。每次溫蒂和孩子們要走，我都想攔——不是因為我是反派，而是因為我也知道，他們一走，夢幻島又少了一點真實的重量。',
      '他帶著孩子們冒險、飛翔、對抗我的海盜船。可我注意到的，不是他有多勇敢，而是他從來不記得我的名字——每次打完，他就忘了。那個遺忘，比任何傷害都更刺人。他不是在對抗我，他只是在享受對抗本身。',
      '溫蒂決定離開，他選擇放手，把她送回倫敦。那一刻，他做了我永遠做不到的事：他放開了。我沒有辦法放開——我的憤怒是我唯一還在抓著的東西，因為放開了，我就什麼都不是了。',
      '最讓我意外的，不是他選擇留下，而是他選擇送她走。我以為他和我一樣，會想盡辦法留住所有人；結果他比我更清楚：強留住的人，已經不是你想要的那個人了。那個智慧，是我用一生憤怒都沒學到的東西。',
      '他的轉彎，是放手；我的困境，是放不下。他放棄了與溫蒂同行的可能，換來了一種乾淨的永恆；我放不下對他的執念，換來的是一條跟著我的鱷魚，和一個永遠無法結束的追逐。',
      '他還在夢幻島，我也還在夢幻島。可我們的永恆，是完全不同的兩種——他的永恆是輕盈的，我的永恆是沉重的。同樣拒絕長大，同樣留在這裡；差別只在於，他是因為選擇，我是因為困住了。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 彼得潘 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 彼得潘 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 彼得潘，最值得分析的不是表面的成敗，而是他在「溫蒂決定回家，彼得潘選擇放手」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，彼得潘 真正要做的，是：讓溫蒂永遠留在夢幻島，繼續說故事、繼續冒險。','這個故事真正有力的阻礙，在於：溫蒂和弟弟們開始想家，想要母親，想回到那個他最不願意面對的「長大的世界」。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他用冒險、飛翔、故事留住他們，試圖讓夢幻島比現實更有吸引力。','故事走到這一步，表面的結果是：溫蒂仍然決定離開，她說她必須回家，必須長大。','真正讓這個故事變得難忘的意外，是：他可以強留，卻發現：強留住的人，已經不是他想要的那個人了。','而最關鍵的轉彎，正是在這裡發生：他選擇放手，把溫蒂和弟弟們送回倫敦，自己獨留夢幻島。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：溫蒂長大、老去，彼得潘依然是那個在窗外窺探的孩子，永遠在告別，永遠不能同行。'],
    quote:'他以為放手是失敗，卻不知道那是他做過最成熟的一個決定。'},
  { name:'唐吉訶德', work:'《唐吉訶德》', scene:'大戰風車：把風車當成巨人衝鋒',
    simple:['消滅眼前的「巨人」，完成遊俠騎士的英雄壯舉。','桑丘大喊那只是風車，不是巨人，但唐吉訶德充耳不聞。','他高舉長矛，策馬全速衝向旋轉的風車葉片。','長矛被風車葉片打斷，人馬俱倒，狼狽落敗。','他不承認失敗，宣稱是巫師在最後一刻把巨人變成了風車，是陰謀，不是他錯了。','他爬起來，重新上馬，繼續前行——失敗對他來說，只是下一場冒險的開始。','世人哄堂大笑，但沒有一個人敢說，他們心裡從來沒有一個想衝向風車的念頭。'],
    full:['外在目標：成為遊俠騎士，行俠仗義，懲奸除惡。<br><br>內在目標：賦予平庸蒼白的生活一種崇高的意義，拒絕接受「世界本來就是如此無聊」這個事實。<br><br>唐吉訶德看見現實世界的庸俗與犬儒，所以選擇用幻夢抵抗它。','外在：嘲笑他的人群，以及根本不存在巨人的現實物理規則。<br><br>中層：衰老的身體、匱乏的物資，以及時代的根本錯位。<br><br>內在：他的理想與所處時代徹底脫節。騎士精神已死，他獨自一人試圖讓它復活。','穿上破銅爛鐵，把風車當巨人，把客棧當城堡。屢戰屢敗，屢敗屢戰。<br><br>他真正的努力是：用極度瘋狂的信念對抗現實世界的庸俗，哪怕每次都是笑話，哪怕從沒有人理解。','他屢戰屢敗，受盡屈辱與毒打，成為天下人眼中的瘋子與笑柄。<br><br>但奇怪的事發生了：越來越多人被他感動，開始懷疑——到底誰才是真正的瘋子？','他的荒唐行為雖然可笑，卻意外照出了現實世界的庸俗、犬儒與失夢。<br><br>一個被所有人嘲笑的瘋子，反而成為整個故事裡最清醒的靈魂。','他可以在幻夢中度過餘生，帶著騎士的榮光死去。<br><br>但在臨終前，他選擇清醒過來，承認那些騎士小說都是胡言亂語。<br><br>他放棄的：一生不計代價捍衛的浪漫幻夢。<br><br>他換來的：作為一個普通人平靜赴死的尊嚴，以及對所愛之人最後的清醒告別。','他死了，幻夢破滅了。<br><br>但他荒唐的抗爭，永遠留在文學史上，反照出現實的犬儒——一個笑話人物，成為捍衛理想最動人的悲劇英雄。'],
    storytellerName:'桑丘', storytellerRole:'唐吉訶德的侍從',
    storytellerIntro:{
      who:'我是桑丘．潘薩。若你聽過我家主人唐吉訶德的名字，多半也聽過那些笑話：把風車當巨人，把客店當城堡，把破爛世界看成騎士傳奇；可我要說，他不只是個笑話。',
      relation:'我和他的關係，是主人與侍從。可走久了，我知道，我不只是跟著他跑腿的人；我是那個一路聽他說夢、陪他摔跤、替他收拾殘局，卻又忍不住繼續跟著他走的人。',
      why:'為什麼由我來說？因為我最像你們。我原本也是覺得他荒唐的人；可正因我這樣的人，最後都被他打動了，你們才會知道：他真正厲害的，不是打贏了誰，而是在人人都清醒得麻木的世界裡，還敢發瘋似地相信理想。'
    },
    storytellerSimple:['我家老爺一看到那幾座風車，眼睛就亮了，彷彿真看見了巨人；在他心裡，這一仗不是胡鬧，而是證明自己真是騎士的機會。','我在旁邊喊破喉嚨，說那不是巨人，是風車；可他一旦相信那是邪惡，就誰的話也聽不進去了。','於是他夾緊瘦馬，高舉長矛，真的朝那幾片大風葉衝了過去；那股認真勁，連我都差點相信前面真有怪物。','結果風車一轉，長矛當場折斷，他整個人連同那匹老馬一起摔得七葷八素，狼狽得不能再狼狽。','可最怪的還不是他摔倒，而是他摔成那樣，還是不肯承認自己看錯；他說，是巫師在最後一刻把巨人變成了風車。','我本以為這下他總該死心了，誰知道他拍拍灰，又重新上馬；對他來說，失敗從來不是結束，而只是下一次出發前的喘口氣。','旁人都笑他瘋，可我一路跟著他，反倒慢慢覺得：真正可怕的，也許不是把風車看成巨人，而是我們早已連衝向風車的膽子都沒有了。'],
    storyteller2Name:'塞萬提斯', storyteller2Role:'唐吉訶德的創造者',
    storyteller2Intro:{
      who:'我是塞萬提斯。我坐過牢，打過仗，手臂在勒班陀海戰失去了功能，一輩子潦倒，晚年才靠一部書留下名字。世人說我寫了一個瘋子，可我寫的，是我自己。',
      relation:'我和唐吉訶德的關係，不是作者和角色，而是一個人和他心裡那個不肯妥協的部分。我在牢裡開始寫他，是因為我需要有人替我說：這個世界犬儒，但衝向風車這件事，本身就有意義。',
      why:'為什麼由我來說？因為我最清楚，寫一個「瘋子」需要多大的清醒。唐吉訶德不是笑話，他是一面鏡子——照出所有那些選擇「清醒」卻活得麻木的人。只有一個一生都在被現實打倒、卻仍然繼續的人，才有資格創造他。'
    },
    storyteller2Simple:[
      '唐吉訶德想要的，不是打贏誰，而是證明這個世界還有值得為之戰鬥的事。這個念頭我懂，懂得骨子裡——因為我坐在牢裡寫他的時候，我也在問自己同樣的問題。',
      '他的阻礙，是整個現實世界的重量：風車只是風車，客棧只是客棧，世人只看見他摔跤，沒有人看見他衝向風車那一刻的眼神。',
      '他衝了，摔了，爬起來，再衝。每一次都被現實打倒，每一次都找到一個理由繼續——巫師、命運、騎士的榮耀。旁人說那是瘋，我說那是一種選擇。',
      '他確實從來沒有打贏過任何一場「真實」的戰鬥。可他贏得了桑丘，贏得了公爵夫人的眼淚，贏得了所有曾經嘲笑他的人心裡那一絲動搖。',
      '最大的意外，不是他又一次失敗，而是他臨終前清醒了——他說那些騎士小說都是謊言，他要以一個普通人的身分死去。我寫到那裡，哭了。',
      '那個清醒，是他最後的禮物，也是最殘酷的轉彎：他放棄了那個瘋狂的夢，換來了一種安靜的尊嚴。可我始終覺得，那個夢的時候的他，比清醒的他更真實。',
      '他死了，桑丘哭了，我也哭了。世人說《唐吉訶德》是喜劇，我說那是我寫過最誠實的悲劇——一個人用盡一生去相信，最後用清醒告別，而那個相信本身，就是他留給世界最重要的東西。'
    ],
    storyteller3Name:'公爵夫人', storyteller3Role:'選擇讓唐吉訶德活在夢裡的人',
    storyteller3Intro:{
      who:'我是公爵夫人。你們記得唐吉訶德大戰風車，記得他把客棧當城堡，記得桑丘一路搖頭嘆氣；可你們不記得我——那個看完這一切，選擇配合他繼續演下去的人。那個選擇，才是整個故事裡最複雜的道德題。',
      relation:'我和唐吉訶德的關係，說起來有點殘忍：我欣賞他，也拿他取樂。我和公爵安排了整場「騎士接待」的戲，讓他以為自己真的受到了英雄般的對待。我們笑了，他也笑了，只是我們笑的不是同一件事。',
      why:'為什麼由我來說？因為我是那個問題的具體形狀：當一個人活在美麗的幻夢裡，你是該叫醒他，還是讓他繼續做夢？我選擇了讓他繼續——可到最後，我不確定那是善意，還是自私。只有我，能說清楚那個選擇的重量。'
    },
    storyteller3Simple:[
      '唐吉訶德想要的，我一眼就看清楚了：他想要一個世界，在那個世界裡，騎士精神不是笑話，英雄壯舉不是妄想，他的存在有意義。那個渴望，讓我無法只是嘲笑他——我選擇給他那個世界，哪怕是假的。',
      '他的阻礙，不是風車，不是巨人，而是現實世界的重力——那個把所有夢想都拉回地面的力量。可在我的城堡裡，我暫時讓那個重力消失了：我叫僕人扮演公主，叫騎士配合他的故事，讓他以為他終於遇見了懂他的人。',
      '他在我城堡裡的那段日子，是他一生最接近「夢成真」的時刻。我看著他認真地履行騎士職責，認真地相信每一個我設計的橋段——那種認真，讓我有一瞬間覺得，也許他才是對的，也許我們都活在自己的幻夢裡。',
      '他相信了一切，全心全意地相信。那個結果，讓我高興，也讓我不安——因為我給他的，是一個精心設計的謊言，而他用他最珍貴的東西去接它：他的信任，他的尊嚴，他的整個世界觀。',
      '最讓我意外的，是我自己的感受。我以為我只是在看一場好戲，結果我發現我開始在乎他。他的荒唐讓我笑，他的誠心讓我動搖；當他離開城堡的時候，我忽然不確定：我給他的那場夢，究竟是禮物，還是又一種殘忍？',
      '他最後清醒了，在臨終前說那些騎士故事都是謊言。那個轉彎，把我的選擇變成了問題：如果我沒有配合他，他會更早清醒嗎？那個清醒，會是解脫，還是另一種傷？我讓他多活了一段夢，但我不知道，那對他是好是壞。',
      '他死了，帶著他的夢，也帶著他最後的清醒。我坐在城堡裡，想著那個問題——一個人活在美麗的錯誤裡，和活在醜陋的真實裡，哪一個更有尊嚴？唐吉訶德用他的一生問了這個問題，我用我的選擇給了一個答案，卻從來不確定那個答案是否正確。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 唐吉訶德 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 唐吉訶德 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 唐吉訶德，最值得分析的不是表面的成敗，而是他在「大戰風車：把風車當成巨人衝鋒」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，唐吉訶德 真正要做的，是：消滅眼前的「巨人」，完成遊俠騎士的英雄壯舉。','這個故事真正有力的阻礙，在於：桑丘大喊那只是風車，不是巨人，但唐吉訶德充耳不聞。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他高舉長矛，策馬全速衝向旋轉的風車葉片。','故事走到這一步，表面的結果是：長矛被風車葉片打斷，人馬俱倒，狼狽落敗。','真正讓這個故事變得難忘的意外，是：他不承認失敗，宣稱是巫師在最後一刻把巨人變成了風車，是陰謀，不是他錯了。','而最關鍵的轉彎，正是在這裡發生：他爬起來，重新上馬，繼續前行——失敗對他來說，只是下一場冒險的開始。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：世人哄堂大笑，但沒有一個人敢說，他們心裡從來沒有一個想衝向風車的念頭。'],
    quote:'他衝向的不是風車，而是所有人心裡那個已經放棄的夢。'},
  { name:'楚門', work:'《楚門的世界》', scene:'船頭撞破藍天布景，真相赤裸現形',
    storytellerName:'席維亞（Sylvia／節目中化名 Lauren）', storytellerRole:'楚門最早想叫醒他的人',
    storytellerIntro:{
      who:'我是席維亞。在楚門的世界裡，你也許見過我另一個名字：Lauren。那是節目替我安排的角色，卻不是我真正的自己。',
      relation:'我和楚門的關係，是那個曾經愛過他，也最早想叫醒他的人。當所有人都在陪他演戲，當整個世界都把他困在一個巨大的謊言裡時，我是少數不願意繼續騙他的人。',
      why:'為什麼由我來說？因為我看見的，不是節目裡那個可愛的主角，而是一個被偷走人生的人。只有真正希望他自由的人，才說得出他踏出那扇門時，有多偉大。'
    },
    storytellerSimple:['我第一次真正看見楚門時，就知道他心裡一直有個念頭：他不是只想離開海景鎮，而是想知道，外面的世界到底是不是真的。','可怕的是，整個世界都在攔他；製作團隊用暴風雨、閃電、巨浪，甚至用他從小被灌輸的恐懼，逼他退回那座精緻的牢籠。','但楚門還是抓緊舵盤，一個人往前開；沒有人能幫他，也沒有人能替他證明前方有沒有出口，可他還是不肯回頭。','他終於撐過了風暴，眼看就要抵達自由，船頭卻猛然撞上一堵牆——那不是天空，那只是被畫成天空的布景。','最殘忍的從來不只是別人騙了他，而是他活了三十年的太陽、海風、街道和微笑，原來全都只是為他搭好的舞台。','導演告訴他，外面的世界一樣虛假，留在這裡反而更安全；可楚門只是鞠了一躬，轉身走向那扇黑門。','那一刻，全世界都在看他離開鏡頭；而我知道，當楚門終於消失在鏡頭之外時，他才第一次真正活成了自己。'],
    storyteller2Name:'克里斯托夫', storyteller2Role:'楚門秀的導演與創造者',
    storyteller2Intro:{
      who:'我是克里斯托夫。我是楚門秀的導演，也是楚門的創造者——從他出生的那一刻起，我就在鏡頭後面，決定他的天氣、他的鄰居、他的故事。我不認為我做錯了什麼。至少，一開始不認為。',
      relation:'我和楚門的關係，比任何人都深，也比任何人都虛假。我看著他長大，看著他笑，看著他愛上一個人，看著他懷疑這個世界——每一秒我都在場，卻從來沒有真正在他身邊。我是他的上帝，也是他的牢獄。',
      why:'為什麼由我來說？因為只有我知道，那扇門打開的那一刻，我失去了什麼。全世界都在歡呼楚門自由了，只有我知道：三十年，三十年我活在他的生命裡——他走出去的那一步，也是我的世界結束的那一刻。'
    },
    storyteller2Simple:[
      '楚門想要的，我比他更早知道——他想離開，想知道真相，想活在一個不是為他設計的世界裡。我知道，所以我設計了那麼多阻礙，讓他以為那些恐懼是他自己的。',
      '他最大的阻礙，是我。不只是暴風雨和閃電，而是他從小就種下的恐水症，那個讓他連逃跑路線都封死的恐懼——那是我設計的，我不後悔，因為那樣他才會安全。',
      '他抓著舵盤，一個人開進風暴。我調大了浪，加強了雷，讓海浪幾乎把他的船翻覆——我有能力讓他死，但我沒有。我只是讓他怕，怕到他回頭。可他沒有回頭。',
      '他撐過了風暴，船頭撞上了布景。那個聲音我永遠記得——不是布景破裂的聲音，而是三十年的設計，在那一刻碎掉的聲音。',
      '我在雲端對他說：外面的世界一樣危險，一樣虛假，留在這裡你是絕對安全的傳奇。我說的是真話，也是我最後能給他的東西。他說謝謝，鞠了一躬，走了。',
      '他走向那扇門的時候，我才真正明白：我以為我在保護他，其實我在保護我自己——保護那個需要他、需要這個節目、需要每天早上看著他醒來的我。',
      '楚門消失在鏡頭外，全球觀眾換台。節目結束了。我坐在控制室裡，第一次沒有鏡頭可以看，第一次不知道他在哪裡，第一次明白：他自由了，而我，從此失去了唯一真實的東西。'
    ],
    simple:['駕船逃離海景鎮，抵達外面真實的世界。','製作團隊用人造暴風雨、閃電、巨浪試圖讓他回頭，極力阻止他到達邊界。','他死死抓住舵盤，在人造風暴中獨自航行，不回頭，不放棄。','他撐過了風暴，船頭卻撞上了一堵牆——那是藍天的布景。','世界不只是被操控的，而是被製造的——他生活了三十年的天空，是一塊假的幕布。','導演說外面的世界一樣虛假，留下來更安全；他鞠躬道謝，走進那扇黑門。','直播結束，全球觀眾歡呼後轉台；楚門消失在鏡頭之外，成為自己人生的作者。'],
    full:['外在目標：駕船逃離海景鎮，抵達外面真實的世界。<br><br>內在目標：拿回自己人生的掌控權——不是逃離某個地方，而是確認「我的選擇是真實的」。','外在：整個影視團隊無所不用其極的阻撓——暴風雨、交通管制、突然出現的親人。<br><br>中層：妻子、朋友全是演員，他所有的情感連結都是劇本。<br><br>內在：製作團隊從小植入的深層恐水症，讓他連最基本的逃跑路線都被封死。他最大的枷鎖，是他自己都不知道它存在。','從細節中觀察破綻，反覆試探、策劃逃亡，獨自駕船駛向充滿人造風暴的大海。<br><br>他真正的努力是克服心魔——在沒有任何人支持、不知道外面是什麼的情況下，仍然選擇往前走。','他戰勝了人造的狂風巨浪，航向大海的盡頭，即將獲得自由。<br><br>然後，船頭撞破了藍天布景。','最大的意外不是某件事的發生，而是整個世界本身就是假的——而且假得如此具象與殘酷。<br><br>他以為突破的終點是自由，結果突破的終點，是另一個邊界。','導演在雲端說：外面的世界一樣虛假，留下來他是絕對安全的傳奇。<br><br>他可以留下，選擇已知的完美。但他沒有。他鞠躬告別，走進那扇黑門。<br><br>他放棄的：安全、無痛、被萬眾注視的完美人生。<br><br>他換來的：未知、危險、可能受傷——但絕對真實的自由。','直播結束，觀眾歡呼後轉台。楚門消失在鏡頭之外。<br><br>他不再是被觀看的商品，真正成為自己人生的作者。而他消失在鏡頭外的那一刻，正是他得到自由的證明。'],
    storyteller3Name:'安德魯·尼科', storyteller3Role:'《楚門的世界》編劇',
    storyteller3Intro:{
      who:'我是安德魯·尼科。我寫了楚門這個故事，但說實話，楚門不是我憑空想出來的——他是我對電視真人秀時代最深的焦慮，以及對「監控」這件事最誠實的追問。一個人從出生就被攝影機拍著，他還算是活著的人嗎？',
      relation:'我和楚門的關係，是造物者與被造物，也是提問者與答案。我設計了他的牢籠，也設計了他的出口；我讓他懷疑，讓他掙扎，讓他撞破布景——因為我需要知道，當一個人面對全部的真相時，他會選擇什麼。',
      why:'為什麼由我來說？因為楚門那一鞠躬，是我寫作生涯裡最驕傲的一個時刻。那不是我給他的台詞，那是他從整個故事的邏輯裡自然長出來的動作——一個被操控了三十年的人，在真相面前，選擇用最有尊嚴的方式說再見。只有寫出他的人，才知道那個姿態有多來之不易。'
    },
    storyteller3Simple:[
      '楚門想要的，我從第一稿就想清楚了：不是逃跑，而是確認。他不只是想離開海景鎮，他需要知道，這一切是不是真的——他的感受，他的選擇，他的人生，到底有沒有一件事是屬於他自己的。',
      '我給他設計的最大阻礙，不是攝影機，不是製作團隊，而是他自己被植入的恐懼。那個對水、對大海的恐懼，是整個故事最殘忍的設計——讓他最想走的那條路，成為他最無法踏上的路。',
      '他一個人駕船出海，我寫那段的時候非常安靜。沒有對白，沒有配角，只有一個人和他決定。那種努力是最純粹的：不是打敗敵人，而是打敗自己。',
      '船頭撞上布景，那是整個故事的核心時刻。我設計那個聲音，是希望觀眾和楚門同時意識到：我們以為是天空的，其實只是一塊布。這不只是楚門的故事，也是我們所有人的故事。',
      '最大的意外，不是布景背後是牆，而是他站在那扇門前，沒有立刻衝出去。他停下來了——這是我給他最重要的一筆。因為只有真正自由的人，才有能力停下來，選擇怎麼離開。',
      '克里斯托夫說外面一樣危險，楚門鞠了一躬。那一鞠躬，是我寫過最有力量的轉彎：他不是逃跑，他是放棄了已知的完美，換來了未知的真實。那個選擇，才是自由真正的樣子。',
      '他走進那扇門，鏡頭切斷，觀眾換台。我用這個結局說的是：一個人最偉大的時刻，往往發生在攝影機消失之後。楚門的故事在這裡結束，他真正的人生，從這裡開始。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 楚門 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 楚門 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 楚門，最值得分析的不是表面的成敗，而是他在「船頭撞破藍天布景，真相赤裸現形」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，楚門 真正要做的，是：駕船逃離海景鎮，抵達外面真實的世界。','這個故事真正有力的阻礙，在於：製作團隊用人造暴風雨、閃電、巨浪試圖讓他回頭，極力阻止他到達邊界。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他死死抓住舵盤，在人造風暴中獨自航行，不回頭，不放棄。','故事走到這一步，表面的結果是：他撐過了風暴，船頭卻撞上了一堵牆——那是藍天的布景。','真正讓這個故事變得難忘的意外，是：世界不只是被操控的，而是被製造的——他生活了三十年的天空，是一塊假的幕布。','而最關鍵的轉彎，正是在這裡發生：導演說外面的世界一樣虛假，留下來更安全；他鞠躬道謝，走進那扇黑門。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：直播結束，全球觀眾歡呼後轉台；楚門消失在鏡頭之外，成為自己人生的作者。'],
    quote:'他不是因為外面更好才離開，而是因為那是他自己的選擇——這才是自由的全部意義。'},
  { name:'佛羅多', work:'《魔戒》', scene:'末日火山口：站在終點，卻戴上了魔戒',
    storytellerName:'山姆', storytellerRole:'佛羅多最忠誠的同伴',
    storytellerIntro:{
      who:'我是山姆衛斯．詹吉。很多人記得佛羅多，是因為他帶著魔戒走到末日火山；可我記得的，是那個一路走到最後，卻早就不是為自己而走的人。',
      relation:'我和他的關係，一開始像主人和園丁，後來更像一起扛著黑暗往前走的同伴。我替他背過鍋、背過行李，也背過他本人；我看過他最堅強的樣子，也看過他被魔戒啃咬得快撐不住的樣子。',
      why:'為什麼由我來說？因為世人只會看見他最後那一秒戴上魔戒，卻沒看見他是怎麼一步一步走到那裡的。由我來說，才能讓你知道：佛羅多不是沒有倒下，而是倒下以前，已經替所有人多走了太遠。'
    },
    storytellerSimple:['要說佛羅多的目標，其實簡單得很：把那枚該死的魔戒帶到末日火山，親手把它毀掉，讓中土再也不用活在索倫的影子下。','可越靠近火山，魔戒就越不像一件東西，反倒像一張嘴，日日夜夜在他耳邊說話；到了最後，真正和他打仗的，早就不是索倫，而是那枚戒指在他心裡種下的黑。','他還是走，腳破了也走，餓得發昏也走，爬不起來就用爬的；若你問我他靠什麼撐到那裡，我只能說：靠意志，還有一點點連他自己都快忘記的夏爾。','我們終於走到火山口時，我原以為事情只差最後一下；可佛羅多舉起手後，卻沒有把魔戒丟進去，反而把它戴上，說那是他的了。','若你沒走過那一路，也許會說他失敗了；可真正殘酷的意外是：他不是在半路敗給敵人，而是在終點，敗給了自己早已被咬爛的靈魂。','後來魔戒雖然毀了，但不是靠他最後一刻的意志，而是靠命運用另一種殘忍方式收場；而真正的轉彎，是在一切結束後，佛羅多明白自己再也回不去原來那個夏爾了。','中土得救了，可佛羅多沒有真正痊癒；最後他乘船離開，我站在岸邊才懂得——有些人救了世界，卻不能留在自己救下來的世界裡。'],
    storyteller2Name:'托爾金', storyteller2Role:'魔戒的創造者',
    storyteller2Intro:{
      who:'我是約翰．羅納德．瑞爾．托爾金。我在第一次世界大戰的壕溝裡，看見我最好的朋友們一個個死去；我在索姆河戰役之後，帶著壕溝熱回到英國，開始寫一個關於小人物扛著重量走向黑暗的故事。那個故事，後來叫做《魔戒》。',
      relation:'我和佛羅多的關係，不只是作者和角色。他是我所有倖存者的化身——那些在戰壕裡熬過來、卻發現自己回不去的人。那種傷，不是身體的，是靈魂的；那種回不去，不是路太遠，而是你已經不再是那個離開的人。',
      why:'為什麼由我來說？因為那條路我走過，不是在中土，而是在法國的泥濘裡。佛羅多的故事是我的故事，也是所有曾經扛過太重的東西、然後發現自己再也放不下的人的故事。只有走過那條路的人，才知道那艘船意味著什麼。'
    },
    storyteller2Simple:[
      '佛羅多想要的，說穿了只有一件事：把這個重量帶到它該去的地方，然後回家，回到夏爾，回到那個他出發前以為永遠不會改變的地方。我第一次寫他的時候，我以為那是可能的。',
      '可魔戒的阻礙，不只是索倫，不只是半獸人——它是那枚戒指本身對持有者的腐蝕。越靠近終點，它越重，越像是屬於他的一部分。我在壕溝裡見過這種重量，它叫做戰爭，叫做見證，叫做你看過的東西永遠無法忘記。',
      '他一步一步走，我一個字一個字寫。那條路我們都走得很慢，因為那是唯一誠實的速度——沒有捷徑，沒有魔法，只有繼續。',
      '他到了火山口，他失敗了——他戴上了魔戒。我寫到那裡沒有猶豫，因為我知道：意志力有它的極限，沒有人能扛著那種重量走到終點還完好無損。那不是失敗，那是真實。',
      '咕嚕搶走魔戒，掉進火山，任務意外完成。我設計了這個結局，因為我相信：有些任務，不是靠英雄完成的，而是靠命運，靠那些意想不到的憐憫。',
      '任務結束後，佛羅多乘船離開了。很多讀者不理解為什麼他不能留下來，在夏爾安享晚年。我理解，因為我見過那些從戰場回來的人——他們回來了，但他們沒有真正回來。有些傷，只能帶著走，不能留在原地。',
      '中土得救了，佛羅多走了。我後來常常想，那艘船開向的地方，叫做靈魂的安息，是給那些用完了自己的人準備的——他救了世界，世界欠他一個他再也無法擁有的家。'
    ],
    simple:['把魔戒扔進末日火山的烈焰裡，永遠銷毀它。','魔戒在距離火山最近的地方，腐蝕力量達到頂峰，讓持有者無法主動放棄它。','他拖著幾乎耗盡的身體爬上火山，一步一步，靠著最後的意志前進。','他站在火山口，舉起手——卻把魔戒戴上了，宣告歸己所有。','咕嚕撲上來奪走魔戒，失足跌入火山，魔戒意外被毀。英雄在終點敗給自己，卻由命運完成了任務。','任務完成後，他選擇乘船永遠離開中土，放棄在自己拯救的世界裡安度餘生。','中土獲救，但夏爾對他來說再也不是原來的家——他帶著永不癒合的傷離開了。'],
    full:['外在目標：將魔戒帶到末日火山銷毀，阻止索倫統治中土。<br><br>內在目標：保住夏爾的純潔與寧靜——那個讓他知道「美好的事物值得守護」的地方。<br><br>他的力量不是強大，而是他對「普通生活的美好」有著異常深刻的珍視。','外在：索倫的大軍、戒靈的追捕、整個中土世界的黑暗力量。<br><br>中層：旅途的極限環境，以及咕嚕這個隨時可能背刺的同行者。<br><br>內在：魔戒日夜對他心靈的腐蝕——它不是在攻擊他的身體，而是在慢慢改寫他是誰。','離開舒適圈，翻山越嶺，忍受極大的身心折磨，一步步向前。<br><br>他真正的努力是：每一秒都在與內心的陰暗面抗衡，獨自承擔著足以壓垮靈魂的重擔。','他歷經千辛萬苦，終於站在末日火山口。只差最後一個動作，就能拯救中土世界。<br><br>然後他停下來了。','他一路戰勝了無數強大的敵人，卻在最後一刻敗給了自己——他戴上魔戒，宣告歸己所有。<br><br>這才是整個故事最殘酷的意外：英雄不是被敵人擊倒的，而是被自己擊倒的。意志力，有它的極限。','咕嚕搶走魔戒，掉入火山，任務意外完成。佛羅多沒有完成他「應該」完成的事。<br><br>但他真正的轉彎在事後：他選擇乘船永遠離開中土。<br><br>他放棄的：在自己拯救的世界裡安度餘生。<br><br>他換來的：心靈創傷的最終平息——承認有些傷，是不會好的。','魔戒毀滅，中土世界迎來和平。但拯救世界的英雄，卻再也無法屬於這個世界。<br><br>夏爾還在，只是他回不去了——不是因為路太遠，而是因為他已經不再是那個離開的人。'],
    storyteller3Name:'咕嚕', storyteller3Role:'佛羅多的未來式，魔戒最長的受害者',
    storyteller3Intro:{
      who:'我是咕嚕。也叫斯米戈。我有兩個名字，因為我有兩個自己——一個還記得河邊、蘑菇、陽光；一個只剩下那個「寶貝」，那個讓我活了五百年、也毀了我五百年的戒指。我說佛羅多的故事，因為我就是他差一點變成的人。',
      relation:'我和佛羅多的關係，比任何人說的都更殘酷，也更深。他帶著戒指走，我帶著對戒指的記憶走；他被它腐蝕了一年，我被它腐蝕了五百年。我是他的嚮導，也是他的預言——看著我，就知道那條路走到底是什麼樣子。',
      why:'為什麼由我來說？因為在火山口，是我完成了他沒能完成的事。他戴上了戒指，我把它奪走，我們一起墜落。世人說那是命運，說那是憐憫的果報；可只有我知道：那一刻，我搶的不只是戒指——我搶的，是他不必變成我的機會。'
    },
    storyteller3Simple:[
      '佛羅多想要的，我太懂了——把那個重量帶到它該去的地方，然後回家，回到那個還沒被它污染的地方。我也曾經想過同樣的事，在很久很久以前，在河邊，在我還叫斯米戈的時候。',
      '他的阻礙，最大的那個，不是我，不是半獸人，而是戒指本身。我知道它怎麼說話，怎麼讓你覺得它是你的，怎麼讓你覺得沒有它你就什麼都不是。那個聲音，我聽了五百年，我比任何人都更懂它有多難抗拒。',
      '他一步一步爬，我在前面帶路。我帶他走，是因為我要那個寶貝；可走著走著，我看見他的樣子——他的眼神越來越像我當年的眼神，他的手越來越緊，他說話的聲音越來越不像他自己。那讓我既高興，又說不清楚的難受。',
      '他到了火山口，舉起手，戴上了戒指。我在旁邊，我知道那一刻——那不是失敗，那是被腐蝕到底了。我曾經也到過那個地方：那個你知道應該放下，卻發現自己的手根本不聽話的時刻。',
      '最讓我沒想到的，不是他戴上戒指，而是那一刻我撲上去，我搶到了，我咬下了他的手指，我抱著寶貝，我跌進火山——那是我第一次，做了一件正確的事。我自己都沒預料到。',
      '我掉進去的那一刻，我只想著寶貝；可後來我想，也許那才是我一生裡唯一的轉彎——用我的執念，完成了他的任務；用我沒辦法放下的東西，把那個東西帶進了火山。那不是犧牲，那是意外的救贖。',
      '中土得救了，佛羅多走了，我消失在火焰裡。可我最後想說的是：他沒有變成我——他走到了終點，身上有傷，但他還是他。那個沒有變成我的他，是我這輩子看過最好的結局，哪怕我不在那個結局裡。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 佛羅多 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 佛羅多 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 佛羅多，最值得分析的不是表面的成敗，而是他在「末日火山口：站在終點，卻戴上了魔戒」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，佛羅多 真正要做的，是：把魔戒扔進末日火山的烈焰裡，永遠銷毀它。','這個故事真正有力的阻礙，在於：魔戒在距離火山最近的地方，腐蝕力量達到頂峰，讓持有者無法主動放棄它。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他拖著幾乎耗盡的身體爬上火山，一步一步，靠著最後的意志前進。','故事走到這一步，表面的結果是：他站在火山口，舉起手——卻把魔戒戴上了，宣告歸己所有。','真正讓這個故事變得難忘的意外，是：咕嚕撲上來奪走魔戒，失足跌入火山，魔戒意外被毀。英雄在終點敗給自己，卻由命運完成了任務。','而最關鍵的轉彎，正是在這裡發生：任務完成後，他選擇乘船永遠離開中土，放棄在自己拯救的世界裡安度餘生。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：中土獲救，但夏爾對他來說再也不是原來的家——他帶著永不癒合的傷離開了。'],
    quote:'英雄用自己永不癒合的傷，換來了世界的完整——有些英雄，是靠著不完美才成為英雄的。'},
  { name:'艾爾莎', work:'《冰雪奇緣》', scene:'安娜為她擋劍，冰封的心在那一刻融化',
    storytellerName:'安娜', storytellerRole:'艾爾莎的妹妹',
    storytellerIntro:{
      who:'我是安娜。很多人看見的是會施展冰雪魔法的姊姊艾爾莎；可我從小認識的，是那個明明很愛我，卻一直把自己關起來的人。',
      relation:'我和她的關係，是姊妹。這四個字聽起來很簡單，可裡面有思念、有誤解、有怨，也有怎麼都斷不了的愛。我追著她、找她、想把她帶回來，不只是因為她是女王，而是因為她是我姊姊。',
      why:'為什麼由我來說？因為別人看到的是她的力量，我看到的卻是她的害怕。只有愛過她、也被她推開過的人，才知道她真正要學會的，從來不是變強，而是不再害怕自己。'
    },
    storytellerSimple:['若你問艾爾莎真正想要什麼，我會說，她從來不只是想當個好女王；她只是想不要再傷害任何人，尤其是我。','可她最大的阻礙，從來不是那些冰雪，而是她一直相信：只要做自己，就會傷人。所以她越怕，力量就越失控；越想躲開我們，整個世界就越被冰封。','她拚命壓住、躲開、逃走，甚至一個人躲進冰宮裡，以為只要跟所有人拉開距離，就能保護所有人。','結果王國真的被冰雪困住了，我的心也被她的魔法刺傷；她越想不傷人，反而越傷得深。','最讓人意外的，不是她有多強，而是我們一直以為救我的關鍵會是王子的吻，最後才發現，真正的愛根本不是那種童話公式。','當我替她擋下那一劍，整個人冰封時，艾爾莎終於不再逃了；她抱住我，第一次不是用恐懼，而是用愛去面對自己的力量。','我活了過來，王國也解凍了；而我知道，那天真正融化的，不只是冰，而是艾爾莎心裡那個一直把自己判成怪物的聲音。'],
    storyteller2Name:'漢斯', storyteller2Role:'艾爾莎的操縱者與反派',
    storyteller2Intro:{
      who:'我是漢斯王子。是的，就是那個壞人。我知道你們怎麼看我，我不打算辯駁——可我要說，如果你只把我當成一個普通的反派，你就沒有真正看懂這個故事。',
      relation:'我和艾爾莎的關係，是獵人與獵物，但也是一面鏡子。我能靠近她，靠近安娜，是因為我太清楚孤立是什麼感覺——我是十二個兄弟裡最小的，從來沒有人真正看見我。我用那個理解去靠近她們，然後用它來傷害她們。',
      why:'為什麼由我來說？因為我是那個最清楚艾爾莎弱點的人。她的孤立、她的恐懼、她對被接受的渴望——我全都看見了，然後我把它們當成工具。只有操縱者，才真正研究過被操縱者的傷在哪裡。'
    },
    storyteller2Simple:[
      '艾爾莎想要的，我比她自己更早看清楚：她不想要王位，不想要權力，她只是想有一個地方，讓她的存在不是威脅。那個渴望，就是我的入口。',
      '她最大的阻礙，我也看得一清二楚：她相信自己是怪物，相信自己一旦被看見就會傷人。所以她躲，越躲越孤立，越孤立越好被孤立的人所靠近。',
      '她在冰宮裡以為自己自由了，其實那正是她最脆弱的時候。一個剛剛逃出去的人，最需要有人說「你沒有錯」——而我就是那種話。',
      '她被我帶回來，被關起來，被指控，被說成是威脅——所有人都相信我說的，因為她的恐懼看起來就像罪行。這是我設計得最精妙的部分：讓她的弱點替我說話。',
      '最讓我沒想到的意外，是安娜。我以為真愛的吻是可以被控制的劇本，以為安娜會選我；可她在那一刻，選的不是任何王子，而是她的姊姊。那個選擇，不在我的計算裡。',
      '安娜擋住了我的劍，用自己的身體。那一刻我才明白，我輸掉的，不是因為計謀不夠好，而是因為我從來不相信有人會為另一個人做那樣的事——而那恰恰是我最大的盲點。',
      '艾爾莎贏了，我輸了，被遣返，被羞辱。可我最後想說的是：她能破解孤立的詛咒，不是因為她比我強，而是因為她身邊有一個人，是真的、不帶目的地在乎她。那是我永遠沒有辦法偽造的東西。'
    ],
    simple:['阻止漢斯的劍砍向安娜，保護妹妹。','安娜的心臟已被冰雪刺中，正在結冰，沒有多少時間；艾爾莎自己也被漢斯囚禁、誤解。','她拚盡全力從囚禁中掙脫，在漫天風雪中奔向安娜。','安娜在最後一秒舉手擋住了漢斯的劍，自己瞬間完全冰封。','「真愛的吻」不是王子的吻，而是妹妹為姊姊的犧牲——愛的定義在這一刻被顛覆。','艾爾莎緊緊擁抱冰封的安娜，第一次不再逃避、不再壓抑，用愛融化了冰雪。','安娜甦醒，王國解封，艾爾莎終於學會用愛而非恐懼驅動自己的力量。'],
    full:['外在目標：控制冰雪魔法，做一個不傷害別人的王后。<br><br>內在目標：找到一種方式存在於這個世界，不必為自己的本質感到羞恥。<br><br>艾爾莎的問題從來不是「魔法太強」，而是「她相信自己本身就是危險」。','外在：王國的傳統禮教與民眾的恐懼。<br><br>中層：父母出於好意的「隱藏你自己」的教養，以及妹妹安娜長期的不理解。<br><br>內在：她對自身力量深深的恐懼與自我厭惡。她最大的敵人不在外面，而是那個每天早上醒來告訴她「你是怪物」的內心聲音。','戴上手套，封閉內心，甚至逃入深山建立冰雪城堡，試圖用隔絕一切的方式保護所愛之人。<br><br>她以為距離是答案。但她越逃，力量的反噬就越大——壓抑從來不是控制，而是延遲爆炸。','她在深山獲得了短暫的釋放與自由，卻導致王國陷入永恆的冬天，並不慎用冰雪刺中了安娜的心臟。<br><br>她以為逃離就能保護別人，結果逃離本身，造成了最大的傷害。','問題的根源不在於魔法本身，而在於她一直用「恐懼」來驅動魔法。<br><br>越壓抑，反噬越強；越逃避，傷害越大。','面對即將結冰碎裂的妹妹，她可以繼續逃避。<br><br>但在安娜為她擋劍的那一刻，她選擇轉身緊緊擁抱妹妹。<br><br>她放棄的：用距離保護別人的邏輯，以及對自己本質的恐懼。<br><br>她換來的：理解愛才是控制力量的關鍵——不是壓抑，而是接納；不是隱藏，而是連結。','冰雪消融，王國重獲生機。艾爾莎不再是孤獨的冰雪女王，而是與自己、與世界徹底和解的統治者。<br><br>她的魔法沒有消失，但它不再是詛咒——因為她終於不再害怕它了。'],
    storyteller3Name:'安徒生', storyteller3Role:'《冰雪女王》原著作者，艾爾莎的精神原型',
    storyteller3Intro:{
      who:'我是漢斯·克里斯汀·安徒生。你們現在看見的艾爾莎，是從我的《冰雪女王》裡長出來的——但我必須說，她和我原來的雪後，走向了完全不同的方向。我的雪後是反派，艾爾莎卻成了英雄。那個改變，讓我非常著迷。',
      relation:'我和艾爾莎的關係，是原型與變形。她身上有我給她的東西：冰雪、孤立、被世界視為危險的力量。但她有一樣東西是我沒給她的——一個愛她的妹妹，和一個「愛能融化一切」的結局。那個結局，是我最想要、卻沒有辦法給自己的東西。',
      why:'為什麼由我來說？因為我這一生，也是艾爾莎——醜陋、格格不入、被人嘲笑、渴望被接受。我寫了無數個關於被愛的故事，自己卻從來沒有真正得到過那種愛。艾爾莎的結局，是我給自己最遙遠的一個安慰。'
    },
    storyteller3Simple:[
      '艾爾莎想要的，在我的故事裡和在迪士尼的故事裡，說穿了是同一件事：一個讓她的存在不是罪的地方。我的雪後選擇了征服，艾爾莎選擇了和解——那是同一個渴望，走向了兩條完全不同的路。',
      '她最大的阻礙，是她相信自己本身就是危險。這一點，是我寫進去的，也是我最懂的——當你從小被世界告訴「你不一樣，你很奇怪，你會傷人」，你最終會開始相信這是真的。艾爾莎的恐懼，是我少年時代每一天早晨的感受。',
      '她躲進冰宮，唱著「Let It Go」，那一段是她第一次選擇做自己。我在那裡看見了自己：用筆寫作，是我的冰宮；把最深的孤獨變成故事，是我的「Let It Go」。孤立有時候，是唯一剩下的自由。',
      '但她的逃避，造成了更大的傷害——王國被冰封，妹妹的心也被刺傷。我的故事也是如此：我以為躲進文字就能保護自己，卻不知道逃跑本身，有時候才是最傷人的選擇。',
      '最意外的，是那個「真愛之吻」的定義被顛覆了。我寫了一輩子愛情故事，卻從來沒想到，最強大的那種愛，不是浪漫的，而是姊妹之間的、無條件的、甘願犧牲的那種。那個意外，也打了我一個措手不及。',
      '安娜為她擋劍，艾爾莎不再逃了。那個轉彎，是整個故事給我最大的禮物：她放棄了用距離保護別人的邏輯，換來了真正的連結。這是我沒辦法給我自己的結局，卻是我最希望所有孤立的人都能走到的地方。',
      '冰雪融化，艾爾莎和解了。我坐在天堂某個角落，看著這個從我故事裡長出來的女孩，心裡想的是：如果我當年也能有人這樣愛我，我的故事或許會寫得不一樣——但也正因為沒有，我才寫出了所有那些渴望被愛的故事。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 艾爾莎 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 艾爾莎 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 艾爾莎，最值得分析的不是表面的成敗，而是他在「安娜為她擋劍，冰封的心在那一刻融化」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，艾爾莎 真正要做的，是：阻止漢斯的劍砍向安娜，保護妹妹。','這個故事真正有力的阻礙，在於：安娜的心臟已被冰雪刺中，正在結冰，沒有多少時間；艾爾莎自己也被漢斯囚禁、誤解。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：她拚盡全力從囚禁中掙脫，在漫天風雪中奔向安娜。','故事走到這一步，表面的結果是：安娜在最後一秒舉手擋住了漢斯的劍，自己瞬間完全冰封。','真正讓這個故事變得難忘的意外，是：「真愛的吻」不是王子的吻，而是妹妹為姊姊的犧牲——愛的定義在這一刻被顛覆。','而最關鍵的轉彎，正是在這裡發生：艾爾莎緊緊擁抱冰封的安娜，第一次不再逃避、不再壓抑，用愛融化了冰雪。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：安娜甦醒，王國解封，艾爾莎終於學會用愛而非恐懼驅動自己的力量。'],
    quote:'真正的魔法不是控制冰雪，而是學會不再恐懼那個真實的自己。'},
  { name:'花木蘭', work:'《花木蘭》', scene:'身分暴露後，獨自回到皇城再次出手',
    storytellerName:'木須龍', storytellerRole:'木蘭的守護者與夥伴',
    storytellerIntro:{
      who:'我是木須龍。對，你可以說我個子小、脾氣大、話很多，但我可不是普通蜥蜴，我是一路陪著花木蘭闖進軍營、闖進戰場、闖進皇城的守護者。',
      relation:'我和木蘭的關係，可不是單純的幫手而已。我看著她從一個被世界說「不夠格」的女孩，變成那個全場最敢衝、最敢扛的人；我知道她會怕，也知道她每次都是怕著還往前走。',
      why:'為什麼由我來說？因為別人最後只看到她很帥、很能打，卻沒看到她前面吞下了多少委屈。由我來說，才能讓你知道：木蘭真正厲害的，不是偽裝成男人，而是就算世界不肯給她位置，她還是替自己殺出一個位置。'
    },
    storytellerSimple:['木蘭到了最後真正要做的，是阻止單于刺殺皇帝。那已經不是替父從軍那麼簡單，而是她明知道自己被趕出隊伍了，還是得自己回去把事情做完。','問題是，她的身分早就暴露了，軍中沒人信她，連替她說話的人都沒有；她手裡沒有權力，沒有名分，只剩下她自己。','可她還是衝回皇城，靠腦袋、靠膽子、靠那股「這件事不做不行」的勁，一個人先撐住局面，再把少數幾個夥伴拉進來。','結果她真的辦到了：單于被逼到皇帝面前，整場局勢被她翻了回來，皇帝的命也保住了。','最意外的是，最後趕來的李翔，不是來拆穿她、懲罰她，而是來幫她。那一刻，世界總算慢半拍地承認：這個人一直都值得被相信。','可我要說，真正的轉彎不是別人終於相信她，而是木蘭早就不再等別人批准了。她在沒有身分、沒有許可的時候，還是選擇做對的事。','到最後，皇帝向她鞠躬，所有人都看見了她；可我知道，木蘭真正贏得的，不是掌聲，而是她終於不用再懷疑：自己夠不夠格。'],
    storyteller2Name:'李翔', storyteller2Role:'花木蘭的將軍，後來的支持者',
    storyteller2Intro:{
      who:'我是李翔。我是將軍，是她的上司，也是那個在身分暴露時、按規矩應該懲處她的人。我沒有。後來很多人問我為什麼——我想了很久，才想清楚那個答案。',
      relation:'我和木蘭的關係，走了一個很奇怪的弧線。我先認識「平」，那個讓我刮目相看的士兵；然後我知道「平」是花木蘭，我憤怒，我放她走；然後她救了皇帝，我去找她。我不是一開始就懂得她，我是慢慢才懂的。',
      why:'為什麼由我來說？因為我代表了那個「慢半拍才承認」的世界。她一直都夠格，是世界太慢看見她——而我，就是那個世界的縮影。只有從「懷疑她」走到「相信她」的人，才能說清楚那條路有多長，又有多值得走。'
    },
    storyteller2Simple:[
      '木蘭想要的，我那時沒有真正想過。我只看見一個違反了軍令的士兵，一個欺騙了所有人的女人。我按規矩把她趕走，以為那就是公正。',
      '可她最大的阻礙，從來不只是匈奴。是我，是軍規，是整個認為「女人不該在這裡」的世界——而那個世界，我也是其中一部分。',
      '她被趕出去了，我以為事情結束了。然後匈奴死而復生，皇城告急，而她，那個被我趕走的人，已經在城裡了。沒有任何人叫她去，她自己決定的。',
      '我趕到的時候，她已經幾乎一個人解決了所有事。我站在那裡，看著她，忽然明白：她不需要我的許可，從來都不需要。',
      '最讓我意外的，不是她有多能幹，而是她在被我趕走之後，還是回來了。不是為了證明什麼，不是為了讓我道歉，而是因為有一件事非做不可，而她是那個看得見的人。',
      '那一刻我的轉彎，不是突然覺得女人可以打仗——而是我終於明白，「值不值得被信任」這件事，和性別無關，和她這個人有關。我一直用錯了標準。',
      '後來我去找她，不是將軍找士兵，而是一個人去找另一個他終於看見的人。皇帝向她鞠躬，那是制度的承認；我去找她，那是我個人的承認——遲了，但總算到了。'
    ],
    simple:['阻止死而復生的匈奴首領單于刺殺皇帝。','她的身分已暴露，被逐出軍隊，手無寸鐵，沒有任何人相信她、支持她。','她獨自潛入皇宮，用智謀和膽識，帶著少數幾個夥伴對抗整支匈奴軍隊。','她成功擊敗單于，將他逼到皇帝面前，拯救了皇帝的性命。','將軍李翔在最後關頭趕來，不是來阻止她，而是來支援她。','她不再等待任何人的許可，在沒有身分、沒有名義的情況下，只憑自己認定的正確行動。','皇帝向她鞠躬，天下人見證——她以自己的方式，贏得了比任何封賞更重要的東西。'],
    full:['外在目標：代父從軍，在戰場上活下來並擊敗匈奴。<br><br>內在目標：在一個從來不給她位置的世界裡，找到一種方式讓自己的存在有意義——不是作為「待嫁的女兒」，而是作為她真正是的那個人。','外在：驍勇善戰的匈奴大軍，以及她實際上相對薄弱的體力條件。<br><br>中層：軍中的性別規則——若身分暴露，依法處死。<br><br>內在：她始終在兩個身分之間撕裂——家族期待她成為的「好女兒」，與她真實渴望成為的自己。','她用智慧彌補體力的差距，最終用一發炮彈引發雪崩擊潰匈奴大軍。<br><br>但她真正的努力是：在每一個「你不夠格」的眼神裡，仍然選擇繼續。','她擊退了匈奴，拯救了將軍，成為戰場上不可或缺的英雄。<br><br>然後她的身分被揭露了。','最大的意外不是戰敗，而是：她用盡一切換來的勝利，在身分暴露的瞬間全部歸零。<br><br>她發現：在那個世界裡，「夠強」和「被允許存在」是兩件不同的事。','身分暴露後，她可以就此消失，回家當那個「令家人蒙羞的女兒」。<br><br>但她沒有。匈奴首領死而復生、威脅皇帝時，她獨自回到皇城，再次出手。<br><br>她放棄的：對「被接受」的期待。<br><br>她換來的：不再為任何人的認可而戰——她只為自己認定正確的事而戰。','皇帝向她鞠躬，將軍追她而來，家人在門口等她。<br><br>但最重要的是：她終於不再問「我夠格嗎」，因為她已經知道答案了。'],
    storyteller3Name:'《木蘭辭》無名氏', storyteller3Role:'花木蘭故事的最初書寫者',
    storyteller3Intro:{
      who:'我沒有名字。或者說，歷史沒有替我留下名字。我只知道，在一千五百年前，我寫下了那首詩——「唧唧復唧唧，木蘭當戶織」——然後我消失在時間裡，只留下那個女孩的故事。',
      relation:'我和木蘭的關係，比任何說書人都更深、也更謙遜。我是那個第一個把她的名字寫下來的人；在我之前，她可能只是一個傳說，一個口耳相傳的影子。是我給了她一首詩的重量，讓她從傳說變成了文學。',
      why:'為什麼由我來說？因為我當年寫她，不是為了寫一個女英雄，而是為了寫一種選擇——一個人在家族、國家、性別的重壓之下，仍然找到了自己的位置。那種選擇，一千五百年前有，現在也有。只有最初說出這個故事的人，才知道它從哪裡來。'
    },
    storyteller3Simple:[
      '木蘭的目標，我當年寫得很簡單：代父從軍，保護家人，活著回來。可當我寫完整首詩，才發現那個「活著回來」裡面，藏著比戰場更難的東西——她必須在一個不允許她存在的地方，讓自己存在。',
      '她最大的阻礙，我用最短的字寫進去了：「阿爺無大兒，木蘭無長兄。」就這兩句。家裡沒有人，她就是那個人。可那個時代，女人不能是那個人——這才是真正的阻礙，比戰場上所有敵人都更難翻越。',
      '她穿上鎧甲，上馬，走進戰場。我寫她的努力，不是英雄的豪情，而是「萬里赴戎機，關山度若飛」的那種沉默的堅持——沒有人知道她是誰，她只是一個士兵，一步一步往前走。',
      '十二年，立了功，回來了。我讓她回來，是因為那才是這個故事真正的高潮——不是打仗，而是她脫下鎧甲，重新成為自己的那一刻。「脫我戰時袍，著我舊時裳」，那才是她最勇敢的動作。',
      '最讓我意外的，不是她能打仗，而是她打完仗還能回來，還願意回來。她不需要功名，不需要留在戰場，她只想回到家裡，回到那台織布機旁邊。那種淡然，比任何英雄氣概都更讓我著迷。',
      '「同行十二年，不知木蘭是女郎。」那是整首詩最驚喜的轉彎，也是最深刻的——她不是靠偽裝贏得尊重的，她是靠能力；而能力，從來不分性別。她放棄了身分，換來了對自己最真實的證明。',
      '我讓她回到家，回到父母身邊，回到鏡子前。那個結局，是我對那個時代最溫柔的反抗——英雄不需要留名，不需要廟堂；她只需要，回到自己的地方，做回自己。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 花木蘭 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 花木蘭 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 花木蘭，最值得分析的不是表面的成敗，而是他在「身分暴露後，獨自回到皇城再次出手」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，花木蘭 真正要做的，是：阻止死而復生的匈奴首領單于刺殺皇帝。','這個故事真正有力的阻礙，在於：她的身分已暴露，被逐出軍隊，手無寸鐵，沒有任何人相信她、支持她。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：她獨自潛入皇宮，用智謀和膽識，帶著少數幾個夥伴對抗整支匈奴軍隊。','故事走到這一步，表面的結果是：她成功擊敗單于，將他逼到皇帝面前，拯救了皇帝的性命。','真正讓這個故事變得難忘的意外，是：將軍李翔在最後關頭趕來，不是來阻止她，而是來支援她。','而最關鍵的轉彎，正是在這裡發生：她不再等待任何人的許可，在沒有身分、沒有名義的情況下，只憑自己認定的正確行動。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：皇帝向她鞠躬，天下人見證——她以自己的方式，贏得了比任何封賞更重要的東西。'],
    quote:'不是女扮男裝的英雄故事，而是一個人被世界拒絕之後，仍然選擇成為自己的故事。'},
  { name:'馬克白', work:'《馬克白》', scene:'殺鄧肯那一夜：跨過道德的門檻',
    storytellerName:'班柯', storytellerRole:'馬克白的戰友',
    storytellerIntro:{
      who:'我是班柯。我曾與馬克白並肩作戰，同受女巫的預言，也曾在最接近他的地方，看見他如何一步一步變成另一個人。',
      relation:'我和他的關係，是戰友，也是鏡子。我知道他原本有多勇敢、多受敬重，所以我更清楚，他後來的墮落不是天生如此，而是一個念頭被餵大之後，慢慢吞掉了他。',
      why:'為什麼由我來說？因為若由敵人來說，馬克白只會像個暴君；若由他自己來說，又太容易變成替自己辯護。只有我這個曾經敬重過他的人，才能說出那份最可怕的事實：一個人不是忽然變壞的，而是先說服自己一次，然後就再也回不了頭。'
    },
    storytellerSimple:['若你問那一夜馬克白真正想要的是什麼，答案殘忍得很清楚：他想殺了鄧肯，奪下王位，把女巫說過的未來，提前變成自己的現在。','可最大的阻礙偏偏不是別人，而是他自己。他知道鄧肯是君主，是客人，也是信任他的人；也就是說，在下刀之前，他其實比誰都清楚這有多錯。','他猶豫、退縮、發問，可馬克白夫人一步步把他推回那條路上；最後他還是走進房裡，把刀落下去了。','王位後來確實落到他手裡，可他一走出那扇門，手就在抖，魂也像留在那間屋子裡；他得到王冠的同時，也失去了睡眠與安寧。','最意外的是，他原以為只要殺一個人，就能把世界安靜下來；可真正開始的，卻是一輩子都停不下來的噪音——懷疑、恐懼、血債，全部一起醒來。','而真正的轉彎，就發生在那之後：他本來還能停下、承認、回頭，可他選擇繼續殺下去，用更多血去保住第一刀換來的東西。','所以最後死去的，不只是馬克白這個人，而是那個原本還值得敬重的靈魂。王位他坐上了，可在坐穩之前，他早就先把自己弄丟了。'],
    storyteller2Name:'馬克白夫人', storyteller2Role:'馬克白的妻子，共謀者',
    storyteller2Intro:{
      who:'我是馬克白夫人。你們記得我，是那個在暗夜裡說「來，殺人的念頭，佔據我的身體」的女人；是那個把丈夫推向謀殺的人。我不否認。可我要說，推了他之後，最先崩潰的，是我。',
      relation:'我和馬克白的關係，是共犯，也是兩個互相以為對方更強的人。我以為我比他冷靜，比他果斷；他以為我沒有良心的重量。我們都錯了——只是他的重量壓垮他比較慢，我的比較快。',
      why:'為什麼由我來說？因為班柯說的是「他怎麼變壞的」，而我才能說「那把刀有多重」。我親手打造了那一夜，我比任何人都清楚，那扇門關上之後，我們兩個各自失去了什麼——他失去了靈魂，我失去了理智。'
    },
    storyteller2Simple:[
      '馬克白想要王位，這我知道，因為那也是我想要的。女巫的預言點燃了我們兩個，但他猶豫，我不猶豫——我以為不猶豫就是力量。',
      '他的阻礙是良心，我的工作是拆掉它。我嘲笑他，激他，替他安排好一切——侍衛、匕首、藉口。我以為只要計劃夠周全，事後就不會有問題。',
      '他殺了鄧肯，拿著血跡斑斑的匕首走出來，說他聽見有聲音說「馬克白再也不能睡了」。我叫他別想這麼多，把匕首放回去。我替他清理了現場。我以為那就是結束。',
      '王位到手了。可他開始見到班柯的鬼魂，開始夜夜不安，開始一個人在黑暗裡說話。我安慰他，試著讓他冷靜，可我發現我安慰不了他，因為我自己也開始有問題了。',
      '最讓我沒想到的，是那個重量落在我身上的速度比他更快。他在白天看見鬼，我在夜裡開始夢遊，在睡夢中不停洗手，洗不乾淨，怎麼洗都洗不乾淨。',
      '真正的轉彎，不是他繼續殺下去，而是我先垮掉了。我以為我沒有良心的重量，結果那個重量只是遲到了，然後一次全壓下來。我推了他那一把，卻沒有力氣跟他走到底。',
      '我死在他前面。他殺的那麼多人，我的手上沾著第一個人的血——那個血，我洗了一輩子，沒有洗乾淨。馬克白得到了王位，失去了靈魂；我失去得更早，也輸得更徹底。'
    ],
    simple:['趁鄧肯國王夜宿馬克白城堡，在夜裡將他殺死，奪取王位。','鄧肯是他的君主、他的貴客，殺他違背了騎士的一切誓言；他自己的良心在最後一刻動搖。','馬克白夫人以嘲諷和激將壓制他的猶豫，親自麻醉侍衛、佈置現場，逼他走向寢室。','他殺了鄧肯，拿著染血的匕首走出來，卻無法回去把匕首放回現場——他的手在顫抖。','他以為跨過去就解脫了，卻發現那扇門關上之後，他再也聽不見安靜了。','他選擇繼續，把染血的匕首推回去，清洗雙手，走向王座——那是他最後一次有機會停下來。','他成為國王，也成為一個從此夜夜難眠、一路殺到底的人。'],
    full:['外在目標：成為蘇格蘭國王，登上權力的頂峰。<br><br>內在目標：得到一種「我的存在有無可撼動的重量」的確認——他一生在戰場上為別人流血，他渴望那種重量屬於他自己。<br><br>馬克白一開始是忠誠的將軍、真實的英雄。女巫的預言點燃了一個好人內心從未說出口的渴望。','外在：鄧肯國王的存在，以及班柯等潛在競爭者。<br><br>中層：他自己清醒的道德感——他知道這是錯的，他也說出來了。<br><br>內在：最致命的阻礙是馬克白夫人的推波助瀾，以及他自己對「如果不現在就永遠不會」的恐懼。','他殺了鄧肯，奪取王位，隨後殺班柯、殺麥克德夫的家人，試圖消滅所有威脅。<br><br>但每殺一個人，他就需要再殺一個人。這是一場沒有終點的戰爭。','他成為了國王，坐上了王座。<br><br>但他發現：王座給了他權力，卻拿走了一切讓權力有意義的東西——睡眠、友誼、妻子的神智，以及內心最後的平靜。','女巫的預言說「無婦人所生者，方能傷害馬克白」，讓他以為自己刀槍不入。<br><br>最大的意外是：麥克德夫是剖腹產出生的。他對預言的詮釋本身，就是他最致命的盲點。','真相揭露的瞬間，他可以放下武器，接受審判，換取一絲人性的尊嚴。<br><br>但他沒有。他選擇繼續戰鬥，直到最後。<br><br>他放棄的：認錯的可能，以及那個在第一刀落下之前還存在的自己。<br><br>他換來的：一種黑暗的完整——他選擇了這條路，他就走到底，哪怕終點是毀滅。','馬克白被殺，暴政終結，蘇格蘭重獲秩序。<br><br>但真正的結局不是他的死，而是他的孤獨——他得到了他渴望的重量，卻早在死之前就已經是一個空殼。'],
    storyteller3Name:'莎士比亞', storyteller3Role:'《馬克白》的作者',
    storyteller3Intro:{
      who:'我是威廉·莎士比亞。我寫馬克白，是在1606年，詹姆士一世剛剛登基、火藥陰謀剛剛被破獲的時刻。整個英格蘭都在問同一個問題：一個人，為什麼會選擇背叛？我想知道答案，所以我寫了馬克白。',
      relation:'我和馬克白的關係，是解剖者與標本，也是理解者與被理解者。我給了他所有的條件：英勇、功勳、一個愛他也推著他的妻子、以及預言那致命的誘惑。然後我退後一步，看他怎麼把自己毀掉。',
      why:'為什麼由我來說？因為馬克白不是壞人的故事——他是好人墮落的故事。這才是最難寫，也最需要作者站出來說清楚的部分：他不是生來就是惡人，他是在一個選擇之後，再也無法停止選擇錯誤。只有我知道，那第一刀有多難落下，又有多難不落下。'
    },
    storyteller3Simple:[
      '馬克白的目標，我從一開始就設計成最危險的那種：他不是追求壞的東西，他追求的是權力、榮耀、成為最偉大的那個人——這些本身並不邪惡。邪惡在於他選擇了什麼方式去追求它們。',
      '他最大的阻礙，不是鄧肯有多強，而是他自己的良知。那把懸空的匕首，那些幻象，那些夜裡的聲音——我用這些意象說的是：他的阻礙從來都是內在的，是他心裡那個還沒死透的「好人」，在不斷地攔著他。',
      '「Is this a dagger which I see before me？」——他問那把刀，其實是在問自己。他的努力，是壓下那個問號，說服自己去做那件事。那種努力，是我寫過最令人心寒的努力。',
      '他殺了鄧肯，得到了王位。可我讓他的結果，是「Macbeth does murder sleep」——他殺死的不只是一個人，而是他自己睡著的能力，他自己的平靜，他自己的靈魂。',
      '最大的意外，不是外部的敵人，而是他發現：得到之後，比得到之前更恐懼。王位不能讓他安心，功名不能讓他休息；他殺人，越殺越怕，越怕越殺。那個迴圈，才是整個故事最殘酷的地方。',
      '他可以在第一刀之後停下來，可以認罪，可以死得有尊嚴。但他沒有。他的轉彎，是徹底的墮落：「I am in blood stepped in so far」——他說他已經走得太深，回頭和繼續走，一樣遠了。',
      '他死了，不是被英雄殺死，而是被自己造出來的那個世界吞噬。我給他的結局，不是懲罰，而是邏輯——一個選擇了什麼的人，最終會活在什麼裡面。馬克白的故事，是我對人性最誠實的一次實驗。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 馬克白 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 馬克白 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 馬克白，最值得分析的不是表面的成敗，而是他在「殺鄧肯那一夜：跨過道德的門檻」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，馬克白 真正要做的，是：趁鄧肯國王夜宿馬克白城堡，在夜裡將他殺死，奪取王位。','這個故事真正有力的阻礙，在於：鄧肯是他的君主、他的貴客，殺他違背了騎士的一切誓言；他自己的良心在最後一刻動搖。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：馬克白夫人以嘲諷和激將壓制他的猶豫，親自麻醉侍衛、佈置現場，逼他走向寢室。','故事走到這一步，表面的結果是：他殺了鄧肯，拿著染血的匕首走出來，卻無法回去把匕首放回現場——他的手在顫抖。','真正讓這個故事變得難忘的意外，是：他以為跨過去就解脫了，卻發現那扇門關上之後，他再也聽不見安靜了。','而最關鍵的轉彎，正是在這裡發生：他選擇繼續，把染血的匕首推回去，清洗雙手，走向王座——那是他最後一次有機會停下來。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他成為國王，也成為一個從此夜夜難眠、一路殺到底的人。'],
    quote:'不是壞人墮落的故事，而是一個好人如何在一個選擇之後，再也無法停止選擇錯誤。'},
  { name:'哈姆雷特', work:'《哈姆雷特》', scene:'「生存還是毀滅」：在復仇與猶豫之間的抉擇',
    storytellerName:'霍拉旭', storytellerRole:'哈姆雷特唯一信任的朋友',
    storytellerIntro:{
      who:'我是霍拉旭。在整個丹麥宮廷裡，我大概是唯一一個從頭到尾都保持清醒的人——不是因為我比別人聰明，而是因為我沒有什麼東西要爭，所以我可以只是站在旁邊，看著這一切發生。',
      relation:'我和哈姆雷特的關係，是他選擇的。他可以選任何人做朋友，卻選了我這個沒有權勢、沒有野心的人。我想那是因為，他在我這裡不需要表演，不需要猜測我是否也是克勞迪斯的眼線。',
      why:'為什麼由我來說？因為他臨死前說：「霍拉旭，你活下去，把我的故事告訴世人。」這不是我自己要搶著說，而是他把這件事交給我的。所以我說的，不是評判，而是見證。'
    },
    storytellerSimple:[
      '哈姆雷特真正想要的，從來不只是殺掉克勞迪斯；他想要的是確認——確認父親的死是真正的謀殺，確認自己的行動是正義而非衝動，確認在這個腐爛的世界裡，還有什麼事情值得去做。',
      '可最大的阻礙偏偏不在外面，而在他自己心裡。他太會思考了——每一個行動他都能想到十個理由去做，也能想到十個理由不做；他的聰明，成了他最沉重的枷鎖。',
      '他裝瘋，他試探，他安排戲中戲，他寫獨白，他在走廊上來回——每一步都像在行動，卻又每一步都在延遲真正的行動。',
      '他終於確認了克勞迪斯的罪，機會就在眼前；可他在禱告室放過了他，說那樣殺他靈魂會升天，那不算報仇。我站在外面，不知道該說他縝密還是說他又找了一個理由等待。',
      '最殘酷的意外，不是某件壞事突然發生，而是他的猶豫本身製造了災難——波洛涅斯死了，奧菲莉亞瘋了，他愛的人一個一個在他的遲疑裡消失。',
      '到了最後的決鬥，他反而不再想了，只是動手。那一刻的他，比整齣戲裡任何時候都更像他自己——也更令人心碎，因為那個清醒來得太晚。',
      '克勞迪斯死了，他也死了，所有人都死了。我是唯一活下來的人，帶著他的故事站在這裡。他說得對：有些故事，需要有人活著把它說完。'
    ],
    storyteller2Name:'奧菲莉亞', storyteller2Role:'哈姆雷特愛過的人',
    storyteller2Intro:{
      who:'我是奧菲莉亞。你們記得我，大概是那個瘋掉的女孩，採著花，唱著歌，最後溺死在河裡。可在那之前，我是愛過他的人，也是被他的猶豫，一點一點磨碎的人。',
      relation:'我和哈姆雷特的關係，曾經是真實的。在那些宮廷表演和哲學獨白之前，我們之間有過真正的東西。可他後來裝瘋，我分不清哪個是真的他；他推開我，我不知道那是愛還是保護還是根本都不是。',
      why:'為什麼由我來說？因為霍拉旭說的是他的故事，而我說的，是他的猶豫壓垮的那些人。哈姆雷特一直在等一個「對的時機」——可在那個等待裡，我的父親死了，我瘋了，我也死了。我是他遲疑最直接的代價。'
    },
    storyteller2Simple:[
      '哈姆雷特想要復仇，想要確認，想要正義——他想要的東西都很大，都很重要。可他在想這些的時候，忘記了還有一些小的東西，會在他等待的過程中，悄悄死去。',
      '他最大的阻礙是他自己的思維，這我知道，因為我看著他一次又一次走到門口，然後退回來。可他退回來的每一步，都壓在別人身上，而他不知道。',
      '他裝瘋，推開我，說一些讓我聽不懂的話。我問父親，父親說那是愛的症狀；我告訴父親，父親拿去告訴了國王。我不知道那會害死父親，我什麼都不知道。',
      '父親死了，死在哈姆雷特的劍下。那一刻，他殺的不只是波洛涅斯，也是我心裡還能理解這個世界的那個部分。',
      '最讓我無法承受的意外，不是父親的死，而是——哈姆雷特在誤殺之後，沒有留下來陪我承受。他繼續他的計劃，繼續他的猶豫，而我獨自面對那個碎掉的世界。',
      '我瘋了。我不是選擇瘋的，是那個重量太重，而我沒有足夠的地方可以放。我採花，我唱歌，那不是美麗，那是我唯一還能做的事。',
      '我死在他復仇完成之前。他的故事有一個結局，有正義，有霍拉旭活著見證。我的故事沒有結局，只有那條河，和那些沒有人撿起來的花。哈姆雷特的猶豫，是他的悲劇；可那個猶豫，也是我的墳墓。'
    ],
    simple:['為父王報仇，殺死篡位的叔父克勞迪斯，奪回丹麥王位。','父親的鬼魂揭示了真相，但哈姆雷特無法確認那是真相還是惡魔的誘惑；他的本性讓他無法輕易殺人。','他裝瘋賣傻、安排戲中戲試探叔父，在行動與猶豫之間反覆拉扯，遲遲無法出手。','他終於確認了克勞迪斯的罪行，做好了復仇的準備——卻在機會最好的時刻，再次放手。','最大的意外不是某件外在事件，而是他發現：每一次他以為自己準備好了，內心又生出新的理由讓他等待。','他在劇終的決鬥中，才終於讓行動超越思考——但代價是所有人，包括他自己，全部死去。','克勞迪斯死了，丹麥的正義算是得到了某種形式的實現——但沒有一個人活下來承受這個結果。'],
    full:['外在目標：為父王報仇，殺死克勞迪斯，奪回王位。<br><br>內在目標：在一個腐爛的世界裡，找到值得活下去、值得行動的理由——不只是復仇，而是確認「行動本身是否有意義」。','外在：克勞迪斯掌握王權，宮廷處處是眼線，動手就是叛亂。<br><br>中層：他愛的人——母親、奧菲莉亞——全都與克勞迪斯有所牽連。<br><br>內在：他最大的阻礙是自己的思維——他能想到每一個行動的後果與矛盾，卻無法停止思考、開始行動。','裝瘋迷惑宮廷，設計戲中戲試探叔父，寫下獨白，一次次逼近——又一次次退縮。','他確認了克勞迪斯有罪，機會就在眼前——但他放過了正在禱告的克勞迪斯，因為那樣殺死他，靈魂可能得救。','他以為自己在等待「正確的時機」，卻在等待中誤殺了波洛涅斯，逼瘋了奧菲莉亞，推走了所有他愛的人。<br><br>最殘酷的意外：他的猶豫，造成的傷害遠多於他害怕的行動本身。','在劇終的決鬥裡，他終於不再思考，只是行動——刺死了克勞迪斯。<br><br>他放棄的：用思想掌控命運的幻覺。<br><br>他換來的：一種殘酷的完成——在一切都無法挽回之後，他終於做了他「應該」做的事。','克勞迪斯死，王后死，雷歐提斯死，哈姆雷特死。丹麥由外國王子福丁布拉斯接收。<br><br>復仇完成了，但什麼也沒有真正被拯救。'],
    storyteller3Name:'莎士比亞', storyteller3Role:'《哈姆雷特》的作者',
    storyteller3Intro:{
      who:'我是威廉·莎士比亞。《哈姆雷特》是我最常被引用、也最常被誤解的作品。很多人只記得「To be or not to be」，卻不知道那句話說的根本不是要不要活著，而是要不要行動——要不要承擔行動所帶來的一切後果。',
      relation:'我和哈姆雷特的關係，比其他角色都更個人。他是我對「一個聰明人，為什麼無法行動」這個問題最深的探索。我見過太多有才華的人，被自己的思想困住，看得越清楚，反而越走不動——哈姆雷特，就是那種人的極致。',
      why:'為什麼由我來說？因為哈姆雷特的猶豫，不是懦弱，而是他比所有人都更清楚地看見了行動的代價。只有寫出他的人，才能說清楚：他不是不敢，他是太懂了——懂得行動意味著什麼，懂得復仇之後什麼會碎掉，懂得知道真相與能夠活著承受真相之間的距離。'
    },
    storyteller3Simple:[
      '我給哈姆雷特的目標，表面上是復仇——替父報仇，殺死克勞狄斯。可我真正想問的是：一個人在知道真相之後，有沒有辦法還活在那個世界裡？復仇只是形式，存在的困境才是本質。',
      '他最大的阻礙，我沒有設計成外部的敵人，而是他自己的腦子。他想太多，看太清，每一個行動在他眼裡都會展開成無數個後果；而那些後果，每一個都足以讓他停下來再想一次。這是天才的詛咒。',
      '他想、他演戲、他試探、他猶豫、他又想——那些看似不作為的過程，其實是我寫過最激烈的努力。他的戰場不在劍與劍之間，而在每一個夜裡，他一個人和自己的對話裡。',
      '他安排了戲中戲，確認了真相，卻還是沒有立刻動手。我讓他有機會殺克勞狄斯，卻讓他因為對方在禱告而放棄——那不是理由，那是又一個他給自己的理由。結果，代價不斷疊加。',
      '奧菲莉亞死了，雷爾提斯要復仇，所有人都被捲進去。最讓我著迷的意外，不是哈姆雷特多聰明，而是他的聰明最終造成了最多的死亡——包括那些他最不想傷害的人。',
      '他最後的轉彎，是放下了思考，接受了命運：「The rest is silence。」那是我寫過最安靜的轉彎——不是頓悟，不是英雄時刻，而是一個人終於停止了對抗自己的那一刻，什麼都不再說了。',
      '所有人都死了，霍拉旭活著，故事留下來。我設計這個結局，是因為這個故事不需要勝利者——它需要一個見證者，一個能把「曾經有人這樣想、這樣掙扎、這樣死去」說出去的人。那才是哈姆雷特真正的結局。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 哈姆雷特 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 哈姆雷特 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 哈姆雷特，最值得分析的不是表面的成敗，而是他在「「生存還是毀滅」：在復仇與猶豫之間的抉擇」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，哈姆雷特 真正要做的，是：為父王報仇，殺死篡位的叔父克勞迪斯，奪回丹麥王位。','這個故事真正有力的阻礙，在於：父親的鬼魂揭示了真相，但哈姆雷特無法確認那是真相還是惡魔的誘惑；他的本性讓他無法輕易殺人。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他裝瘋賣傻、安排戲中戲試探叔父，在行動與猶豫之間反覆拉扯，遲遲無法出手。','故事走到這一步，表面的結果是：他終於確認了克勞迪斯的罪行，做好了復仇的準備——卻在機會最好的時刻，再次放手。','真正讓這個故事變得難忘的意外，是：最大的意外不是某件外在事件，而是他發現：每一次他以為自己準備好了，內心又生出新的理由讓他等待。','而最關鍵的轉彎，正是在這裡發生：他在劇終的決鬥中，才終於讓行動超越思考——但代價是所有人，包括他自己，全部死去。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：克勞迪斯死了，丹麥的正義算是得到了某種形式的實現——但沒有一個人活下來承受這個結果。'],
    quote:'他不是因為懦弱而猶豫，而是因為他比所有人都更清楚地看見了行動的代價——這才是他最深的悲劇。'},
  { name:'諸葛亮', work:'《三國演義》', scene:'出師北伐：明知不可為而為之',
    storytellerName:'劉備', storytellerRole:'諸葛亮的主公，蜀漢昭烈帝',
    storytellerIntro:{
      who:'我是劉備。很多人說諸葛亮是我的軍師，可我想說的是：他是我三次放下臉面、親自去敲門，才終於請出來的人。那三次，我比任何人都更清楚——我不只是在請一個謀士，我是在找一個願意跟我相信同一件事的人。',
      relation:'我和孔明的關係，是魚水。他說「如魚得水」，我信那句話。我把兒子托付給他，把整個蜀漢托付給他，那不是君臣，那是我這輩子最重要的一次相信。',
      why:'為什麼由我來說？因為我死在他前面，所以我看不到他後來做的那些事；可也正因為這樣，我說的不是結果，而是那個在隆中對我說出天下三分時，眼睛裡有光的人。那個人，才是我想讓你們認識的諸葛亮。'
    },
    storytellerSimple:[
      '孔明真正想要的，不只是打贏幾場仗。他想完成的，是讓漢室的旗幟重新插回中原——那不是他的野心，而是他從一開始就選擇扛起來的責任。',
      '可他比任何人都清楚那有多難。曹魏的國力是蜀漢的數倍，糧道漫長，後主難以倚靠，他每次出征都像是用一根竹竿去撐一座山。',
      '他沒有因為知道難就停下來。六出祁山，每一次都把籌碼算到最細，木牛流馬、八陣圖、空城計，他用智慧把資源的差距一寸一寸地填補。',
      '可每次都差那麼一點。糧草、天氣、人算不如天算——他能算盡所有的變數，卻算不盡命運留給他的那一道缺口。',
      '最讓我心疼的意外，不是他打輸了哪一仗，而是他的身體先撐不住了。他把自己燒得太盡，五丈原那盞燈，是他自己把它吹滅的。',
      '我在白帝城說「君才十倍曹丕，必能安國，終定大事」，他沒有辜負我那句話——可他也沒有讓自己留下來。他用盡了，才走。',
      '北伐沒有成功，漢室最後還是亡了。可孔明留下來的，不是版圖，而是一種證明：有些人，是真的可以為了一個承諾，把自己燒光的。'
    ],
    storyteller2Name:'司馬懿', storyteller2Role:'諸葛亮一生的對手',
    storyteller2Intro:{
      who:'我是司馬懿。我和諸葛亮打了一輩子，沒有在戰場上真正打敗過他，也沒有被他真正打敗過——我們互相繞著對方轉，像兩個下棋的人，各自知道對方的段數，卻沒有一局能決出勝負。',
      relation:'我和孔明的關係，是對手，是鏡子，也是這個世界上最了解彼此的兩個人。我撤退，他追；他出祁山，我守；他送我女人衣裳羞辱我，我穿上了，繼續等。我知道他在想什麼，他也知道我在想什麼。',
      why:'為什麼由我來說？因為朋友說的是欣賞，敵人說的才是真正的評價。劉備說他好，那是主公的話；我說他好，那是一輩子想打敗他、卻沒能打敗他的對手的話。只有我，才知道他有多難對付——也只有我，才知道他最終輸給了什麼。'
    },
    storyteller2Simple:[
      '孔明想要的，我清楚得很：他要北伐成功，要漢室復興，要兌現他對劉備的承諾。那不是野心，是他給自己的枷鎖——一個他自己親手鎖上、然後再也打不開的枷鎖。',
      '他最大的阻礙，是我。不是兵力，不是糧草，而是我這個對手——我知道他的節奏，知道他不能久戰，知道只要我守住不動，時間就站在我這邊。',
      '他每次出祁山，我每次守。他用木牛流馬，我研究木牛流馬；他擺八陣圖，我繞開八陣圖。我不求勝，只求不敗——因為我知道，他比我更輸不起時間。',
      '空城計那一次，他彈琴，城門大開，我退兵了。旁人說我怕了，說我被他嚇到了。不是的。我退，是因為我知道：如果他真的死在那裡，我就失去了唯一值得對付的對手。留著他，才有繼續活著的意義。',
      '最讓我意外的，不是他有多聰明，而是他的身體先垮了。五丈原，他的燈滅了——我聽到消息，沒有慶祝，只是說了一句：天下奇才。那不是客套，那是真話。',
      '他死了，我贏了——可那個「贏」，空得很。他用盡了自己去打這場仗，而我只是等著他用盡。那不是我的勝利，那是時間的勝利，命運的勝利，不是我的。',
      '後來有人問我，孔明這個人怎麼樣。我說：他是我見過最像一根蠟燭的人——把自己燒光了，才算盡了本分。我活得比他長，贏得比他多，可我這輩子最清楚的一件事是：有些人燃燒的方式，是我永遠學不來的。'
    ],
    simple:['完成先主劉備的遺願，北伐中原，恢復漢室江山。','蜀漢國力遠遜曹魏，劉備已死，後主劉禪懦弱無能，國內人才凋零，北伐勝算極微。','他六出祁山，每次出征都精心謀算，以弱擊強，力求在有限資源中創造最大勝算。','屢次北伐皆功敗垂成，或糧草不繼，或戰局忽變，始終無法突破曹魏防線。','最大的意外不是敵人太強，而是他自己的身體先倒下了——積勞成疾，病倒五丈原。','他明知天命難違，仍選擇「鞠躬盡瘁，死而後已」——不是因為勝算，而是因為那是他對劉備、對漢室、對自己的承諾。','他病逝五丈原，北伐未竟，蜀漢最終仍走向滅亡；但他留下的，是一種知其不可為而為之的精神典範。'],
    full:['外在目標：北伐中原，消滅曹魏，恢復漢室。<br><br>內在目標：兌現對劉備的承諾——「受任於敗軍之際，奉命於危難之間」，用一生去完成一個幾乎不可能的使命。','外在：曹魏國力數倍於蜀漢，地利、兵力、資源全面居劣。<br><br>中層：後主劉禪難以倚重，人才不繼，朝中有掣肘之人。<br><br>內在：他比任何人都清楚勝算有多低，卻無法停止，因為停止等於背棄了他一生所托。','六出祁山，每次都是以算術般精確的謀略彌補資源的差距，街亭之失、木牛流馬、空城計，每一步都是在懸崖邊上行走。','數次北伐均未能決定性突破，糧草問題始終是致命限制，每次都功虧一簣。','天命給他最殘酷的意外，不是戰敗，而是他自己的身體在五丈原耗盡了——他輸給的不是敵人，而是時間。','臨終前，他沒有改變目標，只是交代了身後事，把這個未竟的使命繼續傳下去。<br><br>他放棄的：活下去的機會——他本可以休養，卻選擇繼續燃燒。<br><br>他換來的：「出師未捷身先死，長使英雄淚滿襟」——一種超越勝負的道德高度。','蜀漢在他死後數十年滅亡，北伐終究失敗。但諸葛亮的名字，卻成為中文世界裡「忠誠與智慧」的永久象徵。'],
    storyteller3Name:'羅貫中', storyteller3Role:'《三國演義》的作者',
    storyteller3Intro:{
      who:'我是羅貫中。我寫《三國演義》，用了一生的時間。我不是史官，我是說書人——我的工作，不是告訴你歷史上發生了什麼，而是告訴你，那些事情為什麼值得被記住。諸葛亮，是我最用力雕刻的那個人。',
      relation:'我和諸葛亮的關係，是作者與偶像，也是時代與時代之間的對話。我生在元末明初，天下大亂，我見過太多聰明人在亂世裡隨波逐流，也見過太多忠心換來的是背叛和遺忘。所以我需要諸葛亮——需要一個不管結局如何，都不肯彎腰的人。',
      why:'為什麼由我來說？因為諸葛亮這個人，歷史上的和我筆下的，不完全一樣。歷史上的他是傑出的政治家和軍事家；我筆下的他，是「鞠躬盡瘁，死而後已」這八個字的化身。那個化身，是我給亂世裡的人的一個答案——有些人值得你這樣活。'
    },
    storyteller3Simple:[
      '我給諸葛亮的目標，從一開始就不是「贏」，而是「盡」。他從隆中出來，不是因為勝算夠高，而是因為劉備值得他出來；他六出祁山，不是因為能打贏，而是因為那個承諾不能食言。我寫他，寫的是一個把「盡力」當成最終答案的人。',
      '他的阻礙，我寫得很誠實：天下三分，蜀漢最弱；後主難以倚重，人才接不上來；糧道太長，每次北伐都是在跟後勤賽跑。這些阻礙，他都知道，一清二楚。他出師，不是因為看不見這些，而是因為看見了還是選擇出發。',
      '六出祁山，每一次我都寫得很仔細。空城計、木牛流馬、火燒藤甲兵——我知道有些是我加進去的，不全是歷史。可我加這些，是因為這個人值得那樣的故事：他的智慧，配得上那些傳說。',
      '街亭失守，揮淚斬馬謖。那一幕是我最難寫的——他哭，不只是因為失去了一個人，而是因為他最清楚，這一步棋走錯了，之後要補回來有多難。那個眼淚，是整個北伐最誠實的時刻。',
      '五丈原，秋風，他的燈滅了。我設計那個意外，不是命運的殘忍，而是我對「天命」這件事最深的感嘆：有些人，把自己燃燒得太完全，以至於連老去的機會都沒有。他輸給的不是敵人，是時間。',
      '他的轉彎，不是在某一場戰役，而是在他決定出師的那一天。他放棄了隱居山林、明哲保身的可能，換來了「出師未捷身先死」——那個放棄，是整部三國演義裡最重的一個選擇。',
      '他死了，蜀漢還是滅了，北伐終究沒有成功。可我讓他留在歷史裡，不是因為他贏了，而是因為他讓所有人看見：有些人的意義，不在結果，而在他怎麼走完那條路。這是我寫三國最想說的那句話。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 諸葛亮 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 諸葛亮 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 諸葛亮，最值得分析的不是表面的成敗，而是他在「出師北伐：明知不可為而為之」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，諸葛亮 真正要做的，是：完成先主劉備的遺願，北伐中原，恢復漢室江山。','這個故事真正有力的阻礙，在於：蜀漢國力遠遜曹魏，劉備已死，後主劉禪懦弱無能，國內人才凋零，北伐勝算極微。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他六出祁山，每次出征都精心謀算，以弱擊強，力求在有限資源中創造最大勝算。','故事走到這一步，表面的結果是：屢次北伐皆功敗垂成，或糧草不繼，或戰局忽變，始終無法突破曹魏防線。','真正讓這個故事變得難忘的意外，是：最大的意外不是敵人太強，而是他自己的身體先倒下了——積勞成疾，病倒五丈原。','而最關鍵的轉彎，正是在這裡發生：他明知天命難違，仍選擇「鞠躬盡瘁，死而後已」——不是因為勝算，而是因為那是他對劉備、對漢室、對自己的承諾。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他病逝五丈原，北伐未竟，蜀漢最終仍走向滅亡；但他留下的，是一種知其不可為而為之的精神典範。'],
    quote:'他不是不知道會輸，而是他認為，有些事值得用一生去做，哪怕結局已經寫好。'},
  { name:'美人魚', work:'《海的女兒》', scene:'王子大婚前夕：不殺他，自己化為泡沫',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 美人魚 這樣的人物，我最在意的不是她多浪漫，而是她在哪一刻，選擇了愛，卻沒有把愛變成佔有。',
      relation:'我和 美人魚 的關係，是故事分析者與故事主角的關係。我不在海底，也不在甲板上，但我會把她的選擇拆給你看。',
      why:'因為用靶心人公式看 美人魚，最值得分析的不是她沒得到王子，而是她在「王子大婚前夕：不殺他，自己化為泡沫」這個節點，怎麼完成了自己。'
    },
    storytellerSimple:['用靶心人公式看，美人魚真正想要的，是：得到一個人的愛，也得到一個不會消逝的靈魂。','這個故事真正有力的阻礙，在於：她必須離開海洋、失去聲音，還要在王子愛上別人之前得到他的真愛。','如果把鏡頭推近，你會看見她的努力其實發生在這裡：她忍著每一步像刀割般的痛，陪在王子身邊，卻一句話也不能說。','故事走到這一步，表面的結果是：王子沒有愛上她，反而迎娶了另一位公主。','真正讓這個故事變得難忘的意外，是：海巫婆給了她最後一次活命機會，只要殺了王子，她就能回到海裡。','而最關鍵的轉彎，正是在這裡發生：她放棄了活下去的機會，不殺王子，讓自己化為泡沫。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：她沒有得到愛情，卻用無私證明了自己的靈魂。'],
    simple:['得到王子的愛，成為真正的人類。','她要離開海洋、失去聲音，還得在期限內讓王子真心愛上她。','她以雙腿與沉默陪在王子身邊，忍痛學會在陌生世界活下去。','王子喜歡她，卻沒有愛上她，最後決定迎娶別人。','她本來可以靠殺死王子活命，卻發現自己做不到。','她放棄回到海裡的機會，選擇不傷害所愛的人。','她化為泡沫，卻在犧牲中得到比愛情更高的完成。'],
    full:['外在目標：得到王子的愛，成為人類。<br><br>內在目標：證明自己不只是海底的公主，而是一個有靈魂、能選擇的人。','外在：她失去聲音，無法說明自己的身份；每一步都如刀割；王子的心也不在她身上。<br><br>內在：她追求的是愛，但真正考驗她的，是她能不能在失去後仍然不扭曲自己。','她離開海底、喝下藥水、承受痛苦、忍住沉默，讓自己有機會靠近王子。這不是童話式的等待，而是痛苦地參與命運。','她終於來到王子身邊，卻只能做最靠近的人，無法成為被選中的人。王子感謝她，卻把心交給了別人。','故事最大的意外，是她最後不是輸給情敵，而是被命運逼到一個極端選擇：殺人活命，或放手赴死。','她放棄的：自己的生命與原本的歸處。<br><br>她換來的：一個不靠佔有來證明愛的高度。','她沒有得到王子，卻得到故事真正的核心：愛一個人，不一定是把他留在身邊，而是即使失去，也不毀掉自己。'],
    quote:'她最動人的地方，不是為愛犧牲，而是她明明可以傷害，最後卻選擇了不傷害。'},
  { name:'灰姑娘', work:'《灰姑娘》', scene:'午夜鐘響前：奔離舞會，留下水晶鞋',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{
      who:'我是許榮哲。遇到像 灰姑娘 這樣的人物，我最在意的不是她有沒有嫁給王子，而是她怎麼在長年被壓低的命運裡，仍保住了自己。',
      relation:'我和 灰姑娘 的關係，是故事分析者與故事主角的關係。我會把她從灰燼裡站起來的過程，拆成真正有力量的七步。',
      why:'因為這個故事真正的戲，不在舞會，而在她明知道魔法會消失，還是決定先走進去。'
    },
    storytellerSimple:['用靶心人公式看，灰姑娘真正想要的，是：離開被羞辱與奴役的生活，證明自己值得被看見。','這個故事真正有力的阻礙，在於：她被繼母與姊姊壓制，連去舞會的資格都沒有，而且魔法只能維持到午夜。','如果把鏡頭推近，你會看見她的努力其實發生在這裡：她沒有因為絕望而變壞，反而在苦難裡依然保有善良與體面。','故事走到這一步，表面的結果是：她終於進入舞會，並讓王子一眼看見她。','真正讓這個故事變得難忘的意外，是：午夜鐘聲響起，魔法開始崩解，她必須立刻逃離。','而最關鍵的轉彎，正是在這裡發生：她沒有硬撐著假裝，而是轉身奔離，留下那隻水晶鞋。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：她從被藏在灰裡的人，變成被整個王國看見的人。'],
    simple:['離開卑微的生活，在命運面前被真正看見。','她受制於繼母與姊姊，連參加舞會的資格都被剝奪，而且魔法有時間限制。','她在長年委屈中依舊保持善良，終於得到仙女教母的幫助進入舞會。','王子被她吸引，她第一次站在不是灰燼、而是燈光裡。','午夜鐘響，魔法開始消失，她若留下，一切會在眾人面前崩塌。','她選擇奔離舞會，不靠謊言撐住幻象，只留下水晶鞋。','水晶鞋帶回了她的真實身分，她終於被認出，也改寫了命運。'],
    full:['外在目標：去到舞會，改變命運。<br><br>內在目標：證明自己不是灰堆裡的影子，而是一個值得被尊重的人。','外在：繼母與姊姊的壓迫、身分的限制、魔法的期限。<br><br>內在：她若相信自己真的低人一等，那麼即使去了舞會也不會被看見。','她真正的努力，不只是整理衣服與赴會，而是在長年羞辱之下，仍不讓自己變得刻薄、怨毒或麻木。','她進入舞會，終於站進命運給她的光裡。那一刻，世界第一次不是把她當僕人，而是當作一個人。','最大的意外，是時間。不是敵人打敗她，而是魔法本身提醒她：你不能永遠躲在借來的奇蹟裡。','她放棄的：繼續用魔法扮演完美幻象的機會。<br><br>她換來的：讓真實的自己被尋回、被確認。','她最後得到的，不只是王子，而是一個故事答案：真正改變命運的，不是水晶鞋，而是她一直沒有放棄自己。'],
    quote:'真正讓灰姑娘走進王宮的，不是魔法，而是她在灰裡待了那麼久，仍然沒有把自己看低。'},
  { name:'小木偶皮諾丘', work:'《木偶奇遇記》', scene:'跳進鯨魚肚：為救父親冒險一搏',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{
      who:'我是許榮哲。遇到像 皮諾丘 這樣的人物，我最在意的不是他有沒有變成真人，而是他怎麼從一個只想逃責任的孩子，長成願意承擔的人。',
      relation:'我和 皮諾丘 的關係，是故事分析者與故事主角的關係。我會把他從木頭到人的那條路，拆成你看得見的轉變。',
      why:'因為這個故事真正的轉彎，不在鼻子變長，而在他願意回頭去救傑佩托。'
    },
    storytellerSimple:['用靶心人公式看，皮諾丘真正想要的，是：成為真正的人，也成為一個值得被愛的孩子。','這個故事真正有力的阻礙，在於：他天真、貪玩、愛逃避，外面的世界又充滿誘惑與騙局。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他一次次闖禍、受騙、跌倒，最後才開始學會為自己的選擇負責。','故事走到這一步，表面的結果是：他終於知道父親為了找他，竟被困在鯨魚肚裡。','真正讓這個故事變得難忘的意外，是：他這一次不是又逃，而是主動跳進更大的危險裡。','而最關鍵的轉彎，正是在這裡發生：他選擇救父親，把別人的生命放在自己前面。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他不再只是會動的木偶，而是一個真正懂得愛與責任的人。'],
    simple:['成為真正的人，得到父親的認可與愛。','他太容易受騙、貪玩、逃避責任，而世界處處在利用他的天真。','他歷經說謊、闖禍、被誘拐與一次次失敗，慢慢學會行動要付代價。','他得知傑佩托為了尋找自己，被困在鯨魚肚裡。','他本來最擅長逃跑，這一次卻發現自己不能再逃。','他跳進鯨魚肚救父親，第一次主動承擔風險與責任。','他在愛與犧牲裡完成了成長，最後變成真正的人。'],
    full:['外在目標：變成真正的人。<br><br>內在目標：從只會反應的孩子，變成能為選擇負責的人。','外在：騙子、誘惑、懶惰與享樂的世界處處勾引他。<br><br>內在：他最大的敵人不是別人，而是他總想偷懶、說謊、逃避後果。','他的努力，不是一條直線，而是反覆犯錯、反覆付代價之後，慢慢長出的自覺。','當他知道父親為了自己陷入更大的險境，故事突然從「我怎麼變好」變成「我願不願意去救別人」。','最大的意外，是那個原本只會闖禍的孩子，竟然在最危險的時刻長出勇氣。','他放棄的：再次逃避的慣性。<br><br>他換來的：成為人的真正資格，不是外表，而是責任感。','皮諾丘最後得到的，不只是變成人的身體，而是終於配得上「兒子」這個身分。'],
    quote:'皮諾丘真正變成人的那一刻，不是木頭變成血肉，而是他第一次願意為別人冒險。'},
  { name:'小紅帽', work:'《小紅帽》', scene:'走進森林：誤信大野狼，偏離原路',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{
      who:'我是許榮哲。遇到像 小紅帽 這樣的人物，我最在意的不是狼有多壞，而是她怎麼在天真與危險交界的那一步，做出了關鍵錯誤。',
      relation:'我和 小紅帽 的關係，是故事分析者與故事主角的關係。我會把這個看起來最簡單的童話，拆成真正的風險結構。',
      why:'因為這個故事真正的戲眼，不在狼吞下誰，而在她明明知道要走直路，卻被一句話帶偏。'
    },
    storytellerSimple:['用靶心人公式看，小紅帽真正要做的，是：把食物送到外婆家，平安完成大人的交代。','這個故事真正有力的阻礙，在於：森林危險重重，而她最大的弱點，是對陌生人的善意與好奇。','如果把鏡頭推近，你會看見她的努力其實發生在這裡：她原本是想乖乖走直路、把任務做好。','故事走到這一步，表面的結果是：她在森林裡遇見大野狼，還把目的地與路線都告訴了對方。','真正讓這個故事變得難忘的意外，是：狼不是當場撲上來，而是先假裝友善，讓她自己偏離原路。','而最關鍵的轉彎，正是在這裡發生：她停下來摘花、聊天、繞遠路，把危險主動放進故事裡。','所以最後留下來的，不只是結局，而是這個人物真正讓我們看見的事：有些危險不是因為你壞，而是因為你太容易相信。'],
    simple:['把點心送到外婆家，平安走完森林。','森林危險，而她天真、好奇、容易相信陌生人的話。','她本來照著母親的交代走，想把任務做好。','她遇到大野狼，還把自己的目的與外婆家的位置說了出去。','狼沒有立刻攻擊，而是用看似無害的對話讓她放下戒心。','她偏離原路去摘花、聊天，讓狼搶先一步去到外婆家。','故事最後變成一堂殘酷的成長課：單純如果沒有警覺，會把自己暴露給危險。'],
    full:['外在目標：把食物送到外婆家。<br><br>內在目標：證明自己已經可以獨立完成大人的交代。','外在：森林裡有危險，還有一隻擅長偽裝的狼。<br><br>內在：她最大的破口不是力量不足，而是她不知道「友善的表面」也可能是一種陷阱。','她的努力原本很單純：照著母親的話走，把事情做好。這也讓故事更殘酷，因為她不是故意闖禍，而是在想當乖孩子的路上失手。','她遇見狼，並在對話裡不知不覺交出了最重要的資訊。這個結果看似小，實際上已經把主導權交給了敵人。','最大的意外，是危險沒有長出獠牙，而是先披上一張會說話、會微笑的臉。','她放棄的：原本該守住的警覺與路線。<br><br>她換來的：一場讓她再也不可能天真如初的教訓。','小紅帽最終留下的，不只是驚嚇，而是一個童話最古老的提醒：成長，往往從你第一次知道世界不全是好人開始。'],
    quote:'小紅帽真正跌倒的，不是在森林裡迷路，而是在一句看似無害的對話裡，把警覺放下了。'},
  { name:'白雪公主', work:'《白雪公主》', scene:'吃下毒蘋果：在善良與惡意之間失守',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{

      relation:'我和 白雪公主 的關係，是故事分析者與故事主角的關係。我會把她的善良與危險之間的張力，拆給你看。',
      why:'因為這個故事真正的關鍵，不是王后有多壞，而是白雪公主始終不把別人想得那麼壞。'
    },
    storytellerSimple:['用靶心人公式看，白雪公主真正想要的，是：活下去，找到一個不再被追殺的安全之地。','這個故事真正有力的阻礙，在於：王后的嫉妒不會停止，而白雪公主最大的弱點，是她太容易相信善意。','如果把鏡頭推近，你會看見她的努力其實發生在這裡：她逃進森林、學著在陌生地方生存，努力在七個小矮人的屋子裡重建生活。','故事走到這一步，表面的結果是：她暫時有了安身之處，也避開了王后的第一次追殺。','真正讓這個故事變得難忘的意外，是：危險不是從森林深處來，而是偽裝成一顆看起來無害的蘋果走到她門前。','而最關鍵的轉彎，正是在這裡發生：她再次相信了陌生人的善意，接過蘋果，也接過了命運。','所以最後留下來的，不只是結局，而是這個人物真正讓我們看見的事：純真很美，但如果沒有辨識惡意的能力，也會成為致命破口。'],
    simple:['逃離王后的追殺，活下去。','王后的嫉妒不死，而她自己又太善良、太容易相信他人。','她躲進森林，在七個小矮人的家中重新建立安全感。','她短暫擁有了平靜，以為危險已經遠離。','王后化裝上門，把毒藥藏進一顆看似普通的蘋果裡。','她接過蘋果，讓善良再次輸給了惡意的偽裝。','故事最後留下的不只是甦醒，而是一個提醒：善良若沒有警覺，會被世界利用。'],
    full:['外在目標：逃過王后的追殺，活下去。<br><br>內在目標：在敵意包圍的世界裡，仍然不失去自己的純真。','外在：王后的權力、魔鏡的催逼、一次次升級的追殺。<br><br>內在：她不知道如何分辨惡意，只知道以善意理解世界。','她逃進森林、住進矮人小屋、學著在驚恐後重新生活。這些努力讓她暫時得到安全，也讓她相信世界還能再開始。','她真的差一點就成功了。她有了新的家、有了陪伴，也有了重新活著的節奏。','最大的意外，是危險不再以刀子或毒藥的模樣來，而是披上可憐、友善、老弱的外衣。','她放棄的：面對陌生人時該有的懷疑。<br><br>她換來的：一場極其昂貴的教訓。','白雪公主最後的意義，不只在甦醒，而在於她讓我們看見：真正成熟，不是失去善良，而是讓善良長出判斷。'],
    quote:'白雪公主最讓人心疼的地方，是她不是輸給邪惡太強，而是輸給自己始終不願把世界想壞。'},
  { name:'羅密歐', work:'《羅密歐與茱麗葉》', scene:'墓室之夜：以為茱麗葉已死，飲下毒藥',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{
      who:'我是許榮哲。遇到像 羅密歐 這樣的人物，我最在意的不是他愛得多深，而是他怎麼在情感、衝動與命運之間，一步一步走到不可回頭。',
      relation:'我和 羅密歐 的關係，是故事分析者與故事主角的關係。我會把這場最經典的愛情悲劇，拆成真正成立的故事結構。',
      why:'因為羅密歐最致命的，不只是愛得太快，而是他每次都讓情緒跑在消息前面。'
    },
    storytellerSimple:['用靶心人公式看，羅密歐真正想要的，是：和茱麗葉在一起，哪怕整個維洛那都反對。','這個故事真正有力的阻礙，在於：兩家世仇深重，愛情每往前一步，都等於逼近災難一步。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他不顧家族立場，秘密求婚、結婚、逃亡，試圖替愛情開出一條活路。','故事走到這一步，表面的結果是：茱麗葉服下假死藥，等待與他重逢。','真正讓這個故事變得難忘的意外，是：關鍵訊息沒有送到，他先收到的是茱麗葉死亡的假消息。','而最關鍵的轉彎，正是在這裡發生：他沒有多等一步、多查一步，而是直接趕到墓室飲下毒藥。','所以最後留下來的，不只是結局，而是這個人物真正讓我們看見的事：有時候悲劇不是因為不夠愛，而是因為愛得太急。'],
    simple:['和茱麗葉在一起，逃離兩家仇恨。','兩家世仇、決鬥、放逐，以及愛情根本沒有合法存在的空間。','他秘密結婚、試圖安排未來，想在仇恨之間替兩人擠出一條路。','茱麗葉決定假死，為重逢爭取機會。','送信失敗，他收到的是茱麗葉已死的消息。','他沒有再確認，直接趕到墓室，在絕望中飲下毒藥。','茱麗葉醒來時一切已晚，兩人的死換來的是兩家終於停戰。'],
    full:['外在目標：和茱麗葉在一起。<br><br>內在目標：用愛對抗家族仇恨，證明人生可以不照舊劇本活。','外在：兩大家族的世仇、社會秩序、暴力循環。<br><br>內在：羅密歐最大的弱點，是他總在最劇烈的情緒裡做決定。','他很努力地愛：秘密赴約、求婚、結婚、逃亡，每一步都在對抗制度與家族。問題不是他不努力，而是每一次努力都太急。','假死計畫本來可能成功，兩人只差最後一個資訊同步，就有機會逃出悲劇。','最大的意外，不是死亡，而是訊息差。愛情明明還有出口，命運卻先把錯的消息送到他手上。','他放棄的：多等一步、多問一步、多確認一步。<br><br>他換來的：一個用死亡封住的結局。','羅密歐最後留下來的，不只是殉情，而是一個殘酷提醒：愛如果沒有節制與判斷，最終可能親手毀掉自己想守護的東西。'],
    quote:'羅密歐不是不夠愛，而是他每次都比真相更快一步。這一步，就是悲劇。'},
  { name:'愛麗絲', work:'《愛麗絲夢遊仙境》', scene:'荒誕法庭：對紅心皇后說「你們只是紙牌」',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{
      who:'我是許榮哲。遇到像 愛麗絲 這樣的人物，我最在意的不是仙境有多奇怪，而是她怎麼在荒謬裡，慢慢學會不再任人擺布。',
      relation:'我和 愛麗絲 的關係，是故事分析者與故事主角的關係。我會把她的迷路，看成一個孩子建立判斷力的過程。',
      why:'因為這個故事真正的轉彎，不在掉進兔子洞，而在她終於看穿：權威有時候只是裝出來的。'
    },
    storytellerSimple:['用靶心人公式看，愛麗絲真正想要的，是：在這個荒誕世界裡找到規則，搞清楚自己到底該怎麼走。','這個故事真正有力的阻礙，在於：仙境沒有穩定邏輯，所有人都在改變規則，連她自己都忽大忽小、搖擺不定。','如果把鏡頭推近，你會看見她的努力其實發生在這裡：她不停發問、觀察、試著理解每一場荒謬對話背後的秩序。','故事走到這一步，表面的結果是：她被一路推到紅心皇后的法庭，成了荒誕審判的一部分。','真正讓這個故事變得難忘的意外，是：她忽然發現，原來這一切最可怕的權威，根本只是紙做的表演。','而最關鍵的轉彎，正是在這裡發生：她不再害怕，直接對整個法庭說「你們只是紙牌」。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：她從被世界牽著走的孩子，變成敢用自己的判斷看世界的人。'],
    simple:['在仙境裡找到方向，弄懂規則。','仙境沒有固定邏輯，所有角色都在扭曲語言與秩序，她也始終不穩定。','她一路發問、觀察、碰撞，努力理解這個不講理的世界。','她被帶到紅心皇后的法庭，捲進一場荒謬審判。','她意外看見：最可怕的權威，其實只是大家一起相信的表演。','她鼓起勇氣指出「你們只是紙牌」，不再接受荒謬支配自己。','仙境於是崩解，她帶著新的判斷力回到現實世界。'],
    full:['外在目標：在仙境裡找到方向與出口。<br><br>內在目標：建立自己的判斷，不再被外界的聲音任意擺布。','外在：仙境的一切都會變，規則、身體大小、語言邏輯都不穩定。<br><br>內在：她最大的混亂，是不知道該相信誰，也不知道該怎麼相信自己。','她一直在試著理解：問問題、回嘴、觀察、適應。這些努力看似零散，其實都在訓練她的判斷力。','她終於走進荒誕的核心——法庭。那裡表面最有秩序，實際卻最沒有道理。','最大的意外，是她忽然看穿：權威不是天生的，而是被服從撐起來的。','她放棄的：對權威天然的敬畏。<br><br>她換來的：面對混亂時仍能保持自己的眼光。','愛麗絲最後得到的，不只是醒來，而是成長：世界可以很荒謬，但你不必跟著它一起荒謬。'],
    quote:'愛麗絲真正長大的那一刻，不是她找到出口，而是她開始敢懷疑那些看起來很有權威的人。'},
  { name:'蝙蝠俠', work:'《黑暗騎士》', scene:'替哈維．丹特背下罪名：主動墜入黑暗',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{
      who:'我是許榮哲。遇到像 蝙蝠俠 這樣的人物，我最在意的不是他多能打，而是他願意為一座城市，背到什麼地步。',
      relation:'我和 蝙蝠俠 的關係，是故事分析者與故事主角的關係。我會把他那個最經典的黑暗選擇，拆成真正讓角色立起來的結構。',
      why:'因為蝙蝠俠最厲害的，不是打敗小丑，而是他明明可以說出真相，最後卻選擇自己成為壞人。'
    },
    storytellerSimple:['用靶心人公式看，蝙蝠俠真正要做的，是：守住高譚市，不讓這座城市完全相信正義只是笑話。','這個故事真正有力的阻礙，在於：小丑不只是犯罪者，他要摧毀的是整個城市對秩序與希望的信念。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他不斷在暴力、法律與犧牲之間周旋，想把希望留給高譚。','故事走到這一步，表面的結果是：哈維．丹特墜落成雙面人，多條人命因此斷送。','真正讓這個故事變得難忘的意外，是：高譚最光明的白騎士先被黑暗吞掉了。','而最關鍵的轉彎，正是在這裡發生：蝙蝠俠決定替哈維背下罪名，讓城市留下「正義還在」的幻象。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他沒有守住自己的名聲，卻守住了高譚最後一點相信光的能力。'],
    simple:['守住高譚市，讓秩序不被小丑徹底摧毀。','小丑要毀掉的不是人，而是整座城市對法律、英雄與希望的信念。','蝙蝠俠不斷在黑暗裡出手，努力替高譚保留可以相信的未來。','哈維．丹特墜落成雙面人，正義的象徵開始反噬城市。','最殘酷的意外，是希望本身先倒下了。','蝙蝠俠選擇替哈維背下所有罪名，把自己放進黑暗裡。','他成為被追捕的人，卻替高譚留住了繼續相信正義的理由。'],
    full:['外在目標：守住高譚市的秩序。<br><br>內在目標：證明黑暗裡仍然值得相信光。','外在：小丑的混亂、犯罪升級、城市恐慌。<br><br>內在：蝙蝠俠最大的困境，是他既要用黑暗對抗黑暗，又不能讓自己真的變成黑暗。','他的努力，不只是追捕罪犯，而是一直替城市扛住那些法律無法立刻承受的部分。','當哈維倒下時，蝙蝠俠表面上失去的只是一個盟友，實際上失去的是高譚對未來最亮的一盞燈。','最大的意外，是最該代表正義的人先被摧毀。那讓小丑幾乎證明了自己的論點：每個人都可以被逼瘋。','他放棄的：自己的清白與英雄身分。<br><br>他換來的：讓高譚保住一個仍能信任法律與希望的敘事。','蝙蝠俠最後留下的，不是勝利，而是一個英雄最高級的版本：不是被愛，而是願意背負誤解，讓別人繼續相信愛。'],
    quote:'蝙蝠俠最強的地方，不是他把壞人打倒，而是他願意自己變成壞人的樣子，去守住別人心裡的好。'},
  { name:'浮士德', work:'《浮士德》', scene:'與魔鬼簽約：拿靈魂交換知識與極致經驗',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{
      who:'我是許榮哲。遇到像 浮士德 這樣的人物，我最在意的不是他懂多少，而是他為了得到更多，願意付到哪一步。',
      relation:'我和 浮士德 的關係，是故事分析者與故事主角的關係。我會把他從求知到墮落的那條線拆清楚。',
      why:'因為這個故事最可怕的，不是魔鬼出現，而是人先覺得現有的一切都不夠。'
    },
    storytellerSimple:['用靶心人公式看，浮士德真正想要的，是：突破知識與生命的極限，得到人世最深的真相與滿足。','這個故事真正有力的阻礙，在於：人的理解力終究有限，而他又對有限這件事極度不能忍受。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他窮盡學問、否定現狀，最後甚至願意和魔鬼交易。','故事走到這一步，表面的結果是：他得到了更多經驗、快感與能力，也打開了自己原本到不了的世界。','真正讓這個故事變得難忘的意外，是：他以為交換的是靈魂的未來，卻先失去了當下判斷善惡的能力。','而最關鍵的轉彎，正是在這裡發生：他不是被逼簽約，而是主動伸手，承認自己願意拿永恆去賭片刻的滿足。','所以最後留下來的，不只是結局，而是這個人物真正讓我們看見的事：當欲望大到連靈魂都能計價，悲劇就已經開始。'],
    simple:['突破知識與人生的極限。','他最大的困境是：已經懂很多，卻仍覺得一切都不夠。','他窮盡學問後仍不滿足，最後與魔鬼簽下契約。','他獲得更多力量、經驗與感官上的擴張。','最大的意外，是他交換出去的不只是未來，還有當下的道德邊界。','他主動用靈魂去賭一個更大的世界。','浮士德的故事最後變成對人類欲望的一次深度審判。'],
    full:['外在目標：得到超越常人的知識、力量與生命經驗。<br><br>內在目標：證明人的存在不必被有限綁住。','外在：人類知識有限、生命有限、感官有限。<br><br>內在：他真正受不了的，不是無知，而是「再多也不夠」的空洞感。','他的努力一路從讀書、研究、思辨走到否定一切，最後連與魔鬼交易也成了方法。','結果是他真的踏進原本到不了的世界，感受到強烈、危險而昂貴的擴張。','最大的意外，是交換往往不是在終點才收款，而是從簽下去那刻開始，你就已經慢慢失去自己。','他放棄的：靈魂與道德的安穩邊界。<br><br>他換來的：一場巨大卻危險的存在實驗。','浮士德留下來的，不只是魔鬼契約，而是一個古老提醒：當人不再接受有限，往往也會同時失去分寸。'],
    quote:'浮士德真正危險的，不是他想知道更多，而是他覺得再大的代價都值得。'},
  { name:'亞森羅蘋', work:'《怪盜亞森羅蘋》', scene:'最高明的一場偷竊：把犯罪變成智力表演',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{

      relation:'我和 亞森羅蘋 的關係，是故事分析者與傳奇角色的關係。我會把他的魅力拆成真正成立的角色機關。',
      why:'因為他最厲害的不是犯案，而是讓你明明知道他在犯案，還是忍不住想看他怎麼做到。'
    },
    storytellerSimple:['用靶心人公式看，亞森羅蘋真正想要的，是：以最高明的方式贏過體制、警方與所有自以為聰明的人。','這個故事真正有力的阻礙，在於：每一次出手，他都得同時對付戒備、追捕與公眾目光。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他精準布局、變裝、誤導、設計節奏，讓每一次行動都像魔術。','故事走到這一步，表面的結果是：他成功偷到東西，還常常在眾人眼前全身而退。','真正讓這個故事變得難忘的意外，是：你最後記得的常常不是被偷走了什麼，而是他怎麼讓所有人都慢半拍。','而最關鍵的轉彎，正是在這裡發生：他把原本屬於陰影的犯罪，改造成陽光下的智力競技。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他把怪盜變成了一種風格，一種連對手都不得不承認的優雅。'],
    simple:['用最漂亮的方式贏過體制與警方。','警方、防備、時間壓力與每次行動都更高的期待。','他靠布局、變裝與心理戰，把偷竊做成表演。','他往往能成功得手，還順便嘲弄整個追捕系統。','最大的意外，是人們最後甚至會欣賞他的手法。','他把犯罪從黑暗動作變成公開較量。','亞森羅蘋留下的是一種帶著魅力的反體制傳奇。'],
    full:['外在目標：完成高難度偷竊並全身而退。<br><br>內在目標：證明自己能比制度更聰明、更自由。','外在：警方、機關、戒備與各種現場限制。<br><br>內在：他真正追求的，不只是財物，而是贏的姿態。','他的努力是一種高度精密的表演：情報、變裝、預告、誤導、節奏安排，缺一不可。','結果往往不只是得手，而是連對手都被迫承認：這一局確實輸得漂亮。','最大的意外，是觀眾對他的情感常常會被他帶著走，從譴責變成欣賞。','他放棄的：低調與簡單。<br><br>他換來的：讓每一次出手都成為傳奇。','亞森羅蘋留下來的，不只是怪盜故事，而是一個角色範例：真正迷人的反派或反英雄，靠的不只是本事，還有風格。'],
    quote:'亞森羅蘋最厲害的，不只是偷到，而是讓整個世界都看著他偷，還來不及阻止。'},
  { name:'普羅米修斯', work:'希臘神話', scene:'盜火給人類：明知受罰仍把火帶到地上',

    storytellerIntro:{
      who:'我是許榮哲。遇到像 普羅米修斯 這樣的人物，我最在意的不是火有多珍貴，而是他為什麼明知道會受罰，還是要把它交給人類。',
      relation:'我和 普羅米修斯 的關係，是故事分析者與神話角色的關係。我會把這個古老神話當成一次關於文明代價的故事拆解。',

    storytellerSimple:['用靶心人公式看，普羅米修斯真正想要的，是：把火帶給人類，讓人類不再只是一群無力的生物。','這個故事真正有力的阻礙，在於：火是神的權柄，而宙斯不願讓人類擁有這種力量。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他不是嘴上同情人類，而是真的去偷、去違抗、去承擔。','故事走到這一步，表面的結果是：火來到了人間，人類文明因此開始有了新的可能。','真正讓這個故事變得難忘的意外，是：他不是不知道代價，而是知道之後仍然去做。','而最關鍵的轉彎，正是在這裡發生：他把對人類的偏愛，放在對神權的服從之前。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他把文明的火種，連同痛苦的代價，一起交給了人類。'],
    simple:['把火帶給人類。','火屬於神，宙斯不允許人類擁有這種力量。','他主動違抗神意，把火偷來交給人類。','人類因此獲得文明發展的重要起點。','最大的意外，是他早就知道自己會被重罰。','他選擇承擔永恆痛苦，也不撤回這個決定。','普羅米修斯成為反抗權威、替人類受苦的象徵。'],
    full:['外在目標：把火帶給人類。<br><br>內在目標：讓人類擁有不只活著、還能發展文明的可能。','外在：宙斯的禁令、神權秩序、偷火本身的高風險。<br><br>內在：最難的是明知懲罰巨大，仍要決定值不值得。','他的努力不是思考而已，而是直接去做那件會改變世界也會毀掉自己的事。','結果是火真的到了人間，人類開始能照明、鍛造、烹煮、創造。','最大的意外，是文明的起點，竟同時綁著一個永恆受刑的身影。','他放棄的：自己的安穩與安全。<br><br>他換來的：替人類打開文明之門。','普羅米修斯留下來的，不只是神話，而是一個根本命題：有些進步之所以出現，是因為有人願意先承受代價。'],
    quote:'普羅米修斯最偉大的，不是偷到了火，而是他知道會被罰，還是把火交給了人類。'},

    simple:['完成十二試煉，贖回自己的人生。','任務極難，而他還背負著沉重的罪與恥感。','他靠一次次行動去完成看似不可能的挑戰。','他最終成為最知名的英雄之一。','最大的意外，是英雄神話背後其實有很深的悲劇底色。','他接受長期勞苦，不用神力逃避代價。','海克利士變成力量與贖罪並存的典型。'],
    full:['外在目標：完成十二試煉。<br><br>內在目標：贖回被毀掉的人生，重新證明自己還值得存在。','外在：怪物、任務、陷阱與接連不斷的極限考驗。<br><br>內在：最難的是，他不是單純要贏，而是要帶著罪咎繼續活。','他的努力是持續性的，不是一拳解決，而是一關又一關承受下來。','結果是他真的完成了那些不可能任務，成為傳奇。','最大的意外，是英雄最耀眼的神話，往往不是從純粹光明長出來，而是從極深的痛苦裡長出來。','他放棄的：只做一個炫耀力量的人。<br><br>他換來的：用勞苦把自己重新鍛回來。','海克利士留下來的，不只是戰績，而是一種更成熟的英雄定義：真正的強，不只是打贏外面的怪物，也要承受裡面的重量。'],

  { name:'亞瑟王', work:'亞瑟王傳說', scene:'拔出石中劍：從無名少年被世界推上王位',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{
      who:'我是許榮哲。遇到像 亞瑟王 這樣的人物，我最在意的不是劍多神，而是他怎麼在還沒準備好的時候，被命運直接推到中心。',
      relation:'我和 亞瑟王 的關係，是故事分析者與傳說人物的關係。我會把這個王者神話拆成一個關於資格與承擔的故事。',
      why:'因為亞瑟王最關鍵的，不是成王之後，而是他原本沒有想當王，卻必須開始學著成為王。'
    },
    storytellerSimple:['用靶心人公式看，亞瑟王真正想要的，是：在混亂時代裡找到自己該站的位置。','這個故事真正有力的阻礙，在於：王位不是榮耀而已，而是整個國家的混亂、期待與權力鬥爭一起壓上來。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他不是一開始就像王，而是在被命運選中後，慢慢學會承擔。','故事走到這一步，表面的結果是：他拔出了石中劍，成為被承認的王。','真正讓這個故事變得難忘的意外，是：最被世界選中的人，往往正是原本最不在中心的人。','而最關鍵的轉彎，正是在這裡發生：他沒有把那把劍當作炫耀，而是把它當作一個必須扛起來的責任。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他讓圓桌、騎士與理想王權，成為後世不斷回望的傳奇。'],
    simple:['在混亂世界裡成為真正的王。','權力鬥爭、各方質疑，以及他自己原本並不在中心。','他被命運選中後，開始學著承擔王者位置。','他拔出石中劍，成為被承認的國王。','最大的意外，是最不起眼的少年反而被命運選中。','他選擇承擔那把劍背後的責任。','亞瑟王留下了理想王權與圓桌傳說。'],
    full:['外在目標：成為能穩住國家的王。<br><br>內在目標：讓自己配得上那個突然落在身上的位置。','外在：混亂局勢、各方權力、王位爭奪與眾人質疑。<br><br>內在：最難的是，他不是自己爭來的，而是被選中的，因此更必須證明自己配得上。','他的努力，不是拔劍那一刻，而是拔劍之後開始學著如何治理、如何團結、如何承擔。','結果是他不只是成王，還讓自己的名字變成理想王者的象徵。','最大的意外，是許多傳奇都不是由最像主角的人開場，而是由最不起眼的人被命運叫上台。','他放棄的：作為普通少年的安全。<br><br>他換來的：一個必須被歷史檢驗的身分。','亞瑟王留下來的，不只是石中劍，而是一種王者想像：真正的王，不只要被選中，還要在之後的每一天持續配得上。'],
    quote:'亞瑟王真正困難的，不是拔出那把劍，而是拔出之後，還要一直配得上它。'},
  { name:'羅賓漢', work:'羅賓漢傳說', scene:'劫富濟貧：在森林裡對抗失衡的秩序',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{

      relation:'我和 羅賓漢 的關係，是故事分析者與傳說人物的關係。我會把這個綠林英雄拆成一個關於正義與體制張力的故事。',
      why:'因為羅賓漢最迷人的地方，不是反叛本身，而是他讓人相信：當制度失衡時，反叛也可能是一種正義。'
    },
    storytellerSimple:['用靶心人公式看，羅賓漢真正想要的，是：替被壓迫的人把被奪走的公平拿回來。','這個故事真正有力的阻礙，在於：他對抗的不只是一兩個壞人，而是整套偏向權勢者的秩序。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他在森林中組織夥伴、伏擊權貴、保護百姓，把零散的不滿變成可行動的力量。','故事走到這一步，表面的結果是：富人的財貨被奪，窮人的生路暫時被保住。','真正讓這個故事變得難忘的意外，是：一個被體制定義為罪犯的人，反而成了民眾心裡最像正義的人。','而最關鍵的轉彎，正是在這裡發生：他不再相信等制度自己變好，而是決定先站出來做那個不合法卻合情理的人。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他把綠林變成庇護，把反抗變成一種會被百姓記住的公平。'],
    simple:['替弱者搶回公平。','他對抗的是整套偏向權勢者的失衡秩序。','他在森林裡集結夥伴，靠行動保護百姓。','富人的財物被奪，窮人因此有了喘息空間。','最大的意外，是罪犯形象反而承載了民間對正義的想像。','他選擇站到法律外面，去做法律裡缺席的事。','羅賓漢成為人民心中比官府更像公平的名字。'],
    full:['外在目標：劫富濟貧，保護受壓迫者。<br><br>內在目標：在失衡的世界裡替公平重新站穩腳步。','外在：官府、軍力、通緝與權勢者的資源壟斷。<br><br>內在：最難的是，他必須接受自己為了正義，會先被定義成不正義。','他的努力不只是射箭與搶劫，而是建立同盟、分配資源、在森林裡形成另一種秩序。','結果是他成為被追捕的人，也成為被保護者依靠的人。','最大的意外，是制度越失靈，人民越會把希望放到制度之外。','他放棄的：留在合法世界裡的安全。<br><br>他換來的：成為一個能替別人擋住不公的人。','羅賓漢留下來的，不只是綠林傳奇，而是一個持續存在的問題：當法律不能代表公平時，誰來替公平出手？'],
    quote:'羅賓漢最迷人的，不是他反叛，而是他讓人相信：有時候站到體制外，反而更靠近正義。'},

    storytellerSimple:['用靶心人公式看，廖添丁真正想要的，是：在不公平的秩序裡，替被壓著的人搶回一點公道。','這個故事真正有力的阻礙，在於：他面對的是殖民權力、警察追捕與底層人幾乎沒有申訴空間的現實。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他不是空想正義，而是直接出手，把風險扛到自己身上。','故事走到這一步，表面的結果是：他成了被通緝的人，卻也成了百姓口耳相傳的英雄。','真正讓這個故事變得難忘的意外，是：一個被官方定義為罪犯的人，反而被民間當成最像正義的人。','而最關鍵的轉彎，正是在這裡發生：他選擇不等制度還人公道，而是自己成為那個先替人出手的人。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他把個人冒險，變成了群體想像中的公平。'],
    simple:['替受壓迫的百姓搶回公道。','殖民權力、警察追捕與底層無力發聲的現實都壓在前面。','他直接出手，用自己的風險去換別人的喘息空間。','他成為被追捕的人，也成為民間心裡的義賊英雄。','最大的意外，是官方罪犯與民間英雄竟然可以是同一個人。','他不等制度修正，而是先以行動介入。','廖添丁留下了台灣民間對俠義與反抗的深刻想像。'],
    full:['外在目標：替弱者出手、劫富濟貧。<br><br>內在目標：在不公平的時代裡，證明小人物也可以有力量。','外在：殖民統治、警力追捕、資源與權力都在對手手上。<br><br>內在：最難的是，當你站到制度外面，必須接受自己會先被定義成錯。','他的努力不是單一壯舉，而是一次次把危險攬到自己身上，去替別人做制度裡缺席的事。','結果是他成為傳奇人物，名字開始超出個人，變成一種民間情感的承載。','最大的意外，是有些人的正義，並不先被法律承認，而是先被百姓記住。','他放棄的：留在安全位置的可能。<br><br>他換來的：成為被壓迫者心中可以投射希望的人。','廖添丁留下來的，不只是俠盜故事，而是一個長久存在的問題：當正式秩序不能代表公平時，人民會把誰想像成英雄？'],
    quote:'廖添丁真正被記住的，不是他偷了什麼，而是他讓很多無力的人覺得：終於有人替我們出手。'},
  { name:'宙斯', work:'希臘神話', scene:'推翻克羅諾斯：奪回天界秩序與最高神權',

    storytellerIntro:{

    storytellerSimple:['用靶心人公式看，宙斯真正想要的，是：推翻舊神暴政，建立新的天界秩序。','這個故事真正有力的阻礙，在於：他的敵人不是普通對手，而是吞噬子女、掌握舊權力的父神克羅諾斯。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他集結兄弟姊妹、聯合同盟，讓反抗從個人怒氣變成整體戰爭。','故事走到這一步，表面的結果是：奧林帕斯眾神勝出，宙斯成為神王。','真正讓這個故事變得難忘的意外，是：他打倒的不只是父親，也打倒了那種靠吞噬下一代維持統治的恐懼秩序。','而最關鍵的轉彎，正是在這裡發生：他從被追殺的孩子，轉成重新制定規則的最高者。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他讓希臘神話世界有了新的中心與新的權力結構。'],
    simple:['推翻舊神暴政，建立新秩序。','對手是掌控舊世界的父神與其恐懼統治。','他集結眾神與同盟，把反抗變成真正戰爭。','奧林帕斯眾神最終勝出，宙斯成為神王。','最大的意外，是他改變的不只是一場勝負，而是整套世界秩序。','他從被壓迫者變成規則制定者。','宙斯成為希臘神話中權力與秩序中心的象徵。'],
    full:['外在目標：推翻克羅諾斯，成為新神界領袖。<br><br>內在目標：讓世界不再由恐懼與吞噬支配。','外在：父神的力量、泰坦勢力、舊秩序龐大而穩固。<br><br>內在：最難的是，打倒暴政之後，你能不能不只是複製暴政。','他的努力是聯盟式的，靠集結、分工、對抗，讓新秩序有機會誕生。','結果是奧林帕斯眾神建立，宙斯取得最高位置。','最大的意外，是神話最深的戲，常不是打鬥本身，而是打完後誰來定義接下來的世界。','他放棄的：只做倖存者。<br><br>他換來的：成為能定義秩序的人。','宙斯留下來的，不只是雷霆，而是一個典型的神話命題：真正的統治，不只靠力量奪來，還要靠規則守住。'],
    quote:'宙斯真正成為神王的關鍵，不只是打倒克羅諾斯，而是他接手了整個世界該怎麼運轉。'},
  { name:'哪叱', work:'《封神演義》與民間傳說', scene:'削骨還父、削肉還母：用自我犧牲切斷宿命',

      relation:'我和 哪叱 的關係，是故事分析者與神話角色的關係。我會把他那個最強烈的轉變拆清楚。',

    storytellerSimple:['用靶心人公式看，哪叱真正想要的，是：從被壓迫與被追討的處境裡，替自己與家人殺出一條路。','這個故事真正有力的阻礙，在於：他惹上的不是小麻煩，而是龍王體系與天命壓力，連父母都被捲進來。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他先是衝動反抗，後來才一步步理解，真正的承擔不只是打贏。','故事走到這一步，表面的結果是：他以自我犧牲切斷恩怨，之後又重獲新生。','真正讓這個故事變得難忘的意外，是：最反骨的孩子，最後也是最先把責任扛回自己身上的那個人。','而最關鍵的轉彎，正是在這裡發生：他不再只靠法寶與怒氣，而是選擇用自己的身體去結束對家人的連累。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他從單純的叛逆者，變成真正理解代價的人。'],
    simple:['替自己與家人殺出一條生路。','龍王追討、天命壓力與家庭連累全都壓上來。','他從衝動反抗一路走到真正理解責任。','他以自我犧牲切斷恩怨，後來又重獲新生。','最大的意外，是最反骨的人先學會了承擔。','他用自己去結束對家人的連累。','哪叱成為叛逆、重生與承擔並存的經典形象。'],
    full:['外在目標：擺脫追殺與連累，保住自己與家人。<br><br>內在目標：從只會反抗的孩子，變成知道代價的人。','外在：龍王勢力、父母壓力、天命與既有秩序。<br><br>內在：最難的是，他不只要贏外面的敵人，還要從自己的衝動裡長出成熟。','他的努力一開始像爆衝，後來才慢慢轉成真正的承擔與抉擇。','結果是他失去原本身體，卻也因此開啟新的生命形態。','最大的意外，是神話裡最劇烈的角色成長，常常來自最疼痛的自我切割。','他放棄的：原本的身體與單純少年位置。<br><br>他換來的：重生後真正屬於自己的力量。','哪叱留下來的，不只是法寶神通，而是一種極強的故事張力：真正的重生，往往先經過一次很痛的自我了斷。'],
    quote:'哪叱最厲害的，不只是敢反，而是他最後真的敢為自己的反抗付代價。'},
  { name:'媽祖', work:'民間信仰傳說', scene:'渡海救難：在風浪裡成為眾人心中的庇護',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{

      relation:'我和 媽祖 的關係，是故事分析者與信仰人物的關係。我會把她從少女到海上守護者的故事力量拆給你看。',
      why:'因為真正讓信仰延續的，不只是神力，而是人們一代代感覺：她真的在照看那些最無助的時刻。'
    },
    storytellerSimple:['用靶心人公式看，媽祖真正想要的，是：在風浪與危難中，守住出海人的平安。','這個故事真正有力的阻礙，在於：海是最無常的地方，人一旦上船，很多時候只能把命交給天候與運氣。','如果把鏡頭推近，你會看見她的努力其實發生在這裡：她不是只在安全處被祭拜，而是總和最危險、最無助的場景連在一起。','故事走到這一步，表面的結果是：她一次次被傳說成拯救沉船、指路返航、護持眾人。','真正讓這個故事變得難忘的意外，是：最強的力量不一定來自征服，而常來自守護。','而最關鍵的轉彎，正是在這裡發生：她從一個人，慢慢變成所有在海上漂泊者共同相信的庇護。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：她把恐懼的大海，變成還有希望可以祈求的地方。'],
    simple:['守住出海人的平安。','大海無常，人面對風浪時幾乎沒有完全掌控感。','她的傳說總和救難、護航、指路連在一起。','她成為海上守護與庇佑的核心信仰。','最大的意外，是最強大的力量常常不是征服，而是守護。','她從個人傳奇變成群體信任的對象。','媽祖成為海洋文化裡最深的安定感來源之一。'],
    full:['外在目標：護持海上行路人的平安。<br><br>內在目標：讓恐懼中的人知道，自己不是孤身面對風浪。','外在：海象無常、災難突發、生命脆弱。<br><br>內在：真正的難，不在打敗海，而在讓人於無力中仍保有希望。','她的努力不是征服式的，而是一次次被記成在危險邊緣接住人。','結果是她的形象超越地方傳說，成為跨世代的守護象徵。','最大的意外，是人最深的信仰，往往長在最無力、最需要被保護的場景裡。','她放棄的：作為單一人物被理解的邊界。<br><br>她換來的：成為無數人共同的安定感來源。','媽祖留下來的，不只是神明形象，而是一種很動人的故事核心：真正讓人一直記得的力量，是在你最怕的時候，讓你覺得還有人在。'],
    quote:'媽祖最讓人依靠的，不是因為她遠，而是因為人在最無助的風浪裡，總覺得她就在附近。'},

    full:['外在目標：降伏邪祟、鎮守一方。<br><br>內在目標：讓力量不只是破壞，而能成為秩序來源。','外在：邪氣、混亂、未知威脅。<br><br>內在：真正困難的是，如何讓強大本身不變成另一種失控。','他的努力是一種長時間修煉，把意志、力量與守護責任慢慢合在一起。','結果是他不只是戰勝敵人，更成為可以長久被依靠的鎮守形象。','最大的意外，是很多最被敬畏的神性力量，根本核心其實是對自身的高度節制。','他放棄的：只做單次勝利者的位置。<br><br>他換來的：成為長期守護秩序的人。','玄天上帝留下來的，不只是威武形象，而是一個很深的故事命題：真正能鎮住亂局的力量，先得鎮住自己。'],

  { name:'釋迦牟尼', work:'佛教故事傳統', scene:'菩提樹下悟道：看見苦的根源，也看見解脫之路',

    storytellerSimple:['用靶心人公式看，釋迦牟尼真正想要的，是：找出人生苦難的根源，並找到可以解脫的道路。','這個故事真正有力的阻礙，在於：苦不是一個外敵，而是整個生命結構本身；你越往裡問，越會發現沒有簡單答案。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他離開王宮、放下安逸、經過極端修行，再重新找到中道。','故事走到這一步，表面的結果是：他在菩提樹下悟道，成為覺者。','真正讓這個故事變得難忘的意外，是：他最後找到的答案，不是征服世界，而是看清自己與苦的關係。','而最關鍵的轉彎，正是在這裡發生：他不再執著於極端苦行，而是轉向更深的觀照與覺察。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他替無數人提供了一條面對苦、理解苦、超越苦的道路。'],
    simple:['找出苦的根源與解脫之道。','真正的阻礙不是敵人，而是人生本身深層的苦與執著。','他離開安逸生活，走過修行與極端，再找到中道。','他在菩提樹下悟道，成為覺者。','最大的意外，是終極答案不是征服外界，而是看清內在。','他放下極端，轉向更深的觀照。','釋迦牟尼成為後世理解苦與解脫的重要起點。'],
    full:['外在目標：找到超越苦難的方法。<br><br>內在目標：不只自己看見真相，也讓眾生有路可走。','外在：修行之路漫長、迷惘、沒有現成答案。<br><br>內在：最難的是，當你連自己原本深信的方法都要放下時，是否還能繼續往前。','他的努力不是打一場仗，而是長時間在生命經驗裡反覆辨認：什麼是苦、苦從哪裡來、怎麼可能停止。','結果是他悟道，並開始向世人說法，把個人的覺悟變成可傳遞的道路。','最大的意外，是最深的勝利，不一定長得像勝利，反而像放下、像看見、像不再執著。','他放棄的：王子身份、安逸生活、對極端修行的執著。<br><br>他換來的：一條更穩、更深、更能普及眾生的道路。','釋迦牟尼留下來的，不只是宗教人物形象，而是一個穿越時代的故事核心：當人真正願意直視苦，才可能找到不被苦牽著走的方法。'],
    quote:'釋迦牟尼真正了不起的，不只是看見人生有苦，而是他沒有停在感嘆，最後真的替人找到了一條路。'},
