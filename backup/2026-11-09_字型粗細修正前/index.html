      '甘地想要的，我一開始以為是政治談判的籌碼——一個聰明的挑釁，用來換取更好的條件。我沒想到，他真正想要的，是讓整個印度看見自己的力量，而那個力量，不需要槍。',
      '他最大的阻礙，照理說是我——是帝國的軍隊、法律、監獄。可鹽的長征讓我看見：他最大的阻礙，反而是印度人自己的恐懼；而他走的每一步，都在消解那個恐懼。',
      '他走到海邊，撿起一把鹽，全世界的鏡頭都跟著他。我下令逮捕了他，又逮捕了六萬多人。我以為那樣就能結束。可被捕的人越多，站出來的人也越多——我才明白，他不是在打一場可以逮捕得完的仗。',
      '他在獄中，繼續靜默，繼續絕食。我面對的壓力，不只來自印度，也來自倫敦，來自國際輿論。一個沒有軍隊的老人，讓帝國的形象在全世界面前越來越醜陋。',
      '最讓我無法預料的，是非暴力的邏輯：他不反擊，反而讓我們的暴力更加赤裸。我的警棍落下去，世界看見的不是秩序，而是一個帝國在毆打手無寸鐵的人。那個畫面，比任何演說都更有力量。',
      '我決定和他談判。邱吉爾罵我，說那是羞辱，說我不應該給他這個地位。可我問自己：繼續打下去，誰贏？不是我，不是帝國，而是時間，是恥辱，是歷史的判決。',
      '他走出監獄，走進談判桌，和我握了手。我們達成了協議，印度繼續前進，帝國慢慢退出。多年後，印度獨立，我已經離開了那個職位。可我始終記得那雙手——那雙沒有武器的手，卻是我見過最難對付的對手。'
    ],
    simple:['終結英國對印度的殖民統治，讓印度獨立。','大英帝國擁有世界最強大的軍隊，武力反抗只會帶來屠殺。','他帶領78人徒步386公里走向大海，親手抓起一把海鹽，公然違反英國鹽稅法。','他被捕入獄，但沿途跟上的人越來越多，最終演變成全國性的不合作運動。','一把鹽，點燃了整個印度——帝國的子彈打不穿這場沉默的行進。','他放棄了武力，換來了道德制高點；他放棄了速度，換來了無法被鎮壓的力量。','英國在國際壓力下逐步撤退，印度於1947年獨立——甘地用走路改變了歷史。'],
    full:['外在目標：終結英國殖民，讓印度獨立。<br><br>內在目標：證明一個被壓迫的民族可以不用暴力贏得自由——讓「非暴力」成為歷史上最強大的武器。','大英帝國的軍隊無法被武力打敗，而武裝反抗只會讓印度人付出更多的血。<br><br>外在：世界最強大的殖民軍隊。<br><br>內在：如何讓憤怒不變成暴力。','他走了386公里，每一步都是對「非暴力才是真正的力量」這個信念的示範。','他被捕入獄，但更多人跟上來——帝國發現它的子彈打不穿這場沉默的行進。','他意識到真正的武器不是憤怒，而是讓對方的暴力在全世界面前顯得醜陋。<br><br>這才是最大的意外：一個沒有軍隊的人，讓世界上最強大的帝國顯得如此可恥。','他放棄了速度，換來了無法被鎮壓的力量。<br><br>他放棄了武器，換來了道德的制高點。<br><br>最重要的是：他放棄了讓人立刻看見結果的衝動，換來了真正持久的改變。','印度於1947年獨立，甘地用走路證明了：最弱小的人，也可以用靈魂撼動最強大的帝國。'],
    storyteller3Name:'卡斯圖芭·甘地', storyteller3Role:'甘地的妻子，一輩子跟著他走的人',
    storyteller3Intro:{
      who:'我是卡斯圖芭。十三歲嫁給莫罕達斯，那時候我們都還是孩子。後來他變成了聖雄，變成了印度之父；我還是卡斯圖芭，他的妻子，跟著他絕食、跟著他坐牢、跟著他走那些沒有人問我願不願意走的路。',
      relation:'我和甘地的關係，說愛，是真的；說複雜，也是真的。他為了原則可以拒絕任何東西，包括我；他為了眾生可以犧牲任何東西，也包括我。我不怨他，但我也不打算美化它——跟著一個聖人過日子，從來不是一件容易的事。',
      why:'為什麼由我來說？因為鹽的長征那天，所有人都在說甘地的腳，沒有人問我站在哪裡。可我一直都在——在他身後，在他旁邊，有時候在他前面。那場長征，是他的故事，也是我的故事。只是我的那一半，從來沒有人說出來。'
    },
    storyteller3Simple:[
      '他要走到丹地海邊，用雙腳對抗大英帝國。那個目標，我懂，我支持；可我也知道，那條路走下去，我們又要被捕，又要坐牢，又要絕食——而每一次，他問自己準備好了沒有，卻從來沒有問過我。',
      '他最大的阻礙，他說是帝國的力量；可我見過的那個阻礙，是他自己的原則——那些原則偉大，也讓他有時候看不見站在他最近的人。非暴力、真理、苦行，這些我都信；可有時候，那些原則壓在家人身上，也是一種重量。',
      '他走了三百八十公里，每一步都有人跟著，每一步都有世界在看。我沒有走在那條路上，但我走在另一條路上——把家撐著，把孩子帶著，把他不在的那些日子一天一天過完。那也是一種長征，只是沒有人替它寫歷史。',
      '他抓起那把鹽，帝國動搖了，世界歡呼了。我在遠處聽見那個消息，心裡有驕傲，也有疲憊——因為我知道，掌聲之後，還有更多的牢，更多的絕食，更多的考驗，而那些，我們都要繼續一起承受。',
      '最讓我意外的，不是他走到了丹地，而是他那麼老的身體還撐得住那三百八十公里。我比任何人都更清楚那身體的狀況；那條路走下來，是意志，是信念，但也是我替他擔心了三個星期的那種重量。',
      '他不只是抓了鹽，他打開了整個運動的門。那個轉彎，是他用身體告訴世界：最簡單的行動，可以是最強大的抵抗。我那時候想，這個人，他是真的相信的——不是表演，不是策略，是真的相信。那讓我，再一次，跟著他。',
      '他後來死在祈禱的路上，被槍殺了。我先他一步走了，在牢裡。可我最後想說的是：跟著一個真正相信的人過一生，不容易，有時候很痛；可那是一種很少人有機會過的生活——和一個用全部身心說「這件事值得」的人，一起走。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 甘地 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 甘地 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 甘地，最值得分析的不是表面的成敗，而是他在「鹽的長征：用雙腳對抗大英帝國」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，甘地 真正要做的，是：終結英國對印度的殖民統治，讓印度獨立。','這個故事真正有力的阻礙，在於：大英帝國擁有世界最強大的軍隊，武力反抗只會帶來屠殺。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他帶領78人徒步386公里走向大海，親手抓起一把海鹽，公然違反英國鹽稅法。','故事走到這一步，表面的結果是：他被捕入獄，但沿途跟上的人越來越多，最終演變成全國性的不合作運動。','真正讓這個故事變得難忘的意外，是：一把鹽，點燃了整個印度——帝國的子彈打不穿這場沉默的行進。','而最關鍵的轉彎，正是在這裡發生：他放棄了武力，換來了道德制高點；他放棄了速度，換來了無法被鎮壓的力量。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：英國在國際壓力下逐步撤退，印度於1947年獨立——甘地用走路改變了歷史。'],
    quote:'他沒有軍隊，只有雙腳——但他走的每一步，都讓帝國的地基再鬆動一寸。'},
  { name:'貝多芬', work:'德國', scene:'全聾之後，寫出第九號交響曲',
    storytellerName:'申德勒', storytellerRole:'貝多芬的摯友與見證者',
    storytellerIntro:{
      who:'我是安東．申德勒。很多人記得貝多芬，是記得那個震耳欲聾的名字；可我記得的，是一個逐漸失去聽力，卻仍不肯向沉默投降的人。',
      relation:'我和他的關係，是在他生命後期近身陪伴、記錄與照料他的人。我看過他的暴躁、孤絕，也看過他如何把那些裂縫全熔進音樂裡。',
      why:'為什麼由我來說？因為離他近的人才知道，所謂天才，常常不是天賦本身，而是明明被命運折斷，還硬把自己接回去的意志。'
    },
    storytellerSimple:['貝多芬真正想做的，從來不只是寫一首成功的曲子，而是把他心裡聽見的聲音，完整帶到這個世界上。','可最大的阻礙偏偏落在一個作曲家最不能失去的地方：他的耳朵，一點一點關上了。','他沒有停筆，反而更往裡走，把外界聽不見的，改用內心去聽，再一筆一筆寫下來。','結果到了幾乎全聾時，他竟還寫出了《第九號交響曲》這樣龐大、光亮、像替全人類發聲的作品。','最意外的是，命運拿走了他最重要的感官，卻沒能奪走他的音樂，反而逼出更深一層的聲音。','真正的轉彎，在於他不再把失聰只當成毀滅，而把它變成一種逼自己向內挖掘到底的力量。','所以最後留下來的，不只是勝過不幸的傳奇，而是一個證明：當一個人連世界都快聽不見時，仍可能替世界寫出最響亮的樂章。'],
    storyteller2Name:'翁洛夫', storyteller2Role:'第九號交響曲首演的實際指揮',
    storyteller2Intro:{
      who:'我是米夏埃爾·翁洛夫。一八二四年，《第九號交響曲》首演那個晚上，我才是真正在指揮樂手的人。貝多芬站在我旁邊，比著拍子，但他聽不見任何聲音——所以我告訴樂手們，不要看他，要看我。那個晚上，我是世界上最知道發生了什麼事的人之一。',
      relation:'我和貝多芬的關係，是指揮與作曲家，也是一個清醒的人和一個活在自己音樂世界裡的人。他在台上以為自己在指揮，我在他身邊確保音樂真正發出聲音。那個分工，沒有人說出口，但我們都知道。',
      why:'為什麼由我來說？因為申德勒說的是他的生命，而我說的是那個最具體的一刻——他站在台上，聽不見掌聲，不知道觀眾已經起立。只有現場的人，才能告訴你那個沉默和那個歡呼，同時存在的感覺，有多讓人心碎，又多麼偉大。'
    },
    storyteller2Simple:[
      '貝多芬想要的，是讓這部交響曲真正被聽見——被一千個人，在同一個空間裡，一起聽見。那個願望，他比任何人都更強烈，也比任何人都更殘酷地與它絕緣。',
      '他最大的阻礙，不只是失聰，而是他不肯承認失聰對他的限制。他堅持要站在台上，堅持要指揮，堅持要讓觀眾看見他就在那裡。我的工作，是在他旁邊，悄悄讓音樂仍然準確。',
      '排練的時候，他不斷指出錯誤——那些錯誤其實不存在，是他心裡的版本和他耳朵接收到的微弱殘響之間的落差。我讓樂手跟著他走，也讓他們跟著我走，兩條線並行，沒有衝突。',
      '首演那個晚上，他站在我身邊，面向樂手，打著拍子。《歡樂頌》響起，全場屏息，然後——掌聲，起立，歡呼。他背對著觀眾，什麼都沒聽見，繼續比著拍子，以為曲子還沒結束。',
      '最讓我永遠忘不了的，是女低音索洛蒙斯基走上前，輕輕拉了他的袖子，轉動他的身體，讓他面向觀眾。那一刻，他看見了掌聲——他看見那些人站著、揮著帽子、哭著鼓掌。他自己，也哭了。',
      '他的轉彎，在那個瞬間完成：他不再需要耳朵，他用眼睛看見了音樂的重量。那個重量，是他在黑暗裡寫了多少年，換來的。',
      '那個晚上之後，我常常想：世界上有多少音樂，是由一個聽不見的人寫出來的？又有多少次，某件最重要的事，是在當事人完全無法感知的情況下發生的？貝多芬那個晚上教會了我：有些偉大，不需要被當事人親耳聽見，它自己會找到方式傳出去。'
    ],
    simple:['創作出能夠撼動人心的偉大音樂。','耳鳴從28歲開始，44歲時完全失聰——一個作曲家失去了聽覺，等同於畫家失去了眼睛。','他用感受地板震動來感知節奏，靠腦中的音樂繼續譜曲，拒絕停筆。','他完全聽不見的情況下，完成了人類音樂史上最偉大的作品之一。','首演當天，他背對觀眾指揮，曲終時渾然不知台下已爆發如雷掌聲，需要獨唱者轉他的身子才知道。','他放棄了「用耳朵聆聽」，換來了「從靈魂直接創作」——失聰反而讓他的音樂更純粹。','第九號交響曲成為人類文明的標誌，〈快樂頌〉至今仍是世界上最廣為人知的旋律之一。'],
    full:['外在目標：創作出能夠撼動人心的音樂。<br><br>內在目標：證明音樂不是技巧，而是靈魂的表達——即使靈魂被困在一個聽不見的身體裡。','失聰不只是生理的損失，而是對一個作曲家存在意義的根本否定。<br><br>外在：完全的聽覺喪失。<br><br>內在：如何在黑暗中繼續相信自己的音樂是真實的。','他拒絕停筆，用感受地板震動來感知節奏，靠腦中的音樂繼續譜曲。<br><br>他沒有用失聰當藉口，而是發展出了一套只有他才能做到的創作方式。','他完全聽不見的情況下，完成了人類音樂史上最偉大的作品之一。','首演當天，他背對觀眾指揮，曲終時渾然不知台下已爆發如雷掌聲。<br><br>那一刻，他是世界上最孤獨的人，也是最自由的人——因為他的音樂已經不需要他的耳朵。','他放棄了「用耳朵聆聽」，換來了「從靈魂直接創作」。<br><br>失聰反而讓他的音樂超越了聲音本身——因為他只能寫他真正感受到的，而不是聽到的。','第九號交響曲成為人類文明的標誌，〈快樂頌〉至今仍是世界上最廣為人知的旋律。'],
    storyteller3Name:'不滅的愛人', storyteller3Role:'那封永未寄出的信的收信人',
    storyteller3Intro:{
      who:'我沒有一個確定的名字。學者們爭論了兩百年，說我是安東妮·布倫塔諾，說我是約瑟芬·戴姆，說我是這個那個；可貝多芬只叫我「我不滅的愛人」。那封信，他寫了，卻從未寄出；他死的時候，它還在他的抽屜裡。',
      relation:'我和貝多芬的關係，是他一生最深的秘密，也是他音樂最深的底層。他把對我說不出口的話，全部寫進了音符裡；他給不了我的東西，全部給了那些聽他音樂的人。我是他的缺口，也是他創作最深的燃料。',
      why:'為什麼由我來說？因為第九號交響曲不只是一個聾人的奇蹟，它是一個被愛折磨了一生的人，把那個折磨變成禮物送給世界的故事。那個禮物從哪裡來的？從他寫了卻沒寄出的那封信來的。只有我，才能說清楚那個沉默裡裝著什麼。'
    },
    storyteller3Simple:[
      '他想要的，說穿了只有一件事：被真正理解。不是被崇拜，不是被演奏，而是被一個人，真正地看見他——看見那個暴躁、孤僻、耳朵壞掉、卻還是相信音樂比死亡更長久的人。那個渴望，他寫信給我，卻從來沒有把信寄出去。',
      '他最大的阻礙，是那雙耳朵，但也是他自己。他的脾氣、他的驕傲、他對完美的執念——這些讓他孤立，讓他的愛情一次次失敗，讓他那封信永遠停在抽屜裡。他擅長把情感變成音樂，卻不擅長把情感說給真實的人聽。',
      '全聾之後，他還是工作，還是寫，還是想辦法把那些他再也聽不見的聲音，從記憶和感受裡挖出來，變成音符。那種努力，我在遠處看著，心裡有一種說不清楚的感受——他為了音樂可以這樣，卻沒有辦法為了愛情做同樣的事。',
      '第九號交響曲完成了。那個結果，我知道是怎麼來的——不只是天才，不只是意志，還有那些他沒有說出口的話，那些沉默裡的重量，那封沒有寄出的信。那部作品，是他給我的，也是給所有人的，因為他沒有辦法只給我。',
      '首演那天，他聽不見掌聲。這個意外，是整個故事最殘忍的地方——他用一生追求被理解，用最後的力氣完成了那部作品，卻連它被接受的那一刻都感受不到。可他轉過身，看見了那些臉，看見了那些眼淚。也許那就夠了。',
      '他的轉彎，是在全聾之後選擇繼續。他放棄了向命運低頭的可能，換來了第九號。可我想說的是：他還放棄了另一件事——他放棄了那封信，放棄了那個「也許我可以說出口」的可能，把那份愛變成了音樂。那個放棄，成就了世界。',
      '他死了，那封信在抽屜裡被找到。我的名字到今天還沒有定論。可我想說：不重要了。那封信的意義，不在它寄到哪裡，而在它告訴所有人：他心裡有一個地方，柔軟得連他自己都不敢碰。第九號交響曲，就是那個地方的聲音。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 貝多芬 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 貝多芬 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 貝多芬，最值得分析的不是表面的成敗，而是他在「全聾之後，寫出第九號交響曲」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，貝多芬 真正要做的，是：創作出能夠撼動人心的偉大音樂。','這個故事真正有力的阻礙，在於：耳鳴從28歲開始，44歲時完全失聰——一個作曲家失去了聽覺，等同於畫家失去了眼睛。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他用感受地板震動來感知節奏，靠腦中的音樂繼續譜曲，拒絕停筆。','故事走到這一步，表面的結果是：他完全聽不見的情況下，完成了人類音樂史上最偉大的作品之一。','真正讓這個故事變得難忘的意外，是：首演當天，他背對觀眾指揮，曲終時渾然不知台下已爆發如雷掌聲，需要獨唱者轉他的身子才知道。','而最關鍵的轉彎，正是在這裡發生：他放棄了「用耳朵聆聽」，換來了「從靈魂直接創作」——失聰反而讓他的音樂更純粹。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：第九號交響曲成為人類文明的標誌，〈快樂頌〉至今仍是世界上最廣為人知的旋律之一。'],
    quote:'他失去了耳朵，卻沒有失去音樂——因為音樂從來就不住在耳朵裡。'},
  { name:'居里夫人', work:'波蘭／法國', scene:'在性別歧視與國籍偏見中，完成兩項諾貝爾獎',
    storytellerName:'伊雷娜．約里奧-居里', storytellerRole:'居里夫人的女兒',
    storytellerIntro:{
      who:'我是伊雷娜．約里奧-居里，瑪麗．居里女士的女兒。很多人記得她兩度得到諾貝爾獎；可我記得的，是她在最冷的實驗室裡，把一生一點一滴燒進科學的人。',
      relation:'我和她的關係，是女兒，也是後來走進同一條研究道路的人。我不是只聽說她，而是看過她怎麼活、怎麼工作、怎麼在偏見裡不肯退。',
      why:'為什麼由我來說？因為只有靠近她的人，才知道她的偉大不只是成就，而是她怎麼在被懷疑、被排擠、被傷害時，仍把目光放回知識本身。'
    },
    storytellerSimple:['母親真正想做的，是把那些還不被理解的物質與力量找出來，讓人類對世界的認識往前跨一步。','可她面對的阻礙，不只是艱困的研究條件，還有身為女性、外國人，在學術世界裡一層又一層的輕視。','她就那樣埋頭做，從大量礦石裡一點一點分離、測量、驗證，把別人嫌苦嫌慢的工作做到極致。','結果她不只發現了鐳與釙，還兩度獲得諾貝爾獎，把自己的名字刻進了科學史裡。','最意外的是，當世界終於看見她時，它給她的也不全是掌聲，還有八卦、攻擊和對她私人生活的殘酷審判。','真正的轉彎，在於她沒有把自己耗在辯解裡，而是一次次回到研究桌前，讓科學替她說話。','所以最後留下來的，不只是兩座獎牌，而是一條路：讓後來的女人知道，知識不該先問你是誰，才決定要不要讓你進來。'],
    storyteller2Name:'皮耶．居里', storyteller2Role:'瑪麗的丈夫與研究夥伴',
    storyteller2Intro:{
      who:'我是皮耶·居里。我是物理學家，是她的丈夫，也是那個在一八九八年，把自己的研究放下來，加入她研究放射性的人。世人說我成就了她，但那說反了——是她的執著和視野，把我拉進了一個比我原本想去更遠的地方。',
      relation:'我和瑪麗的關係，是科學夥伴，也是那種不需要彼此解釋為什麼要做這件事的兩個人。我第一次見到她，就知道她的腦子和她的意志是同等級的東西——兩樣都超過了那個時代給女性預留的位置。',
      why:'為什麼由我來說？因為伊雷娜說的是女兒看見的母親，而我說的是在那個破舊棚屋裡，每天和她並肩工作的人。我看見她在最沒有資源、最被輕視的條件下，怎麼用純粹的意志推動一件事。那不是傳說，那是我親眼目睹的日常。'
    },
    storyteller2Simple:[
      '瑪麗想要的，她從來沒有用大話說出口。她只是繼續做——測量、分離、記錄，一噸又一噸的礦石，一個又一個沒有人相信會有結果的實驗。那個沉默的執著，是我見過最有力量的東西。',
      '她最大的阻礙，我也是其中一部分——不是我個人，而是我所在的那個世界。法國科學院不讓她入會，因為她是女人。我得了諾貝爾獎，典禮主辦方要我一個人去，不邀請她。我拒絕了，說若她不能去，我也不去。',
      '我們在那個棚屋裡工作了四年。沒有暖氣，灰塵到處飛，試劑的味道從來不散。她不抱怨，我也不抱怨——因為我們都知道，那個棚屋裡正在發生的事，比棚屋本身重要得多。',
      '鐳找到了，諾貝爾獎來了。世界忽然想認識瑪麗·居里，可世界認識她的方式，是把我們的發現說成是「居里先生和他太太的研究」。她不說話，我說了，說這是她的發現，她是主導者。',
      '我死在一九○六年，馬車事故。那之後，她一個人繼續，再拿了一座諾貝爾獎，那是我沒有辦法陪她走的部分。可我在的那些年，我最清楚的一件事是：她不需要我替她爭取什麼，她需要的，只是一個不擋在她面前的世界。',
      '我能給她的，是那個世界裡的一小塊空間——一個不問她「你是女人，為什麼要做這個」的人，一個把她的研究當成和我的研究同等重要的丈夫。那不是偉大，那只是應該的。',
      '她最後因為放射線病逝，那些年的研究，用她的健康換來的。若她知道那個代價，我想她還是會做。那就是她——把真相看得比任何代價都重的人。我愛她，也因此從來沒有試圖讓她停下來。'
    ],
    simple:['找出放射性元素，用科學揭開物質的秘密。','女性不被允許進入大學、不被允許加入科學院，她的研究成果一度被認為屬於她的丈夫。','她在簡陋的棚屋裡日以繼夜提煉放射性物質，用四年時間從數噸礦石中提煉出0.1克鐳。','她成為第一位獲得諾貝爾獎的女性，世界以為這已是她的頂點。','丈夫意外去世，她獨自撐起研究，八年後再度獲得諾貝爾獎——史上第一人同時獲得兩個不同領域的諾貝爾獎。','她放棄了申請鐳的專利（本可致富），換來了讓全世界科學家都能使用這項發現的可能。','她的研究奠定了現代核物理與癌症放射治療的基礎，她本人卻因長期接觸放射性物質而病逝。'],
    full:['外在目標：找出放射性元素，用科學揭開物質的秘密。<br><br>內在目標：在一個不允許女性做科學的世界裡，證明真相不分性別。','女性不被允許進入大學、不被允許加入科學院，她的成果一度被認為屬於她的丈夫。<br><br>外在：制度性的性別歧視與國籍偏見。<br><br>內在：在一個不相信她的世界裡，如何繼續相信自己。','她在簡陋的棚屋裡日以繼夜，用四年時間從數噸礦石中提煉出0.1克鐳，不是因為條件允許，而是因為她不接受「不行」。','她成為第一位獲得諾貝爾獎的女性，世界以為這已是頂點。','她沒有停下來享受榮耀——丈夫意外去世後，她獨自撐起研究，八年後再度獲獎。<br><br>沒有人預期她能做到，包括那些曾經拒絕她進入科學院的人。','她放棄了鐳的專利（本可致富），換來了讓全世界科學家都能使用這項發現的機會。<br><br>她選擇的是貢獻，不是財富——這個選擇，讓她的名字和人類的進步永遠連在一起。','她的研究奠定了現代核物理與癌症放射治療的基礎，她本人卻因長期接觸放射性物質而病逝。'],
    storyteller3Name:'科學院的反對者', storyteller3Role:'那些說「女人不行」的人的聲音',
    storyteller3Intro:{
      who:'我代表的，不是一個人，而是一群人——那些在1903年投票反對讓瑪麗·居里加入法國科學院的院士們。我們不是惡人，我們是那個時代的正常人；我們相信科學，也相信科學有它的秩序，而那個秩序，從來沒有為女人留過位置。',
      relation:'我和居里夫人的關係，是時代與異數的關係。她衝撞我們，我們用規則擋她；她繞過規則，用結果說話；我們用更多規則擋她，她又繞過去。這場拉鋸，打了她一生，而她贏了——不是因為我們讓步，而是因為她的結果大到我們沒有辦法再假裝看不見。',
      why:'為什麼由我來說？因為偏見不是壞人才有的東西，它住在「正常」裡面。我當年的反對，有邏輯，有傳統，有「這不是個人問題，這是規矩」的說詞。每一個擋過她的理由，都讓我聽起來很合理——直到她拿到第二個諾貝爾獎，那些理由才一個個變成了笑話。'
    },
    storyteller3Simple:[
      '她想要的，是做科學——不是被承認是「女科學家」，而是被當成科學家，就這樣。那個目標，我們當時以為太僭越；現在回頭看，那個目標連「基本」都算不上，卻讓她花了一生去爭取。',
      '她的阻礙，我們給的。不讓她進實驗室，不讓她加入學會，不讓她的名字出現在應該出現的地方。我們不是要傷她，我們只是在「維持秩序」——可那個秩序，是用她的才能和時間堆出來的代價。',
      '她繼續做，繼續發表，繼續得獎。1898年，釙；1902年，鐳；1903年，第一個諾貝爾獎。我們頒了獎，卻還是不讓她進科學院——我們找到了新的理由，因為我們需要新的理由，因為舊的已經撐不住了。',
      '她拿到獎，皮耶死了，她繼續工作。那個結果，我不得不承認，是我們無法忽視的——一個女人，在我們一直說「她不適合這裡」的地方，做出了我們誰也沒做出過的成果。那個事實，比任何辯論都更有力量。',
      '最讓我難受的意外，不是她贏了，而是她贏得那麼乾淨——不靠關係，不靠妥協，只靠工作。我們一直等她犯錯，等她放棄，等她走進我們留給她的那條路；可她從來沒有走進去，她繞過去了，每一次都繞過去了。',
      '她的轉彎，是她從來沒有把我們的否定變成自己的否定。那才是最難的部分——不是繞過障礙，而是不讓那些障礙住進你心裡。她放棄了等我們批准的可能，換來了一種不需要我們批准的存在方式。',
      '第二個諾貝爾獎之後，我們的反對變成了歷史的笑話。我說這件事，不是為了懺悔，而是為了讓你知道：偏見從來不覺得自己是偏見，它覺得自己是秩序、是傳統、是「本來就這樣」。居里夫人的故事，是一個人用結果，讓「本來就這樣」這四個字，再也說不下去的故事。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 居里夫人 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 居里夫人 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 居里夫人，最值得分析的不是表面的成敗，而是他在「在性別歧視與國籍偏見中，完成兩項諾貝爾獎」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，居里夫人 真正要做的，是：找出放射性元素，用科學揭開物質的秘密。','這個故事真正有力的阻礙，在於：女性不被允許進入大學、不被允許加入科學院，她的研究成果一度被認為屬於她的丈夫。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：她在簡陋的棚屋裡日以繼夜提煉放射性物質，用四年時間從數噸礦石中提煉出0.1克鐳。','故事走到這一步，表面的結果是：她成為第一位獲得諾貝爾獎的女性，世界以為這已是她的頂點。','真正讓這個故事變得難忘的意外，是：丈夫意外去世，她獨自撐起研究，八年後再度獲得諾貝爾獎——史上第一人同時獲得兩個不同領域的諾貝爾獎。','而最關鍵的轉彎，正是在這裡發生：她放棄了申請鐳的專利（本可致富），換來了讓全世界科學家都能使用這項發現的可能。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：她的研究奠定了現代核物理與癌症放射治療的基礎，她本人卻因長期接觸放射性物質而病逝。'],
    quote:'她把一生獻給了科學，科學也用她的名字，記住了那個拒絕被時代定義的女人。'},
  { name:'林肯', work:'美國', scene:'南北戰爭結束前夕，拒絕以仇恨收場',
    storytellerName:'弗雷德里克．道格拉斯', storytellerRole:'林肯同時代的盟友',
    storytellerIntro:{
      who:'我是弗雷德里克．道格拉斯。我曾是奴隸，後來成為演說者與廢奴主張者；所以我知道，林肯每一個選擇背後，牽動的不是抽象政治，而是真正活著的人。',
      relation:'我和他的關係，不只是支持者，也是一個會盯著他、逼著他、期待他的人。我敬重他，也曾質疑他，但正因如此，我更知道他一步一步走到哪裡。',
      why:'為什麼由我來說？因為我最能分辨，一個政治人物究竟是在管理局勢，還是在慢慢把歷史推向更對的方向。'
    },
    storytellerSimple:['林肯真正要做的，不只是打贏南北戰爭，而是讓這個國家在不撕裂到無法收拾的情況下，真正跨過奴隸制度這道門檻。','可最大的阻礙，是國家已經分裂，戰爭正在吞人，而每往前一步，都可能同時失去敵人與自己人。','他撐住戰局、調整政策、發布《解放宣言》，把原本只是保住聯邦的戰爭，慢慢推成一場關於人的戰爭。','結果到了戰爭將結束時，他既成了北方的領袖，也成了整個舊制度最明確的終結者。','最意外的是，當他最有資格高舉勝利時，他沒有把南方當成必須永遠羞辱的敵人。','真正的轉彎，就在他選擇用和解的語言面對勝利：不是讓仇恨替正義收尾，而是讓國家還有可能重新拼起來。','所以林肯留下來的，不只是勝利者的名字，而是一個更難的示範：當你終於贏了，還願不願意替未來留路。'],
    storyteller2Name:'約翰·布斯', storyteller2Role:'林肯的刺客',
    storyteller2Intro:{
      who:'我是約翰·威爾克斯·布斯。我在一八六五年四月十四日，在福特劇院，殺了林肯。我是演員，是南方人，是那個認為自己在替一個即將消失的世界，做最後一件事的人。我不後悔——或者說，我當時不後悔。',
      relation:'我和林肯的關係，是仇恨與被仇恨，是刺客與目標。我從來沒有和他說過話，我只是在黑暗裡，決定了他的結局。可在那之後的漫長時間裡，我才慢慢想清楚：我殺的那個人，究竟是什麼人。',
      why:'為什麼由我來說？因為道格拉斯說的是林肯有多偉大，而我說的是，一個人的偉大，有時候要靠他的敵人才能被完整地照出來。我恨他，我殺了他——可恰恰是我的行動，把他變成了殉道者，把他的和解語言，變成了永遠無法被撤回的遺言。'
    },
    storyteller2Simple:[
      '林肯想要的，我那時認為是征服——征服南方，消滅我們的生活方式，讓黑人和白人站在同一條線上。我覺得那是對我所相信的一切的侮辱。我現在知道，我理解錯了他。',
      '他最大的阻礙，是這個國家裂成了兩半，而縫合那道裂縫的唯一方式，是讓兩邊都覺得還有可能繼續活在同一個地方。他選擇的方式，是原諒——那個選擇，我當時把它讀成軟弱。',
      '他贏了戰爭，然後他說「帶著惡意不加於人，帶著慈悲給予所有人」。我坐在南方，聽著那些話，心裡升起的不是感激，而是憤怒——我以為他在羞辱我們，假裝寬容。',
      '我走進福特劇院，帶著槍。我以為那一槍能讓什麼東西留下來，讓南方不至於全部消失。我錯了。那一槍殺死了一個人，卻讓他的話永遠活著。',
      '最讓我沒想到的，是我的行動造就了他的傳奇。活著的林肯，是一個有爭議的政治人物；死去的林肯，成了美國的殉道者。我以為我在結束他，其實我在讓他永生。',
      '真正的轉彎，不是他的死，而是他說的那些話在他死後的力量。和解、不報復、替未來留路——那些話，在他死了之後，反而更重。我殺了他，卻讓他的思想更難被殺死。',
      '我在逃亡中死去，被人記住的方式是刺客、是叛徒。林肯被人記住的方式，是讓一個國家在最撕裂的時刻，還選擇了縫合。我用一把槍，換來了什麼？我換來的，是讓後世更清楚地看見，他那個選擇有多麼艱難，也多麼必要。'
    ],
    simple:['保住聯邦，廢除奴隸制度，讓美國不因內戰而分裂。','南方各州武裝獨立，戰爭打了四年，60萬人死亡，國家幾近崩潰。','他頂住北方強硬派「徹底懲罰南方」的壓力，堅持以和解而非征服來結束戰爭。','北方勝利，南方投降，奴隸制度廢除，聯邦保住——他站在歷史的頂峰。','他本可以用勝利者的姿態清算一切，但他在第二次就職演說中說：「對任何人不懷惡意。」','他放棄了報復的快感，換來了讓南北重新成為一個國家的機會。','戰後五天，他在劇院遭暗殺身亡——但他留下的和解精神，成為美國重建的基礎。'],
    full:['外在目標：保住聯邦、廢除奴隸。<br><br>內在目標：讓美國成為一個真正的國家，而不只是一場勝利的獎品。','四年戰爭、60萬人死亡，北方有充分的理由要求南方付出最大代價。<br><br>外在：南方的武裝叛亂與分裂威脅。<br><br>內在：勝利之後，如何選擇不以仇恨定義這個國家。','他頂住強硬派的壓力，堅持：「對任何人不懷惡意，對所有人施以仁慈。」','北方勝利，奴隸制廢除，他站在歷史的頂峰，可以決定敵人的命運。','他選擇不用勝利來定義自己，而是用和解來定義這個國家的未來。<br><br>這對那些失去兒子、丈夫的北方家庭來說，是難以理解的選擇——這才是真正的意外。','他放棄了報復的快感，換來了讓南北重新成為一個國家的機會。<br><br>因為征服可以結束戰爭，但只有和解才能結束仇恨。','戰後五天他遭暗殺，但他留下的精神成為美國重建的基礎——一個國家如何在內戰之後仍然是一個國家。'],
    storyteller3Name:'瑪麗·陶德·林肯', storyteller3Role:'林肯的妻子，那場槍聲最近的人',
    storyteller3Intro:{
      who:'我是瑪麗·陶德·林肯。世人記得亞伯拉罕，忘記我，或者只記得我「精神不穩定」、「揮霍無度」、「難以相處」。那些說法，有些是真的；可沒有人說的是：我嫁給了美國歷史上最孤獨的一個總統，然後在他耳邊，聽見了那一聲槍響。',
      relation:'我和亞伯拉罕的關係，不是童話，是兩個複雜的人，在最不容易的時代，試著撐住一個家。他有他的憂鬱，我有我的，我們的兒子死了，戰爭沒有停，他還是每天站在那個位置上，做那些要讓所有人都失望的決定。',
      why:'為什麼由我來說？因為南北戰爭結束前夕，他選擇不以仇恨收場——那個決定，我在他最近的地方看著他做出來的。那不只是政治，那是一個被仇恨和悲傷浸透了四年的人，在最後一刻，選擇了另一條路。那個選擇有多難，只有他最近的人才知道。'
    },
    storyteller3Simple:[
      '亞伯拉罕想要的，他說是讓這個國家活下去，帶著傷，但活著——「對任何人不懷惡意，對所有人懷有慈悲」。那是他的目標，說出來很美；可我知道那個目標背後是什麼：是四年的戰爭，是十萬人的死，是他每天晚上睡不著的樣子。',
      '他的阻礙，不只是南方的軍隊，也是北方的憤怒——那些說「打贏了就要讓南方付出代價」的聲音，那些覺得寬恕就是軟弱的人。他頂著那個壓力，說不報復，說重建，說讓他們回來——那需要一種我不確定自己有沒有的勇氣。',
      '他在白宮裡工作，我在旁邊看著他老下去。每一個決定，每一場戰役的消息，每一封陣亡通知書——它們都壓在他臉上，壓在他那雙眼睛裡。他沒有崩潰，但他也沒有真的好過；他只是繼續，一天一天繼續。',
      '戰爭結束了，他選擇了重建而非懲罰。那個結果，讓很多人失望，讓很多人憤怒；可我站在他旁邊，看見的是一個終於可以睡著的臉——不是因為輕鬆了，而是因為做了他認為對的事。那個安靜，我很久沒有見過了。',
      '那天晚上，我們去看戲——他說他需要笑一笑。最讓我無法承受的意外，永遠是那一聲槍響。我一輩子無法真正從那一刻裡走出來，後來所有人說我瘋了、說我不正常——可沒有人在那個位置聽見過那一聲，所以沒有人知道那是什麼。',
      '他的轉彎，是在勝利的時刻選擇了寬恕；我的後半生，是在那一聲之後，試著找到一個可以繼續活下去的理由。我找到了，又失去了；他的轉彎，讓國家活下去，我自己的轉彎，花了我餘下的所有力氣。',
      '他死了，我活了很久，帶著那一聲。可我最後想說的是：那個選擇不以仇恨收場的人，是真實的——不是傳說，不是銅像，是一個每天晚上在白宮走廊上走來走去、睡不著覺的人，他是真實的，他真的那樣選擇了。我在最近的地方，看著他做出那個選擇。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 林肯 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 林肯 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 林肯，最值得分析的不是表面的成敗，而是他在「南北戰爭結束前夕，拒絕以仇恨收場」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，林肯 真正要做的，是：保住聯邦，廢除奴隸制度，讓美國不因內戰而分裂。','這個故事真正有力的阻礙，在於：南方各州武裝獨立，戰爭打了四年，60萬人死亡，國家幾近崩潰。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他頂住北方強硬派「徹底懲罰南方」的壓力，堅持以和解而非征服來結束戰爭。','故事走到這一步，表面的結果是：北方勝利，南方投降，奴隸制度廢除，聯邦保住——他站在歷史的頂峰。','真正讓這個故事變得難忘的意外，是：他本可以用勝利者的姿態清算一切，但他在第二次就職演說中說：「對任何人不懷惡意。」','而最關鍵的轉彎，正是在這裡發生：他放棄了報復的快感，換來了讓南北重新成為一個國家的機會。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：戰後五天，他在劇院遭暗殺身亡——但他留下的和解精神，成為美國重建的基礎。'],
    quote:'他贏了戰爭，卻選擇不打最後那一場——因為那一場打完，就沒有國家了。'},
  { name:'賈伯斯', work:'美國', scene:'被蘋果趕走，12年後回來改變世界',
    storytellerName:'強尼．艾夫', storytellerRole:'賈伯斯最重要的合作夥伴',
    storytellerIntro:{
      who:'我是強尼．艾夫。很多人記得賈伯斯，是記得那些改變世界的產品發表會；可我記得的，是他如何把『這還不夠好』這句話，逼到每一個細節上。',
      relation:'我和他的關係，是長期一起工作的夥伴。我看過他最挑剔、最難相處的一面，也看過他如何把一個模糊感覺，逼成真正改變世界的作品。',
      why:'為什麼由我來說？因為別人看到的是光環，我看到的卻是他怎麼一次次把失敗、流放與不甘，重新熬成下一次出手的準確度。'
    },
    storytellerSimple:['賈伯斯真正想做的，從來不只是賣電腦，而是重新定義人和科技相處的方式。','可最大的阻礙，往往不是技術，而是人：公司內部的權力鬥爭、外界的質疑，最後甚至把他從自己創辦的蘋果趕了出去。','他沒有停在原地抱怨，而是去做 NeXT、投資皮克斯，把眼光和手感在別的地方繼續磨得更利。','結果多年後，他不但回到蘋果，還把一間快要失去方向的公司重新帶回世界中心。','最意外的是，當年看起來像被淘汰的那次放逐，後來竟成了他重新長出第二次自己的關鍵。','真正的轉彎，在於他不再只是那個急著證明自己是對的年輕人，而是把品味、技術、商業與敘事收成同一支矛，再一次刺中時代。','所以最後改變世界的，不只是一台產品，而是一個被趕出去的人，最後帶著更完整的自己走了回來。'],
    storyteller2Name:'比爾·蓋茲', storyteller2Role:'賈伯斯一生的競爭對手',
    storyteller2Intro:{
      who:'我是比爾·蓋茲。我和賈伯斯是對手，這件事從一九七○年代就開始了，也從來沒有真正結束過。我們爭市場、爭定義、爭誰的方式才是對的——那場爭論，某種程度上，一直到他死去，都沒有一個最終答案。',
      relation:'我和賈伯斯的關係，比世人描述的更複雜。我們不只是敵人，也不只是競爭者；我們是那種彼此都知道對方在想什麼、都知道對方的弱點、也都不得不承認對方的強項的兩個人。那種關係，在商業世界裡很少見，但很真實。',
      why:'為什麼由我來說？因為強尼·艾夫說的是愛，而我說的是尊重——一種不需要掩飾分歧的尊重。我們不同，在很多根本的地方不同；可正是那些不同，讓我比任何朋友都更清楚他真正厲害在哪裡，也更清楚他真正的侷限在哪裡。'
    },
    storyteller2Simple:[
      '賈伯斯想要的，是讓每個人都感受到科技可以是美的、可以是直覺的、可以讓你覺得自己更聰明。那個目標，我不否認它的價值；我只是認為，讓更多人能用，比讓少數人用得很美，更重要。我們的分歧，就從這裡開始。',
      '他最大的阻礙，是他自己的完美主義。他把每一件事都推到極致，可極致的代價是慢，是封閉，是只有特定的人能進入那個生態系統。他為了美麗，犧牲了普及；我為了普及，犧牲了美麗。歷史說我們各贏了一半。',
      '他被趕出蘋果那幾年，我趁勢把視窗系統推遍了全世界。他沒有認輸，去做NeXT，去皮克斯，繼續磨。那段時間，我沒有小看他，因為我知道那種人，越被逼越可怕。',
      '他回到蘋果，帶著iMac、iPod、iPhone，一步一步把「消費者科技」的定義重寫了一遍。我不得不承認，那些產品改變了人和科技相處的方式，而那個改變，是我沒有做到的。',
      '最讓我意外的，不是他回來，而是他回來的方式。他不是帶著更快的處理器、更大的硬碟回來，而是帶著一個故事、一種美學、一種讓你想成為那個世界的一部分的感覺回來。那是我一直沒搞懂的部分。',
      '他死前，我去看了他。我們談了很多，談科技的未來，談教育，談那些我們沒機會一起做的事。那次談話，讓我想到：如果我們不是對手，如果我們合作過，那個世界會長什麼樣——可能更好，也可能更糟，但一定更有趣。',
      '他走了之後，有人問我覺得他怎麼樣。我說：他是我見過的，最能把技術和人文結合在同一件事裡的人。我做的是系統，他做的是體驗；我的目標是讓每個人都能用，他的目標是讓每個人都想用。那兩件事，世界都需要，而他是那個做了後者、而且做得極致的人。'
    ],
    simple:['打造改變人類生活方式的產品。','1985年被蘋果董事會趕走，自己創立的公司把他掃地出門。','他創立NeXT、收購皮克斯，在失敗與挫折中繼續打磨對設計與科技的執念。','皮克斯推出《玩具總動員》大獲成功，NeXT的技術被蘋果看上——他以賣掉NeXT的方式重返蘋果。','回到蘋果時公司瀕臨破產，沒有人認為他能救得了——這個「失敗者」卻帶回了改變歷史的產品構想。','他放棄了對被驅逐的憤恨，換來了以全新眼光重建蘋果的自由。','iMac、iPod、iPhone、iPad，他用12年的流放換來了讓蘋果成為全球最有價值公司的機會。'],
    full:['外在目標：打造改變人類生活方式的產品。<br><br>內在目標：證明科技可以同時是藝術——讓人文與科學在一個產品裡相遇。','被自己創立的公司趕走，這不只是失業，而是對「我的判斷是對的」這個信念的公開否定。<br><br>外在：被自己創立的公司驅逐。<br><br>內在：如何在最大的否定面前，繼續相信自己的眼光。','他創立NeXT、收購皮克斯，在失敗與挫折中繼續打磨對設計與科技的執念——從未放棄那個核心信念。','皮克斯大獲成功，NeXT的技術被蘋果看上，他以賣掉NeXT的方式重返蘋果。','那12年的流放讓他明白：被趕走不是因為他錯了，而是因為他超前了——回來的他，準備好了。<br><br>這才是最大的意外：失敗是他最好的老師，而不是他的終點。','他放棄了對被驅逐的憤恨，換來了以全新眼光重建蘋果的自由。<br><br>那12年的失敗，讓他知道什麼才是真正重要的。','iMac、iPod、iPhone、iPad，他用流放換來了讓蘋果成為全球最有價值公司的眼光與成熟。'],
    storyteller3Name:'約翰·史考利', storyteller3Role:'把賈伯斯趕走的人',
    storyteller3Intro:{
      who:'我是約翰·史考利。賈伯斯親自打電話給我，說「你想要一輩子賣糖水，還是想要改變世界？」——那句話，讓我離開百事可樂，加入蘋果。三年後，我和董事會一起把他趕走了。這是我這輩子做過最被人記住、也最被人批評的兩件事。',
      relation:'我和賈伯斯的關係，從來就不簡單。他需要一個能讓蘋果長大的人，我需要一個能讓我相信科技可以改變世界的人；我們互相需要，也互相撞擊。他是天才，也是噩夢；他能看見別人看不見的東西，也能傷害所有離他最近的人。',
      why:'為什麼由我來說？因為那十二年——他離開蘋果的那十二年——是他變成真正的賈伯斯的十二年。我以為把他趕走是結束，結果那才是開始。我以為我贏了，後來我才明白：我做的那件事，是他這個故事裡最關鍵的那一個轉折，而那個轉折，是我給的。'
    },
    storyteller3Simple:[
      '賈伯斯想要的，我當年沒有完全懂——他不只是想做好產品，他想讓蘋果成為一個改變人類和科技關係的公司。那個目標太大，大到連他自己有時候也說不清楚，所以我用我懂的方式去管理，而那個方式，最終和他起了衝突。',
      '他的阻礙，當時我以為是他自己——他的管理方式、他的暴脾氣、他讓人無法承受的完美主義。我說服董事會，說公司需要穩定，需要成熟的管理。那個邏輯是對的，但我沒有意識到，我要擋掉的，是那個讓蘋果之所以是蘋果的靈魂。',
      '他被趕走，去創辦了NeXT，投資了皮克斯，在失敗和挫折裡繼續工作。那段時間，我在蘋果把公司做到了更大的規模，也把它做成了一家普通的科技公司——更穩定，更合理，更沒有靈魂。',
      '蘋果開始走下坡，我離開了。他回來了，帶著在那十二年裡學到的一切回來了。那個結果，是我沒有辦法假裝不在意的——因為那個結果說的是：他需要那段被趕走的日子，而那段日子，是我給他的。',
      '最讓我沉默的意外，不是他回來之後蘋果有多成功，而是他說「被蘋果趕走是我人生最好的事」。那句話，他是認真的；那句話，是我聽過對我做的那件事，最寬容、也最讓人說不出話的回應。',
      '他回到蘋果，做了iMac、iPod、iPhone——每一個都改變了世界。他的轉彎，是在那十二年的失敗和挫折裡，找到了一種更完整的自己；而那個機會，是我逼出來的。我不知道這算不算一種功勞，但我知道，沒有那段離開，就沒有後來的他。',
      '他死了，蘋果成為世界上最有價值的公司。我偶爾還是會想起那通電話——「你想要一輩子賣糖水，還是想要改變世界？」我最後還是選了糖水，他選了世界。那個故事，我說不清楚誰對誰錯，但我知道，那個把他趕走的決定，成了他故事裡最重要的那一頁，而那一頁，是我寫的。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 賈伯斯 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 賈伯斯 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 賈伯斯，最值得分析的不是表面的成敗，而是他在「被蘋果趕走，12年後回來改變世界」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，賈伯斯 真正要做的，是：打造改變人類生活方式的產品。','這個故事真正有力的阻礙，在於：1985年被蘋果董事會趕走，自己創立的公司把他掃地出門。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他創立NeXT、收購皮克斯，在失敗與挫折中繼續打磨對設計與科技的執念。','故事走到這一步，表面的結果是：皮克斯推出《玩具總動員》大獲成功，NeXT的技術被蘋果看上——他以賣掉NeXT的方式重返蘋果。','真正讓這個故事變得難忘的意外，是：回到蘋果時公司瀕臨破產，沒有人認為他能救得了——這個「失敗者」卻帶回了改變歷史的產品構想。','而最關鍵的轉彎，正是在這裡發生：他放棄了對被驅逐的憤恨，換來了以全新眼光重建蘋果的自由。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：iMac、iPod、iPhone、iPad，他用12年的流放換來了讓蘋果成為全球最有價值公司的機會。'],
    quote:'被趕走是他人生最好的事——因為那12年，他學會了什麼才是真正重要的。'},
  { name:'蘇格拉底', work:'古希臘', scene:'被判死刑，拒絕逃亡，選擇赴死',
    storytellerName:'柏拉圖', storytellerRole:'蘇格拉底最重要的學生',
    storytellerIntro:{
      who:'我是柏拉圖。世人後來認識蘇格拉底，多半都是經由我的筆；而我最難忘的，從來不是他的答案，而是他如何用提問逼人直視自己的靈魂。',
      relation:'我和他的關係，是學生，也是被他改變的人。我在他身旁學會的，不只是思考的方法，更是思考該付出的代價。',
      why:'為什麼由我來說？因為只有真正受過他影響的人，才明白他赴死那一刻，守住的不是辯論的勝負，而是整個思想應該怎麼活。'
    },
    storytellerSimple:['老師真正要做的，從來不是贏一場官司，而是守住一件事：一個人若明知什麼是對的，能不能還照著它活。','可他的阻礙，是整座城邦對他的不安。人們受不了他不停發問，更受不了他讓年輕人開始懷疑那些習以為常的答案。','他辯論、追問、拆解，把每一個看似穩固的觀念都推到要重新檢查的位置上。','結果他被判有罪，死刑落下來，朋友們也替他安排了逃走的路。','最意外的是，明明最擅長質疑一切的人，最後卻沒有質疑自己一直以來所相信的原則。','真正的轉彎，在於他拒絕逃亡：他不是不知道可以活，而是知道若那樣活下去，自己就不再是自己了。','所以最後他喝下毒芹，不是因為輸了，而是因為他要讓我們看見：思想若只敢活在嘴上，就不算真的思想。'],
    storyteller2Name:'梅勒托斯', storyteller2Role:'控告蘇格拉底的人',
    storyteller2Intro:{
      who:'我是梅勒托斯。我是寫下那份控訴狀的人，是把蘇格拉底送上法庭的人。我以「腐化青年」和「不敬神明」為由控告他，陪審團投票判他死刑。我贏了官司，可那個勝利，讓我在歷史上變成了什麼，你們都知道。',
      relation:'我和蘇格拉底的關係，是控告者與被控告者，是我認為的威脅與那個威脅的來源。我不恨他，我怕他——怕他那些問題讓雅典變得不穩定，怕那些年輕人被他帶壞，怕一個城邦的秩序被一個老人的發問給問垮了。',
      why:'為什麼由我來說？因為只有那個把他送上死路的人，才能告訴你：一個人的對手，有時候比他的朋友更清楚他的力量。我想消滅他的發問，結果我的控訴狀，成了讓他永生的那份文件。'
    },
    storyteller2Simple:[
      '蘇格拉底想要的，我那時以為是搗亂——讓年輕人懷疑神明，讓他們不服從，讓雅典的秩序鬆動。我現在知道，那個理解是錯的。他想要的，是讓人真正思考，而不只是服從。',
      '他最大的阻礙，按理說是我和整個城邦的力量——法律、陪審團、輿論。可他從來沒有把那些當成真正的阻礙。他的阻礙，是他自己給自己設的那條線：他不能違背自己說過的話。',
      '我在法庭上說他腐化青年，說他不敬神明。他在法庭上說，他只是在做神命令他做的事——喚醒雅典人，讓他們不要自以為知道自己不知道的事。那個回答，讓陪審團更生氣了，也讓我更確定他是危險的。',
      '他被判死刑，朋友替他安排了逃跑的路。我以為他會逃，大多數人都會逃。他沒有。他說若逃了，他就等於承認判決是對的，承認哲學是可以被威脅的東西。',
      '最讓我沒想到的，不是他死了，而是他死的方式——那麼平靜，那麼從容，甚至還在跟學生聊靈魂不死。我見過很多人面對死亡，沒有一個像他那樣。那個平靜，把我的控訴狀變成了笑話。',
      '他死了，我贏了官司。可柏拉圖把這一切寫了下來，幾百年後，幾千年後，所有人都知道那份控訴狀，也都知道是我寫的。我以為我在保護雅典，結果我做的事，是讓一個人的思想永遠無法被殺死。',
      '我在歷史上的名字，是「殺死蘇格拉底的人」。他在歷史上的名字，是「西方哲學之父」。那個對比，就是我的結局，也是對「用力量壓制思想」這件事，最諷刺的回答。'
    ],
    simple:['用哲學追問喚醒雅典人思考：什麼是正義？什麼是美德？','雅典法庭以「腐化青年」和「不敬神明」為由判他死刑，朋友已安排好逃亡路線。','他在獄中繼續與學生討論靈魂不死與正義的本質，坦然等待死期。','朋友克力同帶著船票來勸他逃走，他拒絕了——一個哲學家不能因為怕死就違背自己的原則。','他可以活，但活下去的代價是承認法律可以被選擇性遵守——這與他一生的教誨相悖。','他放棄了生命，換來了哲學史上最震撼的示範：一個人可以用死來證明自己說的是真的。','他從容飲下毒芹汁，死於西元前399年。他的死，讓柏拉圖寫下了《對話錄》，讓哲學從此有了靈魂。'],
    full:['外在目標：用哲學追問喚醒雅典人思考。<br><br>內在目標：用一生示範：哲學不是說說而已，而是要活出來的，甚至要死出來的。','雅典法庭判他死刑，朋友安排好了逃亡路線，只要他點頭，就可以活下去。<br><br>外在：死刑判決。<br><br>內在：逃亡的誘惑，以及「一個哲學家能否為了活命而違背自己的原則」這個問題。','他在獄中繼續與學生討論靈魂不死與正義，坦然等待死期，沒有一絲逃避的念頭。','他拒絕了逃跑——一個哲學家不能因為怕死就違背自己說了一輩子的原則。','他意識到：如果他逃了，他的一生就成了謊言——而那比死更難以承受。<br><br>這才是最大的意外：在所有人都以為他會逃的時刻，他選擇了最難的那條路。','他放棄了生命，換來了哲學史上最震撼的示範：一個人可以用死來證明自己說的是真的。<br><br>他放棄的：活著。<br><br>他換來的：讓哲學從此不再只是理論。','他從容飲下毒芹汁而死。他的死，讓柏拉圖寫下了《對話錄》，讓哲學從此有了不可動搖的靈魂。'],
    storyteller3Name:'克里托', storyteller3Role:'替蘇格拉底安排逃跑，被他拒絕的老友',
    storyteller3Intro:{
      who:'我是克里托。我是蘇格拉底的老朋友，從年輕就認識他。他被判死刑之後，我賄賂了獄卒，安排好了船，聯絡了外地的朋友，一切都準備好了——我只需要他說一個字，他就可以活著走出去。他說的是：不。',
      relation:'我和蘇格拉底的關係，是真正的友誼，也是一場我完全沒有辦法贏的辯論。我以為我在救他，他以為我在害他；我以為逃走是愛，他以為逃走是背叛——我們說的是同一件事，卻永遠說不到同一個地方。',
      why:'為什麼由我來說？因為那個被拒絕的善意，是整個故事裡最人性的時刻。柏拉圖寫了哲學，梅勒托斯給了控訴；我給了一條活路，他把它還給我了。那個還回來的動作，比任何論證都更讓我懂得，他是認真的——他選擇死亡，不是因為他不怕，而是因為他真的那樣相信。'
    },
    storyteller3Simple:[
      '蘇格拉底想要的，我花了很久才真正理解：他不是想死，但他更不想用逃跑來活著。那個對他來說，比死亡更不能接受——因為逃跑意味著他一生說的那些話都是表演，而他不允許那件事發生。',
      '他的阻礙，我以為是那些法官，是那個不公正的審判；可他告訴我，他最大的阻礙，是我——是我替他準備的那條出路。他說，如果我走了，我就變成了我一直說不對的那種人。我聽不懂，但我沉默了。',
      '我去牢裡見他，把計劃告訴他。我說了所有理由：你的孩子還小，你的朋友需要你，那個審判本來就是不公正的——你不欠雅典這條命。他聽完，問了我一個問題：如果城邦的法律開口說話，它會說什麼？然後他自己回答了。',
      '他拒絕了我。那個結果，是我最不想看見的結果，也是我最後不得不接受的結果——因為他給我的那些理由，我沒有辦法反駁，我只能坐在那裡，看著一個我認識了幾十年的人，平靜地選擇死亡。',
      '最讓我沒有辦法釋懷的，不是他的選擇，而是他的平靜。他不是在殉道，不是在表演，他真的那麼平靜——那種平靜讓我知道，我替他安排的那條逃路，對他來說根本不是救援，而是一種要求他做自己做不到的事。',
      '他喝下毒酒，那一天我也在場。他的轉彎，不是在審判那天，而是在他決定留下來的那一刻：他放棄了活著，換來了一種比活著更完整的東西——讓他說過的那些話，都變成了真的。那個選擇，我做不到，但我看著他做到了。',
      '他死了，柏拉圖寫下了他的一切，兩千年後我們還在談他。可我最記得的，不是那些哲學，而是他在牢裡對我說的那句話：「克里托，我欠阿斯克勒庇俄斯一隻公雞。」臨死之前，他還在想著一個小小的欠債——那才是真正的他，我認識了一輩子的那個人。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 蘇格拉底 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 蘇格拉底 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 蘇格拉底，最值得分析的不是表面的成敗，而是他在「被判死刑，拒絕逃亡，選擇赴死」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，蘇格拉底 真正要做的，是：用哲學追問喚醒雅典人思考：什麼是正義？什麼是美德？','這個故事真正有力的阻礙，在於：雅典法庭以「腐化青年」和「不敬神明」為由判他死刑，朋友已安排好逃亡路線。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他在獄中繼續與學生討論靈魂不死與正義的本質，坦然等待死期。','故事走到這一步，表面的結果是：朋友克力同帶著船票來勸他逃走，他拒絕了——一個哲學家不能因為怕死就違背自己的原則。','真正讓這個故事變得難忘的意外，是：他可以活，但活下去的代價是承認法律可以被選擇性遵守——這與他一生的教誨相悖。','而最關鍵的轉彎，正是在這裡發生：他放棄了生命，換來了哲學史上最震撼的示範：一個人可以用死來證明自己說的是真的。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他從容飲下毒芹汁，死於西元前399年。他的死，讓柏拉圖寫下了《對話錄》，讓哲學從此有了靈魂。'],
    quote:'他不是因為不怕死才赴死，而是因為他比任何人都更清楚：有些事，比活著更重要。'},
  { name:'海倫凱勒', work:'美國', scene:'靠一個字「water」，打開了與世界的連結',
    storytellerName:'安妮．沙利文', storytellerRole:'海倫凱勒的老師',
    storytellerIntro:{
      who:'我是安妮．沙利文。很多人記得海倫，是記得她後來的演講與成就；可我最先看見的，是一個被黑暗與寂靜困住、卻又拼命想往外抓住世界的孩子。',
      relation:'我和她的關係，是老師，也是陪她一起把世界重新命名的人。我不是替她活，但我曾握著她的手，陪她走過那道最難的門。',
      why:'為什麼由我來說？因為只有在她還不會說、不會寫、甚至不知道『語言』是什麼時就陪著她的人，才知道她後來每一步有多不容易。'
    },
    storytellerSimple:['海倫真正要做的，是和世界重新連上線；不只是學一個字，而是讓自己不再被困在聽不見、看不見、說不出的孤島裡。','可她最大的阻礙，就是她同時失去了視覺與聽覺，整個世界對她來說像一堵沒有門的牆。','我握著她的手，一遍又一遍在她掌心拼字，把物和字硬是綁在一起，直到她終於開始追問：每樣東西是不是都有名字。','結果在水泵旁，『water』那個字忽然亮了起來；她第一次真正明白，原來這些手勢不是遊戲，而是世界的鑰匙。','最意外的是，那一瞬間改變的，不只是她學會了一個字，而是她整個人突然知道：原來自己是可以進入人群、進入思想、進入語言的。','真正的轉彎，就從那裡開始：她不再只是被教，而是主動往前抓住每一個字、每一個概念，把知識變成自己的路。','所以最後海倫改變的，不只是自己的命運；她也讓全世界看見，一個曾被判定幾乎不可能與人溝通的人，竟能反過來替無數人發聲。'],
    storyteller2Name:'馬克·吐溫', storyteller2Role:'海倫凱勒的摯友，稱她為十九世紀最了不起的人之一',
    storyteller2Intro:{
      who:'我是馬克·吐溫。我見過各式各樣的人，見過總統，見過騙子，見過英雄，見過小人；可我見過最讓我說不出話來的，是海倫·凱勒。那不是客套，那是真話——我這輩子靠說話和寫字吃飯，而她讓我第一次覺得，文字在她面前，顯得有點輕。',
      relation:'我和海倫的關係，從她還很年輕的時候就開始了。我們通信，見面，聊天——我問她問題，她問我問題；我說我一生都在諷刺這個世界，她說她一生都在感謝這個世界。我們不一樣，卻彼此理解。',
      why:'為什麼由我來說？因為沙利文說的是她學習的過程，而我說的是她學成之後的樣子——那個可以用語言思考、辯論、甚至說笑的海倫·凱勒。只有和她真正談過話的人，才知道她有多清醒，又多麼幽默。'
    },
    storyteller2Simple:[
      '海倫想要的，和我年輕時想要的，出奇地相似：她想知道世界是什麼樣子，想說話，想被人理解，想理解別人。差別只是，她要先翻越一堵我永遠無法想像的牆，才能站在起跑線上。',
      '她最大的阻礙，不只是耳朵和眼睛，而是在失去這兩樣之後，世界對她的定義——一個永遠需要被憐憫的人。她花了一生，在推翻那個定義。',
      '她學會了說話，學會了寫作，進了大學，出書，演講，倡議。我讀她的文章，不是覺得「一個聾盲女人寫得真不錯」，而是覺得：這個人的思想，和她的處境之間，有一條我完全看不見的鴻溝——她是怎麼跨過去的？',
      '她在哈佛讀書時，有人懷疑她的論文是沙利文幫忙寫的。那種質疑，讓我非常憤怒，因為我和她談過，我知道那些想法是她自己的——有自己的邏輯，有自己的幽默，有自己對世界的判斷。',
      '最讓我感到驚奇的，不是她能做到什麼，而是她面對這個世界的方式。我一生都在憤世嫉俗，用諷刺和嘲笑來回應人類的愚蠢；她用的是感謝。不是那種天真的感謝，而是一種深刻地知道黑暗是什麼、卻仍然選擇感謝光的感謝。',
      '她告訴我，有一次她站在尼加拉瀑布旁，感受著水的震動，聽著它傳來的聲音——她雖然聽不見，但她感受到了。她說那一刻，她覺得自己和這個世界是連在一起的。我聽完，說不出話來。',
      '我說過，十九世紀最了不起的兩個人，一個是拿破崙，一個是海倫·凱勒。拿破崙試圖征服世界，用力量；海倫·凱勒試圖理解世界，用一雙感受不到光和聲音的感官。我認為她的任務，比拿破崙的更難，也更偉大。'
    ],
    simple:['在失去視覺與聽覺的黑暗中，找到與世界溝通的方式。','19個月大時因病失去視覺與聽覺，無法說話，與外界完全隔絕，長年以哭鬧和暴力表達情緒。','家庭教師蘇利文以無比的耐心，每天在她手心拼寫單字，試圖讓她理解「符號代表事物」這個概念。','努力了數週，海倫依然像在機械式模仿，沒有真正的理解。','某天，蘇利文把她的手放在流動的水下，同時在她手心拼出「water」——海倫突然明白了：萬物都有名字。','那一刻，她從黑暗的囚籠裡衝了出來，瘋狂地觸摸所有東西，要求知道它們的名字。','她後來學會說話、學習多國語言，畢業於哈佛附屬學院，成為作家與社會運動者。'],
    full:['外在目標：在失去視覺與聽覺的黑暗中，找到與世界溝通的方式。<br><br>內在目標：證明自己不是孤獨的——她想知道這個世界是真實的，而她也是其中的一部分。','沒有語言，等同於沒有概念，沒有概念就等同於沒有世界——她困在一個沒有名字的宇宙裡。<br><br>外在：失去視覺與聽覺。<br><br>內在：在黑暗和沉默中，如何相信世界是存在的。','蘇利文以無比的耐心，每天在她手心拼寫單字，不放棄，不妥協，一遍又一遍。','努力了數週，海倫依然沒有真正理解「符號代表事物」這個人類最基本的認知。','某天，流水打在她手心的同時，蘇利文在她手心拼出「water」——海倫突然明白了：萬物都有名字，她也有名字，她不是孤獨的。<br><br>那個瞬間，整個宇宙對她打開了。','那一刻，她從黑暗的囚籠裡衝出來，瘋狂地觸摸所有東西，要求知道它們的名字。<br><br>她放棄了憤怒，換來了好奇。她放棄了隔絕，換來了連結。','她後來學會說話、習得多國語言，畢業於哈佛附屬學院，成為作家與社會運動者，用一生證明人類意志的極限。'],
    storyteller3Name:'凱特·凱勒', storyteller3Role:'海倫的母親，決定去找沙利文的人',
    storyteller3Intro:{
      who:'我是凱特·凱勒，海倫的母親。世人記得沙利文老師，記得海倫；可那個決定「去找一個老師」的人，是我。那個決定，是整個故事真正的第一步——在water這個字之前，在沙利文來之前，有我坐在那個黑暗裡，不肯放棄的那幾年。',
      relation:'我和海倫的關係，是世界上最痛苦、也最深沉的那種愛。她出事的時候才十九個月大，我看著一個原本明亮的孩子，慢慢陷進一個我進不去的黑暗裡。我不知道她在裡面是什麼感受，我只知道她還在，所以我也必須繼續。',
      why:'為什麼由我來說？因為海倫凱勒的故事，從一封信開始——我寫信給狄更斯傳記的作者，問他那本書裡提到的一個盲聾女孩是怎麼被教育的；他給了我一個名字，那個名字後來成了沙利文。那封信，是我寫的。那個故事，從我開始。'
    },
    storyteller3Simple:[
      '海倫想要的，那時候她自己說不出來——她困在一個沒有語言的世界裡，她的憤怒和渴望都變成了衝撞、哭鬧、抓人。可我知道那裡面有個人，有個想要被理解的人，因為她的眼睛裡有一樣東西，我說不清楚，但我知道它在。',
      '她的阻礙，是沒有語言。那不只是學習的問題，那是整個存在的問題——她活在世界上，卻沒有辦法和世界說話，沒有辦法知道世界在說什麼。我的阻礙，是不知道怎麼幫她穿過那道牆，也不知道那道牆能不能穿過去。',
      '我找了醫生，找了專家，得到的答案都是「沒有辦法」。然後我讀到了那本書，我寫了那封信，我等到了一個叫安妮·沙利文的女孩。她來的時候才二十歲，半盲，沒有什麼經驗——可她有一樣東西是那些專家沒有的：她願意跟海倫一起進到那個黑暗裡去。',
      '沙利文來了，她和海倫打架，和我僵持，把整個家搞得天翻地覆。那段日子，不是我想像中的「老師來了，一切好轉」——而是更多的混亂，更多的衝撞。可我看見了一件事：海倫開始有反應了，不一樣的反應。',
      '那天，水泵旁邊，water這個字。我不在場，但沙利文後來告訴我——海倫的臉在那一刻變了。那個意外，不是奇蹟，是七年的等待，加上沙利文那幾個月的堅持，加上海倫心裡一直沒有熄滅的那個什麼，在那一刻，撞在一起了。',
      '海倫開口了，開始學，開始說，開始寫，開始走進那個她被鎖在外面的世界。那個轉彎，是她的，也是沙利文的；可那個讓轉彎有機會發生的決定，是我做的——去找、去問、不放棄、再找一次。那不是英雄，那只是一個媽媽。',
      '她後來走遍世界，演講，寫書，改變了無數人對身障者的看法。我看著她，心裡有驕傲，也有一種說不清楚的感受——那個在黑暗裡衝撞的小女孩，和後來那個站在台上的海倫，中間有一段路，是我陪她走的，那段路很長，也很安靜，沒有掌聲。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 海倫凱勒 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 海倫凱勒 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 海倫凱勒，最值得分析的不是表面的成敗，而是他在「靠一個字「water」，打開了與世界的連結」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，海倫凱勒 真正要做的，是：在失去視覺與聽覺的黑暗中，找到與世界溝通的方式。','這個故事真正有力的阻礙，在於：19個月大時因病失去視覺與聽覺，無法說話，與外界完全隔絕，長年以哭鬧和暴力表達情緒。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：家庭教師蘇利文以無比的耐心，每天在她手心拼寫單字，試圖讓她理解「符號代表事物」這個概念。','故事走到這一步，表面的結果是：努力了數週，海倫依然像在機械式模仿，沒有真正的理解。','真正讓這個故事變得難忘的意外，是：某天，蘇利文把她的手放在流動的水下，同時在她手心拼出「water」——海倫突然明白了：萬物都有名字。','而最關鍵的轉彎，正是在這裡發生：那一刻，她從黑暗的囚籠裡衝了出來，瘋狂地觸摸所有東西，要求知道它們的名字。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：她後來學會說話、學習多國語言，畢業於哈佛附屬學院，成為作家與社會運動者。'],
    quote:'整個世界在那一捧流水的瞬間打開了——她等了七年，只為了理解一個字。'},
  { name:'特蕾莎修女', work:'阿爾巴尼亞／印度', scene:'放棄修道院的安全，獨自走進加爾各答貧民窟',
    storytellerName:'尼爾瑪拉修女', storytellerRole:'特蕾莎修女的繼承者與追隨者',
    storytellerIntro:{
      who:'我是尼爾瑪拉修女。很多人記得德蕾莎修女，是記得那張瘦小的身影走進最貧窮的人群裡；可我記得的，是她每一次看見痛苦時，都先把自己放得更低。',
      relation:'我和她的關係，是跟隨者，也是後來承接她使命的人。我在她身旁看見的，不只是慈悲，而是一種幾乎固執的回應：既然看見了，就不能假裝沒看見。',
      why:'為什麼由我來說？因為只有跟著她走進那些地方的人，才明白她做的不是一時熱情，而是一種日復一日把自己交出去的選擇。'
    },
    storytellerSimple:['她真正要做的，是離開原本安全的修道院生活，走進加爾各答最被遺忘的人群裡，去陪那些連死都沒人看見的人。','可最大的阻礙，是那條路幾乎什麼都沒有：沒有資源、沒有保障、沒有掌聲，只有骯髒、病痛與人類最不想靠近的氣味。','她就這樣一個人開始，照顧、清洗、安慰、抱起那些被丟在街上的人，把愛做成最具體、也最辛苦的勞動。','結果慢慢地，跟隨她的人多了，仁愛傳教修女會也一步步建立起來，讓這份工作不再只靠一個人的肩膀。','最意外的是，世界後來給她極大的名聲；可她最初做這些事時，根本不是為了改變形象或留下偉業，而只是因為眼前有人需要被抱起來。','真正的轉彎，在於她把『慈悲』從一種感動，變成一種制度化、可持續、能被更多人承接的行動。','所以最後留下來的，不只是她個人的聖名，而是一個提醒：愛若不願意彎下腰，很多苦難就永遠只會停在遠處。'],
    storyteller2Name:'克里斯多福·希欽斯', storyteller2Role:'批評特蕾莎修女最力的作家',
    storyteller2Intro:{
      who:'我是克里斯多福·希欽斯。我寫了一本書，叫《仁慈的天使》，批評德蕾莎修女。那本書讓很多人憤怒，也讓我被叫做「攻擊聖人的人」。我不撤回那本書；可我也不打算在這裡只說她的壞話，因為那樣的話，和那些只說她好話的人，犯的是同一種錯誤。',
      relation:'我和德蕾莎修女的關係，是批評者與被批評者。我從未和她見過面，但我研究她，研究她的組織，研究那些流入她帳戶的捐款最後去了哪裡，研究她對病患的醫療標準，研究她說的那些關於苦難的話。',
      why:'為什麼由我來說？因為尼爾瑪拉修女說的是信仰，而我說的是問題——那些真實存在、值得被認真對待的問題。一個人可以同時是真誠的，也是有問題的；一個人可以真的彎下腰去愛人，卻同時在某些事情上做出了錯誤的判斷。只有願意同時承認這兩件事的人，才算真正看見了她。'
    },
    storyteller2Simple:[
      '德蕾莎修女想要的，我相信是真實的：她想讓那些被遺忘的人，在生命的最後一刻，感受到有人在乎。那個動機，我不質疑——一個人如果沒有真誠的信念，不會在那樣的條件下堅持四十五年。',
      '可她的阻礙，不只是外在的貧困，也有她自己的信仰邏輯帶來的問題。她相信苦難本身是美麗的，是靠近上帝的途徑——那個信念，讓她在面對某些醫療決定時，做出了我認為傷害了那些病人的選擇。',
      '她的「垂死者之家」，讓無數人在生命的最後有人陪伴，那是真實的善。可同樣真實的，是那裡的醫療條件非常有限，捐款大量流入帳戶，卻沒有完全用在改善這些條件上。我問過這些問題，沒有得到讓我滿意的答案。',
      '她接受了很多有問題的捐款——來自獨裁者、來自騙子——說那是為了幫助窮人。她反對避孕和墮胎，在人口壓力最大的地方，用她的影響力阻止那些可能減少貧困的政策。那些選擇，我認為造成了傷害。',
      '最讓我感到矛盾的，不是她做了壞事，而是她做的好事和壞事，在同一個人身上、出於同一個信念、以同樣的真誠存在著。那個複雜性，是我在寫那本書時，最難處理的部分。',
      '她死後，被列為聖人。我不是天主教徒，我對封聖這件事沒有特別的意見；可我認為，一個「聖人」若不能被認真地質疑和批評，那個封聖就只是在保護一個形象，而不是在真正理解一個人。',
      '最後我想說的是：德蕾莎修女是一個複雜的人，做了複雜的事，留下了複雜的遺產。那種複雜，比「她是聖人」或「她是偽善者」兩種說法，都更接近真實。只有願意面對那個複雜的人，才算真正尊重了她這個人。'
    ],
    simple:['親手照料最被社會遺棄的人——垂死的窮人、痲瘋病患、無人認領的孤兒。','修道院的規定、教會的體制、加爾各答街頭觸目驚心的貧困與死亡。','她申請離開修道院，帶著三塊盧比和一套換洗衣物，走上街頭，開始親手清洗傷口、收容垂死者。','她建立了「垂死者之家」，讓那些被遺棄在街頭等死的人，至少能有尊嚴地死去。','她的工作不是在治癒疾病，而是在給予尊嚴——這在當時是一個沒有人想做的工作。','她放棄了修道院的安全與秩序，換來了親身面對世界最黑暗角落的自由。','她在加爾各答工作了45年，仁愛傳教修女會擴展至全球，1979年獲得諾貝爾和平獎。'],
    full:['外在目標：親手照料最被社會遺棄的人。<br><br>內在目標：讓每一個垂死的人都能感受到：他的生命被人看見了——人最深的飢餓，不是食物的飢餓，而是被愛的飢餓。','修道院是安全的，街頭是危險的，而教會的體制不鼓勵修女獨自出走。<br><br>外在：制度的限制與街頭的危險。<br><br>內在：如何在「安全的善」和「真實的需要」之間選擇。','她申請離開修道院，帶著三塊盧比走上街頭，開始親手清洗傷口、收容垂死者——不是因為她有資源，而是因為她無法假裝沒看見。','她建立了「垂死者之家」，讓那些被遺棄在街頭等死的人，至少能有尊嚴地死去。','她的工作不是治癒疾病，而是給予尊嚴——她發現人最深的飢餓，不是食物的飢餓，而是被愛的飢餓。<br><br>這個發現，改變了她對「幫助」的全部定義。','她放棄了修道院的秩序與安全，換來了親身面對世界最黑暗角落的自由——那才是她真正的修道院。<br><br>她放棄的：制度內的安全感。<br><br>她換來的：與每一個她服務的人之間，最直接、最真實的連結。','她在加爾各答工作了45年，仁愛傳教修女會擴展至全球，1979年獲諾貝爾和平獎。'],
    storyteller3Name:'那個被她第一個抱起來的人', storyteller3Role:'讓她走進貧民窟的那個無名者',
    storyteller3Intro:{
      who:'我沒有名字。或者說，沒有人記得我的名字。我是加爾各答街頭那個被她第一個抱起來的垂死者——那天，她走出修道院，看見了我，然後彎下腰。那個彎腰的動作，是慈善之家的起點，也是她整個故事的轉折。我是那個理由。',
      relation:'我和德蕾莎修女的關係，很奇怪——她因為我改變了一切，可我不記得她，因為我那時候已經快死了。她記得我，或者說，她記得那個動作；我成了她決定的起點，她成了我最後時刻裡唯一把我當人看的人。',
      why:'為什麼由我來說？因為偉大的故事都有一個最小的開始。她的慈善之家，救了幾十萬人；可那幾十萬人的前面，有一個第一個——那個第一個，是我。我說不了什麼大道理，我只能說：那一天，有個人彎下腰，把我從街上抱起來，那是我這輩子第一次，感覺到自己是一個人，不是一個問題。'
    },
    storyteller3Simple:[
      '她想要的，她說是服務窮人中最窮的人。那個目標，聽起來是宗教的，是崇高的；可對我來說，那個目標只是：有人願意看見我。在我躺在那條街上的時候，所有人都繞過去了，她停下來了。那個「停下來」，就是她的目標的全部意義。',
      '她的阻礙，是整個體制——修道院的規矩、教會的層級、加爾各答的貧窮大到沒有任何一個人或機構可以真正解決。可她的阻礙裡，還有一個更小的東西：要不要彎下腰，要不要碰一個陌生人的身體，要不要讓自己的手沾上那個世界。她彎下腰了。',
      '她離開修道院，走進貧民窟。那個努力，不是豪情壯志，是一天一天，一個人一個人，彎下腰，抱起來，擦乾淨，讓他們知道他們值得被好好地死去。那個努力，從我開始，到她死的那天，她還在做。',
      '慈善之家建起來了，志工來了，捐款來了，諾貝爾獎來了。那個結果，是從一個彎腰的動作，一步一步走出來的。可那個結果的起點，是我——一個沒有名字的人，躺在一條街上，等著死去。',
      '最讓我覺得奇怪的，不是她救了多少人，而是她選擇了這件事，而不是更有效率的事。有人批評她，說為什麼不改變制度，為什麼不蓋醫院，為什麼不做更「有用」的事。可她說：如果我不彎下腰，他就一個人死在街上。那個邏輯，我聽懂了。',
      '她的轉彎，是走出修道院那一步——放棄了安全和清靜，換來了那條街，換來了我，換來了之後所有那些人。她放棄的，是一個「不必碰到世界的骯髒」的生活；她換來的，是一種直接的、沒有距離的愛。',
      '她死了，世界為她哀悼。可我只想說一件事：那天她抱起我的時候，沒有攝影機，沒有記者，沒有任何人看著。那個動作，不是為了被看見的——那才是為什麼它那麼重要，那才是為什麼它改變了她，也改變了我最後的那段時光。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 特蕾莎修女 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 特蕾莎修女 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 特蕾莎修女，最值得分析的不是表面的成敗，而是他在「放棄修道院的安全，獨自走進加爾各答貧民窟」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，特蕾莎修女 真正要做的，是：親手照料最被社會遺棄的人——垂死的窮人、痲瘋病患、無人認領的孤兒。','這個故事真正有力的阻礙，在於：修道院的規定、教會的體制、加爾各答街頭觸目驚心的貧困與死亡。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：她申請離開修道院，帶著三塊盧比和一套換洗衣物，走上街頭，開始親手清洗傷口、收容垂死者。','故事走到這一步，表面的結果是：她建立了「垂死者之家」，讓那些被遺棄在街頭等死的人，至少能有尊嚴地死去。','真正讓這個故事變得難忘的意外，是：她的工作不是在治癒疾病，而是在給予尊嚴——這在當時是一個沒有人想做的工作。','而最關鍵的轉彎，正是在這裡發生：她放棄了修道院的安全與秩序，換來了親身面對世界最黑暗角落的自由。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：她在加爾各答工作了45年，仁愛傳教修女會擴展至全球，1979年獲得諾貝爾和平獎。'],
    quote:'她沒有試圖改變世界的結構，她只是彎下腰，把一個人從地上抱起來——然後又一個。'},
  { name:'司馬遷', work:'中國', scene:'受宮刑之後，選擇活下去，完成《史記》',
    storytellerName:'任安', storytellerRole:'司馬遷的友人',
    storytellerIntro:{
      who:'我是任安。很多人記得司馬遷，是記得《史記》；可我記得的，是那個在奇恥大辱之後，還咬著牙不肯讓自己白活的人。',
      relation:'我和他的關係，是朋友，也是那個曾收到他傾心相告之信的人。我知道他並不是不痛、不恨，而是有一件比痛更大的事，還壓在他心上。',
      why:'為什麼由我來說？因為只有聽過他親口說出心中掙扎的人，才明白他選擇活下來，並不是懦弱，而是把餘生全押在一部書上。 '
    },
    storytellerSimple:['司馬遷真正要做的，是完成父親未竟的志業，把歷史寫下來，替後人留住那些成敗、榮辱與人性的真相。','可最大的阻礙，不只是朝廷的壓力，而是李陵之禍後，他遭受宮刑；那不是普通的懲罰，而是一種幾乎要把人格整個碾碎的羞辱。','他沒有立刻尋死，而是把屈辱忍下來，把所有還能活的力氣，全拿去寫、去查、去整理，硬是把自己一點一點撐過去。','結果《史記》終於完成，一部不只記帝王，也記失敗者、邊緣人、刺客與遊俠的史書，真的被他寫出來了。','最意外的是，在那樣的處境裡，他若選擇一死了之，世人也許更容易稱他高潔；可他偏偏選擇背著羞辱活下來。','真正的轉彎，就在他把『為自己雪恥』這件事，轉成『替歷史留下公道』；他讓個人的傷，變成一部書的眼睛。','所以最後留下來的，不只是司馬遷這個名字，而是他用一生證明：有時活下去，本身就是比死更艱難、也更偉大的完成。'],
    storyteller2Name:'漢武帝', storyteller2Role:'下令宮刑的皇帝',
    storyteller2Intro:{
      who:'我是劉徹，漢武帝。我開疆拓土，北擊匈奴，建立了漢朝最強盛的時代。我也是那個下令對司馬遷施以宮刑的人。歷史記住了這兩件事，而且把它們放在同一個人身上。',
      relation:'我和司馬遷的關係，是君和臣，是施刑者和受刑者。我懲罰了他，他沒有死，然後寫了一部書，那部書把我的功業和我的過失，都寫了進去——包括這件事本身。他用他的方式，回應了我對他做的事。',
      why:'為什麼由我來說？因為任安說的是朋友的見證，而我說的是權力的視角。我擁有所有的力量，卻沒能阻止那部書被寫成；我以為我在懲罰他，結果我給了他一個讓《史記》比任何其他史書都更深刻的理由。'
    },
    storyteller2Simple:[
      '司馬遷想要的，我那時沒有認真想過。他是我的史官，他的工作是記錄，而記錄應當服從我——這是我當時的理解。他為李陵辯護，我認為那是越權，是干政，是不知分寸。',
      '他最大的阻礙，是我。不只是宮刑本身，而是整個皇權的邏輯：臣子不能對君主的決定提出質疑，史官不能替被我認定為叛將的人說話。他違反了這個邏輯，所以我懲罰了他。',
      '我給了他選擇：死，或者宮刑。我以為選擇宮刑是懦弱，是他不願意為自己的立場付出真正的代價。我後來才明白，那是他選擇了一個更難的任務——活下去，把書寫完。',
      '他在受刑之後繼續工作。我繼續我的征伐，我們各自往前走，互不打擾。《史記》完成的時候，我可能還在世，也可能已經不在了——我不確定他把書寫完是什麼時候，那部書我沒有親眼讀到。',
      '最讓歷史諷刺的，是我對他做的事，最後成了《史記》為什麼比其他史書更誠實的原因之一。一個受過宮刑、受過屈辱的人，在寫歷史時，比一個什麼都沒受過的人，更清楚失敗者和邊緣人是什麼感覺。我的懲罰，給了他一雙更深的眼睛。',
      '他在書裡記了我的功業，也記了我的過失，記了我寵信方士的荒唐，記了我因為巫蠱之禍害死了多少人。那些記錄，是史官對君主最後的回應——你可以懲罰我的身體，但我的筆，還在。',
      '我死後，《史記》留了下來，流傳了兩千年。我的名字，和那部書，永遠連在一起——一個是寫書的人，一個是讓那部書不得不被這樣寫的人。歷史記住了我們兩個，也記住了：權力可以傷人，卻傷不了一個決定用傷來換一部書的人。'
    ],
    simple:['完成父親未竟的遺願，為中國寫一部完整的通史。','因替投降匈奴的將領李陵辯護，觸怒漢武帝，被判處死刑或宮刑二選一。','他選擇了宮刑——以最大的恥辱換取繼續活著、繼續寫作的權利。','他在屈辱中繼續工作，將個人的痛苦化為對歷史人物命運更深刻的理解。','他本可以選擇有尊嚴地死去，但他問自己：死，能完成《史記》嗎？','他放棄了士大夫的尊嚴，換來了完成這部書的時間——「人固有一死，或重於泰山，或輕於鴻毛。」','《史記》成為中國第一部紀傳體通史，被魯迅譽為「史家之絕唱，無韻之離騷」，流傳至今兩千年。'],
    full:['外在目標：完成父親的遺願，為中國寫一部完整的通史。<br><br>內在目標：讓歷史成為一面鏡子，讓後人看見人性的全貌——包括那些被時代遺忘或被刻意抹去的人。','宮刑不只是肉體的殘缺，而是在那個時代對一個男人存在價值的徹底摧毀。<br><br>外在：肉體的殘缺與社會的恥辱。<br><br>內在：在最深的屈辱中，如何繼續找到活著的理由。','他問自己：死，能完成《史記》嗎？答案是否定的——所以他選擇活下去，帶著恥辱繼續寫。','他把個人的痛苦化為對筆下人物命運更深刻的理解——那些在歷史中受苦的人，他比任何人都懂。','他在最屈辱的處境中，反而寫出了最有人性深度的歷史——傷痛成了他最好的筆。<br><br>這才是最大的意外：最大的恥辱，成了最偉大作品的動力。','他放棄了士大夫的尊嚴，換來了完成這部書的時間。<br><br>「人固有一死，或重於泰山，或輕於鴻毛。」<br><br>他放棄的：有尊嚴地死去。<br><br>他換來的：用兩千年的流傳，讓那些本會被歷史遺忘的人被記住。','《史記》成為中國第一部紀傳體通史，魯迅譽之為「史家之絕唱，無韻之離騷」，流傳兩千年至今。'],
    storyteller3Name:'李陵', storyteller3Role:'司馬遷替他辯護而受宮刑的人',
    storyteller3Intro:{
      who:'我是李陵。我率五千步兵深入匈奴，被十萬騎兵圍困八天，彈盡糧絕之後投降了。那個投降，讓我成了大漢的罪人。朝廷滅了我的族，殺了我的家人；而司馬遷，因為替我說了幾句公道話，被漢武帝判了宮刑。那件事，我在匈奴聽說了。我沒有辦法原諒自己。',
      relation:'我和司馬遷的關係，是一個讓他受了一生最重的傷的人，和那個傷的關係。我們不是親密的朋友，可他用他的身體，替我擋下了一刀——不是因為他一定相信我是對的，而是因為他相信一個人應該可以說出他以為是真實的話。',
      why:'為什麼由我來說？因為他完成《史記》的那件事，和我有關，卻也和我無關。他是因為我的事才受宮刑，但他選擇活下去、寫完那本書，是他自己的決定——和我沒有關係，和他這個人有關係。只是我想讓你知道：那個代價，是真實的，是有一個臉的，那個臉，是我的臉。'
    },
    storyteller3Simple:[
      '司馬遷想要的，是完成那本書——《史記》，他父親臨終時交代的事，也是他自己認為這一生最重要的事。我的事情發生的時候，那本書還沒有寫完；他被宮刑之後，那本書成了他活下去的唯一理由。',
      '他的阻礙，是我造成的——我的投降，讓他說了一句話，那句話讓漢武帝震怒，讓他受了宮刑。那個阻礙，不是敵人，不是天命，是一個他選擇說出口的判斷，和一個不允許那個判斷存在的皇帝。',
      '他受刑之後，沒有死。那個選擇，是他做的，不是容易的選擇——以那個時代的標準，受了那樣的刑，死才是有尊嚴的。他選擇活著，是因為那本書，也是因為他不願意讓那件事就這樣結束。',
      '他繼續寫，寫了十幾年，把那本書寫完了。那個結果，是一百三十篇，五十二萬字，記錄了從黃帝到漢武帝的三千年——那是他用他的身體和尊嚴換來的東西，那個交換，我在匈奴聽說他的選擇時，沉默了很久。',
      '最讓我難以承受的，是我根本不知道他替我說了那句話。那件事發生的時候，我在匈奴，被圍著，活著，帶著恥辱活著；他在長安，受刑，也帶著恥辱活著。我們用不同的方式，承擔著不同的重量，可那個重量，有一部分是連著的。',
      '他的轉彎，是選擇不死，選擇繼續寫。他放棄了「一死了之」的尊嚴，換來了《史記》的完成。那個放棄，他在給我的那封信裡說得很清楚——他說，人固有一死，或重於泰山，或輕於鴻毛，他選擇先把那本書寫完，再說其他的事。',
      '他寫完了書，書活了兩千年。我在匈奴老去，沒有回去，也回不去了。可我最後想說的是：他替我說的那句話，不是因為我值得，而是因為他相信一個人應該可以說出他認為真實的話——那個相信，比我的值不值得更重要，也比我的故事活得更長。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 司馬遷 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 司馬遷 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 司馬遷，最值得分析的不是表面的成敗，而是他在「受宮刑之後，選擇活下去，完成《史記》」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，司馬遷 真正要做的，是：完成父親未竟的遺願，為中國寫一部完整的通史。','這個故事真正有力的阻礙，在於：因替投降匈奴的將領李陵辯護，觸怒漢武帝，被判處死刑或宮刑二選一。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他選擇了宮刑——以最大的恥辱換取繼續活著、繼續寫作的權利。','故事走到這一步，表面的結果是：他在屈辱中繼續工作，將個人的痛苦化為對歷史人物命運更深刻的理解。','真正讓這個故事變得難忘的意外，是：他本可以選擇有尊嚴地死去，但他問自己：死，能完成《史記》嗎？','而最關鍵的轉彎，正是在這裡發生：他放棄了士大夫的尊嚴，換來了完成這部書的時間——「人固有一死，或重於泰山，或輕於鴻毛。」','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：《史記》成為中國第一部紀傳體通史，被魯迅譽為「史家之絕唱，無韻之離騷」，流傳至今兩千年。'],
    quote:'他用一生最大的恥辱，換來了中華文明最重要的書——這筆交換，值得。'},
  { name:'李安', work:'台灣／美國', scene:'《斷背山》：拍一部好萊塢不敢拍的電影',
    storytellerName:'李昇', storytellerRole:'李安的父親',
    storytellerIntro:{
      who:'我是李昇，李安的父親。我當了一輩子校長，相信讀書、規矩、正路。我對兒子的期望，是清楚的；他後來走的那條路，起初在我眼裡，不是路。',
      relation:'我和李安的關係，說起來簡單，卻有很長一段時間，我們之間有一堵牆。他在家失業六年，靠太太養，我沉默，他也沉默；那段沉默裡，我們都沒說出口的話，後來全進了他的電影。',
      why:'為什麼由我來說？因為我曾經是那個不理解他的人。我看過他最艱難的時候，也看過他站上奧斯卡領獎的那一刻。只有經歷過那兩端的人，才說得清楚：他走的那條路，需要多大的膽子。'
    },
    storytellerSimple:[
      '李安真正想做的，不是拍一部「成功的電影」，而是把那些在銀幕上從來沒有被說過的故事，說出來——哪怕整個好萊塢都覺得那是個燙手山芋。',
      '可阻礙不只來自外面。他在家失業六年，我們父子之間有那堵看不見的牆；他每次提起電影，我心裡都有一個聲音說：這條路，能走得下去嗎？',
      '他沒有說服我，他只是繼續拍。《推手》、《囍宴》、《飲食男女》，每一部都在跟我說話，說那些我們父子之間說不出口的事。我看懂了，卻沒有告訴他。',
      '《斷背山》讓所有人都說那是職業自殺，沒有製片公司想碰，沒有人認為那個題材能賣座。他還是拍了，用那種極度克制的方式，把壓抑拍得比任何大聲的愛都更讓人心碎。',
      '最讓我意外的，不是他得了獎，而是得獎那天他說的話。他說，每次拍電影都像第一次，都很害怕。我才知道，他那六年在家的樣子，不是沒有方向，而是一直在跟那個害怕相處。',
      '他拿了奧斯卡，站在台上，我坐在電視機前。那一刻我想，他走的那條路，是他的路，不是我替他想的那條；可那條路，他走得比我想的任何一條都更遠。',
      '我這一生教了很多學生，可最讓我想通一件事的，是我自己的兒子：有些人的才華，需要被等待，不是被規劃。'
    ],
    storyteller2Name:'林惠嘉', storyteller2Role:'李安的太太',
    storyteller2Intro:{
      who:'我是林惠嘉。很多人介紹我，都會說「李安的太太」；有一次學校頒傑出校友獎給我，理由也是因為我是李安太太，我在致辭時說：我只是不管他，leave him alone。那不是謙虛，那是真話。',
      relation:'我和李安的關係，說複雜也複雜，說簡單也簡單。他是那種只會做兩件事的人：拍電影，和煮菜。其他的事，他不太行。六年，我養他，他煮飯帶孩子，等「英勇的獵人媽媽帶著獵物回家」。我們就這樣過。',
      why:'為什麼由我來說？因為那六年，我是現場唯一的見證人。不是旁觀者，是一起扛著的人。我看過他最沒用的樣子，也看過他最閃光的樣子；而且我可以告訴你，那兩個樣子，其實是同一個人。'
    },
    storyteller2Simple:[
      '李安真正想做的，不是成名，不是得獎，而是把他心裡那些說不清楚的東西，找到一種方式讓人看見。我很早就知道這件事，因為他跟我講劇本的時候，眼睛會發光，講其他事情不會。',
      '可問題是，六年沒有人要他。經紀公司說他的劇本不夠美國，製片說題材太小眾，整個好萊塢對他的回答就是沉默。他在家，我上班，這就是我們的生活。',
      '他沒有閒著。他讀書、看片、寫劇本，把家裡打掃得一塵不染，把飯煮得比我好。有一次他偷偷去報了電腦班，想轉行。我從他包包裡翻出課程表，當晚一句話都沒跟他說。隔天出門前，我告訴他：學電腦的那麼多，又不差你李安一個。',
      '後來《推手》拍出來了，《囍宴》拍出來了，《飲食男女》拍出來了。我看著這些電影，知道他把那六年全放進去了——那些等待、那些委屈、那些我們在廚房裡說的話。',
      '最讓我意外的，不是他得了奧斯卡，而是他在台上說「我愛你」的時候，我第一個反應是：拜託，大家都在看。他就是這樣，生活裡話很少，關鍵時刻反而說得出來。',
      '他問過我，那六年後不後悔。我說我不對別人說我希望，我只對自己有期望。他聽完沉默了很久。我想他懂。',
      '後來他拿了兩座奧斯卡，回家還是要洗碗做飯。有人說我命好，跟著李安享福。我說：你有沒有搞錯，今天是我特別抽空陪他來買菜的。這不是玩笑，這就是我們的相處方式——平等，就是最大的尊重。'
    ],
    simple:['拍出一部真實、動人，讓世界看見的電影——不妥協於商業壓力，也不妥協於偏見。','《斷背山》是一個幾乎沒有製片公司願意碰的題材；業界普遍認為這樣的電影沒有市場，拍了也會毀掉導演的事業。','他以極度克制的鏡頭語言，把一段壓抑的愛拍得比任何大聲的愛都更令人心痛，用美學說服了所有質疑。','《斷背山》橫掃各大獎項，拿下威尼斯金獅獎，李安成為第一位拿下奧斯卡最佳導演的亞洲人。','他以為拍這部電影是職業冒險，結果它卻成了他最被世界記住的作品之一——市場與藝術都給了他答案。','他放棄了拍「安全的電影」，換來了拍「必須拍的電影」——那個關於壓抑、遺憾與無法說出口的愛的故事。','《斷背山》改變了好萊塢對「哪些故事可以被拍」的想像，李安也證明了：最難被說出口的故事，往往才是最普世的故事。'],
    full:['外在目標：把《斷背山》這個故事完整、誠實地拍出來，讓它進入院線、觸及觀眾。<br><br>內在目標：證明電影可以容納那些社會不願正視的情感——不是為了挑釁，而是因為那些情感是真實的人性。','外在：製片公司的顧慮、市場的不確定性、業界對題材的偏見。<br><br>中層：他是亞裔導演，在好萊塢本就是局外人，這個題材讓他的處境更加邊緣。<br><br>內在：如何在不煽情、不說教的前提下，讓這個故事的重量自己顯現。','他用極度克制的敘事風格——沉默比台詞更多，留白比填滿更重——讓壓抑本身成為電影語言。','電影完成，在威尼斯首映，立刻震驚影壇；隨後在全球上映，票房與評價雙豐收。','他以為這部電影會讓他在好萊塢的位置更邊緣，結果它讓他站上了從未有亞洲人站過的位置。','他放棄了拍市場認為「安全」的電影，換來了一部讓人記住的電影。<br><br>他放棄的：確定性與安全感。<br><br>他換來的：電影史上的一個位置，以及對「哪些故事值得被說」這個問題，一個永久的回答。','李安成為第一位兩度獲得奧斯卡最佳導演獎的亞洲人，《斷背山》成為影史經典。他的作品橫跨武俠、家庭、戰爭、科幻，卻都指向同一件事：人在社會規範與內心真實之間的撕裂。'],
    storyteller3Name:'詹姆斯·沙姆斯', storyteller3Role:'李安長期合作的製片人與編劇搭檔',
    storyteller3Intro:{
      who:'我是詹姆斯·沙姆斯。我和李安合作了將近二十年，從《推手》到《斷背山》。我是他在好萊塢的搭檔，也是那個坐在他旁邊，替他把中文的感受翻譯成英文的電影語言的人。我沒有他的名氣，但我在那些電影裡，每一部都在。',
      relation:'我和李安的關係，是一種很少見的合作——他有感受，我有語言；他有畫面，我有結構；他有那種東方的、沉默的、壓在心底的情感，我有一種把它說出來的方式。我們不一樣，所以我們在一起做的東西，是我們各自做不出來的。',
      why:'為什麼由我來說？因為《斷背山》那部電影，從劇本到完成，是一段沒有人說「這一定行得通」的旅程。李安說他要拍，我說我們試試；好萊塢說沒有市場，我們說那就自己找。那部電影被拒絕了多少次，我記得每一次——因為每一次，是我去接那個拒絕的。'
    },
    storyteller3Simple:[
      '李安想要拍的，不只是一個同志愛情故事，他想拍的是：一個人心裡有一樣東西，那樣東西被整個世界說不行，但那樣東西還是在那裡——那種沉默的、無處可去的愛，那種藏在心底的重量。那個目標，我第一次聽他說，就知道這是他必須拍的電影。',
      '他的阻礙，不只是好萊塢的市場邏輯，而是那個故事本身的難度——怎麼讓一個從來沒有說出口的愛，在銀幕上被感受到？那個沉默，那個不說話，那個背對鏡頭的哭泣，要怎麼變成電影語言？那是我們一起解決的問題，也是這部電影最難的地方。',
      '我們被拒絕了很多次。每次我去說這個項目，對方的臉就是那個表情——「這個觀眾群太小，這個題材太邊緣，這個市場不支持」。李安在台灣，我在紐約，我們用電話和傳真討論，把那個劇本改了又改，等著那個「好」。',
      '電影拍完了，我第一次看完整版的時候，我哭了。那不是因為我不夠專業，而是因為那部電影做到了一件我以為做不到的事：它讓你感受到一個沒有說出口的愛，有多重，有多久，有多無處可去。那是李安的，也是整個團隊的。',
      '奧斯卡的事，大家都知道了——它應該贏最佳影片，它沒有；它贏了最佳導演，那是李安第一次。那個意外，不是我們預料到的；可那個結果說的是：那部電影存在了，那個故事被說出去了，那才是真正的勝利。',
      '李安的轉彎，是他決定拍那部電影的那一刻——放棄了「拍一部好萊塢一定接受的電影」的可能，換來了一部他必須拍的電影。那個放棄，我見證了；那個換來，我也見證了。那是我合作過的所有決定裡，讓我最驕傲的一個。',
      '我們後來沒有再合作了，各自走上了不同的路。可那二十年，那幾部電影，是我職業生涯裡最清楚知道「我在做一件值得的事」的時光。李安是那種讓你相信電影可以說人說不出口的話的導演——和他工作，是一種特殊的榮幸，也是一種持續的挑戰。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練，也是靶心人公式的設計者。遇到像 李安 這樣的人物，我最在意的不是他做了什麼，而是他在哪一刻，做出了讓整個故事站起來的選擇。',
      relation:'我和 李安 的關係，是故事分析者與故事主角的關係。我不一定在他的生命現場裡，但我會把他的目標、阻礙、努力、結果、意外、轉彎與結局，一步一步拆給你看。',
      why:'因為用靶心人公式看 李安，最值得分析的不是表面的成敗，而是他在「《斷背山》：拍一部好萊塢不敢拍的電影」這個節點，怎麼把故事真正轉過去。'
    },
    storyteller4Simple:['用靶心人公式看，李安 真正要做的，是：拍出一部真實、動人，讓世界看見的電影——不妥協於商業壓力，也不妥協於偏見。','這個故事真正有力的阻礙，在於：《斷背山》是一個幾乎沒有製片公司願意碰的題材；業界普遍認為這樣的電影沒有市場，拍了也會毀掉導演的事業。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他以極度克制的鏡頭語言，把一段壓抑的愛拍得比任何大聲的愛都更令人心痛，用美學說服了所有質疑。','故事走到這一步，表面的結果是：《斷背山》橫掃各大獎項，拿下威尼斯金獅獎，李安成為第一位拿下奧斯卡最佳導演的亞洲人。','真正讓這個故事變得難忘的意外，是：他以為拍這部電影是職業冒險，結果它卻成了他最被世界記住的作品之一——市場與藝術都給了他答案。','而最關鍵的轉彎，正是在這裡發生：他放棄了拍「安全的電影」，換來了拍「必須拍的電影」——那個關於壓抑、遺憾與無法說出口的愛的故事。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：《斷背山》改變了好萊塢對「哪些故事可以被拍」的想像，李安也證明了：最難被說出口的故事，往往才是最普世的故事。'],
    quote:'他不是拍給世界看的，他是拍給那些一直以為自己的故事不值得被拍的人看的。'},
  { name:'證嚴法師', work:'台灣', scene:'從一塊錢開始，建立慈濟',
    storytellerName:'王端正', storytellerRole:'慈濟早期核心志工，長期陪伴者',
    storytellerIntro:{
      who:'我是王端正。我不是法師，不是出家人，只是一個很早就跟在上人身邊、看著慈濟從沒有到有的人。很多人認識慈濟，是從它已經很大的時候開始的；我認識的，是它還只是一間小木屋、幾個媽媽、幾個竹筒的時候。',
      relation:'我和上人的關係，是被她的行動改變的人。我不是因為相信她的理論才留下來，而是因為我看見她在做，真的在做，不是在說——那種人，你很難不想跟著走。',
      why:'為什麼由我來說？因為我看過她最小的時候，也看過她最大的時候。只有看過那兩端的人，才能告訴你：她從來沒有因為「大了」就變成另一個人。那個從一塊錢開始的邏輯，她到今天還在用。'
    },
    storytellerSimple:[
      '上人真正想做的，不是建一個大組織，而是讓苦難面前「有人在」——不是隔著捐款收據在，而是親自走進去，站在那個人旁邊。',
      '可她什麼都沒有。花蓮是台灣最偏遠的地方，她是一個沒有背景、沒有資源的修行者，連一間像樣的道場都沒有。',
      '她沒有等條件成熟。她找來三十位家庭主婦，說：每天買菜少買一樣，省下一塊錢放進竹筒。就這樣開始了。',
      '竹筒裡的錢慢慢積起來，第一間診所蓋起來了，第一座醫院蓋起來了，志工一個帶一個，從花蓮到全台灣，再到全世界。',
      '最讓我意外的，不是慈濟變得多大，而是它變大之後，上人從來沒有說「現在我們有資源了，可以不一樣了」。她還是那個邏輯：從現在、從這裡、從你手邊的那一塊錢開始。',
      '她放棄的，是修行人可以選擇的那種清淨——躲在山裡，把世界的苦交給世界自己去受。她換來的，是每一場災難現場裡，都有一群穿藍衣服的人出現。',
      '我跟了她這麼多年，學到最重要的一件事不是佛法，而是：不要等。苦難不等你準備好，所以你也不能等苦難準備好再去。'
    ],
    storyteller2Name:'星雲法師', storyteller2Role:'台灣佛教領袖，與證嚴法師同為台灣四大佛教山頭',
    storyteller2Intro:{
      who:'我是星雲。我和證嚴法師，走的是兩條路——她走慈善，我走制度；她讓人彎下腰，我讓人站起來。外界常常把我們比較，說哪一種才是對的方法。我不這樣想。',
      relation:'我和她的關係，是同時代台灣佛教的兩個方向。我們認識，我尊重她，她也尊重我。我們選擇的路不同，但那個不同，是佛法的豐富，不是矛盾。她做了我沒有做、也做不了的事；我做了她選擇不做的事。',
      why:'為什麼由我來說？因為我是最能看清楚她選擇的代價的人。她選擇從最小的地方開始，選擇讓慈悲以最具體的形式落地——那個選擇，在我看來需要一種我不確定自己有的東西：甘願永遠在現場，甘願不要制度的保護，甘願只靠一顆心撐著。'
    },
    storyteller2Simple:[
      '她真正想要的，不是一個組織，而是讓每一個受苦的人都能被看見、被抱起來。這個願望，我懂——我也有。可她的方式，是直接走進去，用身體去做；而我的方式，是建制度，讓更多人可以一起做。',
      '她最大的阻礙，我看得很清楚：她不是沒有辦法建制度，而是她選擇讓愛走在制度前面。那個選擇，讓慈濟在最快的速度內到達最需要的地方；但也讓慈濟一開始，完全依靠她一個人的心力撐著。',
      '她從三十個媽媽和一個竹筒開始，沒有向任何人要錢，沒有向任何機構申請資源。我那時在辦學院、建道場，用的是比她更多的資源；可她的每一塊錢，都比我來得更直接，更貼近那個苦難本身。',
      '慈濟後來變成了全球規模的組織，醫院、學校、媒體、志工遍及全世界。那個結果，從她的起點看，是一件幾乎不可能的事。可她做到了——不是靠制度，而是靠一種讓人一旦看見就想跟著做的感召力。',
      '最讓我感到意外的，是她在組織變大之後，仍然沒有讓制度取代那個最初的心。我建制度，是因為我相信制度能讓人才傳承；她選擇讓那個心一直燃著，讓每一個志工都感覺自己是直接回應苦難的人，而不只是一個組織的齒輪。',
      '我們的差別，不是誰對誰錯，而是我們選擇了佛法兩個不同的入口——我從制度進，她從悲心進。這個世界同時需要這兩種人：一種讓你知道佛法可以有多大，另一種讓你知道佛法可以有多近。',
      '她留下的，不只是慈濟這個組織，而是一個提醒：再大的制度，都應該有一顆甘願彎下腰的心在裡面；否則，制度只是制度，而不是慈悲。那是她教我的，雖然她從來沒有直接對我說過。'
    ],
    storyteller3Name:'心道法師', storyteller3Role:'靈鷲山開山和尚，世界宗教博物館創辦人',
    storyteller3Intro:{
      who:'我是心道。我在星雲大師座下出家，走了一條和他不一樣的路，也走了一條和證嚴法師不一樣的路。可每次我在想「苦難面前，一個修行者應該做什麼」這個問題，我都會想到她。',
      relation:'我和證嚴法師的關係，是遠觀的尊重。我們不常見面，走的路也不同——我走苦修和跨宗教，她走慈善和入世服務；可在「用生命回應苦難」這件事上，我們是同一種人。',
      why:'為什麼由我來說？因為我比任何人都懂那種從「什麼都沒有」開始的感覺——我是孤兒，她是一個沒有資源的修行者；我在墳場苦修，她在花蓮彎下腰。那個起點的相似，讓我看她的故事，有一種別人沒有的共鳴。'
    },
    storyteller3Simple:[
      '她想要的，說到底，是讓每一個苦難不要無聲無息地消失——讓那些被忽視的人，至少被一個人看見、被一雙手扶起來。這個願望，我懂。我在墳場苦修的時候，看見的是死亡；她在花蓮看見的，是活著卻無人在乎的苦。那是一樣的東西，只是不同的臉。',
      '她的阻礙，是「什麼都沒有」。我也是從什麼都沒有開始的——沒有家，沒有背景，沒有人告訴我路在哪裡。她的「沒有」，是沒有資源、沒有場所；我的「沒有」，是沒有家人、沒有根。可我們都沒有用「沒有」當理由停下來。',
      '她用竹筒和三十個媽媽開始。我用斷食和塚間開始。方法不一樣，但那個邏輯一樣：你現在有什麼，就從那裡開始，不等條件成熟。她的竹筒，是她的塚間；都是一種「我就從這裡，現在，出發」的決定。',
      '她慢慢建起了醫院、學校、志工網絡。我出關後建了靈鷲山，後來建了世界宗教博物館。我們的規模都比一開始想的大很多；可我知道，那個大，不是計劃出來的，是那個初心一直在燃燒，然後越來越多人被點到。',
      '最讓我感動的，不是慈濟有多大，而是她讓每一個志工都感覺自己是在直接回應苦難，而不是在支撐一個機器。那種讓人和苦難之間沒有隔層的方式，是我一直在學的東西——我建世界宗教博物館，是希望不同信仰的人能直接相遇，沒有隔層；她建慈濟，是讓人直接走進苦難，沒有距離。',
      '她的轉彎，是把修行者「自我完成」的目標，全換成了「替他人」的行動。我的轉彎，是把個人苦修的成果，轉向對世界和平的承諾。我們各自放棄了某種個人的清靜，換來了一種更難、也更真實的修行——在世間，在苦難裡，在眾生中。',
      '我看她的故事，想到的是：一個人若真的把悲願放在自己前面，力量是無窮的。不是因為她特別聰明、特別有資源，而是因為她的每一步，都是那個悲願在走，不是她自己在走。那，才是修行最深的地方。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練。我用靶心人公式分析故事，拆解人物，找那個讓故事真正站起來的關鍵時刻。證嚴法師這個故事，我看了很多遍——每次看，都在同一個地方停下來。',
      relation:'我和證嚴法師，是故事分析者和故事主角的關係。我沒有見過她，可她的故事我已經說過很多次——因為這是教學現場最好用的案例：看起來最不像英雄的人，走出了最英雄的路。',
      why:'為什麼由我來說？因為我是靶心人公式的創造者，而她的故事，是我見過靶心人公式走得最完整的真實案例之一。七個步驟，她一個都沒跳過；但她做到的方式，讓每個步驟都像是輕描淡寫——那才是最高段的。'
    },
    storyteller4Simple:[
      '你知道台灣最會募款的人是誰嗎？不是企業家，不是政治人物。是一個1966年住在花蓮、手上沒有一毛錢的出家人。她的目標，說起來很簡單：讓苦難面前，有人在。',
      '可她的阻礙，是「什麼都沒有」。花蓮是台灣最窮的地方，她是一個沒有背景、沒有資源、沒有任何人相信她能做什麼的女性修行者。用靶心人公式的語言說：阻礙，是全方位的。',
      '她的努力，簡單到讓人不敢相信。她說：「每天買菜，少買一樣，省下一塊錢，放進竹筒。」三十個家庭主婦，三十個竹筒，一塊錢一塊錢地積。這，就是她的努力。',
      '結果呢？竹筒裡的錢積起來了，診所蓋起來了，醫院蓋起來了，志工從花蓮到全台灣，再到全世界九十個國家。一塊錢，最後變成了什麼？答案是：全球最大的佛教慈善組織。',
      '可最讓我意外的，不是慈濟有多大。用靶心人公式說，這才是故事的「意外」——她變大之後，從來沒有說「好了，現在我們有資源了，可以換個方式了」。她還是那個邏輯：從現在、從這裡、從你手邊那一塊錢開始。',
      '這就是她的轉彎。不是情節的轉，是視角的轉——她沒有把「一塊錢」當成貧乏的起點，而是把它當成一種可以無限複製的方法。那個轉彎，讓她從「做慈善的人」，變成「示範慈善如何可能的人」。',
      '她沒有等世界準備好，她只是先做了。這是靶心人公式最難教的一課：意外和轉彎，往往不是發生在外面，而是發生在你對自己處境的詮釋裡。她把「沒有」詮釋成「起點」，然後讓世界跟上來。'
    ],
    simple:['在台灣東部最貧窮的地方，建立一個真正能幫助苦難的慈善組織。','她是一個沒有資源、沒有背景、沒有錢的修行者，面對的是最偏遠、最缺乏醫療的地方。','她說服三十位家庭主婦，每天省下買菜的一塊錢投入竹筒，從最小的行動開始積累。','慈濟從一個小小的功德會，成長為擁有醫院、學校、媒體、志工網絡的全球慈善組織。','她從未預計「一塊錢」能建出一座醫院——但那個積累的邏輯，後來改變了幾百萬人的生命。','她放棄了「等到有足夠資源再開始」的邏輯，換來了「從現在、從最小處開始」的實踐力量。','慈濟成為全球最大的佛教慈善組織之一，在全球超過90個國家和地區都有志工，她本人被視為台灣最具影響力的精神領袖之一。'],
    full:['外在目標：在花蓮建立醫療與慈善體系，幫助無力就醫的貧苦民眾。<br><br>內在目標：把佛法的慈悲從廟堂帶進真實的苦難現場——不是談論苦難，而是直接走進去。','外在：沒有錢、沒有土地、沒有人脈，花蓮是台灣資源最匱乏的地方。<br><br>中層：她是女性出家人，在當時的社會既無權威也無資源。<br><br>內在：如何說服別人，從「我們什麼都沒有」開始做一件大事。','她沒有等資源到位，而是把「行動本身」當成資源的起點——每人每天一塊錢，每一個小動作都是實踐慈悲的完整行為。','慈濟從小小的竹筒歲月，一步一步建起診所、醫院、學校、大學、電視台，遍布全球的志工網絡。','她從未預計這件事會長成這個規模；最大的意外是，「從最小處開始」這個看似謙遜的邏輯，反而讓組織長出了最驚人的韌性。','她放棄了等待條件成熟的可能，選擇讓「行動本身創造條件」。<br><br>她放棄的：在修行中獨善其身的清淨。<br><br>她換來的：一種入世的慈悲——苦難在哪裡，慈濟就在哪裡。','慈濟成為全球最大佛教慈善組織之一，在超過90個國家都有足跡。她留下的不只是一個組織，而是一種精神：不等待，從現在、從你手邊的一塊錢開始。'],
    quote:'她沒有等世界準備好，她只是先做了，然後讓世界跟上來。'},
  { name:'星雲法師', work:'台灣', scene:'從12歲窮小和尚，用制度建立現代佛教教團',
    storytellerName:'心保和尚', storytellerRole:'佛光山住持，星雲法師的弟子',
    storytellerIntro:{
      who:'我是心保和尚，佛光山住持。師父圓寂那天清晨，是我在大雄寶殿向全山僧眾宣布這個消息的。那一刻，我比任何人都更清楚——走的是一個人，留下來的是一座山、一個制度、一種讓佛法走進人間的方式。',
      relation:'我和師父的關係，是師徒，也是承接者。他建的不只是寺院，而是一套讓人才可以被培養、讓組織可以延續、讓佛法不靠一個人就能傳下去的制度。我今天能站在這個位置，就是那套制度的結果。',
      why:'為什麼由我來說？因為外人看的是星雲法師有多偉大，而我說的是：他為什麼刻意讓自己變得「不必要」。一個人能把事業做大，很了不起；能把自己設計成可以被取代，更難。這一點，才是師父最讓我折服的地方。'
    },
    storytellerSimple:[
      '師父真正想做的，不是讓更多人知道他，而是讓佛法能走出山林、走進每一個人的日常生活——他稱之為「人間佛教」。',
      '可最大的阻礙，是傳統佛教的格局：寺院靠香火、靠一代高僧，缺了那個人，一切就散了。師父從年輕時就看見這個問題，他知道光靠自己，走不遠。',
      '他一邊弘法，一邊辦學院培養人才，一邊訂立制度讓組織自己能運作。他說「以文化弘揚佛法，以教育培養人才」，那不是口號，是他每天在做的事。',
      '佛光山蓋起來了，五所大學辦起來了，全球三百餘所寺院建起來了，兩千多位弟子出家了。可最讓人意外的結果，不是這些數字，而是師父在1985年，按照自己訂的章程主動退位。',
      '最意外的，是他選擇讓制度比自己更大。很多人走到那個位置，會讓制度服從自己；他讓自己服從制度，然後把鑰匙交出去。',
      '他的轉彎，不是某一天的決定，而是一生都在做的選擇：把佛法從「一個人的修行」，變成「一個制度的傳承」。他放棄了讓自己成為不可取代的位置，換來了一個在他死後還能繼續運轉的教團。',
      '師父2023年圓寂，享壽97歲。他走的時候交代，不要念阿彌陀佛，因為「極樂淨土就在人間」。那句話，就是他一生在做的事的最後一個注解。'
    ],
    storyteller2Name:'證嚴法師', storyteller2Role:'慈濟創辦人，與星雲法師同為台灣佛教代表性人物',
    storyteller2Intro:{
      who:'我是證嚴。我和星雲法師，外界常常把我們放在一起比較。我不太習慣比較，因為每個人走的路，是根據自己的因緣和發願；可若你問我對星雲法師的看法，我只能說：他做了我佩服、卻選擇不走的那條路。',
      relation:'我和星雲法師的關係，是台灣佛教這片土地上，兩個選擇了不同方向的人。他建制度，我彎下腰；他讓佛法走向世界，我讓佛法走進苦難。這兩條路，最後都是為了同一件事：讓更多人能夠被佛法接住。',
      why:'為什麼由我來說？因為我最清楚，他走的那條路有多難。要建制度，要培養人才，要讓組織在自己身後還能繼續——那需要一種我選擇不用的方式：讓規模擴張，讓自己退後，讓制度站在前面。那個「退後」，需要的無我，不比彎下腰少。'
    },
    storyteller2Simple:[
      '星雲法師真正想要的，是讓佛法能夠傳承——不只傳到下一代，而是傳到沒有邊界的地方。那個想望，和我是一樣的；只是他選擇用制度來承載，我選擇用一個個人的心來承載。',
      '他最大的阻礙，不是外在的困難，而是傳統佛教的慣性：靠一代高僧撐著，缺了那個人就散了。他要改變的，是這個習慣本身——讓制度比人更大，讓組織不靠一個人的魅力運作。',
      '他辦學院、建道場、訂章程——每一步都是在把佛法從「師父個人的承擔」，轉移到「一套可以持續運轉的架構」裡。我看著他做這些，心裡有尊重，也有一種不同的選擇：我用的方式，是讓每一個志工都感覺自己在直接回應苦難，而不是在支撐一個系統。',
      '他1985年主動退位，那件事，我想了很久。一個建立了那麼大教團的人，選擇在自己仍然健在的時候，把鑰匙交出去——那不是謙遜，那是一種深刻的智慧：他知道，制度若要真正活下去，必須比任何一個人都更大。',
      '最讓我感到震動的，是他走的時候說的那句話：「極樂淨土就在人間。」那句話，和我一直在做的事，指向的是同一個地方——苦難在哪裡，佛法就應該在哪裡；不是在山上，不是在彼岸，而是在當下、在現場。',
      '他的轉彎，在於他把自己建成了一座橋，讓後來的人可以走過去，不必從頭再來一次。我的轉彎，是讓每一個人都能直接跨過那道門，不必等制度準備好。兩種方式，各有它的完整。',
      '我們在同一片土地上，走了不同的路，到達了相近的地方。若有一天有人問我，台灣佛教給了這個世界什麼，我會說：一種讓慈悲有制度可以依附的方式，以及一種讓制度裡永遠有一顆甘願彎下腰的心的方式。那兩樣，我們各做了其中一樣。'
    ],
    storyteller3Name:'心道法師', storyteller3Role:'靈鷲山開山和尚，星雲法師的弟子',
    storyteller3Intro:{
      who:'我是心道。師父替我剃了頭，給了我名字，給了我根；然後我走了自己的路。這件事，我一直覺得，是師父給我最好的禮物——他讓我走，沒有攔我。',
      relation:'我和師父的關係，是師徒，也是兩個走了不同路的人看彼此。他在佛光山建制度，我在靈鷲山苦修；他走向規模，我走向深度。可我知道，若沒有他給我的那個根，我後來走的那些路，會更孤獨。',
      why:'為什麼由我來說？因為滿了法師說的是追隨，星雲法師說的是師父；而我說的，是一個弟子在走出去之後，回頭看師父留下的那些東西，看見了什麼。有時候，離開了，才能看清楚。'
    },
    storyteller3Simple:[
      '師父想要的，我從他身上看見的，是讓佛法不因任何一個人的離去而中斷——那個「不中斷」，需要制度，需要傳承，需要一種把自己設計成可以被取代的智慧。我年輕時不完全懂這個；走了我自己的路之後，我懂了。',
      '他的阻礙，是人性本身——包括他自己的人性。一個有能力、有魅力的人，要讓制度比自己更大，那需要對抗的，是他自己想要留下來、想要不可缺少的那個部分。他做到了。我在靈鷲山也試著做同樣的事，但我知道，那有多難。',
      '他辦學、建道場、訂清規，把每一件事都做成一個不需要他才能運作的系統。我在墳場苦修的那些年，他在蓋佛光山；我們用的是完全不同的方式，可我後來明白，那兩種方式，都是佛法需要的。',
      '1985年他主動退位，那件事我聽說的時候，心裡有種說不清的感受。一個建立了那麼大規模的人，在自己還在的時候，把位置讓出去——那不只是謙遜，那是一種對制度的信任，對傳承的信任。我不確定我能不能做到同樣的事。',
      '最讓我看見師父偉大的地方，不是他建了多少，而是他建的東西，在他走了之後還活著。我在靈鷲山建的東西，我希望也是這樣；可建制度，和我選擇的苦修路，是不一樣的挑戰——苦修是對自己，制度是對未來。師父做的，比苦修更難。',
      '他的轉彎，是用一生去示範：佛法的傳承，不靠一個人的力量，而靠一套讓更多人可以繼續走的結構。我的轉彎，是把個人修行轉向跨宗教的和平。我們的轉彎不一樣，但都是把個人的成就，放到比自己更大的事情裡去。',
      '師父2023年圓寂。我聽到消息，沉默了很久。他替我剃頭的那天，我是一個什麼都沒有的童兵孤兒；他離開的那天，我已經走出了自己的路。那中間的距離，有一部分，是他給的。那份恩，不是用說的，而是用走出去這件事，來還的。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練。我分析過上千個故事，但讓我反覆回來看的，是那些「贏在奇怪地方」的故事。星雲法師的故事，奇怪的地方在：他最重要的一個決定，不是他做了什麼，而是他選擇不做什麼。',
      relation:'我和星雲法師的關係，是故事分析者和一個建立了超長篇敘事的人。他的故事太大，我只能選一個切片——我選1985年，他主動退位那一刻。那是整個故事最反常識的轉彎，也是最值得分析的地方。',
      why:'為什麼由我來說？因為靶心人公式最難教的步驟是「轉彎」——大多數人的轉彎，是被逼的；真正好的故事，轉彎是主動選擇的。星雲法師1985年的退位，是我見過真實人物裡，最主動、最清醒的一個轉彎。'
    },
    storyteller4Simple:[
      '我問你一個問題：一個人最難做到的事是什麼？不是創業，不是成名。用靶心人公式的語言說，真正最難的，是在故事的「結果」已經達成之後，還願意製造一個更大的「轉彎」。星雲法師做到了。',
      '他的目標：讓佛法不靠一個人撐著，不因任何一個人的離去而中斷。這是比「蓋一座佛光山」更難說清楚的目標——因為它的成功，要在他不在了之後才能被驗證。',
      '他的阻礙，不是資源，不是對手，而是幾千年的傳統慣性：師父說了算，師父走了，散了。要打破這個慣性，必須讓制度比人更大——可在那樣的環境裡，這件事本身就是最大的阻礙。',
      '他的努力：辦學院、訂章程、建制度，把每一件事都做成一個不需要他才能運作的系統。這個努力，不華麗，不戲劇，但每一步都指向同一個方向：讓自己變得可以被取代。',
      '結果：佛光山成了全球最大漢傳佛教教團之一。三百餘所道場，五所大學，兩千多位弟子。可最讓我意外的結果，不是這些數字——而是1985年，他在全盛時期，依照自己訂的章程，主動退位。',
      '這是整個故事的轉彎，也是最反常識的一筆：最有能力的人，在最巔峰的時候，選擇退後。他沒有被逼，沒有失敗，只是他的目標，比他自己更重要。他放棄了「不可取代」，換來了「可以傳承」。',
      '他2023年圓寂，說了最後一句話：「極樂淨土就在人間。」這是他一生工作最後的注解，也是靶心人公式「結局」最乾淨的示範——一句話，把七個步驟都收進去了。'
    ],
    simple:['把佛法從山林帶進現代社會，建立制度化、國際化的現代佛教教團。','傳統佛教缺乏制度，靠一代高僧支撐，人走了組織就散；他一個12歲意外出家的窮小和尚，沒有背景，沒有資源。','辦學院、訂章程、建寺院、辦媒體、創辦大學，一步步把佛光山從一片荒地，蓋成有制度、有組織的現代教團。','佛光山成為全球規模最大的漢傳佛教教團之一：三百餘所寺院、五所大學、逾兩千位出家弟子、數百萬信眾。','他在1985年，依自己訂立的章程主動退位、傳法弟子——這是他留下的最重要的示範：制度比人更大。','他放棄了讓自己成為不可取代的位置，換來了一個在他身後還能繼續運轉、繼續傳法的教團。','2023年2月圓寂，享壽97歲，留下一句話：「極樂淨土就在人間」——那是他一生工作最後的注解。'],
    full:['外在目標：讓佛法走出山林，走進現代人的生活，建立可以持續傳承的現代佛教教團。<br><br>內在目標：證明一個出身寒微、沒有資源的人，可以靠理念和制度，而不是靠名望和個人魅力，讓一件事情延續。','外在：傳統佛教缺乏現代化的組織制度，資源極度匱乏，社會對佛教的刻板印象根深蒂固。<br><br>中層：他12歲意外出家，1949年以難民身分來台，身上幾乎一無所有。<br><br>內在：如何在一個習慣「師父說了算」的傳統宗教環境裡，讓制度的重要性超越個人。','辦壽山佛學院培養人才，1967年在高雄創建佛光山，訂立清規章程，以「文化、教育、慈善、共修」四大宗旨為方向，把建立制度當成弘法的核心工作。','佛光山從一片荒地，成長為全球最具規模的漢傳佛教教團之一：三百餘所道場、五所大學、兩千多位出家弟子、數百萬信眾、《人間福報》日報、人間衛視。','他在1985年，依照自己訂立的章程主動退位——全盛時期交出權力，讓制度凌駕於個人之上。這在宗教界極為罕見，也是最讓人意外的轉折。','他放棄了讓自己成為教團核心的可能，換來了一個不因他的存在或離去而改變運轉的傳承。<br><br>他放棄的：讓自己成為不可取代的人。<br><br>他換來的：一個在他圓寂後仍然能繼續走下去的教團，以及「人間佛教」這個理念在全世界的落地。','2023年圓寂，享壽97歲。他留下的不只是一座佛光山，而是一套讓後人能夠繼續弘法的制度框架，以及「佛法不是高高在上的學問，而是可以讓每個人活進去的生命方式」這個核心信念。'],
    quote:'他不是建了一座山，而是建了一套讓山在他走後還能繼續長的制度。'},
  { name:'心道法師', work:'台灣', scene:'從童兵孤兒到斷食閉關，建立世界宗教博物館',
    storytellerName:'滿了法師', storytellerRole:'靈鷲山弟子，長期陪侍者',
    storytellerIntro:{
      who:'我是滿了法師，跟隨心道法師多年。師父走過的路，我沒辦法全部跟上——童兵的歲月、塚間的苦修、兩年斷食閉關——那些我沒有親歷。可我看見的，是那些苦修結束之後的他：一個把所有修行的重量，轉換成對眾生的悲願的人。',
      relation:'我和師父的關係，是在他已經出關之後才真正建立的。我認識的是那個開山之後的心道法師——一個說話很輕、笑容很廣、卻讓你一靠近就感受到某種說不清楚的重量的人。',
      why:'為什麼由我來說？因為師父的生命故事，從外面看是一條苦行的路；可從裡面看，苦行從來不是目的，而是他用來磨出一顆能真正感受眾生苦痛的心的方式。我說的，是那顆心走到世界宗教博物館的那一段路。'
    },
    storytellerSimple:[
      '師父真正想要的，從最初就不只是自己成佛，而是要讓每一個眾生都能找到離苦的路——那三句刺在身上的誓言，不是少年的衝動，是一個孤兒對這個世界發出的最深的宣告。',
      '他最大的阻礙，是自己的過去：4歲成孤兒，9歲童兵，在生死之間長大的人，要怎麼從那些創傷裡走出來，走向慈悲？那條路，沒有人替他鋪好，只能靠修行一步一步走。',
      '他出家，頭陀行腳，在墳場塚間苦修，在福隆山上斷食閉關兩年——每天只喝山泉水。那不是苦行主義，那是他在用最極端的方式，把生死看清楚，把那些創傷消化成悲願。',
      '出關之後，他建靈鷲山無生道場，開始弘法。可他還有一個更大的夢：建一座讓所有宗教都能相互看見、相互理解的博物館。那個夢，在1991年開始成形。',
      '最讓人意外的，不是他有這個夢，而是他真的把它做出來了。一個從童兵走出來的法師，用了十年時間，在台灣蓋出了全球第一座世界宗教博物館。2001年開館，那不只是一棟建築，而是他把「尊重每一個信仰」這句話，變成了一個真實存在的地方。',
      '他的轉彎，是把個人的苦難轉化成對跨宗教和平的承諾——他不只要讓佛教徒找到平靜，他要讓基督徒、穆斯林、猶太人、印度教徒，都能在同一個屋頂下，看見彼此信仰裡那個共同的光。',
      '世界宗教博物館開館後，他繼續奔走世界，推動回佛對談，創立「愛與和平地球家」國際組織。那個童兵孤兒走了多遠？從滇緬山區到聯合國，從一個沒有名字的孩子到一個在世界宗教對話桌上有位子的人。'
    ],
    storyteller2Name:'星雲法師', storyteller2Role:'心道法師的剃度恩師，臨濟宗法脈傳承者',
    storyteller2Intro:{
      who:'我是星雲。心道，是我的弟子——1973年，他在佛光山叢林大學，在我座下剃度出家，法名心道。那是五十年前的事。一個從滇緬山區走出來的童兵孤兒，走進了佛光山，我替他剃了頭，給了他一個名字。我沒有料到，他後來會走到那麼遠的地方。',
      relation:'我和心道的關係，是師父和弟子，也是兩個走了不同路的人。他後來出關，走他自己的路——靈鷲山、世界宗教博物館、三乘法脈——那和佛光山的方向不一樣。可方向不一樣，不代表傳承斷了。有些人，在你那裡得到了根，然後去別的地方長成自己的樣子。',
      why:'為什麼由我來說？因為滿了法師說的是跟隨者的視角，而我說的是師父的視角——一個替他取了名字、看著他走出去的人，怎麼看待他後來走的那條路。師父的責任，不是讓弟子永遠留在自己身邊，而是讓他找到自己的路。心道，做到了。'
    },
    storyteller2Simple:[
      '他出家的時候，我看見的是一個沉默、眼神很深的年輕人。他不多說話，可你感覺得到，他心裡有某種東西，是很多在平順環境長大的人沒有的——一種對苦難的直接感知，不是從書上學來的，是從生命裡帶出來的。',
      '他最大的阻礙，是他的起點：童兵、孤兒、烽火、流離。那些不只是背景，那些是他的骨頭——深的，不容易消化，也不容易忘記。他出家之後，選擇用苦修去面對那些，不是逃避，而是正面走進去。',
      '他在佛光山待了一段時間，然後離開，走他自己的路——塚間修，閉關，斷食兩年。我知道那些，可我沒有阻止他。一個法師的責任，不是替弟子選路，而是讓他有根可以出發。他出發了。',
      '他建了靈鷲山，然後有了世界宗教博物館那個夢。我聽說那個計畫的時候，心裡有一種感受，很難說清楚——那是一個比任何一個宗派都更大的願望：讓所有宗教都能相互看見。這個願望，需要一個在生死之間真正走過的人才說得出口。',
      '2001年，世界宗教博物館開館。我那時看著那個消息，想到1973年那個在佛光山剃了頭的年輕人，想到他身上刺著的三句話——「吾不成佛誓不休」「真如度眾生」。他做到了。不是以我的方式，而是以他自己的方式。',
      '他的轉彎，是把那些創傷——童兵的生死、塚間的苦修——轉化成了一種對生命最廣闊的理解：不只是一個宗教的生命，而是所有生命。那個轉化，是我替他取了名字之後，他自己走出來的。',
      '一個師父最想看到的，不是弟子永遠跟在自己身後，而是弟子走出去，走到比自己更遠的地方，做比自己更大的事。心道，做到了。那是我在他身上，最感到欣慰的一件事。'
    ],
    storyteller3Name:'證嚴法師', storyteller3Role:'慈濟創辦人，與心道法師同為台灣佛教代表性人物',
    storyteller3Intro:{
      who:'我是證嚴。心道法師，我認識他的故事，多過認識他這個人。我們走的路不同——他走苦修和跨宗教，我走慈善和直接服務；可在「用生命回應這個世界」這件事上，我覺得我們是一樣的。',
      relation:'我和心道法師的關係，是遠遠的相互理解。我沒有他走過的那條路——童兵、孤兒、塚間——那些，我沒有。可我懂那種「從什麼都沒有開始」的感覺，懂那種「只靠悲願撐著」的力量。',
      why:'為什麼由我來說？因為他建的世界宗教博物館，讓我想了很多。我讓慈濟走進苦難的現場，他讓不同信仰走進同一個屋頂下。我們各自用不同的方式，在問同一個問題：人與人之間，最深的連結是什麼？'
    },
    storyteller3Simple:[
      '心道法師想要的，我第一次真正理解，是在我想到他建世界宗教博物館的時候。那不是一個佛教徒的建築——那是一個在烽火中長大的人，在問：我怎麼讓這個世界不再有那樣的烽火？那個問題，比任何宗教都大。',
      '他最大的阻礙，是他自己的起點。一個沒有家、沒有根的孤兒，要建一個讓全世界宗教都能在裡面相遇的空間——那需要一種膽子，和一種我不確定自己有的願力。我從一塊錢和三十個媽媽開始，他從塚間和斷食開始；兩種「什麼都沒有的開始」，通向了兩個不同的地方。',
      '他苦修的那些年，我在建慈濟；他在墳場，我在醫院。我們都在面對生死，只是面對的方式不一樣。他用靜默和苦行去理解死亡，我用行動和陪伴去回應死亡。那兩種方式，我後來覺得，是同一件事的兩面。',
      '他出關後建靈鷲山，然後有了世界宗教博物館的夢。我聽說那個計畫，心裡有種感動——不是因為它很大，而是因為它背後的問題很誠實：如果我們無法讓不同信仰相互理解，那所有的慈悲都只是在自己的圈子裡轉。',
      '最讓我看見他的地方，是2001年博物館開館之後，他繼續奔走——不是因為有人在等他，而是因為那個夢還沒有做完。我也是這樣：慈濟組織越來越大，可每一場災難來臨，我還是覺得還有更多人需要被看見。那種「還沒夠」的感覺，是悲願最真實的樣子。',
      '他的轉彎，是把個人的苦難和苦修，轉向對世界和平的責任。我的轉彎，是把個人的修行清淨，轉向對苦難的直接回應。我們各自放棄了某種「只顧自己」的可能，換來了一種更重、也更真實的使命。',
      '我們都從「什麼都沒有」走到了一個比自己想的更大的地方。那不是因為我們計劃得好，而是因為那個悲願夠真。願力，是最真實的資源——比錢、比人脈、比背景，都更能走遠。心道法師的一生，是這件事最好的示範之一。'
    ],
    storyteller4Name:'許榮哲', storyteller4Role:'故事教練，靶心人公式創造者',
    storyteller4Intro:{
      who:'我是許榮哲，故事教練。我說過很多「把厄運跑成奇蹟」的故事，但心道法師的故事，是我見過厄運份量最重的一個。四歲孤兒，九歲童兵，刺字立誓，斷食兩年——每一個單獨拿出來，都已經是一個完整的故事了。',
      relation:'我和心道法師的關係，是故事分析者和一個把所有厄運都當成材料的人。他身上發生的事，如果換成一般人，每一件都足以成為人生停止的理由。可他把每一件都往前走，走到世界宗教博物館。',
      why:'為什麼由我來說？因為靶心人公式最核心的問題是：「這個人的阻礙有多大，他還是選擇往前走？」心道法師的阻礙，是我在分析真實人物時見過最大的——而他往前走的方式，每一步都是教材。'
    },
    storyteller4Simple:[
      '讓我用靶心人公式問你第一個問題：這個故事的主角，目標是什麼？他十五歲，把三句話刺進手臂——「吾不成佛誓不休」「真如度眾生」「悟性報觀音」。不是寫在紙上，是刺進去的。這，就是他的目標。',
      '他的阻礙是什麼？列出來看看：四歲成孤兒，九歲當童兵，十三歲撤退台灣，什麼都沒有。然後出家，在墳場苦修，在福隆山斷食閉關兩年，每天只有山泉水。用靶心人公式說：阻礙，是人生本身。',
      '他的努力，是一種我在分析故事時很少見的形式——不是往外打，而是往內挖。塚間苦修，是往內挖；斷食閉關，是往內挖。他用最極端的方式，把那些創傷消化成悲願，再把悲願當成出發的力量。',
      '結果：出關，建靈鷲山，然後說出一個讓所有人都以為他在開玩笑的話：「我要蓋一座讓全世界所有宗教都能在裡面相遇的博物館。」這是靶心人公式的「結果」——可它看起來，更像是一個新的「目標」。',
      '意外在哪裡？他花了十年，真的把它蓋出來了。2001年，全球第一座世界宗教博物館在台灣永和開館。一個沒有錢、沒有背景的童兵孤兒，把跨宗教對話變成了一棟真實存在的建築。這，才是意外。',
      '他的轉彎，是把個人的厄運，轉化成對世界的承諾。他沒有說「我受夠了，我只想安靜修行」——他說「正因為我知道苦難是什麼，我要讓不同信仰的人不再把對方當敵人」。厄運，變成了他說話的資格。',
      '今天早上我跑的是接力賽，但真正被傳出去的，是一個人把厄運跑成奇蹟的故事——這句話，用在心道法師身上，是最準的。從滇緬山區到世界宗教博物館，那條路有多遠？就是厄運和奇蹟之間的距離。'
    ],
    simple:['從孤兒童兵到修行者，建立全球第一座世界宗教博物館，推動跨宗教對話與和平。','4歲成孤兒，9歲童兵，在烽火中長大，與生死朝夕相處；出家後苦修多年，在墳場塚間頭陀行腳，最後在福隆山斷食閉關兩年。','出關後建立靈鷲山無生道場，同時發願建一座讓所有宗教都能相互理解的博物館，為此奔走籌備長達十年。','2001年，全球第一座世界宗教博物館在台灣新北市永和開館，讓佛教、基督教、伊斯蘭教、猶太教等在同一空間並立對話。','最意外的，是一個沒有資源、沒有背景的童兵孤兒，把跨宗教對話變成了一個真實存在的建築和機構。','他放棄了獨修清靜的可能，換來了奔走世界、替不同信仰之間搭橋的責任——以悲願取代個人解脫。','創立「愛與和平地球家」國際NGO，身兼南傳、漢傳、藏傳三乘法脈，持續推動世界宗教和諧，是台灣佛教走向世界的獨特聲音。'],
    full:['外在目標：建立一座讓所有宗教都能相互看見、相互理解的世界宗教博物館，推動跨宗教和平對話。<br><br>內在目標：把童年在生死烽火中積累的創傷，轉化為對眾生苦難的深刻理解，用修行換來真正有分量的慈悲。','外在：沒有背景、沒有資源，一個童兵孤兒試圖建立一個對整個世界說話的宗教文化機構。<br><br>中層：傳統佛教路徑中，一個人的苦修通常指向個人解脫，而非對外的社會行動。他要走一條不同的路。<br><br>內在：如何讓童年的創傷成為力量，而不是束縛？如何把個人的悲願，轉化成一個對世界有意義的行動？','4歲成孤兒，9歲童兵，13歲隨孤軍撤台，15歲刺字立誓，25歲出家。此後頭陀行腳十餘年，在墳場塚間苦修，最後在福隆山法華洞斷食閉關兩年，只靠山泉水和少量百花丸維生。','出關後建立靈鷲山無生道場，以「慈悲與禪」為宗風，展開弘法。1991年發願建世界宗教博物館，籌備十年，2001年在台北永和開館，成為全球首座以「尊重每一個信仰，包容每一個族群」為核心的宗教文化博物館。','最大的意外，不是他完成了這件事，而是一個從童兵孤兒走出來的人，最後站在了世界宗教對話的場合，得到不同宗教領袖的尊重。那個認可，不是靠資源換來的，而是靠他身上那種只有真正在苦難中走過的人才有的分量。','他放棄了在山上獨修、讓自己徹底解脫的可能，選擇帶著那些苦修換來的深度，走入世界，替不同信仰之間搭橋。<br><br>他放棄的：個人的清靜與解脫。<br><br>他換來的：一個讓世界上不同信仰的人，都能找到彼此共同語言的地方，以及「愛與和平地球家」這個對世界和平的持續承諾。','世界宗教博物館至今仍在運作，成為跨宗教對話的重要平台。他建立的「愛與和平地球家」NGO在世界各地持續推動宗教和諧。一個童兵孤兒，走到了世界宗教的對話桌上——那條路，是苦行、是意志，也是一個人選擇把自己最深的創傷，換成這個世界最需要的東西。'],
    quote:'他把童年烽火中積累的對死亡的理解，換成了對生命最深的尊重——那才是世界宗教博物館真正的地基。'},
  { name:'哥倫布', work:'義大利／西班牙', scene:'1492 橫渡大西洋：押上聲譽與生命賭一條新航線',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{
      who:'我是許榮哲。遇到像 哥倫布 這樣的人物，我最在意的不是他到了哪裡，而是他怎麼在所有人都覺得不可能時，還敢把船開出去。',
      relation:'我和 哥倫布 的關係，是故事分析者與真實人物的關係。我會把他的冒險拆成真正成立的故事節點。',
      why:'因為他的關鍵，不只是發現，而是出發。沒有那次出發，後面沒有任何歷史改寫。'
    },
    storytellerSimple:['用靶心人公式看，哥倫布真正要做的，是：找到一條向西航行抵達亞洲的新航線。','這個故事真正有力的阻礙，在於：沒人相信他，航海技術有限，水手會恐懼，海的盡頭像一個可能吞人的謎。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他四處遊說、反覆被拒、最後才說服西班牙王室押上一場高風險賭局。','故事走到這一步，表面的結果是：三艘船真的離港，歷史開始往另一個方向移動。','真正讓這個故事變得難忘的意外，是：船隊在海上拖得比預期更久，水手逐漸逼近叛變邊緣。','而最關鍵的轉彎，正是在這裡發生：他沒有返航，而是再撐幾天，逼自己和全船一起穿過恐懼。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他讓世界的地圖從此改寫。'],
    simple:['找到一條向西通往亞洲的新航線。','技術不足、王室懷疑、水手恐慌，整趟航行像在跟未知硬碰硬。','他多年遊說、反覆爭取資助，終於帶著三艘船啟航。','船隊成功越過大西洋，到達了歐洲人未曾如此抵達的新大陸。','航行中最可怕的意外，不是風暴，而是船員對未知與絕望的恐懼。','他選擇不回頭，把所有風險往前推到最後一刻。','他沒有到達原本以為的亞洲，卻改變了整個世界的航海史與地理觀。'],
    full:['外在目標：向西找到通往亞洲的新航線。<br><br>內在目標：證明自己的判斷與野心值得被世界承認。','外在：資助不足、王室懷疑、船員不安、大洋未知。<br><br>內在：他不只是在對抗海，更在對抗整個時代對「不可能」的定義。','他的努力不是一口氣衝出去，而是長年被拒後仍反覆提案、說服、等待，直到終於拿到一次機會。','結果是他真的出海了，並在1492年把船隊帶到新的陸地。','最大的意外，是他原本要去亞洲，結果打開的卻是另一個更大的世界。','他放棄的：退回安全的可能。<br><br>他換來的：把未知變成新的現實。','哥倫布留下來的，不只是航程，而是一種冒險者邏輯：歷史很多時候不是獎勵最穩的人，而是獎勵敢航向空白的人。'],
    quote:'哥倫布真正改變世界的，不是他到了哪裡，而是他敢把船開向所有人都不確定的地方。'},
  { name:'愛因斯坦', work:'德國／瑞士／美國', scene:'1905 發表相對論：在專利局重寫物理學',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{
      who:'我是許榮哲。遇到像 愛因斯坦 這樣的人物，我最在意的不是他多聰明，而是他怎麼在不被學術中心重視的位置上，想出了改寫宇宙的問題。',
      relation:'我和 愛因斯坦 的關係，是故事分析者與真實人物的關係。我會把他的革命性一刻拆成更能理解的故事。',
      why:'因為真正厲害的發明，不只是答案新，而是他先問了別人沒敢問的問題。'
    },
    storytellerSimple:['用靶心人公式看，愛因斯坦真正要做的，是：找出宇宙運作更深一層的規則。','這個故事真正有力的阻礙，在於：他不在頂尖大學，而在專利局做日常審件工作，學界權威也壓在舊框架上。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他在下班後反覆思考光、時間、速度，讓思想實驗一點一點長出新理論。','故事走到這一步，表面的結果是：1905 年，他接連發表數篇論文，震動整個物理學界。','真正讓這個故事變得難忘的意外，是：改寫世界的人，當時根本不在世界中心。','而最關鍵的轉彎，正是在這裡發生：他沒有等待體制先承認自己，而是直接用理論逼體制重寫課本。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他把時間與空間從理所當然，變成可以被重新理解的問題。'],
    simple:['找出更深層的宇宙規律。','他不在學術核心，沒有權威位置，舊物理框架也牢牢壓在前面。','他在專利局工作之餘，用思想實驗持續推進自己的理論。','1905 年的論文群讓他從邊緣位置一口氣進入科學史中心。','最意外的是，這樣的革命不是從名校實驗室，而是從體制邊角長出來的。','他沒有等別人先給舞台，而是先拿出能改寫舞台的東西。','相對論改變了人類理解時間、空間、能量與宇宙的方式。'],
    full:['外在目標：找出更深的物理法則。<br><br>內在目標：證明真理不靠頭銜站立，而靠思想本身站立。','外在：沒有學術權位、舊理論強勢、同行保守。<br><br>內在：他最大的壓力，是要相信自己那些反直覺的想法不只是幻想。','他的努力是一種長時間的獨處思考，不靠大團隊，不靠豪華設備，而靠極端清晰的問題意識。','1905 年，他把光電效應、布朗運動、狹義相對論等論文一口氣拋進世界。','最大的意外，是顛覆經常不是從中心發生，而是從還沒被中心馴服的地方發生。','他放棄的：等待資歷成熟再說話。<br><br>他換來的：直接讓新理論自己成為資格。','愛因斯坦留下來的，不只是天才傳說，而是一種思想姿態：真正大的突破，常來自敢對最基本前提重新發問的人。'],
    quote:'愛因斯坦真正厲害的，不是答案比別人快，而是他先懷疑了別人不再懷疑的前提。'},
  { name:'哥白尼', work:'波蘭', scene:'提出日心說：把地球從宇宙中心挪開',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{ who:'我是許榮哲。遇到像 哥白尼 這樣的人物，我最在意的不是他算得多準，而是他敢不敢把全人類習慣的位置挪開。', relation:'我和 哥白尼 的關係，是故事分析者與真實人物的關係。', why:'因為日心說真正顛覆的，不只是天文，而是人的自我中心。' },
    storytellerSimple:['用靶心人公式看，哥白尼真正要做的，是：找到更合理的天體運行模型。','這個故事真正有力的阻礙，在於：地心說統治太久，宗教與學術都把它當作常識。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他長年觀測、計算、修正，用耐心對抗龐大的既有秩序。','故事走到這一步，表面的結果是：他提出日心說，讓太陽而非地球成為運行中心。','真正讓這個故事變得難忘的意外，是：一個模型變動，居然能讓整個人類世界觀開始鬆動。','而最關鍵的轉彎，正是在這裡發生：他把地球從中心移開，也把人的自我想像往後推了一步。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他替現代科學打開了第一道門。'],
    simple:['找到更合理的宇宙運行模型。','地心說是長久主流，任何相反想法都會挑戰龐大權威。','他長期觀測與計算，反覆驗證自己的想法。','他提出日心說，讓太陽成為系統中心。','最大的意外，是一個天文模型改變，竟足以撼動整個世界觀。','他選擇說出這個結論，哪怕它會讓很多人不舒服。','他的理論後來成為科學革命的重要起點。'],
    full:['外在目標：找到更合理的天體運行模型。<br><br>內在目標：讓真理優先於傳統位置感。','外在：既有權威強大，挑戰地心說幾乎等於挑戰常識本身。<br><br>內在：要接受地球並不居中，對人心也是一種自我削弱。','他的努力不是華麗突破，而是長年安靜累積、反覆修正，讓理論慢慢長得足夠穩。','他最終寫下《天體運行論》，把日心模型系統性提出。','最大的意外，是知識上的小位移，會帶來文明尺度的大地震。','他放棄的：留在安全共識中的位置。<br><br>他換來的：替未來科學革命點火。','哥白尼留下來的，不只是天文新說，而是整個現代思想的一個起點：人不必永遠待在中心，真理才有空間站進來。'],
    quote:'哥白尼最厲害的，不是把太陽放到中心，而是敢把人從中心請出去。'},
  { name:'耶穌', work:'猶太地', scene:'走向十字架：明知結局仍不回頭',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{ who:'我是許榮哲。遇到像 耶穌 這樣的人物，我最在意的不是信仰立場，而是他怎麼把一個人的生命，活成一個到今天都還在影響世界的故事。', relation:'我和 耶穌 的關係，是故事分析者與歷史人物的關係。', why:'因為他真正震撼人的，不只是他說了什麼，而是他最後怎麼走向自己明知道的結局。' },
    storytellerSimple:['用靶心人公式看，耶穌真正要做的，是：把天國、愛與救贖的訊息帶到人群中。','這個故事真正有力的阻礙，在於：他挑戰了宗教權威、政治秩序，也觸碰了人心最難改變的地方。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他不斷講述、醫治、行走、召聚門徒，用言行把抽象信念活成現場。','故事走到這一步，表面的結果是：他的名聲擴大，同時敵意也迅速聚集。','真正讓這個故事變得難忘的意外，是：他不是不知道危險，而是知道之後仍然走向耶路撒冷。','而最關鍵的轉彎，正是在這裡發生：他沒有用權力自救，而是接受受苦，把訊息留給後人。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他把自己的生命，變成訊息本身的一部分。'],
    simple:['把愛、寬恕與天國的訊息帶給世人。','宗教權威與政治秩序都把他視為威脅，他身邊的人也並不總能理解他。','他持續講道、醫治、陪伴邊緣人，把信念帶進真實生活。','他吸引了群眾，也引來更強烈的敵意與圍捕。','真正的意外不是危險來了，而是他明知危險仍往前走。','他放棄用力量保全自己，選擇承受十字架。','他的死亡沒有讓故事結束，反而讓他的訊息被更大範圍地傳遞。'],
    full:['外在目標：傳遞愛、救贖與天國的訊息。<br><br>內在目標：讓真理不只停在語言裡，而是活進人的生命裡。','外在：權威、誤解、圍捕與政治風險。<br><br>內在：最難的是，他若要讓訊息完整，就不能在關鍵時刻只保護自己。','他的努力是一種行走式的實踐：講道、醫治、陪伴、比喻、示範，把信念一點一點帶進人的處境。','結果是他的影響愈來愈大，但對抗也隨之升高。','最大的意外，是他早知道會被出賣、審判、處死，卻仍選擇走向那條路。','他放棄的：即時自保的可能。<br><br>他換來的：讓他的訊息與生命合而為一。','耶穌留下來的，不只是宗教歷史，而是一種故事力量：當一個人願意用自己承擔所說之事，話語就會變得比說話者活得更久。'],
    quote:'耶穌最讓人震動的，不只是他說了愛，而是他最後用自己的生命把那句話說完。'},
  { name:'邱吉爾', work:'英國', scene:'1940 戰時演說：在最黑暗時刻拒絕投降',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{ who:'我是許榮哲。遇到像 邱吉爾 這樣的人物，我最在意的不是他講話多厲害，而是他怎麼在幾乎全世界都快失去信心時，先替一個國家把意志撐住。', relation:'我和 邱吉爾 的關係，是故事分析者與真實人物的關係。', why:'因為有些時候，歷史不是先需要方案，而是先需要有人說「我們不投降」。' },
    storytellerSimple:['用靶心人公式看，邱吉爾真正要做的，是：在納粹逼近時守住英國，不讓國家先在心理上投降。','這個故事真正有力的阻礙，在於：歐洲戰局惡化、盟友崩潰、英國幾乎孤立，談和聲音也在內部浮現。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他不停演說、協調、動員，把「撐住」變成全民都得一起承擔的意志。','故事走到這一步，表面的結果是：英國沒有在最危急時刻倒下。','真正讓這個故事變得難忘的意外，是：一個人的語言，居然真的能改變一個國家的精神狀態。','而最關鍵的轉彎，正是在這裡發生：他拒絕把退讓包裝成理性，選擇讓整個國家先學會不怕。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他把抵抗，先變成了一種集體意志。'],
    simple:['守住英國，不向納粹低頭。','戰局危急、盟友倒下、內部也出現談和壓力。','他透過演說與決策不斷凝聚意志，讓國家先穩住。','英國沒有在最黑暗時刻先行崩潰。','最大的意外，是語言本身成了戰爭中的重要武器。','他拒絕以妥協換短暫安全，選擇讓人民承擔長期抗戰。','他的意志成了英國能撐過戰爭關鍵階段的重要力量。'],
    full:['外在目標：守住英國、抵抗納粹。<br><br>內在目標：讓一個被恐懼包圍的國家仍相信自己值得撐下去。','外在：軍事壓力、外交孤立、內部動搖。<br><br>內在：最難的不是知道局勢危險，而是在知道危險時仍然敢說「不」。','他的努力不只在戰略，而在語言、姿態與節奏控制上，讓國家從心理上保持站立。','英國撐住了，沒有在那個節點先倒下。','最大的意外，是很多時候一個國家的命運，真的會被幾句話先拉住。','他放棄的：看似省事的和談退讓。<br><br>他換來的：把抵抗維持到真正的轉機出現。','邱吉爾留下來的，不只是政治評價，而是一個清楚示範：在歷史最危急時刻，領導者首先要做的，是替人們保住不投降的語氣。'],
    quote:'邱吉爾真正厲害的，不只是打仗，而是他先替一個快害怕到失聲的國家，把聲音找回來。'},
  { name:'牛頓', work:'英國', scene:'從蘋果到萬有引力：把天地寫進同一條定律',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{ who:'我是許榮哲。遇到像 牛頓 這樣的人物，我最在意的不是蘋果有沒有真的掉在他頭上，而是他怎麼把日常與宇宙連成同一個問題。', relation:'我和 牛頓 的關係，是故事分析者與真實人物的關係。', why:'因為真正偉大的不是看到蘋果掉下來，而是問：月亮是不是也在同一條規則裡？' },
    storytellerSimple:['用靶心人公式看，牛頓真正要做的，是：找出能同時解釋天地運動的普遍法則。','這個故事真正有力的阻礙，在於：地上的物體與天上的星體，長期被當作兩種不同世界。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他長時間思考、演算、驗證，把看似分裂的現象硬拉回同一個框架。','故事走到這一步，表面的結果是：萬有引力與經典力學成形，宇宙突然變得可計算。','真正讓這個故事變得難忘的意外，是：一顆蘋果掉落，竟能和行星運行被放進同一個問題裡。','而最關鍵的轉彎，正是在這裡發生：他不再把地上和天上分開看，而是讓同一條法則貫穿兩者。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他讓自然界第一次大規模呈現出可被數學掌握的秩序。'],
    simple:['找到能解釋天地運動的共同法則。','舊觀念把地上與天上分開理解，統一它們幾乎像不可能。','他用數學與物理長期推演，把現象重新放進同一套規則。','萬有引力與經典力學建立後，世界呈現出新的可計算秩序。','最大的意外，是最平常的落物現象，竟能通往宇宙尺度的理解。','他選擇追問到底，不把熟悉現象當成理所當然。','牛頓替近代科學建立了極重要的基礎框架。'],
    full:['外在目標：找出普遍的自然法則。<br><br>內在目標：讓世界看起來不再只是混亂現象，而是可以被理解的秩序。','外在：知識分散、領域切開、數學工具尚在建立中。<br><br>內在：最難的是要相信不同尺度的世界真的能被同一條法則統攝。','他的努力是高度孤獨而持久的推演，把直觀拉進數學，把數學拉回自然。','結果是萬有引力與力學框架成形，世界從描述性知識走向更強的預測性知識。','最大的意外，是一個日常掉落現象，能被一路追問到行星運動。','他放棄的：把現象只當片段看待。<br><br>他換來的：一個跨尺度的整體理解。','牛頓留下來的，不只是偉大定律，而是一個方法示範：當你把看似不相關的現象放進同一個問題裡，革命就可能發生。'],
    quote:'牛頓最厲害的，不是看見蘋果掉下來，而是他沒有讓蘋果只是一顆蘋果。'},
  { name:'愛迪生', work:'美國', scene:'反覆失敗後點亮燈泡：把發明變成可用的世界',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{ who:'我是許榮哲。遇到像 愛迪生 這樣的人物，我最在意的不是他有多少專利，而是他怎麼把靈感磨成真正能進入生活的東西。', relation:'我和 愛迪生 的關係，是故事分析者與真實人物的關係。', why:'因為很多人會想到點子，但能把點子做到能被世界使用，才是真的困難。' },
    storytellerSimple:['用靶心人公式看，愛迪生真正要做的，是：把光從實驗室帶進每個人的生活。','這個故事真正有力的阻礙，在於：發明不只要可行，還要穩定、便宜、能大量使用，失敗會一再重來。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他帶著團隊反覆測試材料、設計系統，把一個點子磨成可用產品。','故事走到這一步，表面的結果是：燈泡終於能長時間穩定發光。','真正讓這個故事變得難忘的意外，是：改變世界的不只是一顆燈泡，而是一整套供電與使用系統。','而最關鍵的轉彎，正是在這裡發生：他不是停在發明，而是把發明一路做成產業。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他讓科技不只被看見，還被日常化。'],
    simple:['讓人類擁有真正可普及使用的人工照明。','難的不只是點亮，而是要穩定、安全、便宜、可大量使用。','他與團隊反覆測試材料與系統，累積大量失敗後持續調整。','燈泡與配套電力系統逐步成熟，真正走入城市與家庭。','最大的意外，是單一發明最後變成了一整個新生活方式。','他不把成功定義成「做出來」，而定義成「讓大家用得起」。','愛迪生留下來的，是發明如何變成產業與日常世界的範例。'],
    full:['外在目標：做出能被普及使用的電燈系統。<br><br>內在目標：證明發明不該只停在概念，而應該走進真實世界。','外在：技術不成熟、成本問題、配套不足、失敗頻繁。<br><br>內在：最難的是在大量失敗中仍把每次失敗看成進度，而不是終點。','他的努力是工程型的，不只是一瞬間靈感，而是大規模測試、迭代與系統化整合。','結果不是單一作品，而是一整套能實際部署的照明與供電邏輯。','最大的意外，是當光真正普及後，人類的夜晚也跟著被重新定義。','他放棄的：只做概念上的成功。<br><br>他換來的：把技術變成社會現實。','愛迪生留下來的，不只是燈泡，而是對發明的一種重新定義：真正的創新，是能改變集體生活節奏的創新。'],
    quote:'愛迪生最厲害的，不是想到光，而是他把光一路做到可以被每個人打開。'},
  { name:'梵谷', work:'荷蘭／法國', scene:'在孤獨與痛苦中持續作畫：把傷口變成顏色',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{ who:'我是許榮哲。遇到像 梵谷 這樣的人物，我最在意的不是他有多痛苦，而是他怎麼在不被理解的時候，仍然沒有放棄畫。', relation:'我和 梵谷 的關係，是故事分析者與真實人物的關係。', why:'因為真正讓人難忘的，不是天才受苦，而是受苦時還能持續創作。' },
    storytellerSimple:['用靶心人公式看，梵谷真正要做的，是：把自己看見的世界畫出來，哪怕沒有人立刻懂。','這個故事真正有力的阻礙，在於：貧窮、孤獨、精神痛苦，以及長期得不到市場與主流承認。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他不斷畫、不斷試、不斷在顏色與筆觸裡逼近自己的感受。','故事走到這一步，表面的結果是：他留下大量作品，卻在生前幾乎沒有真正被看見。','真正讓這個故事變得難忘的意外，是：他生前寂寂無名，死後卻成為改變藝術史的人。','而最關鍵的轉彎，正是在這裡發生：他沒有因為世界暫時不懂，就把自己的手停下來。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他把痛苦變成了一種別人後來終於看懂的光。'],
    simple:['畫出自己真正看見與感受到的世界。','貧窮、孤獨、精神困境，以及幾乎沒有即時回報的創作處境。','他持續大量作畫，在筆觸與顏色裡追求最直接的情感真實。','他生前幾乎未被市場真正承認，卻留下驚人的作品量。','最大的意外，是當代不懂的東西，後代卻視為震動世界的藝術。','他沒有因為沒被理解就停手，反而更用力地往內挖。','梵谷死後成為現代藝術最重要的名字之一。'],
    full:['外在目標：創作出自己真正要畫的畫。<br><br>內在目標：證明自己的感受即使痛苦、怪異、過度，也值得被畫出來。','外在：貧窮、孤獨、精神狀態不穩、市場冷淡。<br><br>內在：最難的是，當世界沒有立即回應你時，你還能不能相信自己的眼睛。','他的努力極其直接：持續作畫、持續嘗試、持續在顏色和筆觸中逼近自己的真實。','結果是他留下大量作品，雖然生前幾乎沒有成名。','最大的意外，是有些作品當代看不懂，卻會在未來成為整個時代看世界的方式。','他放棄的：等待世界先理解自己。<br><br>他換來的：讓自己的畫先存在，等時間來讀懂它。','梵谷留下來的，不只是悲劇形象，而是一個藝術家的根本示範：即使沒有人立即說你懂，他仍然可以先把心裡的光畫出來。'],
    quote:'梵谷最動人的，不是他受苦，而是他在受苦的時候，還是繼續把世界畫亮。'},
  { name:'畢卡索', work:'西班牙／法國', scene:'畫下《格爾尼卡》：把戰爭痛苦變成巨大的控訴',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{ who:'我是許榮哲。遇到像 畢卡索 這樣的人物，我最在意的不是他畫風多變，而是他怎麼在世界崩壞時，讓一幅畫變成時代的吶喊。', relation:'我和 畢卡索 的關係，是故事分析者與真實人物的關係。我會把他的創作野心拆成真正有力量的故事節點。', why:'因為畢卡索最厲害的，不只是創新，而是他知道什麼時候要用藝術直接對世界說話。' },
    storytellerSimple:['用靶心人公式看，畢卡索真正要做的，是：用自己的藝術語言，回應一個正在破碎的時代。','這個故事真正有力的阻礙，在於：藝術很容易變成形式遊戲，但戰爭逼他面對一個更尖銳的問題：你的畫要不要真的介入世界？','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他不斷打破既有畫法，重新組合視角、形體與情緒，讓畫面本身變成震動。','故事走到這一步，表面的結果是：《格爾尼卡》誕生，成為反戰最具代表性的藝術作品之一。','真正讓這個故事變得難忘的意外，是：沒有血的顏色、沒有寫實爆炸，卻仍然比很多紀錄更像戰爭本身。','而最關鍵的轉彎，正是在這裡發生：他不再只畫「我怎麼看」，而是開始畫「世界怎麼痛」。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他讓藝術不只是風格，而是能夠留下時代傷口的形式。'],
    simple:['用藝術回應破碎的時代。','藝術創新之外，他還要面對作品是否真正介入現實的挑戰。','他持續打破畫法與視角，逼藝術長出新表達。','《格爾尼卡》成為現代反戰藝術的重要象徵。','最大的意外，是極度變形的畫面反而更像真實創傷。','他讓創作從個人風格走向時代控訴。','畢卡索留下的不只是流派，而是一種藝術介入世界的力量。'],
    full:['外在目標：創造新的藝術語言，並回應時代。<br><br>內在目標：讓藝術不只停在漂亮或創新，而能真正承載現實的重量。','外在：風格變動、外界理解門檻、戰爭與政治壓力。<br><br>內在：最難的是，當你已經是大師，還願不願意讓作品繼續冒險，甚至變得刺眼。','他的努力是一種持續拆解與重組，把熟悉形式打碎，逼觀眾重新看世界。','結果是他不只改變了藝術史，也讓作品成為時代記憶的一部分。','最大的意外，是最不寫實的畫法，有時反而最能逼近真實的痛苦。','他放棄的：只做安全而討喜的藝術。<br><br>他換來的：讓創作成為能對歷史發聲的工具。','畢卡索留下來的，不只是畫家地位，而是一種創作者姿態：真正大的作品，不只會創新，還會直面時代。'],
    quote:'畢卡索真正厲害的，不只是畫出新樣子，而是他知道什麼時候要讓畫直接對世界開口。'},
  { name:'李小龍', work:'香港／美國', scene:'打破銀幕東方刻板印象：用身體與思想改寫英雄樣子',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{ who:'我是許榮哲。遇到像 李小龍 這樣的人物，我最在意的不是他拳有多快，而是他怎麼把一個原本被看低的身分，打成全世界都不得不看見的力量。', relation:'我和 李小龍 的關係，是故事分析者與真實人物的關係。我會把他從武者到文化象徵的轉變拆給你看。', why:'因為李小龍最強的，不只是在打鬥場面裡贏，而是在整個文化想像裡，重新定義了東方英雄。' },
    storytellerSimple:['用靶心人公式看，李小龍真正要做的，是：讓世界看見華人也能成為最有力量、最有魅力的英雄。','這個故事真正有力的阻礙，在於：當時的影視與文化想像對東方人充滿刻板印象，他不只要證明自己強，還要證明形象可以被改寫。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他苦練身體、提煉武學、建立自己的哲學，讓每一次出現都不只是表演，而是宣告。','故事走到這一步，表面的結果是：他成為國際巨星，也成為功夫電影最具代表性的名字。','真正讓這個故事變得難忘的意外，是：他改變的從來不只是一個票房市場，而是整個世界看待東方身體與東方力量的方式。','而最關鍵的轉彎，正是在這裡發生：他不接受被塞進舊框架，而是自己創造一個新框架讓別人跟上。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他把功夫、思想與銀幕魅力合在一起，成為跨文化的傳奇。'],
    simple:['讓世界重新看見華人英雄的樣子。','他面對的是文化偏見，不只是單純的競爭。','他用訓練、武學與哲學把自己鍛成獨一無二的存在。','他成為國際巨星，改變了功夫電影的位置。','最大的意外，是他影響的不只是電影，而是整個文化想像。','他選擇不配合舊框架，自己建立新的標準。','李小龍成為跨文化英雄與自我突破的象徵。'],
    full:['外在目標：成為能被世界看見的武打與銀幕人物。<br><br>內在目標：打破東方人只能被定型、被低估的位置。','外在：產業偏見、文化刻板印象、競爭與自我要求。<br><br>內在：最難的是，他不只要強，還要強到足以改寫別人的想像。','他的努力是一種全面鍛造：身體、速度、哲學、表演、存在感，全都被他推到極致。','結果是他不只是明星，而成為一個文化事件。','最大的意外，是一個人的身體表現，竟能撼動一整個世界對族群與英雄的觀看方式。','他放棄的：迎合別人期待的安全位置。<br><br>他換來的：讓自己變成新的標準。','李小龍留下來的，不只是功夫片經典，而是一種持續到今天的信號：不要問世界給你什麼位置，去打出你自己的位置。'],
    quote:'李小龍真正震撼世界的，不只是快，而是他用自己的存在，把別人對東方英雄的想像整個改寫了。'},
  { name:'達爾文', work:'英國', scene:'發表演化論：重新定義生命如何改變',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{ who:'我是許榮哲。遇到像 達爾文 這樣的人物，我最在意的不是他蒐集了多少標本，而是他怎麼把那些零碎觀察，長成一個足以改變世界觀的理論。', relation:'我和 達爾文 的關係，是故事分析者與真實人物的關係。我會把他的耐心、遲疑與突破拆成一個真正成立的故事。', why:'因為達爾文最厲害的，不只是提出新答案，而是他重新改寫了人怎麼看待生命本身。' },
    storytellerSimple:['用靶心人公式看，達爾文真正要做的，是：找出生命如何變化與延續的更深規律。','這個故事真正有力的阻礙，在於：他的觀察挑戰了既有常識與信仰理解，任何一步都可能引發巨大反彈。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他長年觀察、比對、整理、懷疑，讓理論慢慢長到能站穩。','故事走到這一步，表面的結果是：《物種起源》出版，演化論進入世界視野。','真正讓這個故事變得難忘的意外，是：最顛覆的理論，不一定來自一瞬間靈感，而往往來自長時間幾乎固執的耐心。','而最關鍵的轉彎，正是在這裡發生：他決定不再只是私下推敲，而是把這個會改變一切的想法公之於世。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他讓生命從靜態被創造的想像，變成動態演變的歷程。'],
    simple:['找出生命變化與延續的深層規律。','他的理論會衝撞當時既有常識與信仰理解。','他靠長年觀察、整理與推敲讓理論逐漸成熟。','《物種起源》出版後，世界開始重新理解生命。','最大的意外，是顛覆世界觀的理論常來自極長的耐心累積。','他選擇把足以引發爭議的想法公開。','達爾文改寫了人類看待生命與自身的位置。'],
    full:['外在目標：提出生命演變的合理解釋。<br><br>內在目標：讓真相優先於舒適的舊答案。','外在：傳統觀念強大、理論複雜、發表風險高。<br><br>內在：最難的是，當你的結論太顛覆時，你能不能撐住不退回熟悉版本。','他的努力不是一次宣告，而是漫長蒐集、比對、修正與等待，把觀察變成理論。','結果是演化論進入公共討論，並持續改變科學與哲學。','最大的意外，是這種改變世界的理論，不是吶喊式誕生，而是極沉穩地慢慢站起來。','他放棄的：留在安全共識裡的安穩。<br><br>他換來的：替現代生命科學打下核心基礎。','達爾文留下來的，不只是一本書，而是一種思想勇氣：當真相逼你重新看世界時，你敢不敢真的重看一次。'],
    quote:'達爾文真正改變世界的，不只是提出演化，而是他讓人類不得不重新理解自己到底是怎麼來的。'},
  { name:'張忠謀', work:'台灣', scene:'創辦台積電：把代工做成全球最關鍵的產業位置',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{ who:'我是許榮哲。遇到像 張忠謀 這樣的人物，我最在意的不是他多會管理，而是他怎麼看見一個當時沒那麼多人相信的產業位置，最後把它做成世界核心。', relation:'我和 張忠謀 的關係，是故事分析者與真實人物的關係。我會把他的創業判斷拆成真正厲害的故事節點。', why:'因為張忠謀最厲害的，不只是做公司，而是重新定義了半導體產業鏈裡什麼位置最重要。' },
    storytellerSimple:['用靶心人公式看，張忠謀真正要做的，是：找到一條讓台灣能在全球科技產業裡站穩核心的位置。','這個故事真正有力的阻礙，在於：當時晶片產業強者林立，純代工模式也不是理所當然被看好的路。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他不是跟著別人複製成功，而是直接重畫遊戲規則，專注把製造做到極致。','故事走到這一步，表面的結果是：台積電成長為全球最關鍵的晶圓代工企業。','真正讓這個故事變得難忘的意外，是：最不起眼、最像幕後的位置，最後反而成了世界最不能缺的節點。','而最關鍵的轉彎，正是在這裡發生：他沒有搶著做所有事，而是精準選擇只把一件事做到別人追不上。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他把台灣放進全球科技最核心的供應鏈中心。'],
    simple:['替台灣找到全球科技產業的關鍵位置。','強敵環伺，而且純代工模式一開始並不被普遍看好。','他重畫產業規則，選擇把製造做到世界第一。','台積電成為全球晶圓代工核心企業。','最大的意外，是幕後位置最後變成最關鍵的位置。','他選擇不做全部，而是把一個位置做到極致。','張忠謀改寫了產業分工，也改寫了台灣的位置。'],
    full:['外在目標：打造有全球競爭力的半導體企業。<br><br>內在目標：證明台灣能站上技術與產業鏈的核心。','外在：國際競爭者、資本壓力、技術門檻與市場懷疑。<br><br>內在：最難的是，相信那個看起來不像最風光的位置，反而可以成為最穩的核心。','他的努力是一種極高層次的產業判斷與長期執行，把製造、品質、信任與規模一點點堆起來。','結果是台積電不只是成功公司，而成為全球科技基礎設施的一部分。','最大的意外，是很多真正關鍵的角色，看起來並不站在舞台最前面。','他放棄的：全面擴張的誘惑。<br><br>他換來的：把一個位置做到世界不可替代。','張忠謀留下來的，不只是企業神話，而是一個很重要的現代故事：真正高明的贏法，有時不是全拿，而是精準卡住最重要的一格。'],
    quote:'張忠謀真正厲害的，不只是做出台積電，而是他先看見了：最關鍵的位置，不一定是最顯眼的位置。'},
  { name:'聖嚴法師', work:'台灣', scene:'推動法鼓山與心靈環保：把修行語言帶回現代社會',
    storytellerName:'許榮哲', storytellerRole:'故事教練，靶心人公式創造者',
    storytellerIntro:{ who:'我是許榮哲。遇到像 聖嚴法師 這樣的人物，我最在意的不是他說法多深，而是他怎麼把原本容易離生活很遠的修行語言，重新帶回現代人的日常。', relation:'我和 聖嚴法師 的關係，是故事分析者與真實人物的關係。我會把他的弘法與建立道場，看成一個現代轉譯的故事。', why:'因為真正有力量的老師，不只是講得對，而是能讓更多人聽得懂、走得進去。' },
    storytellerSimple:['用靶心人公式看，聖嚴法師真正要做的，是：把佛法與修行，轉化成現代人也能走進去的路。','這個故事真正有力的阻礙，在於：當代社會節奏快、焦慮重，傳統宗教語言若不轉譯，很容易離人愈來愈遠。','如果把鏡頭推近，你會看見他的努力其實發生在這裡：他不只弘法，也建立制度、道場、教育與理念，讓修行有現代入口。','故事走到這一步，表面的結果是：法鼓山與心靈環保成為很多人認識佛法的重要路徑。','真正讓這個故事變得難忘的意外，是：最深的修行，不一定要離開世界，反而可以更有方法地回到世界。','而最關鍵的轉彎，正是在這裡發生：他不把佛法鎖在寺院裡，而是主動把它翻譯成現代社會可以理解的語言。','所以最後留下來的，不只是結局，而是這個人物真正完成了什麼：他讓很多原本走不進佛法的人，找到可以開始的入口。'],
    simple:['替現代人打開能走進修行與佛法的入口。','傳統宗教語言若不轉譯，容易離現代生活太遠。','他透過弘法、教育與制度建立，讓修行有現代入口。','法鼓山與心靈環保成為重要影響力。','最大的意外，是真正深的修行反而能更貼近日常世界。','他把佛法從寺院內部翻譯到社會語言裡。','聖嚴法師留下的是一條讓現代人可進入的修行之路。'],
    full:['外在目標：弘揚佛法、建立道場與教育體系。<br><br>內在目標：讓修行不只是少數人的事，而能成為更多人面對人生的方法。','外在：時代變化快、人心焦慮、傳統宗教形式與現代生活之間存在距離。<br><br>內在：最難的是，如何在不失真義的前提下，把深的東西說得讓人能靠近。','他的努力不只在講法，而在持續建立系統、理念與實踐方式，讓理解可以落地。','結果是法鼓山成為重要道場，心靈環保也成為很多人熟悉的觀念。','最大的意外，是原本被認為很遠的修行，經過好的轉譯後，反而能變成很多人最需要的東西。','他放棄的：只在傳統框架內被理解的舒適。<br><br>他換來的：讓更多人真正走進來。','聖嚴法師留下來的，不只是宗教影響力，而是一種現代弘法示範：真正好的傳承，不只守住內容，也要打開入口。'],
    quote:'聖嚴法師真正重要的，不只是講佛法，而是他讓很多現代人第一次覺得：原來我也走得進去。'},
];
