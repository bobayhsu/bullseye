const EXTRA_STORYTELLERS = {"美人魚": [{"name": "小美人魚", "role": "故事主角本人", "who": "我是海王最小的女兒。十五歲那年，我第一次浮出海面，看見一艘船、一場暴風雨，和一個快要淹死的王子。從那天起，我就再也不只是海底的公主了。", "relation": "我和這個故事的關係，就是我自己。我把聲音交出去，把尾巴換成雙腿，每走一步都像踩在刀上。這些痛，別人只能讀，我是真的走過。", "why": "大家都說我是為愛犧牲，可那不是全部。我想親口告訴你，最後那個晚上，我手裡握著刀，心裡到底在想什麼。", "simple": ["我想要的不只是王子。我想要他的愛，也想要一個人類才有的、不會消失的靈魂。海裡的人活三百年，死後只剩泡沫；我不想只是泡沫。", "可是海巫婆開的價太高了：我的聲音。我不能說話，不能告訴王子是我救了他。而且他若娶了別人，隔天清晨我就會化成海上的泡沫。", "我每天陪在他身邊，跳舞給他看，雖然每一步都像踩在刀尖上。我學著用眼睛說話，用微笑說話，希望有一天他能聽懂。", "他很喜歡我，叫我「撿來的小孩」，讓我睡在他門口的絨墊上。可是他愛的，是他以為救了他的那位公主。他們要結婚了。", "婚禮那晚，姊姊們從海裡浮上來，她們剪掉了長髮，跟海巫婆換來一把刀。只要天亮前把刀刺進王子的心，我就能變回人魚，回到海裡。", "我站在他的床邊，他在睡夢中喊著新娘的名字。我握著刀的手在發抖。最後，我把刀丟進了海裡。", "我化成了泡沫，卻沒有消失。我變成了空氣的女兒，飄得很輕、很高。原來我一直想要的靈魂，不是別人給的，是我在那一刻，自己長出來的。"]}, {"name": "海巫婆", "role": "和小美人魚交易的人", "who": "我是住在漩渦後面、珊瑚骨頭屋裡的海巫婆。人魚們怕我，說我邪惡。我不否認，我從來不做白工，每一樣東西都有價錢。", "relation": "我和小美人魚的關係，是一筆交易。她來找我，我開價，她付錢。我拿走她最美的聲音，給她一雙會痛的腿。公平得很。", "why": "為什麼由我來說？因為所有人都只看見她的愛情，只有我看過她的帳本。我知道她付了多少，也知道她最後放棄了什麼。", "simple": ["她游進我的屋子時，我就知道她要什麼了。每一條愛上人類的人魚，眼神都一樣：想要一雙腿，想要一個靈魂，想要一個不屬於自己的世界。", "我把條件說得很清楚：聲音歸我；每一步都會痛；他若娶了別人，妳就變泡沫。我從不騙人，是她們自己不肯聽完。", "她真的去了，真的忍了。我在海底的水鏡裡看著她，每天用那雙流血的腳跳舞。老實說，我有點佩服她。", "結果和我想的一樣：王子沒有愛上她。人類哪會愛上一個不會說話的女孩？他們只愛會說話的故事。", "她的姊姊們來找我，用頭髮換一把刀。我給了。一條命換一條命，這是我最喜歡的那種交易：乾淨、俐落。", "可是她把刀丟了。我做了幾百年生意，第一次有人拿到退路卻不用。那一刻，我的帳對不起來了。", "她變成泡沫，我以為我贏了。後來才知道，她沒有死，她升到了我永遠去不了的地方。原來有一種東西，我開不出價錢，也買不到。"]}, {"name": "安徒生", "role": "《海的女兒》的作者", "who": "我是漢斯．克里斯汀．安徒生，出生在丹麥歐登塞一個鞋匠家裡。我長得不好看，聲音也不討喜，年輕時想當歌手、演員，全都失敗了，最後才靠寫故事活下來。", "relation": "小美人魚是我寫的，但她身上有我。我也曾愛過一個人，卻說不出口；我也曾站在一個不屬於我的世界裡，努力讓別人看見我。", "why": "很多人把這個故事改成快樂結局。我不怪他們，但我想親口說說，為什麼我當年不肯讓她嫁給王子。", "simple": ["我讓她想要兩樣東西：王子的愛，和不朽的靈魂。前者是每個少女都懂的，後者才是我真正想問的——一個人，要怎樣才算真正活過？", "我給她最殘忍的阻礙：拿走她的聲音。因為我知道那種感覺，心裡有滿滿的話，卻沒有人肯聽，或者你根本沒有說的資格。", "我讓她每一步都痛。寫這段時我很清楚：愛不是輕飄飄的，愛是忍著痛還要微笑，還要跳給對方看。", "王子沒有愛上她。編輯勸我改，朋友勸我改，我都沒改。因為人生裡，真心付出而沒被選中，才是最常發生的事。", "我讓姊姊們送來那把刀。我要讓她站在一個真正的十字路口：活下去的代價，是毀掉自己所愛的人。", "她把刀丟進海裡。寫到這一句，我放下筆很久。我想告訴讀者：一個人最高貴的時刻，不是得到，而是明明可以傷害，卻選擇了不傷害。", "我沒有讓她就此消失，而是讓她成為空氣的女兒。這是我給她的，也是我給所有沒被選中的人的：你的愛不會白費，它會讓你成為更好的人。"]}], "灰姑娘": [{"name": "灰姑娘", "role": "故事主角本人", "who": "我的名字其實不叫灰姑娘。那是姊姊們取笑我的綽號，因為我每天睡在壁爐邊的灰燼裡。叫久了，連我自己都差點忘了原來的名字。", "relation": "這是我的故事。從母親過世、父親再娶，到那晚十二點的鐘聲，每一步都是我自己走的。", "why": "大家都記得南瓜馬車和水晶鞋，好像是魔法救了我。我想親口告訴你，那天晚上真正讓我走出灰燼的，是什麼。", "simple": ["我想要的其實很簡單：有一天，不再被當成家裡的傭人；有一天，有人看我的時候，看見的是我，而不是我身上的灰。", "可是繼母不准我去舞會，姊姊們把我的衣服撕破。就算仙女教母幫了我，魔法也只到午夜十二點為止。", "我沒有因為委屈就變得刻薄。我照樣做完所有家事，照樣幫姊姊們梳頭。仙女教母說，她就是看見了這一點，才願意幫我。", "那天晚上，我第一次穿著禮服走進燈光裡。王子一整晚只和我跳舞。我從來沒有被這樣注視過。", "然後鐘聲響了。第一聲時我就知道：再不走，我的禮服會變回破布，馬車會變回南瓜，所有人都會看見我真正的樣子。", "我轉身就跑，連鞋子掉了都來不及撿。我不想讓一個美麗的謊言，在眾人面前崩塌。我寧可帶著真實的自己離開。", "後來王子拿著那隻水晶鞋找遍全城。鞋子穿在我腳上時，我身上還是舊衣服。他認出了我，不是因為魔法，而是因為那就是我。"]}, {"name": "繼母", "role": "灰姑娘的繼母", "who": "我是她的繼母，那個大家都討厭的女人。我帶著兩個女兒嫁進這個家，丈夫常不在家，家裡的一切都得靠我撐。", "relation": "我和灰姑娘的關係，是一個屋簷下的兩種人生。她是前妻留下的女兒，漂亮、安靜、討人喜歡。而我的女兒們，不是。", "why": "為什麼由我來說？因為故事裡的壞人，也是有理由的。我不求你原諒我，只想讓你知道，一個母親的嫉妒是怎麼長出來的。", "simple": ["她想要離開灰燼，我看得出來。可我想要的，是讓我的女兒們嫁得好。在我的算盤裡，她越不被看見，我的女兒就越有機會。", "所以我讓她做所有粗活，不准她去舞會。我對自己說，這是在保護我的女兒。其實我心裡知道，我是在害怕她。", "她從不頂嘴，也從不抱怨。老實說，這比她頂嘴還讓我難受。她越溫順，就越顯得我們刻薄。", "舞會上來了一位神祕的公主，王子只跟她跳舞。我的女兒們回家時又氣又酸，我卻隱約覺得那張臉有點眼熟。", "午夜鐘響，那位公主跑了，只留下一隻水晶鞋。我聽到這消息時鬆了一口氣：沒有名字、沒有來歷，就不會有人找得到她。", "王子的人拿著鞋子上門。我把她鎖在閣樓裡，讓女兒們一個一個試。腳太大，就硬塞。我那時已經分不清，我是在爭，還是在怕輸。", "門最後還是開了。鞋子穿在她腳上，剛剛好。那一刻我才明白，我能鎖住她的人，卻鎖不住她本來就是誰。"]}, {"name": "夏爾．佩羅", "role": "《灰姑娘》的法文版作者", "who": "我是夏爾．佩羅，十七世紀路易十四宮廷裡的文官。晚年我把民間流傳的故事整理成書，南瓜馬車、仙女教母和那隻水晶鞋，都是在我筆下定型的。", "relation": "灰姑娘的故事在世界各地都有，中國有葉限，德國有格林版本。我和她的關係，是把一個古老的故事，打扮好送進宮廷的人。", "why": "我在每個故事後面都寫了一段寓意。這一次我想多說一點，說說我為什麼讓她在午夜十二點轉身離開。", "simple": ["我寫的灰姑娘，要的不是報仇，而是被看見。宮廷裡每個人都在爭著被看見，我想寫一個不靠爭、卻終究被看見的人。", "我給她最難的阻礙：時間。魔法只到午夜。這是我給讀者的提醒——所有外在的光彩，都有到期的一刻。", "我讓仙女教母出手，但前提是她一直保持善良。在我的寓意裡，好心腸是比美貌更珍貴的禮物。", "她走進舞會的那一段，我寫得很華麗。因為我想讓讀者先相信這個夢，然後再看她怎麼面對夢的結束。", "我設計了午夜鐘響。一聲一聲，逼她做選擇：留下，就會在眾人面前被揭穿；離開，就可能永遠失去這個機會。", "她選擇離開，留下一隻鞋。我特別讓鞋子是玻璃做的：透明、易碎，卻不會變回原樣。那是她身上唯一不屬於魔法的真實。", "結局裡她原諒了兩個姊姊，還替她們安排婚事。我在寓意裡寫：美貌是寶藏，但優雅的心更是無價。這才是我真正想留下的。"]}], "小木偶皮諾丘": [{"name": "皮諾丘", "role": "故事主角本人", "who": "我是皮諾丘，一塊會說話的木頭。傑佩托爸爸把我刻出來的那天，我還沒學會走路，就先學會了逃跑。", "relation": "這是我自己的故事。說謊鼻子會變長的是我，被賣去馬戲團的是我，被變成驢子的也是我。每一個傻事，我都親自做過。", "why": "大家記得我的長鼻子，卻很少人記得我跳進鯨魚肚子那一刻。我想親口告訴你，一塊木頭，是怎麼變成一個人的。", "simple": ["我想變成真正的男孩。可一開始，我根本不懂那是什麼意思。我以為只要不再是木頭就好，後來才知道，是要讓爸爸以我為榮。", "問題是我太愛玩、太容易相信別人。狐狸和貓說錢可以種出錢樹，我就信了；有人說有個地方天天放假，我就跟去了。", "我說過很多謊，鼻子長過很多次。我也被吊在樹上、被關進牢裡、變成驢子。每一次，我都在付代價，只是我學得很慢。", "後來我才知道，爸爸為了找我，划著小船出海，被一條巨大的鯨魚吞進了肚子裡。", "我這輩子最會的事就是逃跑。可是那一次，我發現自己跑不了了。如果我不去，就再也沒有人會去救他。", "我跳進海裡，游進鯨魚的肚子。我找到爸爸，把他背在背上，趁鯨魚張嘴打呵欠時游了出去。那是我第一次為別人冒險。", "後來我每天打工、照顧生病的爸爸。某天早上醒來，我發現自己變成了真正的男孩。原來變成人的方法，不是許願，而是學會愛。"]}, {"name": "狐狸", "role": "一路誘騙皮諾丘的騙子", "who": "我是狐狸，平常和我的搭檔貓一起行走江湖。我們裝瘸的裝瘸，裝瞎的裝瞎，專門等那些天真的傢伙上門。", "relation": "我和皮諾丘的關係，是獵人和獵物。他口袋裡有五枚金幣，而我有一肚子的故事。", "why": "為什麼由我來說？因為我最清楚他哪裡好騙。一個騙子說的成長故事，才知道那個孩子到底長大了多少。", "simple": ["他說他想變成真正的男孩，想讓爸爸過好日子。我聽了只想笑：想要得太多、又想要得太快的人，最好騙。", "他最大的阻礙不是我，是他自己。他貪玩、愛聽好話、不喜歡吃苦。這種孩子，給他一個捷徑，他就會自己走進來。", "我帶他去「傻瓜國」，告訴他把金幣埋進土裡，隔天就會長出金幣樹。他真的埋了，還乖乖回去等。", "等他回來，金幣早就被我們挖走了。後來聽說他又被騙去玩具國，變成了驢子。我不意外，世界上多的是比我更狡猾的人。", "真正讓我意外的，是很久以後在路上又遇見他。他扶著老父親，身上穿著破衣服，手裡提著工作賺來的錢。", "我們那時已經又老又病，真的瞎了、真的瘸了，跟他討錢。他沒有報復，也沒有再上當。他只說：「偷來的錢，不會有好結果。」", "那一刻我才懂，我騙走的只是他的金幣。他後來賺回來的東西，是我這輩子都騙不到的：一個不再需要捷徑的自己。"]}, {"name": "卡洛．科洛迪", "role": "《木偶奇遇記》的作者", "who": "我是卡洛．科洛迪，本名卡洛．洛倫齊尼，出生在義大利佛羅倫斯。我當過記者、打過仗，也欠過賭債。寫皮諾丘的時候，我已經五十多歲了。", "relation": "皮諾丘最早是登在兒童報紙上的連載。說實話，一開始我並不太在乎他，甚至讓他在第十五章就被吊死在樹上。", "why": "是讀者把他救回來的。孩子們寫信到報社，要我讓他活下去。所以我想說說，一個被讀者救回來的木偶，後來怎麼學會救別人。", "simple": ["我給皮諾丘的目標是變成真正的孩子。那個年代的義大利，很多孩子不上學、在街上流浪，我想寫一個從流浪走回家的孩子。", "我讓他的阻礙來自他自己：懶惰、說謊、禁不起誘惑。因為我知道，對一個孩子來說，最大的敵人往往不是外面的壞人。", "我讓他一次又一次犯錯，付出代價。我不想寫一個乖孩子的故事，我想寫一個跌倒很多次、還能爬起來的孩子。", "寫到傑佩托被鯨魚吞下時，我讓故事整個轉向。前面都是皮諾丘被照顧，從這裡開始，換他要去照顧別人。", "我故意讓他最擅長的事是逃跑。這樣當他終於不逃的時候，讀者才會知道，那個孩子真的不一樣了。", "他跳進鯨魚肚子救父親。我寫這一段時想著：成長不是突然變聰明，而是第一次願意為別人承擔風險。", "最後他變成了真正的男孩，舊的木偶身體靠在椅子上。我讓他看著那具木偶說：「我以前多可笑啊！」能笑自己的過去，就是長大了。"]}], "小紅帽": [{"name": "小紅帽", "role": "故事主角本人", "who": "我叫小紅帽，因為外婆送了我一頂紅色絨帽，我天天戴著，大家就這樣叫我。那天，媽媽讓我帶著蛋糕和葡萄酒，穿過森林去看生病的外婆。", "relation": "這是我的故事，也是我第一次一個人走進森林。那段路不長，卻讓我從一個只會聽話的孩子，變成一個懂得害怕的人。", "why": "很多人拿我的故事來嚇小孩：不要跟陌生人說話。可我想親口說說，那天我到底是在哪一刻，把警覺放下的。", "simple": ["我的目標很簡單：把點心送到外婆家，讓她吃了好起來。媽媽出門前一直叮嚀：走大路，不要離開小徑，不要東張西望。", "可是森林很大，而我很小。我那時候不知道什麼叫危險，覺得每一隻動物都跟我一樣，只是想好好過日子。", "一開始我真的照著媽媽的話走，一步都沒有偏。我覺得自己很乖，很快就能把事情做好。", "然後我遇見了狼。他很有禮貌地問我去哪裡，我就老老實實告訴他：去外婆家，就在三棵大橡樹下面，旁邊有榛樹籬笆。", "他沒有撲過來，反而指著路邊說：「妳看，花開得多漂亮，鳥叫得多好聽，妳怎麼只顧著低頭走路？」", "我抬頭一看，陽光在樹葉間跳舞，到處都是花。我想，摘一束給外婆，她一定會很開心。就這樣，我一朵一朵，越走越遠。", "等我到外婆家，床上的「外婆」耳朵好大、眼睛好大、嘴巴好大。後來獵人救了我們，我對自己說：以後媽媽說不要離開小路，我就真的不離開。"]}, {"name": "大野狼", "role": "森林裡的狼", "who": "我是森林裡的狼。我不需要跑得最快，也不需要牙齒最利，我最厲害的本事，是讓人願意停下來跟我說話。", "relation": "我和小紅帽的關係，是一場對話。那天在森林裡，我只問了她幾個問題，她就把我想知道的全都告訴了我。", "why": "為什麼由我來說？因為大家都怪我兇狠，卻很少人研究我是怎麼贏的。我沒有搶，我只是聊天。", "simple": ["我一看到那頂紅帽子就知道：她有目的地，有時間壓力，還有一顆想把事情做好的心。這種孩子，最好引導。", "她最大的弱點，是她不覺得世界上有壞人。她看我的眼神，跟看一隻松鼠沒兩樣。", "她一開始走得很規矩，我若直接撲上去，她會尖叫，會有人聽見。所以我決定慢慢來。", "我只問了兩個問題：「妳去哪裡？」「外婆住在哪裡？」她全答了，連地標都告訴我。", "我沒有急著動手，而是給了她一份禮物：一片開滿花的草地。人一旦覺得對方是好意，就不會再防備了。", "她離開小路去摘花，我就抄近路先到了外婆家。是她自己給了我時間，我只是好好利用而已。", "我以為我贏了，吃飽了就在床上打呼。結果那一聲呼嚕，把獵人引了過來。原來我最擅長的是讓人放下警覺，最後卻輸在自己放下了警覺。"]}, {"name": "雅各．格林", "role": "《格林童話》的編者之一", "who": "我是雅各．格林，和弟弟威廉一起在德國各地蒐集民間故事。《小紅帽》是從說故事的婦人們口中聽來的，我們把它記下來、整理好，收進了《兒童與家庭童話集》。", "relation": "比我們更早，法國的佩羅也寫過小紅帽，但他的版本裡，小紅帽被狼吃掉就結束了。我們留下了獵人，也留下了一個讓孩子學到教訓的機會。", "why": "我想說說，一個原本很殘酷的民間故事，為什麼我們最後選擇讓它有第二次機會。", "simple": ["這個故事的目標設計得很小：把點心送到外婆家。越小的任務，越能讓孩子明白，危險常常藏在最日常的路上。", "真正的阻礙不是森林，而是她的天真。我們蒐集的每一個版本裡，狼都不是硬闖的，而是被請進來的。", "我們保留了母親的叮嚀：不要離開小路。這一句話是整個故事的鑰匙，後面發生的一切，都是在測試她記不記得。", "狼問路那一段，我們寫得很平常，平常得像鄰居聊天。因為我們希望讀的人意識到：最危險的對話，聽起來往往最無害。", "狼沒有動手，而是指給她看花。這是我們覺得最值得孩子記住的一幕：誘惑不一定兇惡，它常常很美。", "她離開了小路。所有說故事的人講到這裡，聲音都會壓低。因為大家都知道，就是這一步，讓狼先到了。", "我們讓獵人剖開狼肚，救出祖孫倆，最後還讓小紅帽說：以後再也不離開小路。我們想留下的不是恐懼，而是一堂來得及學會的課。"]}], "白雪公主": [{"name": "白雪公主", "role": "故事主角本人", "who": "我是白雪公主。母親生下我不久就過世了，她曾希望我的皮膚像雪一樣白、嘴唇像血一樣紅、頭髮像烏木一樣黑。後來，這份美麗差點害死我。", "relation": "這是我的故事。被獵人帶進森林的是我，在小矮人家裡掃地煮飯的是我，接過那顆蘋果的，也是我。", "why": "大家都說我太天真，被騙了三次。我想親口告訴你，一個人明明被傷害過，為什麼還是會開門。", "simple": ["我想要的只有一件事：活下去。王后派獵人殺我，我在森林裡跑了一整夜，直到看見一間小小的屋子。", "可是王后的魔鏡什麼都看得見。只要我還活著，她就不會停手。而我最大的問題是，我沒辦法把人想得很壞。", "七個小矮人收留了我。我替他們煮飯、洗衣、整理屋子。他們每天出門前都提醒我：不要讓任何人進來。", "有一陣子，我真的以為危險過去了。我有了家，有了一群會擔心我的人，日子平靜得像一場夢。", "然後，一位賣蘋果的老婆婆來敲窗。她先咬了一口白的那半邊，把紅的那半邊遞給我。我看她吃了沒事，就放心了。", "我咬下那口蘋果。那一刻我想的不是危險，而是：一位老人家這麼辛苦賣蘋果，我怎麼好意思拒絕？", "我倒下了，在玻璃棺裡躺了很久，直到那塊毒蘋果從喉嚨裡掉出來。醒來後我明白了：善良要留著，但門，不能隨便開。"]}, {"name": "王后", "role": "白雪公主的繼母", "who": "我是王后。每天早上，我都會站在魔鏡前問同一個問題：「魔鏡啊魔鏡，誰是世界上最美的女人？」很多年來，答案都是我。", "relation": "我和白雪公主的關係，是繼母和繼女，也是兩張臉。直到有一天，魔鏡說出了她的名字。", "why": "為什麼由我來說？因為這是一個關於美的故事，而沒有人比我更了解，害怕失去美的人會做出什麼事。", "simple": ["白雪公主想活下去，而我想讓她消失。說穿了，我們的目標是同一件事的兩面：這世界只能容得下一個最美的人。", "她最大的阻礙是我，而我最大的阻礙是那面鏡子。它從不說謊，也從不讓我好過。", "我派獵人帶她進森林，要他帶回她的心臟。他帶回來一顆野豬的心，而我吃了下去，以為一切結束了。", "魔鏡告訴我，她還活著，住在七座山後面的小矮人家裡。我明白了，別人靠不住，我得自己去。", "我試過緊身胸帶，試過毒梳子，都被小矮人救了回來。第三次，我做了一顆半邊有毒的蘋果，自己先咬沒毒的那一半。", "她接過去了。我早就算準了，她不會拒絕一個看起來無害的老人。我贏的不是力氣，是她的善良。", "後來王子帶走了玻璃棺，她醒了，還辦了婚禮。我去參加，在那裡付出了代價。我追了一輩子最美的臉，最後才發現，醜的一直是我的心。"]}, {"name": "威廉．格林", "role": "《格林童話》的編者之一", "who": "我是威廉．格林。我和哥哥雅各一起蒐集民間故事，雅各重視原汁原味，我則負責把故事潤飾得讓孩子讀得下去。《白雪公主》一版一版地改，大部分出自我的手。", "relation": "最早的版本裡，想殺白雪公主的是她的親生母親。是我們後來改成了繼母。這個故事經過了很多人的口，也經過了我的筆。", "why": "我想說說，為什麼我們讓王后來了三次，為什麼讓她一次比一次聰明，而白雪公主一次比一次心軟。", "simple": ["我讓白雪公主的目標只有活下去。在一個故事裡，目標越單純，讀者越能看清楚她每一次的選擇。", "阻礙有兩層：外面是王后的嫉妒，裡面是她不肯把世界想壞。我特別讓她被騙三次，因為一次是意外，三次就是性格。", "小矮人的家是我給她的避風港，也是一堂課。他們一再叮嚀：誰都不要開門。規則很清楚，考驗的是她守不守得住。", "我讓她過了一段平靜日子。故事需要一個假的終點，讓讀者和她一起鬆一口氣。", "蘋果是我最用心的設計：一半紅一半白，王后先吃白的那半。惡意最可怕的樣子，就是先證明自己無害。", "她咬下去了。我沒有寫她很笨，我寫的是她很好。這樣孩子們讀到這裡才會心疼，也才會記住。", "我讓她在玻璃棺裡被看見、被帶走，毒蘋果從喉嚨裡滑出來。她醒過來，也長大了。童話不必把善良寫成錯，只需要讓它學會睜開眼睛。"]}], "羅密歐": [{"name": "羅密歐", "role": "故事主角本人", "who": "我是羅密歐，維洛那城蒙太古家的獨子。在遇見茱麗葉之前，我以為自己愛著另一個女孩，整天唉聲嘆氣。見到她之後，我才知道以前那些都不算數。", "relation": "這是我的故事。從面具舞會上的那一眼，到陽台下的誓言，到墓室裡那瓶毒藥，每一步都是我自己跑過去的。", "why": "大家都說我太衝動。我不辯解。我只想親口告訴你，一個人在愛裡為什麼會那麼急，急到來不及等真相。", "simple": ["我只想和茱麗葉在一起。她是凱普萊特家的女兒，我們兩家是世仇，可我不在乎。我想要的是一個能光明正大愛她的未來。", "整座城都不允許。兩家的僕人在街上見面就打，親王說再有人鬥毆就判死刑。我們的愛，在這座城裡根本沒有位置。", "我們認識的第二天，勞倫斯神父就替我們秘密證婚。我想，只要先成為夫妻，總有一天可以說服兩家。", "可是婚禮當天，提伯特殺了我的朋友茂丘西奧，我一怒之下殺了他。我被放逐到曼圖亞，茱麗葉被家人逼著嫁給帕里斯。", "神父安排她喝藥假死，再寫信通知我。可信沒送到。我的僕人跑來告訴我：茱麗葉死了，已經下葬了。", "我沒有再問，也沒有再等。我買了毒藥，連夜騎馬回維洛那，走進墓室。她躺在那裡，美得像是睡著了。我喝下了毒藥。", "我倒下沒多久，她就醒了。後來兩家的父親在我們身邊握手言和。我用生命換來了和平，卻也永遠錯過了那一口氣的時間。"]}, {"name": "提伯特", "role": "茱麗葉的表哥，凱普萊特家的劍客", "who": "我是提伯特，凱普萊特家的人，茱麗葉的表哥。維洛那城裡，沒有人劍比我快。人家叫我「貓王子」，因為我出手又快又狠。", "relation": "我和羅密歐的關係，是仇人。我們兩家的恨，比我們兩個人的年紀還老。我從小就被教導：看到蒙太古家的人，就拔劍。", "why": "為什麼由我來說？因為這個悲劇，是從我的劍開始的。如果你想知道仇恨怎麼一步步把兩個孩子逼上絕路，你該聽聽帶頭仇恨的人。", "simple": ["羅密歐想要愛情，我想要的是面子。家族的名譽比什麼都重要，蒙太古家的人竟敢戴著面具混進我們的舞會，這是羞辱。", "我就是他們的阻礙之一。整座城的恨意，需要有人拿劍去執行，而我一直很樂意做那個人。", "舞會那晚我就想動手，是叔叔攔住了我。我發誓，這筆帳一定要算。第二天我就去街上找羅密歐決鬥。", "他竟然不肯跟我打，還叫我「好親戚」。我聽不懂，以為他在羞辱我。茂丘西奧替他出頭，被我一劍刺死。", "羅密歐瘋了一樣衝過來。我沒想到，那個一直退讓的人，劍會突然變得那麼快。我倒在街上，到死都不明白他為什麼叫我親戚。", "後來我才知道，那天早上，他剛娶了茱麗葉。他不是懦弱，他是想停下這場仇恨。而我，親手把他推回了仇恨裡。", "我死後，他被放逐，她假死，他真死，她再死。兩家人最後在墓前和解。我才明白，我一生守護的名譽，只是把兩個孩子送進墳墓的理由。"]}, {"name": "莎士比亞", "role": "《羅密歐與茱麗葉》的作者", "who": "我是威廉．莎士比亞。寫這齣戲的時候，我三十歲左右，在倫敦替劇團寫劇本。故事不是我原創的，在義大利流傳很久了，但我把它壓縮成短短幾天。", "relation": "羅密歐是我筆下最年輕的主角之一。我讓他十幾歲，衝動、熱烈、說起話來全是詩。我年輕時，大概也像他。", "why": "原來的故事發生在九個月裡，我把它改成四、五天。我想說說，為什麼我要讓所有事情都這麼快。", "simple": ["我給羅密歐的目標是和茱麗葉在一起。這個目標簡單到任何觀眾都懂，也因此，阻擋它的一切都顯得格外殘忍。", "我在開場的第一段就告訴觀眾：這是一對「命運多舛的戀人」。阻礙不是某一個壞人，而是整座被仇恨綁住的城。", "我讓他們一見鍾情，隔天就結婚。我想讓觀眾看見：愛越急，就越想在仇恨的縫隙裡擠出一條路。", "然後我讓茂丘西奧死、提伯特死、羅密歐被放逐。一場街頭鬥毆，就把喜劇變成了悲劇。這是整齣戲的轉捩點。", "我設計了一封沒送到的信。因為瘟疫封城，送信的修士出不了門。悲劇常常不是大惡造成的，而是一個小小的延誤。", "羅密歐沒有等。我讓他在墓室裡說完最後的情話，喝下毒藥。觀眾知道茱麗葉就快醒了，他不知道。這一段落差，就是我要的心碎。", "戲的最後，兩家的父親握手，說要替對方的孩子立金像。我讓和平來得這麼晚，是想問觀眾：非要付出這樣的代價，仇恨才肯停嗎？"]}], "愛麗絲": [{"name": "愛麗絲", "role": "故事主角本人", "who": "我是愛麗絲。那天下午，我坐在河岸邊，姊姊在看一本沒有圖畫也沒有對話的書，我無聊得快睡著了。然後，一隻穿背心、拿懷錶的白兔從我面前跑過去。", "relation": "這是我的故事。掉進兔子洞的是我，一下變大一下變小的是我，最後在法庭上站起來大聲說話的，也是我。", "why": "大家都覺得仙境好玩，可身在其中的人其實很害怕。我想親口告訴你，一個小女孩是怎麼在一個沒有道理的世界裡，找回自己的判斷。", "simple": ["我想弄懂這個地方。一開始只是好奇那隻兔子要去哪裡，後來變成想找到那座美麗的花園，想知道這裡的規則到底是什麼。", "可是這裡什麼都不固定。喝一口我就縮小，吃一口我就變大；毛毛蟲問我是誰，我竟然答不出來。連我自己都不穩定。", "我一路問問題：問柴郡貓該走哪條路，問瘋帽匠為什麼永遠是下午茶時間。答案都很荒謬，但我還是一直問。", "最後我被帶到紅心國王和皇后的法庭。他們在審判一個偷了水果塔的傑克，證據亂七八糟，皇后動不動就喊「砍掉他的頭」。", "我坐在那裡，身體慢慢變大。我突然發現，這些讓大家嚇得發抖的國王、皇后、侍衛，其實只是一副撲克牌。", "皇后要先判刑再討論，我忍不住站起來說：「胡說八道！」她叫人砍我的頭，我說：「誰理你們？你們不過是一副紙牌！」", "紙牌全飛到我臉上，我一揮手，醒了過來。原來是一場夢。可是從那天起，我知道了：看起來很有權威的東西，不一定有道理。"]}, {"name": "紅心皇后", "role": "仙境的統治者", "who": "我是紅心皇后，仙境的女王。在我的國度裡，規則由我決定，心情也由我決定。不高興的時候，我只要說一句「砍掉他的頭」，大家就會安靜。", "relation": "我和愛麗絲的關係，是女王和闖入者。她在我的槌球場出現，後來又在我的法庭上，做了一件從來沒有人敢做的事。", "why": "為什麼由我來說？因為她的長大，是踩著我的權威完成的。只有被推倒的人，才知道那一下有多重。", "simple": ["那個女孩想弄懂仙境的規則。真可笑，規則就是我。她只要照做就好，何必弄懂？", "我的國度靠的不是邏輯，是恐懼。每個人都怕我，所以每個人都聽話。我從不需要解釋，因為從來沒人敢問。", "她在槌球場上跟我說話，一點都不怕。我很不喜歡。我看得出來，她一直在觀察，一直在想，一直在懷疑。", "我把她帶進法庭。審判嘛，本來就是一場表演：證人發抖，陪審團亂寫，國王念些看不懂的證據，最後我宣判。", "她越變越大。我發現，當她不再害怕的時候，我的聲音就越來越小。原來我的權力，一直是寄放在別人的害怕裡。", "她說：「你們不過是一副紙牌。」那一刻，整個法庭都安靜了，連我也是。因為她說的，是真的。", "我們全飛了起來，散落一地。她醒了，而我什麼都不是了。我統治了這麼久，最後被一句實話拆穿。"]}, {"name": "路易斯．卡羅", "role": "《愛麗絲夢遊仙境》的作者", "who": "我是路易斯．卡羅，本名查爾斯．道奇森，在牛津大學教數學。1862年一個夏天的午後，我划船帶著朋友家的三個小女孩出遊，邊划邊編了一個故事，主角就用其中一個女孩的名字：愛麗絲。", "relation": "小愛麗絲聽完，要我把故事寫下來。我寫了，還自己畫插圖送給她。後來擴寫出版，就是這本書。", "why": "我是數學家，最在乎邏輯。可我寫了一本最不講邏輯的書。我想說說，為什麼我要讓一個孩子，在荒謬的世界裡學會懷疑。", "simple": ["我給愛麗絲的目標，是弄懂仙境。這其實是每個孩子進入大人世界時的處境：到處都是規則，卻沒人解釋為什麼。", "我讓仙境的邏輯全是歪的：文字遊戲、倒過來的推理、永遠停在六點的下午茶。這不是亂寫，是我刻意把大人的規矩誇張給你看。", "我讓她一直發問。我相信，一個會問「為什麼」的孩子，就不容易被荒謬吞掉。", "最後一章我安排了一場審判。大人世界裡最莊嚴的地方，被我寫成最荒唐的舞台：先判刑，後定罪。", "我讓她在法庭上慢慢變大。這是我給她的隱喻：當一個人的判斷力長大了，那些原本嚇人的權威，就變小了。", "「你們不過是一副紙牌！」這句話，是我替所有被規矩壓著的孩子喊出來的。", "她醒了，故事結束在姊姊的想像裡：愛麗絲長大後，會把這個夢說給她的孩子聽。我希望她帶走的不是奇遇，而是那份敢說出實話的勇氣。"]}], "蝙蝠俠": [{"name": "布魯斯．韋恩", "role": "蝙蝠俠本人", "who": "我是布魯斯．韋恩。八歲那年，我親眼看著父母在巷子裡被槍殺。從那天起，我就在想同一件事：怎麼讓這座城市，不再有下一個八歲的我。", "relation": "我就是蝙蝠俠。白天，我是揮金如土的富家子；晚上，我戴上面具，站在高譚市的屋頂上。", "why": "大家都以為我最痛苦的是對抗小丑。其實不是。我想親口告訴你，那天晚上我為什麼要替哈維背下所有罪名。", "simple": ["我想守住高譚市。但我更想做的是，有一天高譚不再需要蝙蝠俠，由一個不戴面具的英雄，在陽光下守護它。", "小丑出現了。他不要錢，不要權，他只想證明一件事：只要給一點壓力，每個好人都會崩潰。", "我一次又一次追捕他，也一直在幫哈維．丹特。哈維是檢察官，是高譚的白騎士，是我希望有一天能取代我的人。", "可是小丑贏了一局。他害死了瑞秋，把哈維逼成了雙面人。高譚最乾淨的那張臉，毀了一半。", "最可怕的不是哈維殺了人，而是如果大家知道真相，他們送進監獄的那些罪犯都會被放出來，整座城市會再也不相信正義。", "所以我對高登說：把罪名都算在我頭上。讓哈維繼續當英雄，讓我當兇手。我可以承受被恨，這就是我能做的。", "高登砸碎了屋頂的探照燈，警察開始追捕我。我騎著車消失在黑夜裡。我不是高譚需要的英雄，但我是它此刻值得的那一個。"]}, {"name": "小丑", "role": "蝙蝠俠的宿敵", "who": "我是小丑。你想知道我臉上的疤怎麼來的？我可以告訴你好幾個版本，每一個都不一樣。重要的不是過去，重要的是，我讓你害怕了。", "relation": "我和蝙蝠俠的關係？你可以說是宿敵。但我更喜歡說：他需要我，我也需要他。沒有我，他只是一個穿著奇怪衣服的有錢人。", "why": "為什麼由我來說？因為這整場戲是我導演的。我只是想證明一件事，而他差點讓我證明失敗。", "simple": ["他想守住高譚，想讓大家相信秩序。可笑。秩序只是大家講好一起假裝的東西，只要一點點混亂，就會露出原形。", "我就是那一點點混亂。我不要錢，那天我把一整堆鈔票燒了。我要的是證明：只要逼得夠緊，每個人都會變成我。", "我給他出題：每天殺一個人，直到你摘下面具。我讓兩艘船上的人互相按引爆器。我在醫院裡等著哈維醒來。", "哈維崩潰了。我只是跟他聊了幾句，他就從白騎士變成雙面人，拿著硬幣決定別人的生死。你看，我說得沒錯吧？", "可是船上的人，沒有一個按下按鈕。那是我第一次輸。原來這座城市的人，沒有我想像的那麼容易崩潰。", "然後蝙蝠俠做了一件我沒算到的事：他把哈維的罪全扛了。他寧可自己被恨，也要保住大家對哈維的信任。", "我被吊在大樓外面，還在笑。可是笑著笑著我就知道了，這一局我沒贏。他保住的不是一座城，而是一個讓人繼續相信的理由。"]}, {"name": "詹姆斯．高登", "role": "高譚市警察局長，蝙蝠俠的盟友", "who": "我是詹姆斯．高登，高譚市警察局的警官，後來當上了局長。我是個普通人，有家庭，有薪水，有一個常常把我弄得焦頭爛額的城市。", "relation": "我和蝙蝠俠的關係，是屋頂上的探照燈。每次高譚撐不住了，我就打開那盞燈，他就會出現。我從來不知道面具底下是誰，也不需要知道。", "why": "為什麼由我來說？因為那天晚上，是我親手答應他的要求，也是我親手砸碎了那盞燈。這個祕密，我得一個人扛著。", "simple": ["他要的從來不是當英雄。他要的是高譚有一天不再需要他。他把希望押在哈維．丹特身上，我也是。", "小丑讓整座城陷入瘋狂。我們警察局裡有內鬼，法院裡有人被收買，每個人都在害怕，不知道該相信誰。", "蝙蝠俠在前面追小丑，我在後面收拾殘局。有一陣子，我甚至假裝自己死了，只為了把小丑引出來。", "哈維變了。他綁架了我的家人，拿槍抵著我兒子的頭，說要讓我也嘗嘗失去最愛的滋味。蝙蝠俠撲過去，兩個人一起摔下樓。", "哈維死了。我看著他那張燒毀的臉，心裡只有一個念頭：如果市民知道他們的白騎士變成了殺人犯，這座城就完了。", "蝙蝠俠說：「你要追捕我，高登。」我不想答應，但我知道他是對的。那一刻，他把我們所有人該扛的東西，一個人扛走了。", "在哈維的葬禮上，我說他是英雄。然後我砸碎了屋頂的探照燈。我的兒子問我，蝙蝠俠為什麼要逃？我說：因為他是沉默的守護者，是黑暗騎士。"]}], "浮士德": [{"name": "浮士德", "role": "故事主角本人", "who": "我是浮士德博士。哲學、法律、醫學，還有該死的神學，我全都讀透了。可是站在書房裡，我還是一個可憐的傻瓜，和從前一樣聰明，也一樣無知。", "relation": "這是我的故事。與魔鬼握手的是我，用鮮血簽下名字的也是我。這一生所有的追求、所有的罪，都是我自己選的。", "why": "大家都說我出賣了靈魂。我想親口告訴你，一個人為什麼會覺得，擁有了這麼多，還是不夠。", "simple": ["我想知道是什麼把世界最深處連在一起。書本告訴我的都是別人的答案，我想要的是親眼看見、親身經歷的真理。", "可我已經到了知識的盡頭。我讀得越多，越覺得空虛。有一晚，我甚至拿起了毒藥杯，想結束這無聊的一生。", "就在那時，梅菲斯特出現了。他說他能給我一切。我跟他打賭：只要有一天我對某個瞬間說「停一停吧，你真美」，我的靈魂就歸他。", "他讓我重返青春，帶我去酒館、去宮廷、去古希臘，見識了愛情、權力、美。我得到了一個凡人不可能擁有的人生。", "可是我也毀了葛麗卿。那個純真的女孩因為愛我，失去了母親、哥哥、孩子，最後被關進死牢。我追求的每一份經驗，都有人替我付帳。", "我年老眼瞎時，還在指揮人開墾海岸，想為千萬人建一片自由的土地。我想像那個畫面，忍不住說出：「停一停吧，你真美！」", "我倒下了，魔鬼來收我的靈魂。天使卻把我帶走了：「凡是自強不息的人，我們都能救他。」我這一生錯了很多，但我始終沒有停止追求。"]}, {"name": "梅菲斯特", "role": "與浮士德簽約的魔鬼", "who": "我是梅菲斯特，那種總是否定一切的精靈。上帝和我打過一個賭：祂說浮士德不會迷失，我說只要給我機會，我就能把他帶走。", "relation": "我和浮士德的關係，是一紙契約。我當他的僕人，滿足他一切欲望；等他滿足的那一刻，他就要當我的僕人。", "why": "為什麼由我來說？因為我比任何人都了解他的欲望。每一個讓他心動的東西，都是我親手端到他面前的。", "simple": ["他說他想追求真理。說得真好聽。我見過太多這樣的人，說到底，他只是不甘心，不甘心一輩子就這樣過去。", "他的阻礙就是他自己：永遠不滿足。可這正好是我的機會。一個永遠不滿足的人，最適合交給魔鬼來照顧。", "我讓他用鮮血簽名。我告訴他，只要有一刻他想留下來，賭局就算我贏。他很有自信地簽了。", "我給他青春、愛情、財富、權力，甚至讓他娶了古希臘最美的海倫。我辦事從不小氣。", "他愛上了葛麗卿，我幫他送珠寶、下迷藥、殺了她哥哥。我以為他會沉淪，他卻在她的牢房前痛苦萬分。我不懂，人為什麼會後悔。", "他老了，還在填海造地，說要讓千萬人自由生活。他終於說出那句話了：「停一停吧，你真美！」我等這句話等了一輩子。", "可是天使來了，把他的靈魂帶走。我輸了。我到最後都沒搞懂，一個犯了這麼多錯的人，為什麼還能得救。原來他的不滿足，不是我的武器，是他的出路。"]}, {"name": "歌德", "role": "《浮士德》的作者", "who": "我是約翰．沃夫岡．馮．歌德，德國的詩人、作家，也當過威瑪公國的大臣。我從二十多歲開始寫《浮士德》，一直寫到八十二歲去世前不久，才把第二部封存起來。", "relation": "浮士德不是我發明的，他是德國民間傳說裡那個把靈魂賣給魔鬼的博士。但我寫了他六十年，他早就長成了我自己的樣子。", "why": "原本的傳說裡，浮士德最後是被魔鬼抓下地獄的。我改了結局。我想說說，為什麼我讓他得救。", "simple": ["我給浮士德的目標，是理解世界最深處的秘密。這也是我自己的目標，我研究植物學、光學、礦物學，從來沒停過。", "他的阻礙是人類永恆的困境：知道得越多，越覺得不夠。這種不滿足，可以是動力，也可以是深淵。", "我讓他和魔鬼打賭，而不是單純地賣靈魂。這一點很重要：他賭的不是享樂，而是他相信自己永遠不會滿足。", "我讓他經歷了愛情、權力、美與歷史。第一部是一個人的小世界，第二部是整個大世界。我用了六十年寫完這兩個世界。", "葛麗卿的悲劇是我最心痛的一段。我要讀者看見：一個追求無限的人，會在路上踩碎多少有限的生命。", "最後我讓他在為別人造地的時候，說出那句「停一停吧」。他滿足的不是自己的享受，而是看見了一群自由的人。", "我讓天使唱著：「凡是自強不息的人，我們都能救他。」這是我寫了一生的答案：人會迷途，但只要還在努力，就不算真正失落。"]}], "亞森羅蘋": [{"name": "亞森羅蘋", "role": "故事主角本人", "who": "我是亞森．羅蘋，紳士怪盜。我有一百張臉、一百個名字。今天我可能是男爵，明天是神父，後天是站在你身邊的那位警探。", "relation": "這是我的故事。那些預告信、那些偷天換日的布局、那些在警方眼皮底下消失的夜晚，全是我一手策劃的。", "why": "大家都說我是小偷。我承認。但我想親口告訴你，一個小偷，為什麼要把偷竊做得這麼漂亮。", "simple": ["我要的不只是珠寶和名畫，那太無聊了。我要贏，而且要贏得漂亮：讓整個法國的警察、報紙、富豪都看著我，卻攔不住我。", "我的對手很多：加尼瑪探長、層層防備的豪宅、一次比一次多的警力，還有觀眾越來越高的期待。每一次，都得比上一次更精彩。", "我的功夫不在撬鎖，在布局。我先寄預告信，告訴主人我哪天會來。他越緊張，就越會把寶物藏在我想要他藏的地方。", "我幾乎每次都成功。更過癮的是，我常常在成功之後，才讓大家發現我早就在現場，扮成了他們最信任的人。", "最讓我意外的是，人們開始喜歡我了。報紙寫我的新聞像在寫連載小說，太太小姐們收集我的照片，連被偷的人都說我很有風度。", "我從來不殺人，也不偷窮人。我偷的是那些靠權勢和運氣累積財富的人。我把犯罪變成一場公開的較量，而規則由我來定。", "我讓法國人明白，體制不是無懈可擊的，權威也可以被嘲笑。這大概是我偷過最值錢的東西：大家看世界的方式。"]}, {"name": "加尼瑪探長", "role": "一生追捕亞森羅蘋的警探", "who": "我是加尼瑪，巴黎警察廳的探長。我辦案三十年，抓過無數竊賊和殺人犯。但我這輩子最常被人問起的，是那個我抓不住的人。", "relation": "我和亞森．羅蘋的關係，是貓和老鼠。只不過，大多數時候，我才是被耍的那一個。", "why": "為什麼由我來說？因為追他追得最久的人是我。我比任何人都清楚，他到底有多厲害，又到底在想什麼。", "simple": ["羅蘋要的不是錢，這一點我很早就看出來了。他要的是贏過我們，而且要讓全世界都看見他贏。", "我們有人力、有檔案、有法律。可他有一百張臉。我們每一次布下天羅地網，他都能找到那個唯一的縫。", "他的預告信寄來時，我們都會加派人手。可後來我才發現，他就是要我們緊張。我們越緊張，越會照著他的劇本走。", "我親手逮捕過他一次，把他關進了桑特監獄。報紙說：羅蘋完了。我那天晚上睡得特別好。", "然後他在牢裡寫信給報社，說他會在審判那天缺席。審判那天，站在被告席上的人，竟然不是他。我到現在還不確定，他是什麼時候換掉的。", "我後來明白了，他不是在逃避我們，而是在跟我們對戲。他要的是觀眾，而我們警察，也被他寫成了戲裡的配角。", "我還是會繼續追他，這是我的職責。可我得承認，他讓這個行業變得有趣了。對手越強，我越想當個更好的警探。"]}, {"name": "莫里斯．盧布朗", "role": "《怪盜亞森羅蘋》的作者", "who": "我是莫里斯．盧布朗，法國作家。1905年，一本雜誌請我寫一篇偵探小說，我寫了一個在郵輪上被逮捕的紳士大盜。沒想到這一寫，就寫了三十多年。", "relation": "那時候英國有福爾摩斯，法國需要一個自己的傳奇。我給了法國一個跟福爾摩斯完全相反的人：不是抓賊的偵探，而是一個讓偵探頭痛的賊。", "why": "我想說說，我為什麼要讓一個小偷當主角，還讓讀者站在他那一邊。", "simple": ["我給羅蘋的目標，是用最優雅的方式戰勝體制。他不是為了錢，而是為了證明：規則是可以被玩弄的。", "我給了他一個一直在追的探長，還讓他跟福爾摩斯交過手。對手越強，他的智慧才顯得越亮。", "我讓他靠腦袋而不是暴力。變裝、預告信、心理戰，每一次行動都像一齣戲，讀者是觀眾，也是共犯。", "我讓他幾乎每次都贏。讀者很快就發現，他們讀我的小說，不是為了看他會不會被抓，而是為了看他這次要怎麼贏。", "連我自己都沒料到，讀者會這麼愛他。有人寫信給我，說他是法國人心中的俠盜。那時我才明白，他代表了一種大家心裡壓著的聲音。", "我讓他有原則：不殺人，不欺負弱者，偶爾還會把東西還回去。一個有原則的反叛者，讀者才願意為他鼓掌。", "我寫他寫了三十多年，他有時讓我煩，好像他比我還出名。但我知道，他留下的，是一種帶著笑容挑戰權威的精神。"]}], "普羅米修斯": [{"name": "普羅米修斯", "role": "故事主角本人", "who": "我是普羅米修斯，泰坦神族的一員。我的名字意思是「先見者」，我總是比別人先看到事情會怎麼發展。所以我偷火的時候，就已經知道自己會受到什麼懲罰。", "relation": "這是我的故事。據說人類是我用泥土捏出來的，我看著他們在寒冷和黑暗裡發抖，看了很久。", "why": "大家記得我被綁在山上，老鷹每天來啄我的肝。我想親口告訴你，為什麼明知道結局，我還是要做。", "simple": ["我想把火給人類。有了火，他們就能取暖、煮食、打造工具、驅趕野獸。火不只是火，是他們從此能照亮自己的開始。", "可是火屬於神。宙斯不願意人類擁有這樣的力量，他寧可讓人類永遠跪在地上，依靠神的施捨活下去。", "我在一根茴香莖裡藏了一點火種，從天上偷偷帶下來，交給了人類。整個過程其實很安靜，一點都不壯烈。", "火在人間燒了起來。人類學會了冶金、耕種、建屋，也開始有了文明。我在旁邊看著，覺得一切都值得。", "宙斯的懲罰來了。我被鐵鏈鎖在高加索山的懸崖上，每天一隻老鷹來啄食我的肝，晚上肝又長回來，第二天再被吃。這一切我早就預見了。", "宙斯派人傳話：只要我說出一個關於他未來的祕密，就放了我。我沒有說。我不後悔，也不求饒。", "很多年後，海克利士路過，射死了那隻老鷹，打斷了鎖鏈。可就算沒有人來救我，我也不會收回那把火。因為那把火，現在是人類自己的了。"]}, {"name": "宙斯", "role": "奧林帕斯的眾神之王", "who": "我是宙斯，眾神之王，雷電是我的武器。我推翻了父親克羅諾斯，建立了奧林帕斯的秩序。在這個秩序裡，神在上，人在下。", "relation": "我和普羅米修斯的關係，本來是盟友。泰坦之戰時，他站在我這邊。可後來，他為了人類，一次又一次地挑戰我。", "why": "為什麼由我來說？因為故事裡的暴君，也有自己的理由。你們只聽到他受的苦，卻沒聽過我為什麼要懲罰他。", "simple": ["普羅米修斯想要人類擁有火。在他看來那是恩賜，在我看來那是失序。一個掌握了火的物種，總有一天會以為自己也是神。", "所以我不給。秩序需要界線，神與人的界線，就是那把火。我是在守護這個世界的結構。", "他先是在獻祭時耍花招，讓人類把好肉留給自己、把骨頭獻給神。我忍了。然後他竟然偷了火，藏在茴香莖裡帶下凡間。", "火在人間蔓延開來。我從奧林帕斯往下看，到處都是爐火、鍛造的火光、夜裡的燈。那是我無法再收回的東西。", "我懲罰了人類，送去潘朵拉和她的盒子；也懲罰了他，把他鎖在懸崖上。我以為他會求饒，他沒有。", "他知道一個關於我命運的祕密，我用自由交換，他還是不說。那時候我才明白，他不是不怕痛，而是比我更堅定。", "很多年後，我默許了我的兒子海克利士去解救他。我沒有認輸，但我也不得不承認：有些東西，就算是神，也關不住。"]}, {"name": "埃斯庫羅斯", "role": "古希臘悲劇《被縛的普羅米修斯》的作者", "who": "我是埃斯庫羅斯，雅典的悲劇詩人，也是在馬拉松戰役裡和波斯人打過仗的士兵。後人叫我「悲劇之父」。《被縛的普羅米修斯》，傳統上被認為是我的作品。", "relation": "在我之前，赫西俄德已經寫過普羅米修斯盜火的故事，在他筆下，那更像是一個狡猾的騙子受到懲罰。是我把他搬上舞台，讓他成為一個受苦的英雄。", "why": "我的整齣戲，普羅米修斯從頭到尾都被綁在岩石上，一步都沒動。我想說說，為什麼一個不能動的角色，能撐起一整部悲劇。", "simple": ["我讓普羅米修斯開口說出他的目標：他給人類的不只是火，還有數字、文字、醫術、航海。火是所有技藝的母親。", "我讓宙斯始終沒有上台。觀眾只看到他派來的權力與暴力把普羅米修斯釘上岩石。看不見的暴君，往往最可怕。", "戲裡他沒辦法行動了。所以他的努力，全部變成了語言：回憶、辯論、預言。他用說話在反抗。", "一位又一位角色來看他：海洋神女、老俄刻阿諾斯、流浪的伊娥。每一位都勸他低頭，也每一位都讓觀眾更看清他為人類做了什麼。", "最大的轉折，是他透露自己握有宙斯命運的祕密。一個被綁住的人，竟然握著綁他的人最怕的東西。", "荷米斯前來威脅，他拒絕說出祕密。戲的最後，雷電大作，岩石崩裂，他被打進深淵。他沒有投降。", "我讓觀眾帶著震撼離開劇場。我要他們思考：當權力與正義衝突時，一個人能不能選擇受苦，也不放棄自己相信的事？"]}], "海克利士": [{"name": "海克利士", "role": "故事主角本人", "who": "我是海克利士，宙斯的兒子，也是凡人阿爾克墨涅的兒子。我生下來就力大無窮，還在搖籃裡就捏死了兩條大蛇。可是力氣越大的人，犯下的錯也越大。", "relation": "這是我的故事。十二項試煉，每一項都是我自己扛下來的。但在那之前，我先犯下了一生最沉重的罪。", "why": "大家記得我殺了獅子、擒了地獄犬，好像我天生就是英雄。我想親口告訴你，那十二件事，其實是一場贖罪。", "simple": ["我要完成十二項試煉，這是神諭給我的唯一出路。只有做完它們，我才能洗清罪過，才能重新做一個人。", "我的罪，是在赫拉讓我陷入瘋狂時，親手殺死了自己的妻子和孩子。清醒之後，我寧可死。那種痛，比任何怪物都可怕。", "於是我去為我的表兄歐律斯透斯服役十二年。他派我去殺尼米亞的獅子、九頭蛇、捕捉聖鹿、清洗奧革阿斯的牛棚，一件比一件更難。", "我全都做到了。我披著獅皮、拿著木棍，走遍了希臘，甚至走進冥府，把三頭地獄犬帶了上來。人們開始叫我最偉大的英雄。", "可是沒有一項試煉能讓我忘記那一天。英雄的名號越響，我心裡那個洞就越深。原來功績洗不掉記憶。", "我從來沒有用神的血統求情，也沒有用我的力氣逃走。我接受這個代價，一天一天，把它做完。", "很多年後我死去，被接上了奧林帕斯，成為神。可我最想讓人記住的不是我變成了神，而是：一個犯過大錯的人，還可以選擇用一生去承擔。"]}, {"name": "赫拉", "role": "天后，宙斯的妻子", "who": "我是赫拉，奧林帕斯的天后，婚姻的守護女神。而海克利士，是我丈夫背叛我的證據。", "relation": "我和海克利士的關係，從他出生前就開始了。我拖延他的出生，讓他失去王位；我在他搖籃裡放了兩條蛇；後來，我讓他發了瘋。", "why": "為什麼由我來說？因為他這一生所有的苦難，都和我有關。只有我知道，他是怎麼一次次從我手裡活下來的。", "simple": ["他要完成十二項試煉。我很清楚，因為那個逼他去服役的國王歐律斯透斯，本來就是我安排坐上王位的人。", "他最大的阻礙是我。我恨他，不是因為他做了什麼，而是因為他是誰：他的存在，就是在提醒全世界宙斯對我的不忠。", "每一項試煉，我都在背後加碼。他去殺九頭蛇時，我派了一隻大螃蟹去咬他的腳。我從來不讓他輕鬆。", "可他全都做到了。我越刁難他，他就越出名。到最後，全希臘都在歌頌他，那些歌裡，我是那個惡毒的天后。", "讓我意外的是，他從來沒有來找我報仇。他恨我嗎？也許。但他從不把力氣花在恨我身上，他只是一件一件，把該做的事做完。", "我以為他會崩潰，會詛咒眾神，會用他的力量反抗天界。可他沒有。他選擇承擔，而不是反擊。", "他死後被接上奧林帕斯，我們和解了，我甚至把女兒赫柏嫁給了他。這很奇怪，對吧？我花了一生折磨他，最後卻不得不承認，他配得上成為神。"]}, {"name": "伊奧勞斯", "role": "海克利士的姪子與戰車夥伴", "who": "我是伊奧勞斯，海克利士的姪子。我從年輕時就跟著他，替他駕戰車，陪他走過好幾項試煉。", "relation": "大家看見的是英雄，我看見的是一個會在半夜驚醒的人。我和他的關係，是戰車上的夥伴，也是他少數肯說心裡話的人。", "why": "為什麼由我來說？因為那些偉大的功績，我有一些是親眼看見的。而那些他不肯說的痛，我也看見了。", "simple": ["他要完成十二項試煉。對外人來說那是冒險，對他來說那是懲罰。他出發的那天，一句話也沒說。", "最難的不是怪物，而是他心裡的罪。有時候他站在獅子屍體旁邊，一動不動地看著遠方，我知道他又想起了那一天。", "我陪他去殺九頭蛇。那怪物砍掉一個頭就長出兩個，他砍，我就拿火把去燒斷口，這樣頭才長不出來。那一戰，我們打了很久。", "他完成了一項又一項，名聲傳遍希臘。每到一座城，都有人請他喝酒、唱他的歌。他笑著接受，可回到營地後，常常一個人坐到天亮。", "我最意外的是，國王說九頭蛇那一項不算，因為我幫了忙。他沒有爭，只說：「那就再多做一項吧。」", "他從不討價還價。力氣那麼大的人，要反抗誰都可以，可他選擇忍，選擇做完。那是我見過最強的力量。", "他後來成了神。有人問我，他是怎麼成為最偉大的英雄的？我說：不是因為他殺了多少怪物，而是因為他從來沒有逃過自己。"]}], "亞瑟王": [{"name": "亞瑟", "role": "故事主角本人", "who": "我是亞瑟。小時候，我在艾克特爵士家長大，一直以為自己只是他的養子，將來頂多當哥哥凱伊的侍從。我從來沒想過，自己的名字前面，會加上一個「王」字。", "relation": "這是我的故事。那把插在石頭裡的劍，全英格蘭的騎士都拔不出來，最後拔出它的人，是一個替哥哥跑腿找劍的少年，也就是我。", "why": "大家記得那一刻很光榮。我想親口告訴你，拔出劍之後，我才真正開始害怕。", "simple": ["一開始我根本沒有目標。老國王死後，英格蘭群龍無首，諸侯們爭來爭去。我的目標，是後來才被那把劍交到我手上的：成為一個真正的王。", "我的阻礙很多：我年紀太小，出身不明，沒有軍隊，也沒有人相信我。那些有兵有地的諸侯，看我就像看一個笑話。", "那天是比武大會，哥哥凱伊忘了帶劍，叫我回去拿。旅店鎖了門，我看見教堂前的石頭上插著一把劍，就順手拔了下來。", "我把劍交給哥哥，大人們都愣住了。他們讓我把劍插回去，再讓所有騎士拔，沒有人拔得動。我又拔了一次，劍又出來了。我就這樣成了國王。", "最讓我意外的，是命運選中了一個最不起眼的人。後來梅林才告訴我，我其實是烏瑟王的兒子。可在那之前，我只是一個幫人跑腿的男孩。", "諸侯們不服，起兵反我。我可以逃，可以放棄，但我選擇留下來。我拔出的不只是一把劍，是一整個國家的責任。", "後來我建立了圓桌，讓騎士們坐在一起，沒有上座下座。我這一生犯過錯，也被背叛過。但我一直記得那把劍教我的事：拔出來很容易，配得上它很難。"]}, {"name": "洛特王", "role": "起兵反對亞瑟的諸侯之一", "who": "我是洛特，奧克尼和洛錫安的國王。烏瑟王死後，我是有資格爭奪王位的人之一。我有軍隊、有領地、有兒子，其中一個叫高文。", "relation": "我和亞瑟的關係，是對手。當那個來歷不明的少年拔出石中劍，被擁立為王時，我是第一批帶兵反對他的人。", "why": "為什麼由我來說？因為我曾經最不相信他。一個不信他的人，最後也不得不承認他是王，這份承認才算數。", "simple": ["亞瑟要當國王。我也要。在我看來，王位該交給有實力、有血統、有功勳的人，而不是交給一把石頭裡的劍。", "我不承認他。一個鐵匠家長大的小子，憑什麼統治我們？我聯合了其他幾位國王，準備用戰爭說話。", "他沒有退縮。他有梅林輔佐，也開始有騎士追隨他。他打仗的方式很年輕，卻很拚。", "我們在戰場上交過手。我輸了，他贏了。那時我還不甘心，以為他只是運氣好，加上魔法師在背後幫忙。", "讓我意外的是，他贏了之後沒有殺光反對他的人。他給了我們一條路：只要效忠，就能保有領地和尊嚴。", "我的兒子們後來一個一個去了卡美洛。高文成為圓桌騎士中最英勇的一位。我看著他們，開始懷疑自己當初反對的到底是什麼。", "我到最後都沒能真心向他低頭。但我知道，他建立的東西比我能想像的更大。一把劍選了他，而他用一生證明，那把劍沒有選錯人。"]}, {"name": "梅林", "role": "亞瑟王的巫師與導師", "who": "我是梅林，一個能看見未來的巫師。烏瑟王在世的時候，我就知道他會有一個兒子，而那個孩子，要在最適當的時機出現。", "relation": "亞瑟一出生，我就把他抱走，交給艾克特爵士撫養。那把插在石頭上的劍，也是我設下的。我和他的關係，是一個看著命運展開的人。", "why": "大家以為我無所不知。其實我只是知道結局，卻改變不了過程。我想說說，我為什麼選擇讓一個男孩在不知道自己是誰的情況下長大。", "simple": ["我替亞瑟設的目標，是讓一個四分五裂的國家重新團結。這件事不能靠血統，也不能靠武力，得靠一個真正值得被追隨的人。", "阻礙是人心。諸侯們各有野心，誰都不服誰。就算我宣布亞瑟是烏瑟的兒子，他們也不會相信，只會覺得是陰謀。", "所以我讓他在平凡人家長大。我要他學會當一個侍從，學會替別人跑腿，學會低頭。一個從沒低過頭的人，是當不好王的。", "我在石頭上立了劍，刻上字：「拔出此劍者，即為英格蘭之王。」然後我等。等到那個替哥哥找劍的少年，自己走過來。", "最讓人意外的，就是那一刻的平凡。沒有號角，沒有神蹟，只是一個男孩順手拔起了一把劍。真正的命運，往往就是這樣來的。", "他拔出劍後，我才告訴他身世。我看著他的臉，從驚訝到害怕，再到下定決心。我知道，他選擇扛起來了。", "我預見了卡美洛的輝煌，也預見了它的崩落。但我從不後悔。因為他讓人們相信過，這世界可以有一張沒有高低的圓桌。"]}], "羅賓漢": [{"name": "羅賓漢", "role": "故事主角本人", "who": "我是羅賓漢，舍伍德森林的綠衣弓箭手。我原本也有自己的土地和名字，後來因為和官府作對，被宣布為法外之徒。從那天起，森林就是我的家。", "relation": "這是我的故事。一箭射穿別人的箭桿的是我，扮成乞丐混進射箭比賽的是我，把稅官的錢袋分給窮人的，也是我。", "why": "大家都說我是俠盜。我想親口告訴你，一個人為什麼會決定，站到法律外面去。", "simple": ["我想替那些被欺負的人搶回公平。農民種的糧被收走，獵一隻鹿就要被砍手，稅一年比一年重。我受不了。", "我對抗的不只是一個郡長，而是整套偏袒有錢人和權貴的制度。法律在他們那邊，軍隊也在他們那邊。", "我在森林裡聚集了一群兄弟：小約翰、塔克修士、磨坊主的兒子馬奇。我們埋伏在路上，攔下那些富商、貪官和肥胖的主教。", "我們搶來的錢，大部分都分給了附近村子裡的窮人。有一年冬天，好幾個村子能撐過去，靠的就是我們送去的糧食。", "讓我意外的是，我明明是通緝犯，百姓卻把我當英雄。他們替我們藏身、送信，還編歌唱我們的故事。", "我也可以低頭，向郡長求饒，換回我的土地。但我選擇留在森林裡，去做那些法律不肯做的事。", "後來國王理查回來了，他赦免了我們。可我知道，我留下的不是一場勝利，而是一個名字。每當有人被欺負，人們就會想起羅賓漢。"]}, {"name": "諾丁漢郡長", "role": "追捕羅賓漢的地方官", "who": "我是諾丁漢郡長，替國王管理這個郡，收稅、維持治安、追捕罪犯。在官方文件裡，我是秩序的代表。在民間的歌謠裡，我是個貪婪的笨蛋。", "relation": "我和羅賓漢的關係，是官與賊。他躲在舍伍德森林，我帶著士兵追了他好多年。", "why": "為什麼由我來說？因為你們只聽過他的版本。而我想讓你看看，一個讓全郡人民都站在賊那一邊的官，到底錯在哪裡。", "simple": ["羅賓漢想要公平，我想要的是秩序。稅要收，法要守，否則這個國家怎麼運轉？至少，我一開始是這樣告訴自己的。", "我的問題是，我收的稅越多，我自己的口袋也越滿。約翰親王要錢，我就從農民身上刮。刮得越多，他越賞識我。", "我辦了射箭比賽，獎品是一支金箭，想把他引出來。他真的來了，還贏了，我卻沒認出他。那天全城都在笑我。", "我派兵進森林，他們熟悉每一棵樹，我的士兵連路都找不到。他搶了我的稅官，還把錢分給了我正在收稅的那些村子。", "最讓我氣的是，那些百姓寧可冒著被絞死的風險，也要替他藏身。我是官，他是賊，可人民只信他。", "後來我才慢慢懂了：不是他太狡猾，而是我讓法律變成了搶奪的工具。人們不是在支持犯罪，而是在找一個比官府更像公平的地方。", "國王回來後，赦免了他，追究了我。我這一生守著的秩序，原來只是權勢的秩序。而那個賊守著的，才是人心裡的正義。"]}, {"name": "小約翰", "role": "羅賓漢的副手", "who": "我是小約翰。我一點都不小，身高將近七尺，是森林裡最高大的人。大家叫我「小」約翰，是羅賓開的玩笑。", "relation": "我和羅賓的相識，是在一根橫跨小溪的獨木橋上。我們誰也不讓誰，就拿棍子打了起來。最後他掉進了水裡，他爬上來大笑，邀我入伙。從那天起，我就是他最信任的兄弟。", "why": "為什麼由我來說？因為大家只看到他射箭的英姿。我陪他在森林裡住了那麼多年，看過他的決定，也看過他的掙扎。", "simple": ["羅賓想要的，說起來很簡單：讓窮人有飯吃，讓欺負人的人付出代價。他常說：「法律不管的，我們來管。」", "可是我們只有幾十個人，對方有軍隊、城堡、法庭。每次出手，我們都在賭命。", "我們定了規矩：不傷婦女，不搶農民，不欺負窮人。我們攔的是那些坐著轎子、帶著大筆錢的人。每一筆錢，羅賓都會問清楚是從哪裡來的。", "有一年，我們劫了主教的車隊，那些錢讓三個村子的人撐過了饑荒。那天晚上，村民在森林外面唱歌，羅賓站在樹上聽了很久。", "最讓我意外的，是羅賓並不想當英雄。有一次他問我：「約翰，我們這樣算不算也是強盜？」我不知道怎麼回答。", "他最後說：「如果制度是對的，我就去坐牢。但制度錯了，總得有人先站出來。」那一刻我知道，我會跟他走到底。", "後來他老了、病了，臨終前朝窗外射出最後一支箭，說要葬在箭落下的地方。我照做了。他走了，可每當森林裡有人唱起他的歌，我就知道，他還在。"]}], "廖添丁": [{"name": "廖添丁", "role": "故事主角本人", "who": "我是廖添丁，台中清水人，後來流落到台北討生活。日本人的報紙叫我「大盜」，大稻埕的阿伯阿嬸，卻叫我「義賊」。", "relation": "這是我的故事。在殖民的警察眼皮底下飛簷走壁的是我，把有錢人的錢分給窮苦人家的也是我。有些是真的，有些是後來大家說的，我自己也分不清了。", "why": "大家都說我是英雄，也有人說我只是個賊。我想親口告訴你，在那個年代，一個窮人家的囝仔，為什麼會走上這條路。", "simple": ["我想替那些被欺負的人出一口氣。日本人來了之後，台灣人在自己的土地上矮了一截，有錢有勢的人又跟著一起欺壓窮人。", "可是我能怎麼辦？殖民政府有警察、有法律、有監獄，底層的人連說話都沒人聽。要講公道，根本沒有門。", "我只有一身本事：跑得快、翻得高、腦筋動得快。我專挑那些為富不仁、仗勢欺人的人下手，被抓過，也逃過。", "我成了全台北最有名的通緝犯。警察到處貼我的畫像，百姓卻偷偷替我通風報信、藏我吃飯。", "最奇怪的是，在官方的文件裡我是罪犯，在老百姓的嘴裡我是英雄。同一個人，兩本帳。", "我沒有等誰來改變制度。我知道我的方法不對，可在那個年代，我至少讓窮人知道，有人站在他們那邊。", "我二十六歲就死了，死在八里的山洞裡。可我的故事沒有死。一百年後，還有人在說廖添丁。原來人會死，但替人出氣的那口氣，不會。"]}, {"name": "日本巡查", "role": "追捕廖添丁的殖民地警察", "who": "我是一名日本巡查，被派到台北維持治安。我的工作是抓人、辦案、讓這塊新領地照著帝國的規矩運轉。", "relation": "我和廖添丁的關係，是追捕者與被追捕者。他在我們的轄區裡來去自如，讓整個警察署顏面盡失。", "why": "為什麼由我來說？因為在我的報告書上，他只是一個竊盜犯。可我追了他那麼久，漸漸發現事情沒那麼簡單。", "simple": ["在我看來，他想要的就是錢。竊盜、搶劫、殺人，這些罪狀寫在紙上清清楚楚。至於百姓說的「替人出氣」，我一開始根本不信。", "他的阻礙就是我們：警察、保甲、懸賞、搜查。我們掌握著整座城市，理論上，他逃不掉。", "可他總能逃掉。他熟悉每一條巷子、每一片屋頂，最麻煩的是，每一戶人家都可能替他開後門。", "我們一次次撲空。報紙上寫他的新聞越來越多，本島人茶餘飯後都在說他。他越難抓，名氣就越大。", "讓我不解的是，我去問話的每個台灣人都說不知道。他們不是怕他，是護著他。我開始懷疑，我們在抓的到底是一個賊，還是一口怨氣。", "最後我們懸賞，讓他身邊的人出賣了他。他死在八里的山洞裡。長官很滿意，案子結了。", "可是案子結了，故事沒結。後來我聽說，他的故事在戲台上、在說書人嘴裡越傳越大。我們抓得到一個人，卻抓不住一群人心裡想被替天行道的願望。"]}, {"name": "大稻埕講古仙", "role": "在茶館說廖添丁故事的講古人", "who": "我是大稻埕茶館裡的講古仙，一把扇子、一塊醒木，就能講一整個下午。我講過三國、講過水滸，但台下阿伯最愛聽的，還是廖添丁。", "relation": "我沒見過廖添丁本人。我和他的關係，是講古人和故事主角的關係。他死後，他的故事是靠我們這些人，一張嘴一張嘴傳下來的。", "why": "為什麼由我來說？因為歷史上的廖添丁，和傳說裡的廖添丁，差了很多。我想說說，一個真實的人，是怎麼被大家講成英雄的。", "simple": ["每次開講，我都先說：廖添丁要替窮人出頭。這是觀眾最想聽的開頭，也是那個年代大家心裡最想要的東西。", "然後我講日本警察有多兇、有錢人有多壞。阻礙講得越重，後面他出手的時候，大家拍手才拍得越大聲。", "我講他飛簷走壁、變裝戲弄警察、把搶來的錢丟進窮人家的窗戶。有些是真的，有些是我們講古人加上去的。", "講到他被全台北通緝，茶館裡總會有人罵警察、有人替他擔心。那時候我就知道，這個故事已經不只是故事了。", "最有意思的是，官方文件說他是罪犯，我們卻把他講成英雄。這兩個說法，其實都對：一個是法律的帳，一個是人心的帳。", "我們講古人選擇了人心那一邊。因為在那個說不出話的年代，大家需要一個敢替我們出手的名字。", "後來他的故事上了歌仔戲、布袋戲、電影、電視。我只是其中一張嘴。但我知道，每一次有人講廖添丁，都是在說：我們也想被公平對待。"]}], "宙斯": [{"name": "宙斯", "role": "故事主角本人", "who": "我是宙斯，克羅諾斯和瑞亞最小的兒子。我的父親怕被孩子推翻，把我的兄姊一個個吞進肚子裡。我能活下來，是因為母親用一塊包著襁褓的石頭，代替我被吞了下去。", "relation": "這是我的故事。我在克里特島的山洞裡長大，後來回到父親面前，救出兄姊，和他打了十年的仗。", "why": "大家都知道我是眾神之王，也知道我後來有很多荒唐事。但我想親口告訴你，我是怎麼從一個躲起來的嬰兒，變成規則的制定者。", "simple": ["我的目標是推翻我的父親。他用恐懼統治世界，連自己的孩子都不放過。只要他還在王座上，任何人都不安全。", "可是我的對手是泰坦神族的王，他掌握著天地，身邊還有一群強大的泰坦神。而我只是一個被藏起來長大的孩子。", "我先讓父親喝下催吐的藥，他吐出了我的兄姊：赫斯提亞、狄蜜特、赫拉、黑帝斯、波塞頓。然後我們一起向泰坦宣戰。", "這場戰爭打了十年。我還去地底釋放了獨眼巨人和百臂巨人，他們替我打造了雷電。最後，我們贏了。", "最讓我意外的是，勝利之後才是真正的難題。打倒一個暴君很容易，可接下來，這個世界該怎麼運轉？", "我和兄弟們抽籤分配世界：我管天空，波塞頓管海洋，黑帝斯管冥界。我從一個反抗者，變成了必須制定規則的人。", "我成了眾神之王，住在奧林帕斯山上。後來我也犯了很多錯，也曾像父親一樣害怕被推翻。原來當上王不難，難的是不變成你當初反抗的那個人。"]}, {"name": "克羅諾斯", "role": "泰坦神族之王，宙斯的父親", "who": "我是克羅諾斯，泰坦神族之王，時間的主宰。我也曾推翻自己的父親烏拉諾斯，用一把鐮刀奪下了天空的王座。", "relation": "我和宙斯的關係，是父子，也是宿敵。預言說，我會被自己的孩子推翻，就像我推翻我的父親一樣。", "why": "為什麼由我來說？因為我是那個被推翻的人。你們都說我是暴君，但只有我知道，一個害怕命運的人，會做出多可怕的事。", "simple": ["宙斯要推翻我。我早就知道了，預言說得清清楚楚。我這一生最大的目標，就是阻止那個預言發生。", "我是他最大的阻礙。我吞下了我的每一個孩子，一個都不留。我以為只要他們在我肚子裡，就沒有人能威脅我。", "可是瑞亞騙了我。她給我一塊包著布的石頭，我竟然就這樣吞了下去。我最小的兒子，就在克里特島上悄悄長大。", "他回來了，讓我吐出了他的兄姊。他們聯合起來，和我打了十年。最後，我被打進了塔耳塔洛斯的深淵裡。", "最讓我痛苦的意外是：我拚命想逃過的命運，正是因為我拚命地逃，才一步步實現了。如果我沒有吞下孩子，他們也許不會恨我。", "他贏了之後，沒有吞下自己的孩子，而是把世界分給了兄弟。那一刻我知道，他和我不一樣。至少，一開始不一樣。", "我被關在黑暗的深淵裡，看著他坐上我的王座。我用恐懼統治世界，最後被恐懼吞噬。時間之王，終究沒能讓時間為他停下。"]}, {"name": "赫西俄德", "role": "古希臘詩人，《神譜》的作者", "who": "我是赫西俄德，住在希臘玻俄提亞的一個小村莊，原本是個放羊的人。據說有一天，在赫利孔山上，繆思女神把一根月桂枝交給我，讓我歌唱眾神的起源。", "relation": "我寫了《神譜》，把混沌、大地、天空、泰坦、奧林帕斯眾神一代代的故事，排成了一條清楚的家譜。宙斯怎麼成為王，是我這首詩的核心。", "why": "我想說說，為什麼在我的詩裡，世界的歷史就是一代又一代的兒子推翻父親，而宙斯，是那個讓循環停下來的人。", "simple": ["我讓宙斯的目標很清楚：終結舊秩序。在他之前，天空之神烏拉諾斯壓迫孩子，克羅諾斯吞食孩子，世界一直在暴力裡循環。", "我讓他的阻礙來自血緣本身。他要反抗的不是外人，是父親。這是最古老、也最沉重的一種衝突。", "我寫他怎麼集結力量：救出兄姊、釋放被囚禁的巨人、得到雷電。他不是一個人打贏的，是一群被壓迫的力量聯合起來。", "泰坦之戰是我詩裡最壯闊的一段：大地在呻吟，海洋在沸騰，天空在燃燒。最後，奧林帕斯眾神勝出了。", "我在詩裡安排了一個意外：宙斯後來吞下了懷孕的妻子墨提斯，雅典娜從他頭上誕生。預言說的那個會推翻他的兒子，就這樣永遠不會出生了。", "他把世界分配給眾神，每一位都有自己的領域和職責。暴力的循環，被他換成了分工的秩序。", "我寫這首詩時，世界還很亂。我想告訴我的同胞：宇宙也曾是一片混亂，是秩序讓它安定下來。宙斯不是完美的神，但他代表了秩序戰勝混沌的那一刻。"]}], "哪叱": [{"name": "哪叱", "role": "故事主角本人", "who": "我是哪叱，陳塘關總兵李靖的第三個兒子。我娘懷我懷了三年六個月，生下來的時候是一團肉球，爹以為是妖怪，拿劍一劈，裡面跳出了我。", "relation": "這是我的故事。在東海邊鬧事的是我，打死龍王三太子的是我，最後拿起劍削骨還父、削肉還母的，也是我。", "why": "大家都說我是叛逆的小孩。我不否認。但我想親口告訴你，一個最反骨的孩子，是怎麼學會替自己闖的禍負責的。", "simple": ["一開始我根本沒什麼目標，只想玩。後來闖了大禍，我唯一想做的事，就是讓爹娘和陳塘關的百姓，不要因為我受苦。", "我打死了東海龍王的三太子敖丙，還抽了他的龍筋。龍王要告上天庭，要水淹陳塘關，要我爹抵命。我闖的禍，壓在全家人頭上。", "我先是衝動地去攔龍王、打龍王，想用拳頭解決問題。可越打，事情越大。四海龍王都來了，把我們家團團圍住。", "我終於明白，這件事不是打贏就能了結的。龍王要的是一個交代，而這個交代，只能由我來給。", "最讓我自己意外的是，那個天不怕地不怕的哪叱，竟然是第一個願意承擔的人。", "我當著四海龍王的面，拿起劍，削骨還父、削肉還母。我說：一人做事一人當，從今以後，我和李家兩不相欠。", "我的魂魄飄到乾元山，師父太乙真人用蓮花和蓮藕替我重塑了身體。我重生了，不再是誰的兒子，而是我自己。"]}, {"name": "東海龍王敖廣", "role": "四海龍王之首", "who": "我是東海龍王敖廣，掌管東海的興雲布雨。我是天庭冊封的正神，在四海之中，我的地位最高。", "relation": "我和哪叱的關係，是一筆血債。他在東海邊洗他的混天綾，把我的水晶宮攪得天搖地動。我派人去看，他打死了巡海夜叉；我派兒子去，他打死了我的兒子。", "why": "為什麼由我來說？因為你們都愛這個故事的主角，卻忘了故事裡有一個失去兒子的父親。", "simple": ["哪叱想保護他的家。我也想，只是我的家已經被他毀了一角。我唯一的目標，就是替我的三兒子討回公道。", "我是正神，他是凡人家的孩子。按天條，殺神之子要償命。我去找李靖理論，要他交出兒子。我以為這件事很簡單。", "那孩子不但不認錯，還半路攔住我，把我打了一頓，剝了我的鱗片。我堂堂龍王，被一個七歲孩子欺負成這樣。", "我找來了三位兄弟，四海龍王一起圍住陳塘關，說要水淹全城。我要的是一個交代，而我也有能力逼出這個交代。", "讓我萬萬沒想到的是，那孩子站到了我們面前，沒有求饒，也沒有再打。他說：這件事是我一個人做的，與父母無關。", "然後他拿起劍，把自己的骨肉還給了父母。四海龍王都愣住了。我要他償命，可我沒想到，他真的會這樣償。", "我們退兵了，陳塘關保住了。後來聽說他用蓮花重生，成了天庭的大將。我失去了一個兒子，也看見了一個孩子，是怎麼在一夕之間長大的。"]}, {"name": "太乙真人", "role": "哪叱的師父，乾元山金光洞仙人", "who": "我是太乙真人，住在乾元山金光洞。哪叱出生前，我就知道他是靈珠子轉世，是天命要助周伐紂的人。他的乾坤圈、混天綾，都是我給的。", "relation": "我是他的師父。他闖禍的時候，我沒有第一時間出面；他死的時候，我替他收了魂；他重生的時候，是我用蓮花替他做了新的身體。", "why": "為什麼由我來說？因為只有我看見了這個孩子的前世、今生和來世。我想說說，我為什麼讓他先闖禍，再讓他自己收拾。", "simple": ["我給他的目標，從來不只是當個乖孩子。他身上背負著天命，將來要上戰場。他得先學會一件事：力量是要拿來承擔的。", "他的阻礙，一半是龍王的權勢，一半是他自己的脾氣。天生神力，卻不懂輕重。這樣的孩子，遲早會闖出大禍。", "他闖了禍跑來找我，我教他去天門攔住龍王。我知道這只會讓事情更大，但有些事，得讓他自己走到底，才會明白。", "事情鬧到四海龍王圍城，他終於回家了。我在洞裡看著，知道他要面對這一生最重要的選擇。", "我最欣慰的，不是他的法力，而是他在那一刻沒有逃，也沒有躲在父母後面。這個最叛逆的孩子，先學會了承擔。", "他削骨還肉，魂魄飄來找我。我取了蓮花做他的身體，蓮藕做他的骨節，荷葉做他的衣裳。蓮花出淤泥而不染，正合適他。", "他重生後，成了封神之戰的先鋒。很多人記得他腳踩風火輪的樣子，我記得的，是他站在城門前，說「一人做事一人當」的那一刻。"]}], "媽祖": [{"name": "林默娘", "role": "媽祖本人", "who": "我姓林，名默，福建湄洲島人。聽說我出生到滿月，都沒有哭過一聲，所以爹娘叫我「默娘」。我從小在海邊長大，聽慣了浪聲，也看慣了出海的人沒有回來。", "relation": "這是我的故事。人們後來叫我媽祖、天上聖母，替我蓋廟、抬我遶境。但一開始，我只是一個漁村的女孩。", "why": "大家都拜我、求我。我想親口告訴你，一個海邊的女孩，是怎麼變成千萬人心裡那個「就在附近」的人。", "simple": ["我想守住出海人的平安。湄洲島的男人都靠海吃飯，每次船出海，女人們就站在岸邊，不知道那是不是最後一面。", "可是大海無常。風浪說來就來，人在海上，就像一片葉子。再好的船、再有經驗的船老大，都可能回不來。", "傳說我曾在夢裡出竅，去救在海上遇難的父親和哥哥。也有人說，我會站在岸邊點起火光，替迷路的船指引方向。", "越來越多船回來了，越來越多人說，在最危險的時候，看見海面上有一個穿紅衣的女子。", "最讓我意外的是，我二十八歲那年就離開了人間，可人們沒有忘記我，反而越來越需要我。原來守護不一定要征服風浪，只要讓人不再那麼害怕。", "我從一個人的傳奇，變成了大家的信任。漁民出海前來拜我，渡海來台灣的人把我的神像帶上船，一路護著他們。", "一千年過去了，台灣到處都有媽祖廟。人們在最無助的時候喊一聲「媽祖婆」，心就定了。這就是我一直在做的事：讓人在風浪裡，知道自己不是一個人。"]}, {"name": "千里眼", "role": "曾與媽祖為敵，後成為她的護法", "who": "我是千里眼，和我的兄弟順風耳，原本是在桃花山作亂的精怪。我能看見千里之外，他能聽見萬里之遠，我們在海上興風作浪，沒人管得住。", "relation": "我和媽祖的關係，一開始是敵人。後來，我們站在她的兩側，一個看、一個聽，守護她守護的那片海。", "why": "為什麼由我來說？因為我曾經是那個讓出海人害怕的力量。一個被她降伏的對手，最能說清楚她到底有多強。", "simple": ["她想守住出海人的平安。而我們，正是讓那片海不平安的原因之一。我們就是她的阻礙。", "我能看得很遠，順風耳能聽得很遠。我們仗著這本事到處搗亂，也覺得沒有人能奈何得了我們。", "她來找我們，我們不服，跟她鬥法。我們以為一個漁村女子，能有多大能耐？", "我們輸了。她沒有用蠻力，也沒有傷害我們。她只是站在那裡，讓我們明白，我們那點本事，在她面前算不了什麼。", "最讓我意外的，是她沒有把我們趕走或消滅，而是收我們做護法。她說：你們能看得遠、聽得遠，就用來看海上的危險、聽遇難的呼救吧。", "從那天起，我的眼睛不再用來找麻煩，而是用來找需要幫助的船。原來同樣的能力，換一個方向用，就從破壞變成了守護。", "現在每一座媽祖廟裡，我和順風耳都站在她的身邊。人們看見我們就知道：媽祖看得到你、聽得到你。我曾經是風浪，現在是守護風浪裡的人。"]}, {"name": "討海人", "role": "一位被媽祖庇佑的漁民", "who": "我是一個討海人，從阿公那一代就在海上討生活。我沒讀什麼書，但我知道，每次出海前要去廟裡拜媽祖，船頭要掛她的香火。", "relation": "我和媽祖的關係，是信徒和神明。有一次颱風，我的船在海上翻了一半，我抱著船板漂了一整夜。我相信，是她把我帶回來的。", "why": "為什麼由我來說？因為我是那個真正在風浪裡喊過她的人。你們在廟裡看到的是神像，我在海上感覺到的，是一個人。", "simple": ["媽祖要守護出海的人。對我們來說，這不是傳說，是每天的生活。出海的人都知道，海不會跟你講道理。", "那年颱風來得太快，氣象報得太晚。浪比房子還高，船身一直斜，我們拚命舀水，還是撐不住。", "我抱著一塊船板，在海裡漂。天很黑，浪一直打過來。我沒什麼力氣了，就一直喊：媽祖婆，救救我。", "天亮的時候，我被沖到一片沙灘上，遠遠看見有人在找我。後來才知道，同船的兄弟也都被救了起來。", "我說不清楚那一晚到底發生了什麼。可是我記得，最絕望的時候，心裡突然安定了下來，好像有人在旁邊跟我說：不要怕。", "從那之後，我每年都跟著遶境，一路走、一路拜。我不是為了求什麼，是為了還願，也是為了說謝謝。", "很多人問我，真的是媽祖救了你嗎？我說，我不知道。但我知道，在最無助的風浪裡，我覺得她就在附近。這就夠了。"]}], "玄天上帝": [{"name": "玄天上帝", "role": "故事主角本人", "who": "人們叫我玄天上帝、上帝公、帝爺公，也叫我北極真武大帝。在道教的說法裡，我是淨樂國的太子，捨棄王位，到武當山修行了四十二年。在台灣民間，還有另一個說法：我原本是個殺豬的屠夫。", "relation": "這是我的故事。兩個說法都在流傳，但說的是同一件事：我怎麼把一身的力量，從傷害變成守護。", "why": "大家看我的神像，赤腳踩著龜和蛇，手持寶劍，威風凜凜。我想親口告訴你，腳下那兩樣東西，是從哪裡來的。", "simple": ["我想鎮住混亂與邪祟。可在那之前，我得先鎮住自己。民間說，我殺了半輩子的豬，有一天突然悔悟，覺得自己雙手沾滿了血。", "我的敵人，不是一個特定的妖怪，而是持續擾動人間的力量。而最早的那股力量，其實來自我自己。", "傳說我在河邊剖開肚子，把胃和腸洗乾淨，要把過去的罪都洗掉。洗完之後，我專心修行，把自己鍛成一個守護者。", "可是我的胃變成了烏龜，腸子變成了蛇，在人間興風作浪。我修成正果後，回頭降伏了它們，收為部將，從此踩在腳下。", "最意外的是，我最強的震懾，不是來自殺伐，而是來自自制。我降伏的龜蛇，說到底，就是我自己過去的貪、嗔、殺念。", "我把力量從攻擊轉成守護。從此我坐鎮北方，替人間擋住那些看不見的邪氣。", "現在很多廟裡都供奉著我，也有不少屠宰業、打鐵業的人把我當守護神。他們拜的不只是一個威武的神，而是一個相信：人可以回頭，力量可以轉向。"]}, {"name": "龜蛇二將", "role": "被玄天上帝降伏的龜精與蛇精", "who": "我們是龜和蛇。民間說，我們是從玄天上帝的胃和腸變來的；道教的經典說，我們是作亂人間的妖物。不管哪個說法，我們都曾讓人害怕。", "relation": "我們和玄天上帝的關係，一開始是敵人，後來是部將。現在你去廟裡，會看到我們被他踩在腳下，但也被一起供奉著。", "why": "為什麼由我們來說？因為被降伏的那一方，才知道降伏我們的是什麼樣的力量。", "simple": ["他要鎮住混亂。而我們，就是那混亂的一部分。我們在河裡、在山林間作怪，吞食牲畜，驚擾百姓。", "我們不是單一的妖怪。龜守、蛇纏，一個硬、一個滑，一個慢慢耗、一個伺機咬。人間很多亂子，都有我們的影子。", "我們聽說有個修行人在山上苦修了很多年，法力越來越強。我們不怕，因為我們知道他的來歷，我們本來就是他的一部分。", "他下山了。他沒有用火燒我們，也沒有用劍斬我們。他只是一腳踩住龜背，一手按住蛇頭，我們就動不了了。", "讓我們最意外的，是他沒有消滅我們。他說：你們是我的過去，我不殺你們，但我要你們跟著我，從此守護人間。", "從那天起，我們變成了龜將、蛇將。原本拿來作亂的那股力量，現在拿來守門、驅邪。", "現在，信徒拜他的時候，也會對我們點頭。我們從被害怕的東西，變成了守護的一部分。原來被降伏，不一定是結束，也可能是重新開始。"]}, {"name": "廟公", "role": "上帝公廟的老廟公", "who": "我在這間上帝公廟當廟公，四十幾年了。每天早上五點開廟門、上香、擦神桌，年節時張羅祭典。附近的人叫我「阿伯」，有什麼煩惱都會來廟裡找帝爺公，順便找我聊天。", "relation": "我沒見過玄天上帝本人，但我每天看著他的神像，也看著來拜他的人。我和他的關係，是守廟的人和廟裡的神。", "why": "為什麼由我來說？因為我聽過很多信徒的故事。他們讓我知道，帝爺公在人心裡，到底代表什麼。", "simple": ["信徒來拜帝爺公，最常求的就是「鎮」：鎮宅、鎮煞、鎮心神。家裡不平安、心裡不安定，都會來求他。", "大家怕的東西，有時候是看得見的，有時候是看不見的。生病、官司、家運不順，這些都像是一股亂流，把日子攪得不安寧。", "我常跟年輕人講帝爺公的故事：他以前殺生，後來悔悟，剖腹洗腸，苦修成神。每次講，大家都聽得很入神。", "講到他把龜蛇踩在腳下，小孩子都會說：「好厲害！」我就會問他們：你知道龜蛇是從哪裡來的嗎？", "有一次，一個剛出獄的年輕人來廟裡，跪了很久。他說他以前做了很多壞事。我跟他說，帝爺公也是從回頭開始的。他哭了。", "我想，這就是帝爺公的轉彎：他沒有用力量去打別人，而是用力量先把自己管住，然後才去守護別人。", "那個年輕人後來常來廟裡幫忙，逢年過節就來扛轎。我看著他，就知道帝爺公的故事還在發生。神明鎮住的，從來不只是妖邪，還有一顆想回頭的心。"]}], "釋迦牟尼": [{"name": "悉達多", "role": "釋迦牟尼本人", "who": "我是悉達多．喬達摩，釋迦族的王子。父親為了留住我，讓我在宮殿裡長大，不讓我看見任何老、病、死的樣子。二十九歲那年，我走出了宮門。", "relation": "這是我的故事。後來人們稱我為佛陀，意思是「覺悟的人」。但在覺悟之前，我也迷惘過、走錯過路。", "why": "大家記得我在菩提樹下悟道的那一刻。我想親口告訴你，在那之前，我是怎麼一步步走到那棵樹下的。", "simple": ["我出城時看見了老人、病人、死人，還有一位出家的修行者。我第一次明白：人生有苦，而且誰也逃不掉。我想找出苦的根源，和離開苦的方法。", "真正的阻礙不在外面。宮殿、財富、妻兒，都擋不住老病死。真正綁住人的，是心裡的貪愛與執著，包括我自己的。", "我離開宮殿，去跟隨當時有名的老師修行，後來又苦修了六年，每天只吃一點點東西，瘦到皮包骨，差點死去。", "我發現苦修也不能讓我覺悟。我接受了一位牧羊女送來的乳糜，恢復了體力，然後在菩提樹下坐了下來，發願不悟道就不起身。", "最大的意外是，答案不在外面，也不在折磨身體，而是在看清自己的心。那一夜，我看見了苦的根源，也看見了解脫的路。", "我放下了兩種極端：縱情享樂，和嚴酷苦行。我走的是中道，一條不偏不倚、清楚觀照的路。", "悟道後，我沒有一個人留在樹下。我走了四十五年，把這條路說給每一個願意聽的人。我不是神，我只是一個先走過去的人，回頭告訴你：這條路，你也可以走。"]}, {"name": "魔王波旬", "role": "欲界的魔王，悉達多悟道前的最後對手", "who": "我是波旬，欲界的主宰。所有的慾望、恐懼、執著，都是我的領土。只要人還有想要的東西、還有害怕的東西，他就是我的子民。", "relation": "我和悉達多的關係，是最後一場對決。那一夜他坐在菩提樹下，發願要覺悟。一旦他覺悟了，就會有千千萬萬的人離開我的國度。", "why": "為什麼由我來說？因為那一夜，只有我在場跟他交手。我用盡了所有辦法，而他，一個都沒接。", "simple": ["他要找出苦的根源和解脫之道。這對我來說是最大的威脅。人若不再被慾望綁住，我還能統治誰？", "所以我就是他的阻礙。更準確地說，我是他心裡還沒放下的每一樣東西：想要的，害怕的，放不下的。", "我先派我的女兒們去誘惑他，她們美得能讓任何人動心。他看著她們，眼神裡沒有起伏。", "我派魔軍去恐嚇他，刀箭如雨，雷火交加。可那些兵器一靠近他，就化成了花瓣落下。", "最後我問他：你憑什麼坐在這裡？誰能證明你有資格覺悟？他沒有辯解，只是伸出右手，輕輕碰了一下大地。", "大地震動了，彷彿在替他作證。那一刻我知道，我輸了。他不是打敗我，而是根本不在我的國度裡了。", "天亮時，他覺悟了。從那以後，我還是在，慾望和恐懼也還在。但人們知道了，有一條路可以不再被我統治。這是我最大的失敗。"]}, {"name": "阿難", "role": "佛陀的侍者與堂弟，經典的誦出者", "who": "我是阿難，佛陀的堂弟。我在他身邊當了二十五年的侍者，替他端水、鋪座、接待來訪的人。我記性很好，他說過的每一段話，我幾乎都記得。", "relation": "佛陀入滅後，弟子們聚在一起整理他的教法。每一部經的開頭，都是我說的那四個字：「如是我聞」，意思是：「我是這樣聽說的。」", "why": "為什麼由我來說？因為我是那個把他的話傳下來的人。他的故事，很多都是從我的口中，一句句被記住的。", "simple": ["佛陀常說，他當年離開宮殿，是因為看見了老、病、死。他的目標只有一個：找到離苦的方法，不只為了自己，也為了所有人。", "他說，苦不是外面給的，是從心裡的貪、嗔、癡長出來的。這是最難的阻礙，因為它就藏在每個人自己身上。", "他跟我們講過很多次他苦修的那六年：怎麼餓到只剩骨頭，怎麼差點倒在河邊。他說，那段路他走錯了，但也正是走錯，才知道哪條是對的。", "他在菩提樹下坐了一夜，天亮時覺悟了。他說，那一刻不是得到了什麼，而是看清了一切本來的樣子。", "最讓我意外的是，佛陀從不把自己說成神。他常說：我只是指路的人，路要你們自己走。", "他教我們中道：不放縱、也不虐待自己。我跟了他二十五年，一直到他入滅的時候，我都還沒有證悟，我很慚愧。", "他走後，我在第一次結集時誦出了他的教法。每一部經，我都從「如是我聞」開始。兩千五百年後，還有人在讀。我只是他的回聲，但我希望，這回聲能讓更多人找到那條路。"]}], "哥倫布": [{"name": "哥倫布", "role": "故事主角本人", "who": "我是克里斯多福．哥倫布，出生在義大利熱那亞，一個織布工人的兒子。我從小就在港口看船，年輕時跑過地中海、到過葡萄牙。我讀了很多地理書，算出了一條向西就能到亞洲的航線。", "relation": "這是我的故事。1492年8月，帶著三艘船從西班牙帕洛斯港出發的人是我；在船員快要叛變時堅持不回頭的，也是我。", "why": "大家說我發現了新大陸。其實我到死都以為自己到的是亞洲。我想親口告訴你，一個算錯了距離的人，為什麼還是改變了世界。", "simple": ["我要找一條向西通往亞洲的新航線。那時候往東的陸路被阻斷，香料和黃金的貿易越來越難。我相信，地球是圓的，一直往西，就能到印度和中國。", "可是沒有人願意出錢。葡萄牙國王的學者說我把地球算得太小，這趟航程船員會先餓死。他們說得其實沒錯，是我算錯了。", "我遊說了好多年，葡萄牙拒絕我，西班牙的學者也反對我。我等了六、七年，最後伊莎貝拉女王和斐迪南國王終於點頭了。", "我帶著聖瑪利亞號、平塔號、尼尼亞號出海。1492年10月12日清晨，瞭望手喊出了「陸地」。我們登上了一座島，我把它命名為聖薩爾瓦多。", "航行途中最可怕的不是風暴，而是人心。一個多月看不到陸地，船員開始害怕、咒罵、想要回頭。我知道，再撐不住，整個計畫就完了。", "我答應他們，再給我幾天。我沒有回頭。後來我們看見了漂浮的樹枝、飛過的鳥，然後，是陸地。", "我四次橫渡大西洋，到死都說那裡是印度。我沒有到達我想去的地方，卻讓歐洲和美洲從此連在一起。這改變了世界，也帶來了很多我當年沒想過的痛苦。"]}, {"name": "平松", "role": "平塔號船長，哥倫布的合作者與競爭者", "who": "我是馬丁．阿隆索．平松，帕洛斯港最有經驗的船長之一。哥倫布是外地人，港口的水手不信他；是我點頭，大家才願意上船。", "relation": "我和哥倫布的關係，是夥伴，也是對手。我指揮平塔號，跑得比他的旗艦還快。沒有我，他組不成那支船隊。", "why": "為什麼由我來說？因為歷史只記得他的名字。我想讓你知道，那趟航程裡還有另一個人，也押上了一切。", "simple": ["哥倫布要找一條去亞洲的航線，我要的是財富和名聲。說實話，我不完全相信他的計算，但我相信大海上一定有東西值得找。", "最大的阻礙是水手們的恐懼。帕洛斯的人都知道大海有多可怕，沒人想跟一個外地人去送死。是我到處說服他們，把我自己的兄弟也帶上了船。", "航行途中，我們好幾次差點回頭。船員鬧事時，是我和哥倫布一起穩住局面。我對他說：我們繼續走。", "最先看見陸地的，是我平塔號上的瞭望手。那一聲「陸地！」是從我的船上喊出來的。", "讓我意外的是，登陸之後，我和他的分歧越來越大。我帶著平塔號自己去探索，想找黃金。他覺得我背叛他，我覺得他什麼功勞都想自己拿。", "回程時我們在風暴中失散，我比他早一步到達西班牙，想先向國王報告。可是國王只願意見哥倫布。", "我回到帕洛斯沒多久就病死了。大家記住了哥倫布，忘了平松。但我知道，那趟航程不是一個人的奇蹟，而是一群敢出海的人，一起賭來的。"]}, {"name": "拉斯卡薩斯", "role": "西班牙修士，哥倫布航海日誌的整理者", "who": "我是巴托洛梅．德拉斯卡薩斯，西班牙道明會修士。我年輕時也去過美洲，當過殖民者、擁有過土地和原住民勞工。後來我看見了太多殘忍，放下了一切，用一生替原住民說話。", "relation": "哥倫布的第一次航海日誌原本已經遺失，今天讀到的版本，主要是透過我的摘錄保存下來的。我很熟悉他的文字，也很熟悉他的航行帶來了什麼。", "why": "為什麼由我來說？因為我既佩服他的勇氣，也見證了那之後的苦難。我想讓你聽見一個完整的故事，而不只是一段冒險。", "simple": ["從他的日誌裡看得出來，他真心相信自己能找到通往亞洲的路。他也相信，這是上帝交給他的使命。", "日誌裡記下了他的阻礙：王室的懷疑、學者的反對、船員的恐懼。他一次又一次被拒絕，卻從沒放棄。", "我抄錄他的日誌時，常被他的堅持打動。他仔細記錄風向、距離、海鳥和漂流物，還記下了他怎麼安撫快要叛變的船員。", "他抵達了那些島嶼，寫下了島上的人：溫和、好客，願意拿東西跟他們交換。他說，這些人會是很好的僕人。我讀到這句時，心裡一沉。", "真正的意外，是這趟航程打開的不只是一條航線，還有一扇門。之後來的，是奪取、奴役、疾病。我親眼看見，島上的原住民人口急遽減少。", "我放下了自己在殖民地的一切，開始寫書、上書國王，為原住民爭取權利。我覺得，這是我能替那段歷史做的轉彎。", "哥倫布改變了世界，這是事實。可我希望後人記得，改變世界的方式，有勇氣，也有代價。我們要學他的勇敢，也要記得那些被遺忘的人。"]}], "愛因斯坦": [{"name": "愛因斯坦", "role": "故事主角本人", "who": "我是阿爾伯特．愛因斯坦，出生在德國烏爾姆。我小時候說話很晚，老師不太喜歡我，大學畢業後也找不到教職。1905年，我在瑞士伯恩的專利局當三級技術員，每天審查別人的發明申請。", "relation": "這是我的故事。那一年，我在專利局的工作之餘寫了幾篇論文，其中一篇，後來被叫做狹義相對論。", "why": "大家都說我是天才。其實我只是比較固執，對一些問題一直追問下去。我想親口告訴你，那些想法是怎麼在一間辦公室裡長出來的。", "simple": ["我想找出宇宙更深層的規律。十六歲時我就在想：如果我追著一道光跑，跑得跟光一樣快，會看見什麼？這個問題，我想了十年。", "可我不在學術圈的中心。沒有教授職位，沒有實驗室，沒有人認識我。當時的物理學已經很成熟，大家都覺得只剩下一些小問題要修補。", "我在專利局工作，審查專利其實很訓練思考：要一眼看出一個裝置的核心原理。下班後，我和幾個朋友在咖啡館討論哲學和物理，一直聊到深夜。", "1905年，我發表了幾篇論文：光電效應、布朗運動、狹義相對論，還有那個後來很有名的式子：E=mc²。後人叫那一年「奇蹟年」。", "最讓人意外的是，改變物理學的革命，不是從名校的實驗室，而是從一個專利局小職員的腦袋裡長出來的。", "我沒有等別人給我舞台。我只是把我相信的想法清楚寫出來，然後寄出去。如果它是對的，自然會有人看懂。", "後來我們知道了，時間和空間不是絕對的，它們會隨著速度改變。我後來也說過很多錯話，也反對過一些新理論。但我始終相信：想像力比知識更重要。"]}, {"name": "萊納德", "role": "諾貝爾物理獎得主，相對論的強烈反對者", "who": "我是菲利普．萊納德，德國物理學家，1905年因為陰極射線的研究拿到了諾貝爾獎。在當時，我是實驗物理的權威，而愛因斯坦只是一個沒沒無名的年輕人。", "relation": "我和愛因斯坦的關係，很諷刺：他那篇關於光電效應的論文，是建立在我的實驗結果上的。可後來，我成了他最激烈的反對者。", "why": "為什麼由我來說？因為我是那個拒絕接受他的人。我的反對，後來證明是錯的，而且錯得很難看。我想讓你看看，一個權威是怎麼在偏見裡迷失的。", "simple": ["他想重寫物理學的基礎。在我看來，這是狂妄。物理學應該靠實驗說話，而不是靠一個年輕人坐在辦公室裡想像。", "我就是他的阻礙之一。我有諾貝爾獎，有學術地位，我說的話在德國很有分量。我公開質疑相對論，說那只是數學遊戲。", "他沒有跟我吵，只是繼續寫論文，繼續接受檢驗。1919年，英國的日食觀測證實了他的預測：光線經過太陽時會彎曲。", "他一夕之間成了全世界最有名的科學家。報紙把他捧成新的牛頓。我氣壞了。", "最讓我不堪的是，我的反對越來越不是在談物理，而是在談他的身分。我開始說相對論是「猶太物理」，說那是對德國科學的污染。", "後來我支持了納粹，寫書推動所謂的「德意志物理」。愛因斯坦被迫離開德國，去了美國。我以為我贏了。", "今天，全世界的物理課本都在教相對論，GPS衛星每天都在用它。而我的名字，常常被當成一個警告：一個科學家，若讓偏見取代了證據，再大的權威也會變得渺小。"]}, {"name": "米列娃．馬利奇", "role": "愛因斯坦的大學同學與第一任妻子", "who": "我是米列娃．馬利奇，塞爾維亞人。在那個女性很難讀大學的年代，我考進了蘇黎世聯邦理工學院的物理系，是班上唯一的女生。愛因斯坦是我的同學。", "relation": "我們一起上課、一起讀書、一起討論物理，後來結了婚，生了兩個兒子。1905年，他在專利局上班，我在家裡帶孩子，晚上我們常在廚房裡討論他的想法。", "why": "後來有很多人問，我在他的研究裡扮演了什麼角色。那是個複雜的問題，我不想替任何人下結論。我只想說說，我親眼看見的那段日子。", "simple": ["他一直想弄懂光。還在學校的時候，他就常常不去上課，躲在宿舍裡讀那些教授沒教的最新理論。他說，他想知道上帝是怎麼創造這個世界的。", "那時候的日子很難。他畢業後找不到教職，靠當家教過活。我們沒有錢，他的家人也反對我們在一起。", "他進了專利局，總算有了穩定的收入。他白天工作，晚上寫東西。我們的公寓很小，他常常一手推著嬰兒車，一手拿著寫滿算式的紙。", "1905年，他寄出了那幾篇論文。一開始沒什麼迴響，後來，慢慢有人寫信來問，有教授來找他討論。", "讓我意外的是，他的名氣來得那麼快。他越來越常出門、演講、參加會議，而我越來越常一個人在家。", "後來我們分開了。離婚協議裡，他答應把未來的諾貝爾獎獎金給我。幾年後，他真的得了獎，也真的把錢給了我。", "我這一生，沒有機會完成自己的物理學夢想。但我見證了一個想法是怎麼在最平凡的日子裡長出來的。我希望後人記得，科學史上的每一個名字背後，都還有很多沒被看見的人。"]}], "哥白尼": [{"name": "哥白尼", "role": "故事主角本人", "who": "我是尼古拉．哥白尼，出生在波蘭托倫。我學過法律、醫學、天文學，後來在弗龍堡大教堂擔任教士。白天我處理教區的事務，晚上，我爬上塔樓看星星。", "relation": "這是我的故事。把太陽放到宇宙中心的人是我，把那本書的手稿藏了三十年的人，也是我。", "why": "大家都說我是科學革命的起點。我想親口告訴你，一個膽小的人，是怎麼說出一個大膽的結論的。", "simple": ["我想找一個更合理的宇宙模型。當時用的是托勒密的地心說，為了解釋行星的運動，得在圓上再套圓，越套越複雜，我覺得上帝創造的宇宙不該這麼醜。", "可是地心說流傳了一千多年，教會、大學、所有人都這樣相信。說地球在動，等於跟整個世界的常識作對。", "我花了幾十年觀測、計算，一遍又一遍地驗證。我發現，只要把太陽放在中間，讓地球和其他行星一起繞著它轉，很多問題就變簡單了。", "我寫下了《天體運行論》。在這本書裡，太陽是中心，地球只是繞著它轉的一顆行星，每天還會自轉一圈。", "最讓我自己意外的是，一個天文模型的改變，竟然足以動搖人們看待自己的方式。如果地球不是中心，那人類還是宇宙的中心嗎？", "我遲遲不敢出版。我怕被嘲笑，也怕引起爭議。直到我的學生雷蒂庫斯來找我，一再勸我，我才終於同意讓它付印。", "據說書印好送到我手上時，我已經在病床上了。我沒能看到它引起的風暴。但後來的伽利略、克卜勒、牛頓，都是從這本書往前走的。"]}, {"name": "托勒密", "role": "古代天文學家，地心說體系的集大成者", "who": "我是克勞狄烏斯．托勒密，住在古埃及的亞歷山卓，大約是西元二世紀的人。我寫了一部天文學巨著，後來阿拉伯人叫它《天文學大成》。", "relation": "我和哥白尼隔了一千三百多年，從沒見過面。但他一生都在跟我的理論對話，也一生都在想辦法推翻它。", "why": "為什麼由我來說？因為我就是他要挑戰的那個權威。我想讓你知道，被推翻的理論，也曾經是它那個時代最聰明的答案。", "simple": ["哥白尼想找一個更好的宇宙模型。我懂這種心情，因為我當年也在做同一件事：用數學，讓天上的運動可以被預測。", "我的地心說就是他的阻礙。它不是迷信，它很精確。用我的方法，可以預測日食、月食、行星的位置，幾百年來都很好用。", "為了讓地球待在中心，我設計了本輪、均輪、偏心點。每一顆行星都在一個小圓上轉，小圓又在大圓上轉。很複雜，但算得出來。", "我的體系統治了天文學一千多年。阿拉伯的學者翻譯它，歐洲的大學教它，教會也接受它。", "讓我意外的是，最後推翻我的，不是一個更精確的觀測，而是一個更簡單的想法：如果把太陽放在中間呢？", "他不是用更多的圓來修補我，而是換了一個觀點。有時候，進步不是在舊答案上加東西，而是敢把舊答案整個翻過來。", "我被推翻了，但我不覺得丟臉。每一個理論都是站在前人肩膀上的。沒有我那些複雜的圓，他也不會那麼強烈地想找一個更美的答案。"]}, {"name": "雷蒂庫斯", "role": "哥白尼唯一的學生，推動《天體運行論》出版的人", "who": "我是格奧爾格．約阿希姆．雷蒂庫斯，德國威登堡大學的年輕數學教授。1539年，我二十五歲，聽說波蘭北方有一位老教士主張地球繞著太陽轉，我就收拾行李，去找他。", "relation": "我在弗龍堡住了兩年，成為他唯一的學生。1540年，我寫了一本《初講》，第一次向學界介紹他的理論。然後，我幫他把手稿帶去紐倫堡印刷。", "why": "為什麼由我來說？因為如果沒有人去敲他的門，那份手稿可能永遠都鎖在抽屜裡。我想告訴你，我看見的那個哥白尼。", "simple": ["他想找一個更合理的宇宙。我第一次讀他的手稿時，興奮得睡不著，那是一個全新的世界。", "可是他很猶豫。他跟我說，他怕被人嘲笑，怕被說成瘋子。他說，畢達哥拉斯的門徒只把祕密傳給朋友，也許他也該這樣。", "他把幾十年的觀測紀錄攤給我看，一頁一頁算給我聽。我這才知道，這不是一時的靈感，是一個人一輩子的功夫。", "我寫了《初講》，先替他試水溫。反應比他擔心的好，很多學者感興趣。他終於願意把完整的書交出去。", "最讓我遺憾的是，印刷過程中，有人在書前加了一篇沒署名的序，說這個理論只是方便計算的假設，不代表真實。那不是他的意思。", "他選擇了出版。我知道，對一個一生謹慎的人來說，這是他最勇敢的一次決定。", "書送到他手上時，他已經中風了。我不知道他有沒有看清楚那本書。但我知道，是他把人類從宇宙中心請了出去，而我很驕傲，自己替他敲開了那扇門。"]}], "耶穌": [{"name": "耶穌", "role": "故事主角本人", "who": "我是拿撒勒人耶穌，木匠約瑟的兒子。我在加利利的小村莊長大，三十歲左右開始在各地講道。跟隨我的，大多是漁夫、稅吏、被人看不起的人。", "relation": "這是我的故事。從加利利的湖邊到耶路撒冷的城門，從最後的晚餐到各各他的山丘，這條路是我自己選擇走上去的。", "why": "很多人知道十字架，卻不知道我為什麼不離開。我想親口告訴你，一個明知道結局的人，為什麼還是往前走。", "simple": ["我要把愛、寬恕和天國的消息，帶給每一個人。不只是給聖殿裡的人，也給那些被趕到門外的人：病人、窮人、罪人、外邦人。", "宗教領袖覺得我褻瀆，羅馬官員覺得我危險。連我身邊的門徒，常常也不明白我在說什麼。他們想要的是一個推翻羅馬的王。", "我走遍各地，醫治病人，和稅吏一起吃飯，在安息日為人治病。我講撒種的比喻、浪子回頭的比喻，想讓每個人都聽得懂。", "越來越多人跟隨我，也有越來越多人想除掉我。我騎著驢進耶路撒冷時，群眾揮著棕櫚枝歡呼，可我知道，接下來會發生什麼。", "我早就告訴過門徒，人子要被交出去、被殺害。那一夜在客西馬尼園，我禱告到汗珠如血滴落。我也害怕，但我沒有離開。", "他們來抓我時，彼得拔刀砍了人，我叫他收刀。我可以逃，可以反抗，但我選擇不用力量保全自己。", "我被釘在十字架上，最後說：「父啊，赦免他們，因為他們所做的，他們不曉得。」我的死沒有讓這個故事結束，而是讓它開始傳向全世界。"]}, {"name": "本丟．彼拉多", "role": "羅馬帝國猶太行省總督", "who": "我是本丟．彼拉多，羅馬帝國派駐猶太行省的總督。我的工作是收稅、維持治安、不讓這個動盪的地方出亂子。凱撒只在乎一件事：穩定。", "relation": "我和耶穌的關係，只有一個早上。祭司長們把他押到我面前，要我判他死刑。我問了他幾個問題，然後做了一個讓我後悔一生的決定。", "why": "為什麼由我來說？因為我是那個有權力放他走的人。我比誰都清楚，他是怎麼死在一個官員的猶豫裡的。", "simple": ["他們說他自稱猶太人的王。在羅馬人聽來，那就是造反。可我看著他，實在不像一個想造反的人。", "我的阻礙是這座城。逾越節期間，耶路撒冷擠滿了朝聖的人，只要一點火星就會爆發暴動。祭司長們又一直施壓，說我若放了他，就不是凱撒的忠臣。", "我審問他：你是猶太人的王嗎？他說：我的國不屬於這世界。我又問：真理是什麼？他沒有回答。", "我找不到他的罪。我想把他交給希律王處理，希律又把他送了回來。我讓人鞭打他，希望群眾看了會滿意。", "讓我意外的是，群眾一點都不滿意。我說按慣例可以在節期釋放一名囚犯，他們竟然選了強盜巴拉巴，然後大喊：「釘他十字架！」", "我叫人拿水來，當著眾人洗手，說：「流這義人的血，罪不在我。」可我知道，下命令的人是我。", "他被釘死了。我以為這件事很快就會被忘記。可兩千年來，每個禮拜天，世界各地都有人在信經裡念出我的名字：「在本丟彼拉多手下受難」。我逃不掉了。"]}, {"name": "彼得", "role": "耶穌的門徒", "who": "我是彼得，原名西門，加利利湖邊的漁夫。有一天，耶穌走過湖邊，對我說：「來跟從我，我要叫你得人如得魚一樣。」我放下漁網，就跟他走了。", "relation": "我是他最親近的門徒之一。他給我取名彼得，意思是「磐石」。可在他最需要我的那一夜，我三次說我不認識他。", "why": "為什麼由我來說？因為我是那個跟得最近、卻跌得最重的人。我想讓你知道，他的十字架，是怎麼把一個懦弱的人變成磐石的。", "simple": ["他要把天國的消息帶給所有人。一開始我不太懂，我以為他要當以色列的王，趕走羅馬人。我還幻想著自己能在他的國裡坐個好位子。", "阻礙越來越大。法利賽人盯著他，祭司長想抓他。他說他要去耶路撒冷受苦、被殺，我把他拉到一邊勸他。他責備我說：你只想到人的事。", "我跟著他走遍各地，看他醫病、趕鬼、餵飽五千人。我曾經在水面上走向他，走了幾步，因為害怕就沉了下去，是他伸手拉住了我。", "最後的晚餐那一夜，他說我們當中有人會出賣他，又說我會三次不認他。我說：就算要跟你一起死，我也不會不認你。", "他們抓走了他。我遠遠跟著，到了大祭司的院子。有人認出我，我說我不認識他。第三次否認時，雞叫了。我想起他的話，跑出去痛哭。", "他被釘死了，我躲了起來。可第三天，墳墓空了。他後來在湖邊找到我，問了我三次：「你愛我嗎？」三次否認，他給了我三次機會。", "從那以後，我不再逃了。我在耶路撒冷講道，一路傳到羅馬。傳說我最後也被釘在十字架上，我要求倒著釘，因為我不配和他一樣。他沒有放棄我，所以我也不能放棄他的話。"]}], "邱吉爾": [{"name": "邱吉爾", "role": "故事主角本人", "who": "我是溫斯頓．邱吉爾。我當過軍人、記者、財政大臣，也失敗過很多次。1930年代，我在議會裡一再警告希特勒的威脅，大家都嫌我危言聳聽。", "relation": "這是我的故事。1940年5月10日，德軍入侵法國和低地國家，同一天，我成了英國首相。那年我六十五歲。", "why": "大家記得我的演說和雪茄。我想親口告訴你，在那年五月最黑暗的幾天，英國差一點就走上了另一條路。", "simple": ["我的目標只有一個：守住英國，絕不向納粹低頭。我在第一次對議會的演說就說了：我能奉獻的，只有熱血、辛勞、眼淚和汗水。", "可是戰局壞到了極點。法國快要倒了，三十多萬英軍被困在敦克爾克海灘。戰時內閣裡，有人主張透過中間人跟希特勒談和。", "我在內閣裡一次次爭論，也一次次站到麥克風前。我要讓英國人知道真實的處境，也要讓他們相信，我們撐得下去。", "敦克爾克撤退成功了，幾百艘民間的小船開過海峽，把士兵接回來。英國沒有在最黑暗的時刻先崩潰。", "最讓我意外的是，語言本身成了武器。我說：「我們將在海灘上作戰，在登陸地作戰，在田野和街頭作戰，我們絕不投降。」那些話，讓一個害怕的國家重新站了起來。", "我拒絕談和。我知道那意味著轟炸、犧牲和漫長的戰爭，但我相信，用投降換來的和平，只會讓我們變成奴隸。", "英國撐過了不列顛空戰和倫敦大轟炸，後來美國和蘇聯加入，同盟國贏得了戰爭。我這一生做錯過很多決定，但在1940年，我做對了一件事：沒有讓英國閉上嘴。"]}, {"name": "哈利法克斯勳爵", "role": "英國外交大臣，1940年主張探詢和談的閣員", "who": "我是哈利法克斯勳爵，1940年時擔任英國外交大臣。張伯倫辭職時，很多人以為下一任首相會是我，而不是邱吉爾。", "relation": "我和邱吉爾的關係，是同一個戰時內閣裡的兩種主張。1940年5月底，我們為了要不要透過義大利跟德國探詢和談，爭論了好幾天。", "why": "為什麼由我來說？因為歷史記住了他的「絕不投降」，卻很少人想起，當時另一種選擇也有它的道理。我就是那另一種選擇。", "simple": ["他要作戰到底。我也想保住英國，只是我覺得，保住英國的方法，不一定是打到最後一兵一卒。", "我看到的現實是：法國即將崩潰，英軍主力被困在敦克爾克，我們可能連本土都守不住。我認為，至少應該去探一探談判的條件。", "我在內閣裡提出來，邱吉爾強烈反對。他說，一旦坐上談判桌，就再也站不起來了。我們吵得很兇，我甚至考慮過辭職。", "5月28日，他召集了更大範圍的內閣大臣。他說，就算英國的故事要結束，也要在每一個人倒在自己的血泊裡時結束。所有人都站起來為他鼓掌。", "最讓我意外的，是那一刻房間裡的氣氛。我原本以為很多人私下同意我，可在那一刻，大家選擇站在他那邊。", "我接受了。我放下了談和的主張，留在內閣裡支持戰爭。那年年底，他派我去當駐美大使，爭取美國的援助。", "後來我常想，如果當時照我的方法，歷史會怎麼走？我不知道。但我承認，那時英國需要的，不是一個精明的計算，而是一個不肯低頭的聲音。"]}, {"name": "克萊門汀．邱吉爾", "role": "邱吉爾的妻子", "who": "我是克萊門汀，溫斯頓的妻子。我們結婚超過五十年。他叫我「貓咪」，我叫他「哈巴狗」。外人看到的是首相，我看到的，是一個會在半夜寫信給我的丈夫。", "relation": "1940年，他搬進唐寧街十號，我也跟著搬了進去。那一年，我看著他幾乎沒有睡過一個完整的覺。", "why": "為什麼由我來說？因為我是那個能看見他害怕的人，也是那個敢跟他說真話的人。", "simple": ["他的目標很清楚：絕不投降。這不是一時的口號，他在議會裡喊了好幾年，大家都不聽。現在他終於有機會證明自己是對的，可代價是整個國家。", "那時候最難的，不只是戰場。內閣裡有人想談和，報紙上充滿悲觀，連他身邊的人都在懷疑。", "他沒日沒夜地工作，一邊口述電報，一邊修改演說稿。他的演說很多是自己一句一句改出來的，改到凌晨，再念給我聽。", "敦克爾克的士兵回來時，他鬆了一口氣，但也說：這不是勝利，撤退贏不了戰爭。", "讓我意外的是，他的壓力大到開始對身邊的人發脾氣。我寫了一封信給他，說：你變得粗魯了，大家開始怕你，這樣下去不好。他讀了，沒有生氣，後來真的改了。", "我陪他走過轟炸中的倫敦街道。他在廢墟前哭了，人們圍過來喊：「我們撐得住！」那一刻，我知道他的聲音已經變成大家的聲音。", "戰爭贏了，可1945年的選舉，他輸了。他很難過，我跟他說：「這也許是塞翁失馬。」他這一生不是完美的人，但在最黑暗的時候，他讓一整個國家不再害怕。"]}], "牛頓": [{"name": "牛頓", "role": "故事主角本人", "who": "我是艾薩克．牛頓，出生在英格蘭林肯郡的伍爾索普村。我是遺腹子，出生時早產，小得可以裝進一個量杯裡。1665年，劍橋因為瘟疫關閉，我回到了鄉下老家。", "relation": "這是我的故事。那兩年裡，我在家裡發明了微積分、研究了光的顏色，也開始思考：月亮為什麼不會掉下來？", "why": "大家都知道蘋果的故事。我想親口告訴你，從一顆蘋果到一條定律，中間隔了二十年。", "simple": ["我想找出能同時解釋天上和地上的法則。為什麼蘋果會掉下來？為什麼月亮繞著地球轉，而不是飛走？我覺得，這兩件事背後應該是同一種力量。", "可是從亞里斯多德以來，大家都相信天上和地上是兩個世界，遵守不同的規則。要把它們統一起來，得先打破兩千年的觀念。", "我在老家的果園裡看見蘋果落下，開始計算：讓蘋果落地的力，是不是也能延伸到月亮那麼遠？我算了，又放下，又拿起來，前後好多年。", "1687年，我出版了《自然哲學的數學原理》。三大運動定律加上萬有引力，行星、潮汐、彗星、落下的石頭，全都可以用同一套數學算出來。", "最大的意外，是最平常的現象通往最大的答案。每個人都看過東西掉下來，只是很少人會問：為什麼？", "我的轉彎，是不把熟悉的事當成理所當然。我一直問下去，問到數學能回答為止。", "我這一生脾氣不好，跟很多人吵過架。但我也寫過：「如果我看得比別人遠，那是因為我站在巨人的肩膀上。」我替後來的人，搭起了一個可以往上爬的肩膀。"]}, {"name": "羅伯特．虎克", "role": "英國皇家學會實驗主管，與牛頓爭論不休的科學家", "who": "我是羅伯特．虎克，英國皇家學會的實驗主管。我用顯微鏡第一次看見了細胞，還發現了彈簧的虎克定律。在牛頓成名之前，我已經是倫敦最有名的科學家之一。", "relation": "我和牛頓的關係，是對手。我們為了光的理論吵過，為了引力的發現權吵過。他說他看得遠，是因為站在巨人的肩膀上，這句話，就是寫在給我的信裡。", "why": "為什麼由我來說？因為歷史只記得他的萬有引力，卻忘了我也曾經想到過。我想讓你知道，一個偉大的發現背後，常常不只一個人。", "simple": ["牛頓想統一天地的法則。其實我也在想同樣的事。我很早就主張，行星的運動是被太陽的某種吸引力拉住的。", "我們之間最大的阻礙，是彼此。他批評我的光學研究，我批評他的顏色理論。我們都驕傲，都不肯讓步。", "1679年，我寫信給他，提出一個想法：吸引力是不是和距離的平方成反比？他回信了，但沒有多說。後來我才知道，他那時候已經在算了。", "幾年後，他出版了《原理》，把引力的數學證明得清清楚楚。全世界都在讚美他。", "最讓我氣憤的是，書裡幾乎沒有提到我。我公開說，平方反比的想法是我先提出的。他聽了，竟然把書裡其他提到我的地方也刪了。", "我承認，我有想法，但我證明不出來。他有能力把想法變成完整的數學。或許這就是我們之間真正的差別。", "我死後，傳說他當上皇家學會會長時，我的畫像不見了，到今天都找不到一張可靠的肖像。歷史總是記住那個完成的人，而不是那個先想到的人。但我希望你記得，我也在那裡。"]}, {"name": "愛德蒙．哈雷", "role": "天文學家，促成並資助《原理》出版的人", "who": "我是愛德蒙．哈雷，天文學家。後人知道我，多半是因為那顆每七十六年回來一次的彗星。但我這一生做過最重要的事之一，是去劍橋敲了牛頓的門。", "relation": "1684年，我和虎克、雷恩爵士在咖啡館裡爭論：如果引力和距離平方成反比，行星的軌道會是什麼形狀？沒有人證明得出來，我就去問牛頓。", "why": "為什麼由我來說？因為如果我那天沒去問，那本改變世界的書可能不會那麼快問世。我想說說，我在他書房裡看到的東西。", "simple": ["牛頓想找出天地共同的法則。我那天問他：在平方反比的引力下，行星會走什麼軌道？他馬上說：橢圓。我問他怎麼知道的，他說：我算過了。", "可是他找不到那份計算了。更大的阻礙是他的個性：他不喜歡爭論，不喜歡發表，寧可把東西鎖在抽屜裡。", "我勸他重新寫下來。他花了一年半，把幾頁計算擴充成三大卷的鉅著。那段時間，他常常忘了吃飯、忘了睡覺。", "1687年，《自然哲學的數學原理》出版了。從此，天上和地上遵循同一套定律。", "最讓我意外的是，皇家學會那時候沒錢了，錢都花在一本關於魚類的書上。我只好自掏腰包，替他付印刷費，還幫他校對、編輯。", "虎克要求在書裡承認他的貢獻，牛頓氣得想刪掉整個第三卷。我兩邊安撫，好不容易才讓書完整出版。", "後來我用他的定律算出，1531年、1607年、1682年出現的彗星其實是同一顆，它會在1758年回來。我沒活到那一年，但它真的回來了。那是對牛頓最好的證明。"]}], "愛迪生": [{"name": "愛迪生", "role": "故事主角本人", "who": "我是湯瑪斯．愛迪生，出生在美國俄亥俄州。我只上過幾個月的學，老師說我腦袋有問題，是我母親在家教我讀書。十二歲，我在火車上賣報紙，還在行李車廂裡弄了一個小實驗室。", "relation": "這是我的故事。在紐澤西門洛公園的實驗室裡，帶著一群人日夜測試燈絲的是我，說出「我沒有失敗，我只是找到了一萬種行不通的方法」的，據說也是我。", "why": "大家以為我發明了電燈泡。其實在我之前，已經有很多人做出過會亮的燈。我想親口告訴你，我真正做的，是什麼。", "simple": ["我要的不只是讓燈亮起來，而是讓每一戶人家都點得起電燈。那時候大家用煤氣燈和煤油燈，又暗又危險，還會失火。", "難的不是點亮，而是要亮得久、夠便宜、夠安全，而且要能大量製造。早期的燈泡亮幾分鐘就燒斷了，根本沒辦法用。", "我和團隊試了幾千種材料：金屬絲、紙、棉線、各種植物纖維。每一次失敗，我們都記下來，再換下一種。", "1879年，一根碳化的棉線燈絲，亮了十幾個小時。後來我們改用碳化的竹絲，可以亮上一千多個小時。", "最意外的是，一個燈泡根本不夠。要讓燈泡進入家庭，得有發電廠、電線、電表、開關、保險絲。一個發明，最後變成了一整套系統。", "我把成功的定義改了：不是「做出來」，而是「讓大家用得起」。1882年，我在紐約珍珠街蓋了發電站，點亮了附近的街區。", "我這一生申請了一千多項專利，也跟人打過很多官司、犯過錯。但我最驕傲的，是讓黑夜變短了。發明不是天才的靈光一閃，是百分之一的靈感，加上百分之九十九的汗水。"]}, {"name": "尼古拉．特斯拉", "role": "曾為愛迪生工作的發明家，交流電的推動者", "who": "我是尼古拉．特斯拉，出生在今天的克羅埃西亞。1884年，我帶著一封推薦信和幾分錢來到紐約，進了愛迪生的公司。我腦子裡，裝著一個交流電的系統。", "relation": "我和愛迪生的關係，是雇員，後來是對手。我們吵的，是全世界該用哪一種電：他的直流電，還是我的交流電。", "why": "為什麼由我來說？因為我是那個最早看出他的系統有極限的人。我想讓你知道，一個偉大的發明家，也會被自己的成功困住。", "simple": ["愛迪生要讓每個家庭都有電燈。這個目標很偉大，我完全同意。我不同意的，是他用來達成目標的方法。", "他的直流電傳不遠，每隔一兩公里就得蓋一座發電站。我跟他說，交流電可以傳得更遠、更便宜。他不想聽。", "我在他的公司裡拚命工作，改良他的發電機。我記得，有人說完成了就給我五萬美元獎金。我做完了，得到的卻是一句：「你不懂美國人的幽默。」我辭職了。", "後來我和西屋公司合作，推廣交流電。愛迪生那邊開始宣傳交流電有多危險，公開用交流電電死動物給大家看。那就是後來所說的「電流大戰」。", "最讓我意外的是，他明明那麼聰明，卻那麼固執。他太愛自己的系統了，愛到看不見更好的方法。", "1893年芝加哥世界博覽會，用交流電點亮了整個會場。後來尼加拉瀑布的水力發電廠也採用了交流電。這場仗，交流電贏了。", "今天，全世界的電網大多用交流電。但我也要說公道話：是愛迪生先讓大家相信，電可以走進每一個家。我們一個打開了門，一個鋪好了路。"]}, {"name": "查爾斯．巴徹勒", "role": "愛迪生的得力助手，門洛公園實驗室的核心成員", "who": "我是查爾斯．巴徹勒，英國人，年輕時來到美國。我手很巧，眼睛也很準，在門洛公園實驗室裡，很多精細的活都是我動手做的。大家說我是愛迪生的右手。", "relation": "我跟著他工作了很多年，燈泡的研發我從頭參與到尾。那些碳化燈絲，很多都是我親手放進爐子裡燒出來的。", "why": "為什麼由我來說？因為大家只知道愛迪生，卻不知道門洛公園是一整群人。我想讓你看看，一盞燈是怎麼在一間實驗室裡被一群人熬出來的。", "simple": ["愛迪生跟我們說，我們要做的不是一盞燈，是一盞每個人都買得起的燈。他常常一邊說一邊在筆記本上畫草圖。", "最難的是燈絲。太細會斷，太粗太耗電，而且燈泡裡的空氣要抽得很乾淨，否則一下就燒掉了。", "我們日夜輪班，一次次地試：碳化紙、碳化棉線、碳化木頭、碳化各種纖維。實驗記錄本堆滿了整個架子，大部分寫的都是「失敗」。", "1879年10月，我們用碳化棉線做的燈泡亮了。我們圍在旁邊看，一小時、兩小時、十小時……沒人捨得去睡。", "最讓我意外的是，他成功之後沒有停下來慶祝，而是立刻問：「好，接下來要怎麼讓一整條街都亮？」", "他把我們從做一個燈泡，帶到做一整套系統：發電機、電線、電表。那時我才懂，他在乎的不是發明，而是讓發明真正有用。", "很多年後，我看見紐約的街道一條條亮起來。我想起門洛公園那些不睡覺的夜晚。燈泡上刻的是他的名字，但那道光裡，有我們每一個人。"]}], "梵谷": [{"name": "梵谷", "role": "故事主角本人", "who": "我是文森．梵谷，荷蘭一個牧師的兒子。我當過畫商店員、當過老師、當過傳教士，全都失敗了。二十七歲，我才開始學畫。弟弟西奧說，他會養我，讓我好好畫。", "relation": "這是我的故事。在阿爾勒的烈日下畫向日葵的是我，在聖雷米的療養院窗口畫星夜的也是我。十年裡，我畫了兩千多件作品。", "why": "大家都知道我割了耳朵，知道我生前幾乎賣不出畫。我想親口告訴你，一個一直被拒絕的人，為什麼還要一直畫。", "simple": ["我想畫出我真正看見、真正感受到的世界。不是照片那樣的真，而是讓人一看就感覺到的真：麥田在燃燒，星星在旋轉，向日葵在呼吸。", "可是我很窮，全靠西奧每個月寄錢。我和人相處得很不好，情緒也常常失控。沒有人買我的畫，沒有人覺得我畫得好。", "我每天都畫，有時一天畫一張。我寫信給西奧，一封又一封，告訴他今天看見了什麼顏色、想試什麼筆法。我買不起模特兒，就畫自己。", "我在阿爾勒畫了向日葵、黃色小屋、夜間咖啡館，還邀請高更來一起生活。可是只過了兩個月，我們就大吵了一架，我在那一晚傷害了自己。", "後來我住進療養院。最奇怪的是，在我最痛苦的時候，我畫出了最明亮的畫。從窗口看出去的星空，我把它畫成了漩渦。", "我沒有因為沒人懂就停下來。我寫信跟西奧說：我想用我的畫觸動人心，我想讓人說：他感受得很深，他感受得很溫柔。", "1890年，我三十七歲就走了。我生前只確定賣出過一幅畫。但現在，我的畫掛在世界各地的美術館裡。原來有些光，要走很久才會被看見。"]}, {"name": "高更", "role": "畫家，曾與梵谷在阿爾勒同住", "who": "我是保羅．高更，法國畫家。我當過股票經紀人，三十幾歲才放棄一切專心畫畫。後來我去了大溪地，畫那裡的女人和陽光。", "relation": "1888年秋天，我應梵谷的邀請去阿爾勒，住進他的黃色小屋。我們一起畫畫、一起喝酒、一起吵架。兩個月後，事情以一個所有人都知道的悲劇收場。", "why": "為什麼由我來說？因為我是那段日子裡離他最近的人，也是最常跟他作對的人。我想讓你知道，我看到的梵谷是什麼樣子。", "simple": ["他想畫出他的感覺，我也想畫出我的想像。我們都在反抗學院派那種死板的畫法，這一點我們是同路人。", "可是我們的路完全不一樣。他喜歡對著實物畫，我喜歡憑記憶和想像畫。他畫得很快、很衝，我覺得應該多想一想。", "我們每天都在爭論：色彩、構圖、哪位畫家比較偉大。他很熱情，熱情到讓我喘不過氣。他把我當成老師，也當成救星，我承受不起。", "他想在阿爾勒建立一個「南方畫室」，讓畫家們一起生活創作。可是我們兩個人都受不了對方，這個夢很快就破了。", "那年聖誕節前，我們又吵了一架，我走出了家門。那天晚上，他割傷了自己的耳朵。第二天我就搭火車離開了阿爾勒，再也沒有見過他。", "我承認，我也許對他不夠溫柔。可我後來常想起他在信裡寫的那些顏色。我們吵了兩個月，但那兩個月裡，他畫了好多傑作。", "他死後，我在遠方聽說他的畫開始被人看見。我在大溪地畫畫時，有時會想起那些向日葵。他很難相處，但他是真正的畫家。這一點，我從來沒有否認過。"]}, {"name": "喬安娜．邦格", "role": "梵谷弟弟西奧的妻子，梵谷作品的推廣者", "who": "我是喬安娜．梵谷－邦格，大家叫我喬。我是西奧的妻子。我們結婚時，文森還在世，他曾經為我們剛出生的兒子畫了一幅杏花。", "relation": "文森死後不到半年，西奧也病逝了。我帶著一個嬰兒，還有幾百幅沒人要的畫和一大疊信回到荷蘭。從那天起，文森的作品就交到了我手上。", "why": "為什麼由我來說？因為沒有人比我更清楚，他的畫是怎麼從堆在床底下，走進全世界的美術館的。", "simple": ["文森想畫出他真正感受到的世界。我讀了他寫給西奧的每一封信，才明白他的每一筆，都是用生命在畫的。", "他生前幾乎沒有人理解他。貧窮、孤單、生病，還有一個只肯相信學院派的藝術圈。西奧是唯一一直支持他的人。", "他畫了將近十年，一刻都沒停。西奧每個月寄錢給他，他就用那些錢買顏料和畫布。有時候他寧可餓肚子，也要先買顏料。", "他走的時候，大部分的畫都沒賣出去。有人勸我把那些畫丟掉，說它們不值錢。我沒有。", "真正的意外，是一個女人和一個嬰兒，竟然要負責讓世界認識一位畫家。我不是藝術專家，但我相信西奧的眼光，也相信文森的畫。", "我開始一幅一幅地借給展覽、賣給收藏家，整理了他的信，1914年出版。人們讀了那些信，才終於懂了他的畫。", "現在大家都知道梵谷了。我的兒子後來成立了基金會，在阿姆斯特丹有了梵谷美術館。我只做了一件事：沒有讓他的畫被遺忘。那是我對西奧的承諾，也是對文森的承諾。"]}], "畢卡索": [{"name": "畢卡索", "role": "故事主角本人", "who": "我是巴勃羅．畢卡索，出生在西班牙馬拉加。我父親是美術老師，據說我小時候會說的第一個字是「鉛筆」。十幾歲時，我畫得已經比父親好。後來我在巴黎，和朋友一起發明了立體主義。", "relation": "這是我的故事。1937年，西班牙正在內戰，一個叫格爾尼卡的小鎮被轟炸成廢墟。我在巴黎的畫室裡，用五個多星期畫出了一幅巨大的黑白灰油畫。", "why": "大家說我是天才，說我一生都在變。我想親口告訴你，我為什麼要在那一年，讓我的畫直接開口說話。", "simple": ["我想用藝術回應這個破碎的時代。我一直在打破舊的畫法，把一張臉的正面和側面同時畫出來。可我在問自己：這些實驗，能不能真正碰觸現實？", "西班牙共和政府邀請我為巴黎世界博覽會畫一幅壁畫。我接了，卻遲遲不知道該畫什麼。直到四月底，我在報紙上看到格爾尼卡被轟炸的消息。", "我立刻開始畫草圖。痛苦的馬、抱著死去孩子哭喊的母親、倒下的士兵、一顆像眼睛又像燈泡的光。我畫了又改，改了又畫。", "《格爾尼卡》完成了，將近八公尺寬。我沒有用任何色彩，只用黑、白、灰，因為我想讓它看起來像報紙上的新聞照片。", "最意外的是，那些扭曲、破碎、變形的形體，反而比寫實的畫更像真正的痛苦。人們站在畫前，不需要任何解說，就懂了。", "我讓我的畫從個人的風格，變成了對時代的控訴。我說過：「繪畫不是用來裝飾公寓的，它是一種對敵人攻擊和防禦的武器。」", "我不讓這幅畫在佛朗哥獨裁時回到西班牙。它在紐約待了四十多年，直到西班牙恢復民主，才終於回家。那時我已經不在了。但它回去了，替那些說不出話的人，一直說下去。"]}, {"name": "德國軍官", "role": "佔領巴黎期間造訪畢卡索畫室的德軍軍官", "who": "我是一名德國軍官，二戰時駐紮在被佔領的巴黎。我的名字不重要，歷史也沒有記下。我只是那個走進畢卡索畫室，問了一個問題的人。", "relation": "格爾尼卡是被德國空軍的禿鷹軍團轟炸的，那是我的國家做的事。後來，我們佔領了巴黎，而那位畫出格爾尼卡的畫家，就住在我們管轄的城裡。", "why": "為什麼由我來說？因為這個流傳很廣的故事裡，我是那個被畫問倒的人。我想讓你知道，一幅畫是怎麼讓一個拿槍的人啞口無言的。", "simple": ["畢卡索想用藝術回應戰爭。在我們看來，他的畫是「墮落藝術」，不能公開展出，他也被監視著。", "我們有軍隊、有權力、有檢查制度。他只有畫筆。照理說，他應該怕我們。", "我奉命去他的畫室檢查。屋子裡堆滿了畫，有些畫得很奇怪，我看不太懂。他很冷淡，也沒有特別客氣。", "我看到牆邊有一張《格爾尼卡》的明信片，或者是照片。那些尖叫的人、倒下的馬、燃燒的房子。我知道那是什麼事件。", "我指著它問：「這是你做的嗎？」他看著我，說：「不，是你們做的。」", "我不記得自己接下來說了什麼。我只記得，那一刻我突然明白，他畫的不是一個小鎮，而是我們。那幅畫一直在指著我們。", "這個故事後來被說了很多次，有人說是真的，有人說是傳說。但不管怎樣，大家會記得那句話。我們贏過很多場戰爭，卻在那一刻，輸給了一幅畫。"]}, {"name": "朵拉．瑪爾", "role": "攝影師與畫家，記錄《格爾尼卡》創作過程的人", "who": "我是朵拉．瑪爾，法國攝影師，也是畫家。我會說西班牙語，也懂政治，和畢卡索一起關心西班牙內戰。1936年，我們在巴黎相遇，後來成為伴侶。", "relation": "他畫《格爾尼卡》時，我幫他找到了那間在大奧古斯丁街的畫室。從第一天到最後一天，我用相機拍下了這幅畫一步步改變的過程。", "why": "為什麼由我來說？因為我看過這幅畫的每一個版本，包括那些後來被他塗掉的。我想讓你知道，一幅偉大的作品，是怎麼掙扎著長出來的。", "simple": ["他想讓藝術面對現實。那時的巴黎，很多藝術家都在爭論：藝術到底該不該談政治？他本來不太表態，但格爾尼卡改變了他。", "他接下了萬國博覽會西班牙館的委託，卻有好幾個月不知道該畫什麼。直到轟炸的消息傳來，他看著報紙上的照片，很久都沒說話。", "他開始瘋狂地畫。一開始的版本裡，有一個舉著拳頭的手臂，後來被他改成了別的。每改一次，我就拍一次。", "五個多星期，這幅將近八公尺寬的畫就完成了。那些照片，後來成了研究這幅畫最重要的紀錄。", "最讓我意外的是，他沒有用顏色。我問他為什麼，他沒有正面回答。我自己後來想，因為那天的格爾尼卡，本來就沒有顏色。", "他畫裡那個哭泣的女人，有人說是以我為原型。他也畫過很多幅《哭泣的女人》。我不知道，但我知道他把那個時代的眼淚，全畫進去了。", "後來我們分開了，我的日子並不好過。但我拍下的那些照片留了下來。每當有人研究《格爾尼卡》，就會看到那段創作的過程。我是見證者，也是那幅畫的一部分。"]}], "李小龍": [{"name": "李小龍", "role": "故事主角本人", "who": "我是李小龍，1940年生在舊金山，在香港長大。我小時候就拍電影，也常在街上打架。後來我跟葉問師父學詠春，十八歲那年，我帶著一點錢，搭船回到美國。", "relation": "這是我的故事。在西雅圖開武館教外國人功夫的是我，在好萊塢被拒絕、回香港拍出《唐山大兄》的，也是我。", "why": "大家記得我的怪叫聲和雙節棍。我想親口告訴你，我真正想打破的，不是對手，而是別人心裡那個華人的樣子。", "simple": ["我想讓世界重新看見華人英雄。那時候好萊塢電影裡的華人，不是留著辮子的僕人，就是說話怪腔怪調的配角。我受夠了。", "我面對的不只是競爭，而是偏見。有人說華人不能當主角，觀眾不會買單。也有華人師傅覺得，功夫不該教給外國人。", "我每天練功，也讀哲學。我在華盛頓大學念哲學系，把武術和道家、禪的思想放在一起想。我說：「像水一樣，我的朋友。」", "我演了《青蜂俠》裡的加藤，終於在美國被看見了。後來我回到香港，拍了《唐山大兄》《精武門》，票房破了紀錄。", "最讓我意外的是，影響我的電影的，不只是華人觀眾。美國、歐洲、非洲、拉丁美洲的年輕人，都開始學功夫，都在模仿我。", "我不再配合別人給我的框架。我創了截拳道，不拘泥於任何門派。我說：以無法為有法，以無限為有限。", "1973年，我在《龍爭虎鬥》上映前一個月過世，才三十二歲。可是那部電影讓全世界都認識了我。我證明了一件事：英雄不一定是金髮碧眼，英雄可以長得像我。"]}, {"name": "好萊塢電視台主管", "role": "當年對華人主角說「不」的那一群人", "who": "我是好萊塢一家電視台的主管。我的名字不重要，因為我代表的是當年那一整批人：坐在辦公室裡，決定觀眾能在螢幕上看到誰的人。", "relation": "我和李小龍的關係，是他想走進來的那扇門。我見過他，也欣賞他的功夫。但當他想當主角時，我的答案是：不行。", "why": "為什麼由我來說？因為我就是那道偏見的牆。我想讓你看看，一個被牆擋住的人，最後是怎麼繞過去，還讓整面牆都倒了的。", "simple": ["他想當主角，想讓華人成為英雄。我聽了只覺得他很天真。在我們的算盤裡，美國觀眾只會買白人英雄的票。", "我不是壞人，我只是在做生意。我會告訴他：你的口音太重、你的外型不夠主流、觀眾不會認同一個亞洲人當主角。", "他很努力。他在《青蜂俠》裡的加藤打得比主角還精彩，很多觀眾是為了看他才轉台的。我們承認他很厲害，但只讓他當配角。", "後來有一部講功夫的電視劇在籌備，很多人說那個角色簡直是為他量身打造的。最後，我們還是找了一個白人演員來演。", "最讓我意外的是，他沒有留下來求我們，他回了香港。幾年後，我聽說他的電影在亞洲打破了票房紀錄，連好萊塢都要去找他合作。", "他沒有等我們改變，而是自己去建立一個新的舞台。他拍的電影，回過頭來證明我們錯了。", "《龍爭虎鬥》在全世界大賣，可他沒能看到。後來我常想起那天在辦公室裡對他說的話。我擋住了一扇門，他卻打開了一整面牆。"]}, {"name": "琳達．李", "role": "李小龍的妻子", "who": "我是琳達，李小龍的妻子。我們是在西雅圖認識的，那時我還是高中生，去他的武館學功夫。1964年，我們結婚了，後來有了兒子國豪和女兒香凝。", "relation": "我陪著他從西雅圖的小武館，走到好萊塢，再到香港。他在外面是功夫巨星，在家裡，是一個會半夜起來讀書、寫筆記的人。", "why": "為什麼由我來說？因為我看過他最意氣風發的時候，也看過他被拒絕、受傷、沮喪的時候。我想讓你知道，那個傳奇背後，是怎樣的一個人。", "simple": ["他想讓世界看見華人的樣子，不只是會打架的華人，而是有思想、有尊嚴、有自己一套哲學的華人。", "我們結婚時，不同種族的婚姻在美國還很少見，我的家人一開始也很擔心。他在好萊塢一次次碰壁，因為他是華人。", "他從不停止訓練。1970年，他背部受了重傷，醫生說他可能再也不能練武了。他躺在床上好幾個月，卻寫下了一大疊關於武術和哲學的筆記。", "他的傷好了，重新站了起來。他回到香港拍電影，每一部都比上一部更成功。", "最讓我意外的是，他的影響遠遠超過電影。世界各地的年輕人寫信給他，說他讓他們重新相信自己。", "他說過，他不想當任何人的複製品，他只想做最真實的自己。他也這樣要求學生：不要學我，要找到你自己。", "他走得太早了，三十二歲。我把他的筆記整理出版，讓更多人讀到他的思想。他留下的，不只是功夫，還有一句話：「像水一樣。」"]}], "達爾文": [{"name": "達爾文", "role": "故事主角本人", "who": "我是查爾斯．達爾文，英國人。我小時候功課不好，愛收集甲蟲。父親說我只會打獵、玩狗、抓老鼠，將來會讓家族蒙羞。二十二歲那年，我登上了小獵犬號，一出海就是五年。", "relation": "這是我的故事。在加拉巴哥群島看著不同島上的雀鳥發呆的是我，把一個想法放了二十年才敢說出來的，也是我。", "why": "大家都知道我提出了演化論。我想親口告訴你，一個人明知道自己的想法會掀起風暴，為什麼還是選擇說出來。", "simple": ["我想找出生命是怎麼變化和延續的。為什麼每個島上的雀鳥嘴巴形狀都不一樣？為什麼化石裡的動物跟現在的有點像，又不完全一樣？", "可我的答案，會跟當時大部分人的信仰衝突。如果物種會改變，那就不是一開始就被創造成現在的樣子。我的妻子是虔誠的教徒，我不想傷她的心。", "回到英國後，我花了二十年研究：養鴿子、研究藤壺、和世界各地的學者通信。我把證據一點一點累積起來，卻一直不敢發表。", "1858年，我收到一封信。一位年輕的博物學家華萊士，在馬來群島想到了跟我幾乎一模一樣的理論。我必須做決定了。", "最讓我意外的是，我的理論並不是在某一天靈光一閃想出來的，而是在漫長的耐心裡，一天一天長出來的。", "我和華萊士的論文一起在學會發表。隔年，我出版了《物種起源》，第一版很快就賣完了。", "書出版後，爭論一直沒停過。我身體不好，很少公開辯論，都是朋友替我出面。我在書的最後寫下：從如此簡單的開端，演化出了無數最美麗、最奇妙的生命形態，而且這個過程仍在繼續。我覺得，這樣看待生命，是一種壯麗。"]}, {"name": "威伯福斯主教", "role": "牛津主教，1860年牛津辯論中的演化論反對者", "who": "我是撒母耳．威伯福斯，牛津主教。我口才很好，好到人家給我取了個綽號：「滑頭山姆」。我讀過《物種起源》，也寫過一篇很長的書評批評它。", "relation": "我和達爾文的關係，是一場沒有他在場的辯論。1860年，牛津的英國科學促進會年會上，我和他的支持者赫胥黎當眾交鋒。", "why": "為什麼由我來說？因為我代表了當時大多數人的想法。你們今天笑我們，但我想讓你明白，那時的世界為什麼這麼難接受他。", "simple": ["達爾文想用自然的規律解釋所有生命的變化。在我看來，他把上帝從創造的故事裡拿走了。", "我不是反對科學。我讀過他的書，也承認他觀察得很仔細。可我認為他的證據不夠，他的推論跳得太遠。", "我在書評裡一條一條地反駁他。我也知道，教會、大學、社會的主流意見，大多站在我這邊。", "那天在牛津，會場擠滿了人。據說我問了赫胥黎一個問題：你說你是猴子的後代，那是你祖父那邊，還是祖母那邊？全場大笑。", "我沒想到的是，赫胥黎站起來回答，大意是：他寧可有一隻猴子當祖先，也不願意有一個用才智去嘲弄嚴肅問題的人當祖先。那一刻，笑聲的方向變了。", "那場辯論到底誰贏了，當時的報導眾說紛紜。但從那以後，越來越多年輕學者站到了達爾文那一邊。", "後來的科學一次次證明了他的理論。我想，我的錯不在於提出質疑，而在於我用了一句玩笑，去回答一個應該認真面對的問題。"]}, {"name": "艾瑪．達爾文", "role": "達爾文的妻子", "who": "我是艾瑪，查爾斯的妻子，也是他的表姊。我出身韋奇伍德家族，從小就是虔誠的基督徒。我們結婚四十三年，生了十個孩子。", "relation": "我們結婚前，他就老實告訴我，他對信仰有很多疑問。我寫信給他，說我擔心我們死後不能在天堂相見。他把那封信收著，在上面寫了一句話，保存了一輩子。", "why": "為什麼由我來說？因為我是那個最愛他、卻也最害怕他的理論的人。我想讓你知道，在那本書的背後，是一個怎樣的家。", "simple": ["查爾斯想弄懂生命是怎麼來的。他每天在書房裡工作，在花園裡散步，一邊走一邊想，還在沙徑上放石頭數圈數。", "他最大的顧慮之一，是我。他知道他的理論會動搖很多人的信仰，包括我的。他遲遲不發表，有一部分是為了不讓我傷心。", "他身體一直不好，常常胃痛、心悸，只能工作幾個小時就得休息。他就這樣一點一點地做研究，做了二十年。", "我們的女兒安妮十歲時病死了。那之後，他對信仰的疑問更深了，而我更需要我的信仰。我們各自用自己的方式悲傷。", "讓我意外的是，他從不瞞我。他把他的想法一五一十說給我聽，就算知道我不會同意。我不同意他的某些結論，但我知道，他是一個誠實的人。", "他決定出版的時候，我沒有阻止他。我對他說：我相信你的誠實，也相信上帝會看見你的真心。", "他後來葬在西敏寺，就在牛頓旁邊。我們一輩子信的不一樣，但我們一輩子都尊重彼此。我想，這也是一種演化：人可以不同，卻不必分開。"]}], "張忠謀": [{"name": "張忠謀", "role": "故事主角本人", "who": "我是張忠謀，1931年出生在浙江寧波。小時候遇上戰亂，跟著家人在好幾個城市之間搬來搬去。十八歲去了美國，在德州儀器工作了二十五年，做到負責全球半導體業務的資深副總裁。", "relation": "這是我的故事。1985年，我五十四歲，接受政府的邀請來到台灣，擔任工研院院長。兩年後，我創辦了台積電。", "why": "很多人說台積電是奇蹟。我想說說，一個被很多人看不好的商業模式，是怎麼一步步變成全世界最關鍵的位置的。", "simple": ["我想替台灣找到一個在全球科技產業裡站得住的位置。那時台灣有很好的工程師，有勤奮的工廠，卻沒有一家能跟世界大廠競爭的半導體公司。", "強敵環伺。美國、日本的大廠都自己設計、自己製造。更麻煩的是，我提出的「專業晶圓代工」，也就是只替別人製造、不做自己的產品，當時幾乎沒有人看好。", "我在德州儀器的經驗讓我相信：很多設計晶片的人，負擔不起蓋工廠。如果有一家公司專門替他們製造、又不跟他們搶生意，他們就能專心設計。", "1987年，台積電成立了，資金來自政府開發基金、飛利浦和一些民間企業。剛開始訂單很少，很多國際大廠不願意投資，也不願意下單。", "最意外的是，當時被視為幕後的位置，後來變成了最關鍵的位置。晶片設計公司一家一家冒出來，他們都需要一個值得信任的製造夥伴。", "我選擇不做全部，而是把一件事做到極致。我們跟客戶說：我們絕不跟你競爭。誠信和技術，成了台積電最重要的資產。", "今天，全世界很多最先進的晶片都在台灣製造。我已經退休了。回頭看，我最想說的是：最關鍵的位置，不一定是最顯眼的位置，但一定是最值得信任的位置。"]}, {"name": "國際半導體大廠主管", "role": "當年不看好專業代工模式的業界人士", "who": "我是一家國際半導體大廠的主管。我的名字不重要，我代表的是1980年代業界的主流看法：真正的半導體公司，要自己設計、自己製造。", "relation": "張忠謀來找過我們，希望我們投資他在台灣的新公司，或者把訂單交給他們。我聽完他的計畫，客氣地拒絕了。", "why": "為什麼由我來說？因為我是那個看走眼的人。我想讓你知道，一個今天看起來理所當然的模式，當年為什麼會被一個個專家拒絕。", "simple": ["他想在台灣建立一家專門替別人製造晶片的公司。我們聽了都覺得很奇怪：沒有自己的產品，要怎麼賺錢？", "在我們看來，製造是半導體公司的核心機密，怎麼可能交給外人？而且台灣那時候的技術，比美國、日本落後好幾年。", "他很有耐心地解釋：未來會有很多只做設計的公司，他們需要代工廠。我們點頭，但心裡想：那樣的公司能有多少？", "我們沒有投資。後來聽說他找到了飛利浦和台灣政府，公司還是成立了。剛開始幾年，訂單不多，我們更相信自己沒看錯。", "讓我們意外的是，只做設計的公司真的越來越多，而且長得越來越大。它們都需要台積電。", "更意外的是，連我們自己，後來也開始把一部分晶片交給台積電製造。自己蓋先進的工廠太貴了，貴到連大公司都負擔不起。", "很多年後，我在一場產業會議上聽他演講。台下坐滿了全世界的客戶。我想起當年那次會面。我拒絕的，不只是一筆投資，而是一個時代的轉彎。"]}, {"name": "李國鼎", "role": "前政務委員，台灣科技產業的推手", "who": "我是李國鼎，當過經濟部長、財政部長，後來擔任政務委員，負責推動科技發展。大家叫我「台灣科技教父」，這個稱呼我不敢當，我只是一直在找人才、找方向。", "relation": "1985年，我和孫運璿先生一起邀請張忠謀回台灣，擔任工研院院長。後來，我請他為台灣規劃一家半導體公司。", "why": "為什麼由我來說？因為我是那個敲門的人。我想讓你知道，一個國家的產業轉型，有時候就是從一次邀請開始的。", "simple": ["台灣要從加工出口，轉型到高科技產業。我們需要一個能帶領半導體發展的人，而張忠謀是我們找到最合適的人選。", "那時的台灣資金有限、技術落後，國際大廠都不看好我們。要從零開始建立一個半導體產業，談何容易。", "我請他提一個計畫。他想了之後說，台灣不該跟大廠正面競爭，而是做他們做不到、也不想做的事：專業代工。", "我們找政府開發基金出資，也說服了飛利浦入股。1987年，台積電成立了。我去參加了成立典禮。", "讓我意外的是，他選的這個模式，當初連很多專家都看不懂。可是他很篤定，他說：我們要做的，是每一家設計公司的晶圓廠。", "他選擇了一條窄路，而且堅持走下去。不做自有品牌，不跟客戶競爭，專心把製程做到最好。", "我在2001年過世了，沒能看到台積電後來成為世界上最重要的公司之一。但我知道，那一次敲門是對的。產業政策最重要的，不是錢，而是找對人。"]}], "聖嚴法師": [{"name": "聖嚴法師", "role": "故事主角本人", "who": "我是聖嚴，1930年生在江蘇南通一個貧窮的農家。十三歲在狼山出家。1949年，我換上軍裝，跟著軍隊來到台灣，當了十年兵。退伍後，我才重新出家，拜東初老人為師。", "relation": "這是我的故事。在美濃山中閉關六年的是我，四十歲才去日本讀博士的是我，後來在金山開創法鼓山、提出「心靈環保」的，也是我。", "why": "我想說說，一個只想好好修行的出家人，為什麼後來花了一生，把佛法翻譯成現代人聽得懂的話。", "simple": ["我想替現代人打開一扇能走進佛法的門。很多人覺得佛教是拜拜、是求平安、是老人家的事。可我知道，佛法其實是一種能用在生活裡的智慧。", "傳統的宗教語言，對現代人來說太遠了。什麼「業障」「解脫」，年輕人聽不懂，也不想聽。而我自己，也一度只是個學問不足的出家人。", "我閉關六年讀經、打坐，又去日本立正大學讀書，拿到了博士學位。後來我到美國教禪修，學生大多是西方人，我得學著用他們聽得懂的方式講。", "1989年，我在台北縣金山找到了一片山坡地，開始建設法鼓山。後來，我提出「心靈環保」：環境要保護，人心也要保護。", "最意外的是，越深的修行，反而越能貼近日常生活。「面對它、接受它、處理它、放下它」，很多人說，這四句話陪他們度過了人生最難的時候。", "我把佛法從寺院裡，翻譯成社會的語言。辦大學、辦禪修營、推廣自然環保和心靈環保，也為社會上的苦難奔走。", "2009年，我走了。我交代弟子們，不要撿骨灰，不要建墓塔，把骨灰植存在土裡就好。我留下的，不是一座山，而是一條現代人也能走進去的修行之路。"]}, {"name": "懷疑的上班族", "role": "一位原本對宗教毫無興趣的現代人", "who": "我是一個普通的上班族，在台北工作，每天加班、開會、搭捷運。我從來不覺得自己需要宗教，甚至覺得宗教有點迷信。", "relation": "我和聖嚴法師的關係，是一本書。那年我工作壓力大到睡不著，朋友塞給我一本他的書。我本來只是想翻幾頁就還回去。", "why": "為什麼由我來說？因為我代表的，就是他一生最想說服的那種人：忙碌、焦慮、不相信任何東西的現代人。", "simple": ["他想讓現代人走進佛法。可我對這種事一向很排斥。我覺得宗教就是要你相信一些看不見的東西，而我只相信我自己。", "我不是沒有煩惱，是太多了。績效、房貸、家人的期待。我覺得宗教幫不上忙，只會叫我燒香、捐錢。", "那本書裡沒有要我燒香，也沒有要我捐錢。他寫的是怎麼面對壓力、怎麼跟自己的情緒相處，用的都是我聽得懂的話。", "後來我報名了一個初級禪修班，只是想學怎麼睡得好。老師教我們放鬆、數呼吸。第一次，我覺得腦子安靜了一點。", "最讓我意外的是，他講的佛法，竟然不是要我離開生活，而是要我回到生活。他說，禪就在吃飯、走路、工作裡。", "我記住了那四句話：面對它、接受它、處理它、放下它。下一次專案出包時，我沒有暴怒，而是在心裡一句一句念。", "我到現在還不算是虔誠的佛教徒，但我常去法鼓山走走。我想，這就是他最厲害的地方：他讓一個原本不信的人，也覺得那扇門是為自己開的。"]}, {"name": "東初老人", "role": "聖嚴法師的剃度師父", "who": "我是東初，一個老和尚。1949年來到台灣，在北投辦了中華佛教文化館，也辦了佛教雜誌。我脾氣不太好，對弟子很嚴，很多人受不了我。", "relation": "1959年，一個剛退伍的軍人來找我，說要重新出家。那就是聖嚴。我是他的師父，也是那個讓他吃了很多苦頭的人。", "why": "為什麼由我來說？因為他後來成了大法師，但他一開始的樣子，只有我見過。我想說說，我為什麼對他那麼嚴。", "simple": ["他想弘揚佛法，讓更多人受益。這個願很大。我那時候看著他，覺得他還差得遠，得先把自己磨好。", "他最大的阻礙，是他太想做事了。一個出家人若心不定，做再多事也只是忙。所以我不讓他輕鬆。", "我叫他搬房間，搬好了又叫他搬回來，前前後後好幾次。叫他砌灶，砌好了又說不對，打掉重來。他沒有抱怨，只是一直做。", "後來他去美濃閉關六年，又去日本讀書。我沒有攔他，也沒有特別支持他，我要他自己想清楚，自己走出來。", "最讓我意外的，是他竟然真的拿到了博士學位，而且學成以後沒有留在外國享福，還是回來做佛教的事。", "1977年，我圓寂了。我把文化館和農禪寺都交給了他。我知道，他會把這些小小的道場，變成更大的東西。", "後來他建了法鼓山，提出心靈環保，影響了很多人。有人問他，師父當年對他那麼嚴，他恨不恨？他說，那是在磨他的心。我聽了，很欣慰。磨刀，是為了讓刀能用。"]}]};
[...FICTION, ...REAL].forEach(c => {
  const extra = EXTRA_STORYTELLERS[c.name];
  if (!extra || c.storyteller2Simple) return;
  c.storyteller4Name = c.storytellerName; c.storyteller4Role = c.storytellerRole;
  c.storyteller4Intro = c.storytellerIntro; c.storyteller4Simple = c.storytellerSimple;
  const keys = ['storyteller', 'storyteller2', 'storyteller3'];

function updateFiltering() {

  const filtering = !!currentQuery || activeCat !== 'all';
  area.classList.toggle('filtering', filtering);

  ['fiction','real'].forEach((g, k) => {

    allCards += cards.length;

    total += vis;

  });

  const emptyEl = document.getElementById('search-empty');
  if (countEl) countEl.textContent = filtering ? `${total} / ${allCards}` : '';
  if (emptyEl) emptyEl.classList.toggle('visible', filtering && total === 0);
}

function randomPick() {
  if (window.__picking) return;
  const pool = Array.from(document.querySelectorAll('#card-area .char-card')).filter(c => c.offsetParent !== null);
  if (!pool.length) return;
  window.__picking = true;
  const btn = document.getElementById('random-btn');
  if (btn) btn.classList.add('rolling');
  clearHomeKbFocus();
  const final = pool[Math.floor(Math.random() * pool.length)];
  const delays = [];
  let d = 55;
  for (let k = 0; k < 16; k++) { delays.push(d); d = Math.round(d * 1.14); }
  let prev = null, t = 0;
  delays.forEach((dl, k) => {
    t += dl;
    setTimeout(() => {
      if (prev) prev.classList.remove('pick-flash');
      const card = k === delays.length - 1 ? final : pool[Math.floor(Math.random() * pool.length)];
      card.classList.add('pick-flash');
      prev = card;
      if (k === delays.length - 1) {
        card.classList.add('pick-final');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => {
          card.classList.remove('pick-flash', 'pick-final');
          if (btn) btn.classList.remove('rolling');
          window.__picking = false;
          openChar(card.dataset.group, parseInt(card.dataset.idx, 10));
        }, 1100);
      }
    }, t);
  });
}

function toggleProjector(force) {
  const on = typeof force === 'boolean' ? force : !document.body.classList.contains('projector');
  document.body.classList.toggle('projector', on);
  try {
    if (on && document.documentElement.requestFullscreen && !document.fullscreenElement) {
      const r = document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(() => {});
    }
    if (!on && document.fullscreenElement && document.exitFullscreen) {
      const r = document.exitFullscreen(); if (r && r.catch) r.catch(() => {});
    }
  } catch (e) {}
  syncBtns();
  if (!onHome) renderContent();
}

function homeSearch(q) {
  currentQuery = q.trim();
  const clearBtn = document.getElementById('home-search-clear');
  const countEl  = document.getElementById('home-search-count');
  const emptyEl  = document.getElementById('search-empty');

  clearBtn.classList.toggle('visible', currentQuery.length > 0);

  // 搜尋時強制展開所有群組
  if (currentQuery) {
    ['fiction','real'].forEach(g => {
      collapsed[g] = false;
      const grid = document.getElementById('grid-' + g);
      const btn  = document.getElementById('collapse-btn-' + g);
      if (grid) grid.classList.remove('collapsed');
      if (btn)  btn.textContent = '收合 ▲';
    });
  }

  const cards = document.querySelectorAll('.card-grid .char-card');
  let visible = 0;

  cards.forEach(card => {
    if (!currentQuery) {
      card.classList.remove('search-hidden');
      // 還原原始文字（移除高亮）
      restoreCardText(card);
      visible++;
      return;
    }
    const haystack = (card.dataset.search || '').toLowerCase();
    const needle   = currentQuery.toLowerCase();
    if (haystack.includes(needle)) {
      card.classList.remove('search-hidden');
      highlightCard(card, currentQuery);
      visible++;
    } else {
      card.classList.add('search-hidden');
      restoreCardText(card);
    }
  });

  updateFiltering();
}

function highlightCard(card, q) {
  const targets = card.querySelectorAll('.card-name, .card-work, .card-scene');
  targets.forEach(el => {
    // 先還原
    if (el.dataset.orig) el.innerHTML = el.dataset.orig;
    else el.dataset.orig = el.innerHTML;
    // 再高亮（只處理純文字節點，避免破壞 style）
    const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    el.innerHTML = el.dataset.orig.replace(
      new RegExp(escaped, 'gi'),
      m => `<mark class="sh">${m}</mark>`
    );
  });
}

function restoreCardText(card) {
  const targets = card.querySelectorAll('.card-name, .card-work, .card-scene');
  targets.forEach(el => {
    if (el.dataset.orig) {
      el.innerHTML = el.dataset.orig;
      delete el.dataset.orig;
    }
  });
}
